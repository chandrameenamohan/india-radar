// ================================== the rail ===============================
// Where you are, always. The only thing on the page that moves while you read,

let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    // elementFromPoint rather than an observer over six thousand rows: one
    // hit-test a frame is cheaper than a thousand live observations, and the
    // answer is exactly "what is the reader looking at".
    const hit = document.elementFromPoint(innerWidth / 2, 90);
    const row = hit && hit.closest ? hit.closest('#reg .row') : null;
    if (row && row !== railRow) {
      railRow = row;
      let b = row.previousElementSibling;
      while (b && !b.classList.contains('band')) b = b.previousElementSibling;

// ================================== the pass ===============================

// ------------------------ what the second sentence yields -------------------
// Stated in numbers, above the register, before the lens is believed. Two
// things have to be legible here: what the reader's own facts rule out, and
// how much of the register said NOTHING — because the second number is the
// larger one and a lens that hid it would be quietly turning silence into no.
function paintYield() {
  const p = $('#yield');
  const out = [];
  const line = (s) => { const n = el('p'); n.append(...markup(s)); out.push(n); };
  if (me.here === 'out') {
    // The correction this brief needed: for a reader outside the fifteen,
    // every role in this register is remote work or relocation, and nothing on
    // the page said so.
    const yes = SCOPED.reduce((a, c) => a + c.roles.filter((r) => r.hire_from_abroad === 'yes').length, 0);
    const visa = SCOPED.reduce((a, c) => a + c.roles.filter((r) => r.visa === 'yes').length, 0);
    line(t('you.out', { yes: count(yes), visa: count(visa) }));
  }
  if (me.reads !== 'x') {
    line(READS_SCRIPT[me.reads]
      ? t('you.script', { total: count(SCRIPTN.total),
                          latin: count(SCRIPTN.total - SCRIPTN.other),
                          mine: count(SCRIPTN.mine) })
      : t('you.latin', { total: count(SCRIPTN.total),
                         latin: count(SCRIPTN.total - SCRIPTN.other) }));
  }
  if (me.lens && st.view !== 'companies') {
    let dim = 0, lit = 0, mute = 0;
    for (const it of CUR.items) {
      const l = it.gone ? null : lensOf(it.r);
      if (l === 'dim') dim++;
      else if (l === 'lit') lit++;
      else mute++;
    }
    line(t('you.lens', { dim: count(dim), lit: count(lit) }));

    // page reporting the absence of an absence.

// A one-off markup pass for the yield lines: *stars* set a number in the lamp,
// `ticks` set it in the mono. The alternative was eight locales of DOM
// assembly, and a translator moving a number is exactly the thing that should
// not require a code change.
function markup(s) {
  const out = [];
  for (const part of String(s).split(/(\*[^*]+\*|`[^`]+`)/)) {
    if (!part) continue;
    if (part.startsWith('*') && part.endsWith('*')) out.push(el('b', 'n', part.slice(1, -1)));
    else if (part.startsWith('`') && part.endsWith('`')) out.push(el('span', 'n', part.slice(1, -1)));
    else out.push(document.createTextNode(part));
  }
  return out;
}

  const byCountry = new Map();
  for (const c of companies) for (const r of c.roles) {
    if (!seenSince(r)) continue;
    n++;
    for (const k of r.countries) byCountry.set(k, (byCountry.get(k) || 0) + 1);
  }
  const gone = [...KEPT.values()].filter((k) => !LIVE_URLS.has(k.url)).length;

  if (top.length) {

      places: listOf(top.map(([k, v]) => `${countryName(CODE[k], k)} ${count(v)}`)) })));
  }
  // The honest half. This record holds first sightings and nothing else, so
  // the page can say what arrived and must not pretend to know what left.

  const acts = el('div', 'acts');

    const b = el('button', null, t('greet.only', { n: count(n) }));

// Written on the way OUT, never on load: a greeting that erased itself the

function stampVisit() {

// "You last read this on the 1st" has to be true, so the stamp is only written
// once the reader has actually READ: they scrolled into the register, or they
// left the page open for half a minute. Opening the page and reloading it is

let didRead = false;
const markRead = () => { didRead = true; };

// ------------------------------- the bookplate ------------------------------
// Every byte this page keeps about the reader, printed back, with a control
// that burns it. The page now writes a shortlist, a profile and a visit stamp;
// a register that asks to be trusted about what it read has to be auditable
// about what it wrote.
const PLATEKEYS = [['ra.keep', 'plate.keep'], ['ra.reader', 'plate.reader'],
                   ['ra.visit', 'plate.visit'], ['ra.ask', 'plate.ask'],
                   ['ra.ask.open', 'plate.open'], ['ra.lang', 'plate.lang']];
function paintPlate() {
  const box = $('#plate');
  const p = el('div', 'plate');
  p.append(el('h2', null, t('plate.head')));
  const dl = el('dl');
  let any = false;
  for (const [key, label] of PLATEKEYS) {
    let v = null;
    try { v = localStorage.getItem(key); } catch { /**/ }
    dl.append(el('dt', null, `${t(label)} · ${key}`));
    if (v == null) dl.append(el('dd', 'nil', t('plate.none')));
    else { any = true; dl.append(el('dd', null, v.length > 300 ? v.slice(0, 300) + '…' : v)); }
  }
  // Anything else in this origin's storage. It is not ours — the sign-in
  // provider keeps its own — and a bookplate that printed only the rows it was
  // proud of would be the audit failing at the one line that matters.
  try {
    const mine = new Set(PLATEKEYS.map(([k]) => k));
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (mine.has(key)) continue;

      const v = String(localStorage.getItem(key) || '');

    const b = el('button', 'burn', t('plate.burn'));
    b.type = 'button';
    b.addEventListener('click', () => {
      for (const [key] of PLATEKEYS) { try { localStorage.removeItem(key); } catch { /**/ } }
      KEPT = new Map();
      Object.assign(me, { here: 'x', reads: 'x', move: 'x', lens: false });
      Object.assign(tally, { shown: 0, yes: 0, no: 0 });
      Object.assign(visit, { last: null, at: null });

// The keyboard path. Somebody who lives here for an hour should never have to
// reach for the mouse.
addEventListener('keydown', (e) => {
  const typing = e.target.closest?.('input, select, textarea');
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q')?.focus(); return; }
  if (e.key === 'Escape') {
    if (typing) { e.target.blur(); return; }
    const open = $('#reg .entry');
    if (open) { open.previousElementSibling?.focus(); open.previousElementSibling
      ?.classList.remove('open'); open.remove(); openName = null; }
    return;
  }
  if (typing) return;
  const rows = [...document.querySelectorAll('#reg .row')];
  if (!rows.length) return;
  // The cursor is where the EYE is, not where a variable last was. Round 1's
  // three variants all kept the cursor as a data structure: press `j` sixteen
  // thousand pixels down and the page warped back to a row nobody had looked
  // at in ten minutes. So: if the focused row is off screen — or there is no
  // focused row — the cursor is adopted from the line the rail is already
  // reporting, which is the one under the reader's eye.
  const focused = document.activeElement.closest?.('#reg .row');
  const onScreen = (n) => {
    if (!n) return false;
    const r = n.getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight;
  };
  let here = rows.indexOf(onScreen(focused) ? focused : (railRow || null));
  // Last resort, and it is the one that actually bites: a reader who has
  // scrolled PAST the last row — into the ask, or the footer — has no row
  // under the hit-test, and warping them to row one would be the same bug in a
  // different costume. Take the row nearest the top of the viewport instead.
  if (here < 0) {
    here = rows.findIndex((n) => n.getBoundingClientRect().bottom > 0);
    if (here < 0) here = rows.length - 1;
    // The nearest row is where the cursor ARRIVES, not the row before it.
    if (e.key === 'j' || e.key === 'ArrowDown') here -= 1;
  }
  const step = (d) => {
    e.preventDefault();
    const next = rows[Math.min(rows.length - 1, Math.max(0, (here < 0 ? -1 : here) + d))];
    next?.focus();
    next?.scrollIntoView({ block: 'center',
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };
  if (e.key === 'j' || e.key === 'ArrowDown') step(1);
  else if (e.key === 'k' || e.key === 'ArrowUp') step(-1);
  else if ((e.key === 'Enter' || e.key === 'c') && here >= 0) {
    e.preventDefault();
    const row = rows[here];
    const it = CUR.items[+row.dataset.i];
    // Enter opens the evidence for the line you are on; `c` opens the company
    // behind it. In the company register there is only one of those.
    if (st.view === 'companies') toggle(row, it);
    else if (e.key === 'c') toggle(row, it.c);
    else toggleRole(row, it);
  } else if (e.key === 'x' && here >= 0 && st.view !== 'companies') {
    e.preventDefault();
    rows[here].querySelector('.kp')?.click();
    rows[here].focus();
  }
});

// ================================== the shell ==============================
function applyLocale() {
  document.documentElement.lang = LOC;
  document.documentElement.dir = (LOCALES.find((l) => l[0] === LOC) || [])[2] || 'ltr';
  document.title = t('title');
  $('#desk').textContent = t('desk');
  $('#snapk').textContent = t('snapk');
  $('#lede1').textContent = t('lede1');
  $('#boot') && ($('#boot').textContent = t('boot'));
  const lede2 = $('#lede2');
  {
    // The four numbers in the opening sentence are set in the mono, because on
    // this page every number is -- so the counts read as things we measured,
    // sitting inside a thing we wrote. The template is WALKED rather than
    // interpolated, so a placeholder can become an element instead of a string.
    // Written BEFORE the data arrives, with an em dash where each number will
    // go. A reserved blank box would have to be one height for eight languages
    // and is wrong in seven of them; the sentence itself is the right
    // skeleton, because it is already the right shape. The dash is also the
    // honest thing to print for a number we do not have yet — the same mark
    // the snapshot stamp uses, and the same rule as everywhere else on the
    // page: a fact we do not hold renders as no fact, never as a zero.
    const roles = companies.reduce((n, c) => n + c.roles.length, 0);
    const em = '\u2014';
    const vals = companies.length
      ? { roles: count(roles), companies: count(companies.length),
          countries: count(COUNTRIES.length), date: fmtDate(snapshot) }
      : { roles: em, companies: em, countries: count(COUNTRIES.length), date: em };
    // The dash holds its own BERTH as well as its place. Measured: an em dash
    // standing in for "6,423" and for "4 de agosto de 2026" is four characters
    // short and thirteen characters short, and in Portuguese that was enough
    // to flip the paragraph from three lines to four the moment the fetch
    // resolved — the largest remaining layout shift on the page. Reserving the
    // width of a number is not claiming the number: nothing is printed there
    // until there is something to print. The date's berth is the width of a
    // date formatted in this locale, which is typography, not data.
    // Sized by MEASURING a sample of the right shape in the reader's own
    // locale, not by counting characters: `ch` is the width of the mono zero,
    // and a Devanagari date inside a mono span is not set in the mono at all,
    // so twelve `ch` reserved a berth a third too narrow and Hindi relayed the
    // paragraph the moment the fetch landed.
    // `countries` is not here: fifteen is this page's own apparatus, not the
    // data's, so it prints from the first paint like every other thing we
    // already know.
    const sample = { roles: count(8888), companies: count(888),
                     date: fmtDate(new Date().toISOString().slice(0, 10)) };
    const raw = S[LOC].lede2 ?? S.en.lede2;
    const out = [];
    const pending = [];
    let at = 0;
    for (const m of raw.matchAll(/\{(\w+)\}/g)) {
      if (m.index > at) out.push(document.createTextNode(raw.slice(at, m.index)));
      const n = el('span', 'n', vals[m[1]] ?? m[0]);
      if (!companies.length && sample[m[1]]) {
        n.style.display = 'inline-block';
        n.textContent = sample[m[1]];
        pending.push(n);
      }
      out.push(n);
      at = m.index + m[0].length;
    }
    if (at < raw.length) out.push(document.createTextNode(raw.slice(at)));
    lede2.replaceChildren(...out);
    // One forced reflow, once, at boot: read each sample's rendered width,
    // then put the dash back inside a box that width, with eight per cent of
    // slack — a berth exact to the pixel is a berth that loses by one pixel,
    // and Hindi lost by seventeen. Then the paragraph's own height is pinned
    // to what it measured, so the block below it cannot be moved by a line
    // that breaks one word differently once the numbers arrive.
    if (pending.length) {
      for (const n of pending) {
        n.style.minWidth = (n.getBoundingClientRect().width * 1.08) + 'px';
        n.textContent = em;
      }
      lede2.style.minHeight = lede2.getBoundingClientRect().height + 'px';
    }
  }
  // The sentence is built BEFORE the data arrives. It is the page's
  // instrument, it is three lines tall, and painting it late threw everything
  // under it down the page the moment the fetch resolved. Its country list is
  // this page's own apparatus and needs no data; its field and city lists open
  // empty and fill on the same pass that fills the register.
  //
  // The country BAND is deliberately not built early, and that is the same
