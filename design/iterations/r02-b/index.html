<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROLE·ATLAS</title>
<meta name="color-scheme" content="dark">
<!-- A missing favicon is a 404, and a 404 is a failed request the reader's
     network tab reports as a broken page. One data: URI is cheaper. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The font sheet is NOT render-blocking. Measured on a cold profile: blocking
     on fonts.googleapis.com put first paint at 564ms and cumulative layout
     shift at 0.52 (the whole page reflowed when Newsreader swapped in); the
     same page with the sheet unblocked paints at 60ms. The metrics-matched
     fallback below is what makes that safe — without it, unblocking would only
     move the reflow earlier. -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=optional"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=optional" rel="stylesheet"></noscript>
<style>
  /* Newsreader's own metrics, measured on the running page at 100px:
     advance 2577.5 for the test string, ascent 74, descent 26. Georgia sets
     the same string at 2519.24 and Times at 2305.32, so each fallback gets the
     size-adjust that makes its line breaks land where Newsreader's will. A
     page whose first paint is a different shape from its second paint is a
     page that moves under the reader's eye while they are reading it. */
  @font-face {
    font-family: "Newsreader fallback G";
    src: local("Georgia");
    size-adjust: 100.5%; ascent-override: 74%; descent-override: 26%;
    line-gap-override: 0%;
  }
  /* The italic gets its own face and its own number. Synthesising an oblique
     from Georgia roman sets ten per cent wide — measured — and the headline
     and the search word are the two italic things on this page, which is to
     say the two places a ten per cent error would relay a line. */
  @font-face {
    font-family: "Newsreader fallback G"; font-style: italic;
    src: local("Georgia Italic"), local("Georgia-Italic");
    size-adjust: 101%; ascent-override: 74%; descent-override: 26%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: "Newsreader fallback T";
    src: local("Times New Roman"), local("Liberation Serif"), local("Tinos");
    size-adjust: 110%; ascent-override: 74%; descent-override: 26%;
    line-gap-override: 0%;
  }
  @font-face {
    font-family: "Newsreader fallback T"; font-style: italic;
    src: local("Times New Roman Italic"), local("TimesNewRomanPS-ItalicMT"),
         local("Liberation Serif Italic");
    size-adjust: 111%; ascent-override: 74%; descent-override: 26%;
    line-gap-override: 0%;
  }
  /* ------------------------------------------------------------------------
     VARIANT r01-b — THE NIGHT DESK.

     Lane B departs. The Swiss atlas answers this data as a printed plate: one
     white grid, hairline rules, one red, everything in the third person. This
     answers it as a person on a night desk reading a wire to somebody who is
     still awake and worried. So: no grid, no chrome, warm dark paper, a serif
     for the voice and a mono for the evidence, and a page that speaks in the
     first person and in sentences.

     The single carrying idea: THE QUERY IS A SENTENCE. There is no filter
     bank. The controls are words inside one line of English (or Japanese, or
     Hindi) that the reader edits in place — "Show me roles matching anything
     in all fifteen countries in any field — newest first." Every filter the
     Swiss page had is a word in that sentence; the narrow ones are further
     clauses the sentence grows on request. A page that talks has to be honest
     about what it does not know, so absence still renders as absence and every
     derived fact still says it was derived.

     Colour discipline: ONE accent, the lamp. #F0A93B means exactly one thing —
     THIS IS LIVE: a departed word in the sentence, the open row, the roles
     that appeared tonight. Nothing else on the page is ever that colour, so a
     lamp-coloured thing at the edge of your eye is always something you did.

     Type discipline: the voice is Newsreader; every NUMBER and every piece of
     machine evidence is mono. A number is never set in the serif, so counts
     line up as columns without a single table, and the reader can tell a thing
     we read from a thing we said by its shape alone.
     ------------------------------------------------------------------------ */
  :root {
    --night:  #14100C;   /* the paper, at the hour this page is read */
    --night2: #1B1610;   /* a raised surface: a hovered row, the ask */
    --night3: #221C15;   /* the deepest recess: the unfolded entry */
    --rule:   #2E2721;   /* hairline */
    --rule2:  #493F34;   /* structural */
    --paper:  #F2E9DC;   /* the voice */
    --paper2: #C0B4A5;   /* the aside */
    --paper3: #8B8175;   /* apparatus, and things that are absent */
    --lamp:   #F0A93B;   /* LIVE. Nowhere else. */
    --lamp-d: #7A5417;   /* the lamp at rest, for rules only */
    --measure: 38rem;    /* the reading measure — prose never runs wider */
    --gut: 1.6rem;
    --serif: Newsreader, "Newsreader fallback G", "Newsreader fallback T",
             Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; padding: 0 0 5rem; overflow-x: clip;
    background: var(--night); color: var(--paper);
    font-family: var(--serif); font-size: 17px; line-height: 1.55;
    font-optical-sizing: auto; font-weight: 400;
    -webkit-font-smoothing: antialiased;
    /* The desk lamp. One radial pool of warmth at the top of the sheet, fixed,
       so the page reads as a lit thing rather than as a dark theme. It is
       painted on the body's own background so it can never intercept a click. */
    background-image: radial-gradient(120rem 46rem at 22% -14rem,
                      rgba(240,169,59,.085), rgba(240,169,59,0) 70%);
    background-attachment: fixed;
  }
  .wrap { max-width: 74rem; margin-inline: auto; padding-inline: var(--gut); }
  /* Every number, every code, every date the build wrote. */
  .n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums;
              font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }
  .lamp { color: var(--lamp); }
  .micro { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
           text-transform: uppercase; color: var(--paper3); }
  a { color: inherit; text-decoration-color: var(--rule2);
      text-underline-offset: .18em; text-decoration-thickness: 1px; }
  a:hover { color: var(--lamp); text-decoration-color: var(--lamp); }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px;
                   border-radius: 1px; }
  button { font: inherit; color: inherit; }

  /* ------------------------------- the letterhead ------------------------- */
  .head { padding-top: 1.5rem; display: flex; flex-wrap: wrap;
          align-items: baseline; gap: .5rem 1.4rem;
          border-bottom: 1px solid var(--rule); padding-bottom: .7rem; }
  .brand { font-family: var(--mono); font-size: 11px; letter-spacing: .3em;
           text-transform: uppercase; color: var(--paper2); }
  .brand b { color: var(--paper); font-weight: 700; }
  .head .stamp { margin-inline-start: auto; }
  /* Hidden until Clerk answers. A page whose auth never loads shows no control
     at all — honest — rather than a Sign in that cannot sign anybody in.
     `visibility`, not `display`: hidden by display, the slot took no space and
     then took 30px the moment Clerk answered, which pushed the whole page down
     and was the single largest layout shift on the page (measured: 0.17 of a
     0.18 CLS). The slot holds its berth from the first paint and either fills
     it or does not. */
  /* `align-self: center` rather than the header's baseline: an EMPTY flex
     item has no baseline to align, so the reserved slot and the filled one
     sat on different lines and the header still moved 5px. Centred, its
     height is its own and the flex line never changes. */
  #account { visibility: hidden; height: 1.9rem; min-width: 1px;
             align-self: center; display: flex; align-items: center; }
  #account[data-ready] { visibility: visible; }
  #account button {
    background: none; border: 1px solid var(--rule2); border-radius: 0;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; padding: .2rem .7rem; cursor: pointer;
    color: var(--paper2);
    /* Exactly the height the empty slot reserves, so filling it changes
       nothing. Reserved at 1.9rem and filled at 1.55rem, the header SHRANK
       five pixels when Clerk answered and took the whole page up with it. */
    min-height: 1.9rem; display: inline-flex; align-items: center; }
  #account button:hover { border-color: var(--lamp); color: var(--lamp); }

  /* ---------------------------------- the lede ---------------------------- */
  .lede { padding: 2.6rem 0 1.6rem; }
  .lede h1 {
    /* `em`, not `ch`. A `ch` is the width of the font's own zero, so a headline
       measured in `ch` is measured differently by the fallback and by
       Newsreader — which is a line break that moves after the font arrives,
       which is the largest single shift left on this page once the metrics
       were matched. */
    margin: 0 0 .8rem; max-width: 11.4em;
    font-size: clamp(2.1rem, 6.4vw, 3.6rem); line-height: 1.06;
    font-weight: 400; letter-spacing: -0.022em;
    font-style: italic; color: var(--paper);
  }
  .lede p { margin: 0; max-width: var(--measure); color: var(--paper2);
            font-size: 1.0625rem; line-height: 1.62; }
  /* A date or a count must not break across two lines mid-token: "am 4. /
     August 2026" reads as two facts. */
  .lede p .n { color: var(--paper); white-space: nowrap; }
  /* Skeletons, sized to what each block becomes, because layout shift is the
     one thing a page cannot apologise for afterwards. Measured, not guessed:
     the page loaded at 0.57 CLS before these — the footer sat in the viewport
     while the register was empty and was thrown a screen and a half down the
     moment 120 rows arrived, which counts as a shift because the reader was
     looking at it. Reserving a screen for the register puts the footer below
     the fold from the first paint, and the two smaller reservations hold the
     lede's own sentence and the country band. */
  #lands:empty { display: block; min-height: 5.3rem; }
  #reg:empty { display: block; min-height: 100vh; }
  @media (max-width: 46rem) { #lands:empty { min-height: 3.9rem; } }

  /* ------------------------------- THE SENTENCE --------------------------- */
  /* The instrument. Nine controls set as words inside one line of prose: each
     is a native <select> or <input> lying invisibly on top of the word that
     shows its value, so the reader gets the platform's own keyboard and touch
     behaviour and the page gets type that sets to its content. A select sized
     by its widest option would blow a hole in the sentence. */
  .askline { padding: .4rem 0 1.5rem; }
  .sentence {
    margin: 0; max-width: 48rem;
    font-size: clamp(1.18rem, 2.6vw, 1.5rem); line-height: 1.85;
    color: var(--paper2); letter-spacing: -0.012em;
  }
  .slot { position: relative; display: inline-block; vertical-align: baseline;
          white-space: nowrap; }
  .slot > .val {
    color: var(--paper); font-weight: 500;
    border-bottom: 1px dashed var(--rule2); padding-bottom: .06em;
  }
  .slot > select, .slot > input {
    position: absolute; inset: -.25em -.35em; width: calc(100% + .7em);
    height: calc(100% + .5em);
    opacity: 0; appearance: none; -webkit-appearance: none;
    font: inherit; border: 0; padding: 0; margin: 0; cursor: pointer;
    background: transparent; color: transparent;
  }
  .slot:hover > .val { color: var(--lamp); border-bottom-color: var(--lamp); }
  .slot:has(> :focus-visible) > .val {
    outline: 2px solid var(--lamp); outline-offset: 3px; }
  /* A departed control is visible from across the room: the moment a word
     leaves its default it takes the lamp and keeps it until it is put back. */
  .slot.set > .val { color: var(--lamp); border-bottom-color: var(--lamp);
                     border-bottom-style: solid; }
  /* The search word is a real input, so its glyphs are the reader's own and
     the caret has to show. It sits ON the line rather than under it. */
  /* The sizer stays IN FLOW and invisible so the slot is as wide as the text
     the reader has typed; the input lies on top of it. An input sized by CSS
     would either clip the word or blow a hole in the sentence. */
  /* The sizer and the input must be set IDENTICALLY or the slot is the wrong
     width: italic on one and roman on the other left a gap in English and, in
     Devanagari — where the oblique is synthesised and the metrics diverge
     further — printed the typed word over the next word of the sentence. */
  .slot.q > .val, .slot.q > input { font-style: italic; }
  /* The sizer runs a hair wide on purpose. Measured in r01: the italic input
     sets a fraction wider than the roman sizer at the same string, and the
     last glyph of "anything" was clipped at rest in every locale. Slack in the
     sizer costs a sixth of a space and clips nothing. */
  .slot.q > .val { visibility: hidden; white-space: pre; padding-inline-end: .18em; }
  .slot.q > input { opacity: 1; color: var(--lamp); cursor: text;
                    inset: -.25em 0; width: 100%; }
  .slot.q > input::placeholder { color: var(--paper); opacity: 1;
                                 font-style: italic; }
  .slot.q > input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .clauses { display: inline; }
  .clauses[hidden] { display: none; }
  /* THE SECOND SENTENCE — the reader's own. The register's sentence is a
     question about the corpus; this one is a statement about the person
     reading, and it is set a size down and a shade back so it reads as an
     aside in the same voice rather than as a second control bank. Its words
     are the same instrument: nouns you edit in place.

     It is NOT written to the URL, and that is the one deliberate asymmetry in
     "the address bar is the session": a find can be sent to a friend, and a
     reader's visa status is not part of a link. */
  .you { margin: .4rem 0 0; max-width: 46rem; font-size: clamp(1rem, 2.1vw, 1.16rem);
         line-height: 1.9; color: var(--paper3); letter-spacing: -0.008em; }
  .you .slot > .val { color: var(--paper2); font-weight: 400; }
  .you .slot.set > .val { color: var(--lamp); }
  .lensbtn {
    appearance: none; background: none; border: 1px solid var(--rule2);
    border-radius: 0; margin-inline-start: .6rem; padding: .28rem .6rem;
    cursor: pointer; vertical-align: .06em; white-space: nowrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--paper3); }
  .lensbtn:hover { border-color: var(--lamp); color: var(--lamp); }
  .lensbtn[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
  /* What the second sentence yields, stated in numbers before it is believed.
     A lens that only dims is a lens that could be lying about why. */
  .yield { margin: .5rem 0 0; max-width: var(--measure); font-size: .8125rem;
           line-height: 1.55; color: var(--paper3); }
  .yield .n { color: var(--paper2); }
  .yield b { font-weight: 400; color: var(--lamp); }
  .yield button { appearance: none; background: none; border: 0; border-radius: 0;
                  padding: .3rem 0; margin: 0; cursor: pointer;
                  font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
                  text-transform: uppercase; color: var(--lamp); }
  .yield button:hover { text-decoration: underline; }

  /* ------------------------------ the return ------------------------------ */
  /* What changed since the last time THIS browser read the register. It sits
     above the register because it is the answer to the question a returning
     reader already has, and it is gone the moment there is nothing to say. */
  .greet { margin: 1.2rem 0 0; padding: .9rem 0 0; border-top: 1px solid var(--rule2);
           max-width: 46rem; }
  .greet h2 { margin: 0 0 .3rem; font-size: 1.18rem; font-weight: 400;
              font-style: italic; letter-spacing: -0.018em; line-height: 1.25;
              color: var(--paper); }
  .greet h2 .n { font-style: normal; color: var(--lamp); }
  .greet p { margin: 0 0 .2rem; font-size: .875rem; line-height: 1.55;
             color: var(--paper3); }
  .greet .acts { display: flex; flex-wrap: wrap; gap: .2rem 1.2rem; margin-top: .5rem; }
  .greet button { appearance: none; background: none; border: 0; border-radius: 0;
                  padding: .5rem 0; margin: 0; cursor: pointer; min-height: 40px;
                  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
                  text-transform: uppercase; color: var(--lamp); }
  .greet button.quiet { color: var(--paper3); }
  .greet button:hover { text-decoration: underline; }
  /* The greeting's berth is reserved from the first paint whenever this browser
     already holds a previous visit — which is known synchronously, before a
     single byte of the register has arrived. A block that appears ABOVE the
     register a second later would throw the whole page down, and the reader is
     looking straight at it. */
  #greet.pending:empty { display: block; min-height: 8.5rem; }
  @media (max-width: 46rem) { #greet.pending:empty { min-height: 11rem; } }
  #yield:empty { display: none; }
  /* Adding a clause is a different act from editing a word, so it is set in a
     different voice: the mono apparatus, not the sentence's own serif. It sat
     in the serif for one pass and read as a fourth control the reader could
     not work out how to change. */
  .grow {
    appearance: none; background: none; border: 0; border-radius: 0;
    margin: 0 0 0 .5rem; padding: .3rem 0; cursor: pointer;
    vertical-align: baseline; white-space: nowrap;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--paper3);
  }
  .grow:hover { color: var(--lamp); }

  /* ------------------------- the countries, as a line of type ------------- */
  /* This is the plate index, and it is type rather than a map. Fifteen names
     that wrap like a paragraph, each carrying its own count. A country nobody
     is hiring in KEEPS ITS LINE and prints its zero — a country we read and
     found empty is a finding, and dropping it would read as one nobody
     looked at. */
  .lands { margin: 0 0 1.2rem; padding: .9rem 0 0; border-top: 1px solid var(--rule);
           display: flex; flex-wrap: wrap; gap: .1rem 0; align-items: baseline; }
  .land { appearance: none; background: none; border: 0; border-radius: 0;
          margin: 0; padding: .3rem .62rem .3rem 0; cursor: pointer;
          font-family: var(--serif); font-size: .95rem; color: var(--paper2);
          display: inline-flex; align-items: baseline; gap: .3rem; }
  .land .lc { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
              color: var(--paper3); }
  .land .ln { font-family: var(--mono); font-size: .78rem; color: var(--paper3);
              font-variant-numeric: tabular-nums; }
  .land:hover { color: var(--lamp); }
  .land:hover .lc, .land:hover .ln { color: var(--lamp); }
  .land[aria-pressed="true"] { color: var(--lamp); }
  .land[aria-pressed="true"] .lc, .land[aria-pressed="true"] .ln { color: var(--lamp); }
  .land[aria-pressed="true"] .lb { border-bottom: 1px solid var(--lamp); }
  .land.nil { color: var(--paper3); }
  .land.nil .ln { text-decoration: line-through;
                  text-decoration-color: var(--rule2); }

  /* --------------------------------- the rail ----------------------------- */
  /* Where you are, always. A sticky column beside the register carrying the
     reader's depth as a mono counter, a filled bar, and the name of the band
     they are inside. It is the only thing on the page that moves while you
     read, which is why it is the only thing that may. */
  .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  @media (min-width: 64rem) {
    .body { grid-template-columns: 10.5rem minmax(0, 1fr); gap: 0 2.6rem; }
  }
  .rail { display: none; }
  @media (min-width: 64rem) {
    .rail { display: block; position: sticky; top: 1.4rem; align-self: start;
            padding-top: .55rem; }
  }
  .rail .rk { display: block; margin-bottom: .3rem; }
  .rail .rn { font-family: var(--mono); font-size: 1.35rem; color: var(--paper);
              font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
              display: block; }
  .rail .rt { font-family: var(--mono); font-size: .74rem; color: var(--paper3);
              display: block; }
  .rail .bar { margin: .8rem 0; height: 8rem; width: 2px; background: var(--rule);
               position: relative; }
  .rail .bar i { position: absolute; inset-inline-start: -1px; top: 0; width: 4px;
                 background: var(--lamp); display: block; }
  .rail .rband { display: block; font-size: .9rem; line-height: 1.3;
                 color: var(--paper2); max-width: 9.5rem; }
  .rail .rhint { display: block; margin-top: 1.1rem; font-family: var(--mono);
                 font-size: 9.5px; letter-spacing: .1em; line-height: 1.7;
                 color: var(--paper3); text-transform: uppercase; }

  /* ------------------------------- the register --------------------------- */
  .tally { padding: .1rem 0 .5rem; display: flex; flex-wrap: wrap;
           gap: .3rem .8rem; align-items: baseline; }
  .tally .big { font-family: var(--mono); font-size: 1rem; color: var(--paper);
                font-variant-numeric: tabular-nums; }
  #reg { margin: 0; padding: 0; list-style: none; }

  /* A band head: the night a set of roles was first seen, or the company a set
     of roles belongs to. The register's rhythm comes from here — the list is
     never a flat 6,423 rows, it is bands of rows with an airy line between. */
  .band { padding: 2rem 0 .5rem; border-bottom: 1px solid var(--rule);
          display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .8rem; }
  .band:first-child { padding-top: .4rem; }
  .band h2 { margin: 0; font-size: 1.5rem; font-weight: 400; line-height: 1.15;
             letter-spacing: -0.02em; color: var(--paper); }
  .band h2 em { font-style: italic; }
  .band .bn { font-family: var(--mono); font-size: .8rem; color: var(--paper3);
              font-variant-numeric: tabular-nums; margin-inline-start: auto;
              white-space: nowrap; }
  .band .bnote { flex-basis: 100%; margin: .28rem 0 0; max-width: var(--measure);
                 font-size: .8125rem; line-height: 1.5; color: var(--paper3);
                 font-style: italic; }
  .band.tonight h2 { color: var(--lamp); }

  /* One line of the register. Rows are a grid rather than flexed text so the
     mono index, the title and the company keep their columns at every measure,
     and so a row can never change shape halfway down the page. */
  .row { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto auto;
         gap: 0 1rem; align-items: baseline; width: 100%; text-align: start;
         padding: .62rem .5rem .62rem .1rem; margin: 0;
         border: 0; border-bottom: 1px solid var(--rule);
         border-inline-start: 2px solid transparent;
         background: none; position: relative; }
  .row:hover { background: var(--night2); }
  .row.open { background: var(--night2); border-inline-start-color: var(--lamp); }
  /* The index is a control: it opens what we hold on this one role. Set as the
     number it already was, because a row that grows a fourth affordance is a
     row that reads as a toolbar. */
  .row .ix { font-family: var(--mono); font-size: 10.5px; color: var(--paper3);
             font-variant-numeric: tabular-nums; letter-spacing: .04em;
             padding: .3em 0 0; margin: 0; background: none; border: 0;
             border-radius: 0; appearance: none; text-align: start;
             cursor: pointer; align-self: baseline; }
  .row .ix:hover { color: var(--lamp); text-decoration: underline; }
  .row.open .ix, .row:hover .ix { color: var(--lamp); }
  .row .ti { font-size: 1.0625rem; line-height: 1.35; letter-spacing: -0.012em;
             overflow-wrap: anywhere; }
  .row .ti a { color: var(--paper); text-decoration: none; font-weight: 500; }
  .row .ti a:hover, .row .ti a:focus-visible { color: var(--lamp);
    text-decoration: underline; text-decoration-color: var(--lamp); }
  /* The apply affordance is visible at rest. A list where only hover says
     "these are links" is a list that reads as prose. */
  .row .ti a::after { content: "\00a0↗"; font-size: .78em; color: var(--paper3); }
  .row .ti a:hover::after { color: var(--lamp); }
  .row .sub { display: block; margin-top: .12rem; font-size: .8125rem;
              line-height: 1.45; color: var(--paper3); overflow-wrap: anywhere; }
  .row .sub .sep { color: var(--rule2); }
  /* The company cell is a button into the entry: a role has two destinations,
     the posting and the company, and one row may not swallow both. */
  .co { appearance: none; background: none; border: 0; border-radius: 0;
        margin: 0; padding: 0; cursor: pointer; text-align: end;
        font-family: var(--serif); font-size: .875rem; color: var(--paper2);
        white-space: nowrap; max-width: 12rem; overflow: hidden;
        text-overflow: ellipsis; }
  .co:hover, .co:focus-visible { color: var(--lamp); }
  .co .cch { font-family: var(--mono); font-size: .7rem; color: var(--paper3);
             margin-inline-start: .35rem; }
  .co:hover .cch { color: var(--lamp); }
  /* The company register's own line: the same three columns, a different unit,
     and the whole line is the button because a company has one destination. */
  .row.crow { cursor: pointer; }
  .row.crow .ti { font-weight: 500; }
  .row .cnt { font-family: var(--mono); font-size: .82rem; color: var(--paper2);
              font-variant-numeric: tabular-nums; white-space: nowrap;
              text-align: end; }
  .row.open .cnt, .row:hover .cnt { color: var(--lamp); }

  /* ------------------------------ what you keep --------------------------- */
  /* At 11pm you collect. The keep is a mark you make on a line, so it is set
     as a mark — a hairline square at the end of the row that fills with the
     lamp when it holds something. It is the only control on the page that
     writes anything down, which is why the bookplate at the foot prints it
     back and offers to burn it. */
  .kp { appearance: none; background: none; border: 1px solid transparent;
        border-radius: 0; margin: 0; padding: .2rem .4rem; cursor: pointer;
        font-family: var(--mono); font-size: 10px; letter-spacing: .06em;
        color: var(--paper3); white-space: nowrap; align-self: baseline;
        min-height: 22px; line-height: 1; }
  .row:hover .kp, .kp:focus-visible { border-color: var(--rule2); }
  .kp:hover { color: var(--lamp); border-color: var(--lamp); }
  .kp[aria-pressed="true"] { color: var(--lamp); border-color: var(--lamp-d); }
  /* A kept role that is no longer on any board we read tonight. The row still
     prints — the reader wrote it down and it is theirs — but the title carries
     the strike, because the claim "this is open" is one we can no longer make. */
  .row.gone .ti a, .row.gone .ti > span:first-child {
    color: var(--paper3); text-decoration: line-through;
    text-decoration-color: var(--rule2); }

  /* --------------------------------- the lens ----------------------------- */
  /* The reader's second sentence, applied. It DIMS; it never removes. A row is
     dimmed only where a stated fact rules it out — the posting's own words, or
     the reader's own words about themselves — and never where a board is
     merely silent, because silence is not a no. */
  /* Dimmed, not greyed out. .42 read beautifully and put the title at 3.5:1,
     which is a page deciding that a job somebody might still want is no longer
     text. Measured back up to where the title clears AA dimmed, with the
     second line lifted a step to pay for its own share of the fade — and any
     dimmed row comes back to full on hover or focus. */
  .row.dim { opacity: .62; }
  .row.dim .sub { color: var(--paper); }
  .row.dim .ix { color: var(--paper2); }
  .row.dim:hover, .row.dim:focus-within { opacity: 1; }
  .row.dim:hover .sub, .row.dim:focus-within .sub { color: var(--paper3); }
  .row.dim:hover .ix, .row.dim:focus-within .ix { color: var(--lamp); }
  @media (prefers-reduced-motion: no-preference) {
    .row { transition: opacity .18s linear; }
  }
  .row.lit .ix { color: var(--lamp); }
  .mk.why { border-style: dashed; }
  .mk.why.no { border-color: var(--rule2); color: var(--paper3); }

  /* The marks. Square, hairline, mono — evidence, never decoration. `open`
     facts take the frame; a stated `no` is a fact too and takes the ink. */
  .mk { font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
        text-transform: uppercase; border: 1px solid var(--rule2);
        padding: .12em .34em .06em; color: var(--paper3); white-space: nowrap;
        margin-inline-start: .4rem; display: inline-block;
        vertical-align: .1em; }
  .mk.yes { border-color: var(--rule2); color: var(--paper2); }
  /* The one exception to "the lamp is only live state": a role that appeared
     tonight IS live state — it is the only thing on a register line that is a
     claim about a change rather than about a fact, and there are seven of them. */
  .mk.fresh { border-color: var(--lamp); color: var(--lamp); }

  /* ------------------------------- the entry ------------------------------ */
  /* A role reveals itself without a page turn and without losing the scroll:
     the entry unfolds in place, directly under the line that opened it, and
     the rows below simply move down. Nothing scrolls, nothing is replaced. */
  .entry { border-bottom: 1px solid var(--rule);
           border-inline-start: 2px solid var(--lamp);
           background: var(--night3); overflow: hidden;
           display: grid; grid-template-rows: 1fr; }
  .entry > .inner { min-height: 0; padding: 1.1rem 1.3rem 1.4rem;
                    overflow-wrap: anywhere; }
  @keyframes unfold { from { grid-template-rows: 0fr; } to { grid-template-rows: 1fr; } }
  .entry { animation: unfold .22s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .entry { animation: none; } }
  .entry h3 { margin: 0 0 .1rem; font-size: 1.6rem; font-weight: 400;
              letter-spacing: -0.024em; line-height: 1.1; }
  .entry .ehead { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem;
                  align-items: baseline; margin-bottom: .9rem; }
  .entry .eclose { margin-inline-start: auto; appearance: none; background: none;
                   border: 1px solid var(--rule2); border-radius: 0; cursor: pointer;
                   font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
                   text-transform: uppercase; padding: .3rem .6rem;
                   color: var(--paper3); }
  .entry .eclose:hover { border-color: var(--lamp); color: var(--lamp); }
  .entry .said { margin: 0 0 1rem; max-width: var(--measure); }
  .entry .said p { margin: 0 0 .18rem; font-size: .95rem; line-height: 1.5;
                   color: var(--paper); }
  .entry .said .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
                    text-transform: uppercase; color: var(--paper3);
                    margin-inline-end: .55rem; }
  /* Scoped past `.entry .said p`, which is one element more specific and was
     setting this line at reading size — a provenance stamp shouting over the
     three lines it is stamping. */
  .entry .said p.prov { margin: .3rem 0 0; font-family: var(--mono); font-size: 9.5px;
                 letter-spacing: .1em; text-transform: uppercase; color: var(--paper3); }
  /* The receipt: this register's one strong claim is "proven by the board",
     and the receipt is where a single entry proves it. Every line is a fact
     the build wrote; the ones it did not write do not print at all. */
  /* The receipt is ONE grid and its rows are display:contents, so the key
     column sizes itself to the longest label in whatever language is loaded
     and still aligns across every row. A fixed track was right in English and
     broke "STELLENSEITE" across two lines in German (measured at 380px). */
  .rcpt { font-family: var(--mono); font-size: 11px; line-height: 1.5;
          color: var(--paper2); border: 1px solid var(--rule);
          border-inline-start: 2px solid var(--lamp-d);
          padding: .55rem .75rem; margin: 0 0 1rem; max-width: 32rem;
          display: grid; grid-template-columns: auto minmax(0, 1fr);
          gap: 0 .8rem; }
  .rcpt .rr { display: contents; }
  .rcpt .rk, .rcpt .rv { padding: .18rem 0; margin: 0; }
  .rcpt .rr + .rr .rk, .rcpt .rr + .rr .rv { border-top: 1px solid var(--rule); }
  .rcpt .rk { font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
              color: var(--paper3); white-space: nowrap; }
  /* A silence in the receipt is set in the apparatus colour rather than the
     value colour, so a fact we hold and a fact nobody stated do not look alike
     at a glance. */
  .rcpt .rv.nil { color: var(--paper3); }
  .rcpt .rv em { font-style: normal; color: var(--lamp); }
  /* The role sheet's own head: the board's words, kept in the board's language,
     above everything this page says about them. */
  .entry .rtitle { margin: 0 0 .7rem; font-size: 1.05rem; line-height: 1.35;
                   color: var(--paper); max-width: var(--measure); }
  .entry .rtitle .mk { vertical-align: .18em; }
  .entry .cobtn { appearance: none; background: none; border: 0; border-radius: 0;
                  padding: .5rem 0 0; margin: 0; cursor: pointer;
                  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
                  text-transform: uppercase; color: var(--lamp); }
  .entry .cobtn:hover { text-decoration: underline; }
  .entry .facts { margin: 0 0 1rem; max-width: var(--measure); font-size: .9rem;
                  line-height: 1.55; color: var(--paper2); }
  .entry .facts p { margin: 0 0 .25rem; }
  .entry .facts .n { color: var(--paper); }
  .entry .rl { list-style: none; margin: .2rem 0 0; padding: 0;
               border-top: 1px solid var(--rule); }
  .entry .rl li { border-bottom: 1px solid var(--rule); padding: .38rem 0;
                  font-size: .95rem; line-height: 1.4; }
  .entry .rl li a { color: var(--paper); text-decoration: none; font-weight: 500; }
  .entry .rl li a:hover { color: var(--lamp); text-decoration: underline; }
  .entry .rl li a::after { content: "\00a0↗"; font-size: .78em; color: var(--paper3); }
  .entry .rl .loc { color: var(--paper3); font-size: .8125rem; }
  .entry .rl li.hit a { color: var(--lamp); }
  .entry .morebtn { appearance: none; background: none; border: 0; padding: .5rem 0 0;
                    margin: 0; cursor: pointer; font-family: var(--mono);
                    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
                    color: var(--lamp); }
  .entry .morebtn:hover { text-decoration: underline; }
  .cin { font-family: var(--mono); font-size: .86em; user-select: all;
         background: var(--night); padding: .05rem .3rem; color: var(--paper); }

  /* --------------------------------- the ask ------------------------------ */
  /* It is a note in the margin of the register, at the exact line where the
     free reading ends, in the same voice as the rest of the page. Not a modal,
     not a blur, not a countdown. The register above it keeps working, and the
     second button below prints everything anyway — the sign-in is here to be
     MEASURED, not to charge a toll. */
  .ask { margin: 1.6rem 0; padding: 1.4rem 1.5rem 1.5rem;
         background: var(--night2); border: 1px solid var(--rule2);
         border-inline-start: 3px solid var(--lamp); max-width: 44rem; }
  .ask h2 { margin: 0 0 .5rem; font-size: 1.45rem; font-weight: 400;
            font-style: italic; letter-spacing: -0.02em; line-height: 1.2; }
  .ask p { margin: 0 0 .7rem; font-size: 1rem; line-height: 1.6;
           color: var(--paper2); max-width: var(--measure); }
  .ask .fine { font-size: .8125rem; line-height: 1.55; color: var(--paper3); }
  .ask .acts { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1rem; }
  .ask button { appearance: none; border-radius: 0; cursor: pointer;
                padding: .72rem 1.1rem; min-height: 44px;
                font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
                text-transform: uppercase; }
  .ask .yes { background: var(--lamp); color: #1A1206; border: 1px solid var(--lamp);
              font-weight: 700; }
  .ask .yes:hover { background: #FFC163; border-color: #FFC163; }
  .ask .no { background: none; color: var(--paper2); border: 1px solid var(--rule2); }
  .ask .no:hover { border-color: var(--paper2); color: var(--paper); }
  .ask .tick { margin: .9rem 0 0; font-family: var(--mono); font-size: 10px;
               letter-spacing: .1em; text-transform: uppercase; color: var(--paper3); }

  /* ------------------------------ the milestones -------------------------- */
  /* 6,423 is a lot. A wall says so once at the top and then makes you climb it;
     these say it as DISTANCE, every two hundred roles, so the scale reads as
     how far you have come rather than as how much is left. */
  .mile { display: flex; align-items: center; gap: .9rem; padding: 1.1rem 0;
          font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--paper3); }
  .mile i { flex: 1; height: 1px; background: var(--rule); display: block; }
  .mile b { font-weight: 400; color: var(--paper2); }

  .keep { appearance: none; display: block; width: 100%; background: none;
          border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
          padding: 1.1rem 0; margin: 0; cursor: pointer; text-align: start;
          font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
          text-transform: uppercase; color: var(--lamp); min-height: 44px; }
  .keep:hover { background: var(--night2); }

  /* -------------------------------- the nothing --------------------------- */
  .none { padding: 2.4rem 0 1rem; max-width: var(--measure); }
  .none p { margin: 0 0 .7rem; font-size: 1.1rem; line-height: 1.55;
            color: var(--paper2); }
  .none .fine { font-size: .875rem; color: var(--paper3); }
  .none button { appearance: none; background: none; border: 1px solid var(--rule2);
                 border-radius: 0; cursor: pointer; padding: .6rem .9rem;
                 min-height: 44px; font-family: var(--mono); font-size: 10.5px;
                 letter-spacing: .13em; text-transform: uppercase; color: var(--paper2); }
  .none button:hover { border-color: var(--lamp); color: var(--lamp); }
  /* The way through the language boundary: the page's own words, offered as
     the filters they already are. */
  .none .acts { display: flex; flex-wrap: wrap; gap: .5rem; margin: .7rem 0 1.1rem; }
  .none .acts button { border-color: var(--lamp-d); color: var(--paper); }

  /* --------------------------------- the foot ----------------------------- */
  footer { margin-top: 4rem; border-top: 1px solid var(--rule); padding-top: 1.6rem; }
  .langs { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .1rem;
           margin: 0 0 1.8rem; }
  .langs .lk { margin-inline-end: .7rem; }
  .langs button { appearance: none; background: none; border: 0; border-radius: 0;
                  cursor: pointer; padding: .45rem .7rem; margin: 0;
                  font-family: var(--serif); font-size: .95rem; color: var(--paper2);
                  border-bottom: 1px solid transparent; min-height: 40px; }
  .langs button:hover { color: var(--lamp); }
  .langs button[aria-current="true"] { color: var(--lamp);
                                       border-bottom-color: var(--lamp); }
  .notes { display: grid; gap: .9rem 2.6rem; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 58rem) { .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .notes p { margin: 0; font-size: .8125rem; line-height: 1.6; color: var(--paper3);
             counter-increment: note; position: relative; padding-inline-start: 1.9rem; }
  .notes p:empty { display: none; }
  .notes p::before { content: counter(note, decimal-leading-zero);
                     position: absolute; inset-inline-start: 0; top: .1rem;
                     font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
                     color: var(--lamp-d); }
  .notes { counter-reset: note; }
  /* ------------------------------ the bookplate --------------------------- */
  /* Everything this page has written down about the reader, printed back as
     the bytes it actually holds, with a control that burns them. A page that
     keeps a shortlist has to be auditable by the person whose shortlist it is,
     and "we respect your privacy" is a sentence; this is the file. */
  .plate { margin: 1.8rem 0 0; padding: .9rem 1rem 1rem; border: 1px solid var(--rule);
           border-inline-start: 2px solid var(--lamp-d); max-width: 44rem; }
  .plate h2 { margin: 0 0 .5rem; font-family: var(--mono); font-size: 10.5px;
              letter-spacing: .14em; text-transform: uppercase; font-weight: 400;
              color: var(--paper3); }
  .plate dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr);
              gap: 0 .9rem; font-family: var(--mono); font-size: 11px;
              line-height: 1.5; }
  .plate dt { color: var(--paper3); padding: .18rem 0; white-space: nowrap; }
  .plate dd { color: var(--paper2); margin: 0; padding: .18rem 0;
              overflow-wrap: anywhere; }
  .plate dd.nil { color: var(--paper3); }
  .plate .burn { appearance: none; background: none; border: 1px solid var(--rule2);
                 border-radius: 0; margin-top: .9rem; padding: .5rem .8rem;
                 min-height: 40px; cursor: pointer; font-family: var(--mono);
                 font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                 color: var(--paper2); }
  .plate .burn:hover { border-color: var(--lamp); color: var(--lamp); }
  .plate p { margin: .7rem 0 0; font-size: .8125rem; line-height: 1.55;
             color: var(--paper3); max-width: var(--measure); }
  .srcs { margin: 1.6rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule);
          font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--paper3);
          display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
  .srcs a { color: var(--paper2); }

  /* ------------------------------- the hand's width ----------------------- */
  @media (max-width: 46rem) {
    :root { --gut: 1.1rem; }
    body { font-size: 16px; }
    /* The snapshot stamp takes its own line rather than sharing one with the
       account button: it opens as an em dash and becomes a long localised date,
       and at this width that difference decided whether the header was two
       lines or three — a header that grows a line moves the entire page. */
    .head .stamp { flex-basis: 100%; order: 3; margin-inline-start: 0; }
    /* The account slot reserves its WIDTH here as well as its height. At 390px
       the letterhead was one pixel from wrapping: the brand and an empty slot
       fitted on one line, and the brand and "Iniciar sesión" did not — so the
       header grew a line the moment Clerk answered, in Spanish, Portuguese and
       French only, and took the whole page down with it. Reserved, the line
       breaks the same way before and after. */
    #account { min-width: 9rem; }
    .sentence { font-size: 1.12rem; line-height: 1.95; }
    .row { grid-template-columns: 2.6rem minmax(0, 1fr) auto; gap: 0 .7rem;
           padding-block: .7rem; }
    /* At a hand's width the company drops under the title rather than fighting
       it for the line. It is still its own control, still 44px tall. The keep
       stays on the first line, at the end of the index column's row, because
       it is the one control a thumb reaches for repeatedly. */
    .co, .row .cnt { grid-column: 2; text-align: start; margin-top: .3rem;
                     max-width: 100%; padding: .35rem 0; }
    .kp { grid-column: 3; grid-row: 1; }
    /* The country band stops wrapping and becomes one scrolling line. Fifteen
       44px names wrapped eight rows deep pushed the register most of a screen
       down the page, and the register is what the reader came for. The strip
       scrolls inside ITSELF — the body still never moves sideways — and it
       fades at its trailing edge so the fact that there is more is visible
       rather than inferred. */
    .lands { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
             scrollbar-width: none; padding-bottom: .2rem;
             -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
             mask-image: linear-gradient(to right, #000 88%, transparent); }
    .lands::-webkit-scrollbar { display: none; }
    .land { flex: none; padding-inline-end: .9rem; }
    .entry > .inner { padding: 1rem .9rem 1.2rem; }
    .rcpt { gap: 0 .6rem; padding: .5rem .6rem; }
    .ask { padding: 1.1rem 1rem 1.2rem; }
    .band h2 { font-size: 1.3rem; }
  }
  /* Touch. A word inside a sentence must NOT become a 44px block — that would
     shred the paragraph's line rhythm — so the slot grows its invisible select
     instead, which is the thing a finger actually hits. The register's two
     controls do grow: the title keeps `display: inline` and takes block padding
     (which enlarges the hit region without moving a single glyph), and the
     company button, which sits on its own line at this width, takes a real
     min-height. */
  @media (pointer: coarse), (max-width: 46rem) {
    .slot > select { inset: -.55em -.4em; height: calc(100% + 1.1em); }
    /* Measured at 380px: .55rem of block padding put the title link at 35px and
       the index at 33px, both short of a thumb. These are the numbers that get
       them to 44 without moving a single glyph. */
    .row .ti a { padding-block: .82rem; }
    .grow { padding-block: .8rem; }
    .srcs a { display: inline-block; padding-block: .8rem; }
    .co { min-height: 44px; display: inline-flex; align-items: center; }
    .land { min-height: 44px; }
    .kp { min-height: 44px; min-width: 44px; display: inline-flex;
          align-items: center; justify-content: center; }
    .row .ix { padding-block: .82rem .78rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="brand"><b>Role·Atlas</b> <span id="desk">Night desk</span></span>
    <span class="micro stamp"><span id="snapk">Read on</span>
      <time class="n" id="snapshot">—</time></span>
    <div id="account"></div>
  </header>

  <div class="lede">
    <h1 id="lede1">&nbsp;</h1>
    <p id="lede2"></p>
  </div>

  <div class="askline">
    <p class="sentence" id="sentence"></p>
    <p class="you" id="you"></p>
    <p class="yield" id="yield"></p>
  </div>

  <nav class="lands" id="lands" aria-label="Countries"></nav>

  <div id="greet"></div>

  <div class="body">
    <div class="rail" id="rail" aria-hidden="true"></div>
    <main>
      <div class="tally" id="tally"><span class="micro" id="boot">Reading the register…</span></div>
      <div id="reg"></div>
    </main>
  </div>

  <footer>
    <nav class="langs" id="langs" aria-label="Language"></nav>
    <div class="notes" id="notes"></div>
    <div id="plate"></div>
    <p class="srcs" id="srcs"></p>
  </footer>
</div>
<script>
// ===========================================================================
// This page is a RENDERER. It reads the JSON the build wrote and never
// recomputes a fact — the snapshot date in particular ships with the data,
// because a date taken at render time would claim a freshness the file lacks.
// ===========================================================================
const SCHEMA = 10;
const DEFAULT_SRC = '../data/companies.json';
// Test seam: the e2e drives this same page over a fixture. Same-origin
// relative paths only — a ?data= pointing at another host would render
// somebody else's rows under our name.
const qp = new URLSearchParams(location.search);
const safe = (v, fb) => (v && !/^[a-z]+:|^\/\//i.test(v) ? v : fb);
const src = safe(qp.get('data'), DEFAULT_SRC);
const seenSrc = safe(qp.get('seen'), '../data/first-seen.json');

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {

// The chosen locale. Detected from navigator.languages, overridable by a click

// not for one page load.
const SUPPORTED = LOCALES.map((l) => l[0]);
function detect() {
  const want = qp.get('lang');
  if (want && SUPPORTED.includes(want)) return want;

  try { saved = localStorage.getItem('ra.lang'); } catch { /* private mode */ }
  if (saved && SUPPORTED.includes(saved)) return saved;
  for (const tag of (navigator.languages || [navigator.language || 'en'])) {
    if (SUPPORTED.includes(tag)) return tag;
    const base = String(tag).toLowerCase().split('-')[0];

    // a browser asking for pt-PT gets pt-BR's strings, which is a closer answer
    // than English, and zh-TW gets Simplified for the same reason — stated here
    // rather than silently, because both are compromises.
    if (base === 'pt') return 'pt-BR';
    if (base === 'zh') return 'zh-Hans';
    const hit = SUPPORTED.find((s) => s.split('-')[0] === base);

  const cat = PLURAL[LOC].select(n);
  const key = `n.${kind}.${cat}`;

  return fill((table[key] ?? table[`n.${kind}.other`] ?? S.en[`n.${kind}.other`]),

const pluralKey = (base, n, vars) => {
  PLURAL[LOC] = PLURAL[LOC] || new Intl.PluralRules(LOC);
  const cat = PLURAL[LOC].select(n);
  const table = S[LOC];
  return fill(table[`${base}.${cat}`] ?? table[`${base}.other`]
              ?? S.en[`${base}.other`], vars);

    { year: 'numeric', month: 'long', day: 'numeric' });

const listOf = (arr) => {

  return LF[LOC].format(arr);

const money = (amount, currency) => {
  if (amount == null) return null;
  try {
    return new Intl.NumberFormat(LOC, {
      style: 'currency', currency: currency || 'USD', notation: 'compact',

  const opts = cityOptions();
  if (opts.length) {
    built.city = slot('city', [['any', t('city.any'), fmt('city', t('city.any'))],
                               ...opts],
                      st.city, (v) => set('city', v), t('city.aria'));
  } else if (st.city !== 'any') st.city = 'any';
  built.work = slot('work', [['any', t('work.any')], ['remote', t('work.remote')]],
                    st.work, (v) => set('work', v), t('work.aria'));
  // The openness clause states its own yield BEFORE the click: most postings
  // say nothing at all, so zero is this filter's common answer, and a control
  // that can only empty the page should say so first.
  const openN = SCOPED.filter((c) => c.roles.some((r) => r.visa === 'yes' || r.hire_from_abroad === 'yes')).length;
  if (openN) {
    built.abroad = slot('abroad', [['any', t('abroad.any')],
                                   ['yes', `${t('abroad.yes')} (${count(openN)})`,
                                    t('abroad.yes')]],
                        st.abroad, (v) => set('abroad', v), t('abroad.aria'));
  } else if (st.abroad !== 'any') st.abroad = 'any';
  // The India register clause follows the India-only enrichment it reads: on a
  // country that is not India it is not a control, it is furniture.
  if (!st.country || st.country === 'India') {
    built.mca = slot('mca', [['any', t('mca.any')], ['yes', t('mca.yes')]], st.mca,
                     (v) => set('mca', v), t('mca.aria'));
  } else if (st.mca !== 'any') st.mca = 'any';
  const m10 = money(1e7, 'USD'), m50 = money(5e7, 'USD');
  built.raised = slot('raised', [['any', t('raised.any')],
                                 ['small', t('raised.small', { a: m10 })],
                                 ['mid', t('raised.mid', { a: m10, b: m50 })],
                                 ['large', t('raised.large', { a: m50 })]], st.raised,
                      (v) => set('raised', v), t('raised.aria'));
  built.funded = slot('funded', [['any', t('funded.any')], ['90', t('funded.90')],
                                 ['365', t('funded.365')]], st.funded,
                      (v) => set('funded', v), t('funded.aria'));

  if (visit.last && visit.last !== snapshot && FIRSTSEEN.size) {
    built.since = slot('since', [['any', t('since.any')],
                                 ['last', t('since.last', { date: fmtDate(visit.last) })]],
                       st.since, (v) => set('since', v), t('since.aria'));
  } else if (st.since !== 'any') st.since = 'any';
  if (me.reads !== 'x' && SCRIPTN.mine) {
    built.script = slot('script', [['any', t('script.any')],
                                   ['mine', t('script.mine', { n: count(SCRIPTN.mine) })]],
                        st.script, (v) => set('script', v), t('script.aria'));
  } else if (st.script !== 'any') st.script = 'any';
  const more = el('span', 'clauses');
  more.hidden = !st.wide;
  for (const k of t('cl.order').split(',')) {
    if (built[k]) more.append(...compose(t('cl.' + k), { [k]: built[k] }));
  }
  // A clause the reader has actually SET is never folded away — hiding a live
  // filter behind a "+ ask something narrower" is the page holding a word the
  // reader can no longer see it is holding.
  const setNarrow = Object.keys(built).some((k) => SLOTS[k]
    && SLOTS[k].sel.value !== SLOTS[k].def);
  if (setNarrow) { more.hidden = false; st.wide = true; }
  const grow = el('button', 'grow', st.wide ? t('shrink') : t('grow'));
  grow.type = 'button';
  grow.addEventListener('click', () => { st.wide = !st.wide; SENTSIG = null; reset(); });
  const sorts = [['newest', t('s.newest')], ['reqs', t('s.reqs')],
                 ['raised', t('s.raised')], ['date', t('s.date')],
                 ['name', t('s.name')]]
    // `newest` is offered optimistically before the data has answered and
    // honestly afterwards. Measured: filtering it out at boot meant the sort
    // word was "busiest boards first" for half a second and then "newest
    // first", and a word changing width inside a line of prose relays the
    // whole paragraph. The optimism costs one late shift in the case where
    // first-seen.json genuinely fails to arrive, which is the case that is
    // already degraded.
    .filter(([v]) => v !== 'newest'
                  || ((FIRSTSEEN.size || !bootDone) && st.view !== 'companies'));
  // Only once the data has answered: before it, `newest` is filtered out
  // because FIRSTSEEN is empty, and clamping here would quietly discard a sort
  // the reader had asked for in the URL.
  if (bootDone && !sorts.some(([v]) => v === st.sort)) st.sort = sorts[0][0];
  parts.sort = slot('sort', sorts, st.sort, (v) => set('sort', v), t('s.aria'), true);
  parts.more = more;
  parts.grow = grow;
  p.replaceChildren(...compose(t('sent.core'), parts));
  SLOTS.q = { node: p.querySelector('.slot.q'), sel: null, def: '', never: false,

}

// --------------------------- FLOW 1+3, the second sentence ------------------
// The register's sentence asks the corpus a question. This one lets the reader
// state a fact about themselves, in the same instrument, and it is the whole
// answer to "no page reads the reader": three words, all of them optional, all
// of them STATED. Nothing here is inferred from a header.
function buildYou() {
  const p = $('#you');
  const parts = {};
  const wheres = [['x', t('here.x')], ['out', t('here.out')],
    ...COUNTRIES.map(([n, cd]) => [n, countryName(cd, n)])
      .sort((a, b) => a[1].localeCompare(b[1], LOC))];
  parts.here = slot('here', wheres, me.here, (v) => setMe('here', v), t('here.aria'));
  parts.reads = slot('reads', [['x', t('reads.x')],
    ...LOCALES.map(([code, name]) => [code, name])], me.reads,
    (v) => setMe('reads', v), t('reads.aria'));
  parts.move = slot('move', [['x', t('move.x')], ['move', t('move.move')],
                             ['visa', t('move.visa')], ['stay', t('move.stay')]],
                    me.move, (v) => setMe('move', v), t('move.aria'));
  const lens = el('button', 'lensbtn', t('lens'));
  lens.type = 'button';
  lens.setAttribute('aria-pressed', String(me.lens));
  lens.addEventListener('click', () => { me.lens = !me.lens; saveMe(); SENTSIG = null; reset(); });
  // The lens is not offered until there is a stated fact for it to work from.
  // A dimming control with nothing to dim on is a toggle that lies.
  parts.lens = (me.here !== 'x' || me.move !== 'x') ? lens : null;
  p.replaceChildren(...compose(t('you.core'), parts));
}
function setMe(key, value) {
  me[key] = value;
  // Stating a fact does not switch the lens on. The reader turns it on, and
  // that ordering is the difference between a page that reads you and a page
  // that decides for you.
  saveMe();
  SENTSIG = null;
  reset();
}
function deptOptions() {
  const n = new Map();
  for (const c of SCOPED) for (const r of c.roles) {
    const d = deptOf(r);
    n.set(d, (n.get(d) || 0) + 1);
  }
  const rest = [...n].filter(([d]) => d !== UNCLASSIFIED)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (n.has(UNCLASSIFIED)) rest.push([UNCLASSIFIED, n.get(UNCLASSIFIED)]);
  return rest.map(([d, k]) => [d, `${deptName(d)} (${count(k)})`,
                               fmt('dept', deptName(d))]);
}
function cityOptions() {
  const home = new Map();
  for (const c of SCOPED) {
    for (const p of c.cities) if (!home.has(p)) home.set(p, 'India');
    for (const r of c.roles) for (const p of roleCities(r)) {
      if (!home.has(p)) home.set(p, r.countries[0]);
    }
  }
  return [...home.keys()].sort((a, b) => a.localeCompare(b, LOC))
    .map((p) => [p, st.country || !CODE[home.get(p)] ? p : `${p} · ${CODE[home.get(p)]}`,
                 fmt('city', p)]);
}

// ============================== the countries band =========================
// The plate index, set as type rather than drawn as a map. Fifteen names that
// wrap like a paragraph, each carrying its own count.
// Same rule as the sentence: the band's fifteen names change only when the
// language or the dataset does, so a country click repaints its own state
// rather than replacing the button the reader just pressed.
let LANDSIG = null;
function syncLands() {
  const sig = [LOC, companies.length].join('|');
  if (sig !== LANDSIG) { LANDSIG = sig; buildLands(); }
  for (const b of $('#lands').children) {
    b.setAttribute('aria-pressed',
      String(b.dataset.land ? st.country === b.dataset.land : !st.country));
  }
}
function buildLands() {
  const nav = $('#lands');
  const nodes = [];
  const listed = (name) => companies.filter((c) => c.countries.includes(name)).length;
  const all = el('button', 'land' + (st.country ? '' : ' '));
  all.type = 'button';
  all.setAttribute('aria-pressed', String(!st.country));
  all.append(el('span', 'lb', t('lands.clear')),
             el('span', 'ln', count(companies.length)));
  all.addEventListener('click', () => set('country', null));
  nodes.push(all);
  for (const [name, cd] of COUNTRIES) {
    const n = listed(name);
    const b = el('button', 'land' + (n ? '' : ' nil'));
    b.type = 'button';
    b.dataset.land = name;
    b.setAttribute('aria-pressed', String(st.country === name));
    b.append(el('span', 'lc', cd), el('span', 'lb', countryName(cd, name)),
             el('span', 'ln', count(n)));
    b.setAttribute('aria-label', t('lands.aria', { name: countryName(cd, name), n: count(n) }));
    b.addEventListener('click', () => set('country', st.country === name ? null : name));
    nodes.push(b);
  }
  nav.replaceChildren(...nodes);
}

// ============================== the working set ============================
// A company as one country's view shows it: the roles in that scope, and every
// derived fact recomputed off THOSE roles. A row under the UK that counted its
// Bengaluru roles would be answering a question nobody asked.
let SCOPED = [];
function scopeCompanies() {
  const covers = st.country ? [st.country] : COUNTRIES.map(([n]) => n);
  const india = covers.includes('India');
  SCOPED = companies.map((c) => {
    const roles = c.roles.filter((r) => r.countries.some((x) => covers.includes(x)));
    if (!roles.length) return null;
    return { ...c, roles, total: c.roles.length,
             countries: c.countries.filter((x) => covers.includes(x)),
             cities: india ? c.cities : [],
             salary: india ? c.salary : null, mca: india ? c.mca : null,
             uk: covers.includes('United Kingdom') ? c.uk : null };
  }).filter(Boolean);
}
const scopeName = () => (st.country
  ? countryName(CODE[st.country], st.country) : t('scope.all'));

// ------------------------------ FLOW 3, the alphabet ------------------------
// The corpus does not carry a language field, and inventing one would be a
// guess. What CAN be read off a title without guessing is the alphabet it is
// written in — and that is the honest half of "posting language", because a
// title in kana is one a reader who does not read kana cannot read, whatever
// language it turns out to be. Note 06 says this is derived and how.
const SCRIPT_RE = {
  kana: /[぀-ヿｦ-ﾟ]/,
  han: /[㐀-鿿豈-﫿]/,
  deva: /[ऀ-ॿ]/,
  hang: /[가-힯]/,
  cyrl: /[Ѐ-ӿ]/,
  arab: /[؀-ۿ]/,
};
// Which of those a reader of each shipped locale can read. A Latin-alphabet
// locale is absent on purpose: 6,413 of 6,423 titles are Latin, so "the
// alphabet I read" would be a control that selects almost everything, and a
// filter that filters nothing is furniture.
const READS_SCRIPT = { ja: ['kana', 'han'], 'zh-Hans': ['han'], hi: ['deva'] };
let NONLATIN = [];
// Every role URL on tonight's boards. This is what lets the page say "kept,
// and no longer listed" as a fact rather than as a shrug: we read the board,
// and this URL was not on it.
let LIVE_URLS = new Set();
function scanScripts() {
  NONLATIN = [];
  LIVE_URLS = new Set();
  for (const c of companies) for (const r of c.roles) {
    LIVE_URLS.add(r.url);
    const s = Object.keys(SCRIPT_RE).filter((k) => SCRIPT_RE[k].test(r.title));
    if (s.length) NONLATIN.push({ c, r, s });
  }
}
const SCRIPTN = { mine: 0, other: 0, total: 0 };
function tallyScripts() {
  const want = READS_SCRIPT[me.reads] || [];
  SCRIPTN.total = companies.reduce((n, c) => n + c.roles.length, 0);
  SCRIPTN.other = NONLATIN.length;
  SCRIPTN.mine = want.length
    ? NONLATIN.filter((x) => x.s.some((k) => want.includes(k))).length : 0;
}
const inMyScript = (r) => {
  const want = READS_SCRIPT[me.reads] || [];
  return want.some((k) => SCRIPT_RE[k].test(r.title));
};

// --------------------------------- the lens ---------------------------------
// The reader's second sentence, applied to a row. It returns 'dim', 'lit' or
// nothing, and it will use exactly two kinds of fact: what a posting states
// about itself, and what the reader stated about themselves. A board that said
// nothing is never dimmed — most of them said nothing, and a page that read
// silence as refusal would be inventing 5,974 rejections.
function lensOf(r) {
  if (!me.lens) return null;
  const saysNo = r.visa === 'no' || r.hire_from_abroad === 'no';
  const saysYes = r.visa === 'yes' || r.hire_from_abroad === 'yes';
  const home = me.here !== 'x' && me.here !== 'out' && r.countries.includes(me.here);
  const crosses = me.here === 'out' || (me.here !== 'x' && !home);
  if (home) return 'lit';
  if (crosses && me.move === 'stay') return 'dim';
  if (crosses || me.move === 'visa') {
    if (saysYes) return 'lit';
    if (saysNo) return 'dim';
  }
  return null;
}

function select() {
  const q = st.q.trim().toLowerCase();
  const hitsIn = (c) => (q ? c.roles.filter((r) => r.title.toLowerCase().includes(q)).length : 0);
  // The shortlist is the register asked a different question, so it is built
  // the same way: rows, in an order, under bands. Its order is the night the
  // reader kept each one, which is the only date this view owns.
  if (st.view === 'kept') {
    const live = new Map();
    for (const c of SCOPED) for (const r of c.roles) live.set(r.url, { c, r });
    const rows = [...KEPT.values()]
      .sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')))
      .map((k) => {
        const hit = live.get(k.url);
        if (hit) return { ...hit, kept: k };
        // Kept, and not on any board we read tonight. We can say that: we read
        // the board, and this URL was not on it. The row still prints, because
        // the reader wrote it down and it is theirs.
        const co = companies.find((x) => x.name === k.co) || null;
        return { kept: k, gone: true, co,
                 c: co || { name: k.co, roles: [] },
                 r: { title: k.title, url: k.url, locations: [], countries: [],
                      workplace: null, department: null,
                      visa: 'unknown', hire_from_abroad: 'unknown' } };
      })
      .filter((x) => !q || x.r.title.toLowerCase().includes(q)
                        || String(x.c.name).toLowerCase().includes(q));
    return { items: rows, q };
  }
  let list = SCOPED;
  // The field cuts at ROLE level, before anything counts: a company stays on
  // the register while one of its roles is in the field, and every count then
  // speaks about those roles alone.
  if (st.dept !== 'any') {
    list = list.map((c) => {
      const roles = c.roles.filter((r) => deptOf(r) === st.dept);
      return roles.length ? { ...c, roles } : null;
    }).filter(Boolean);
  }
  list = list
    .filter((c) => !q || c.name.toLowerCase().includes(q) || hitsIn(c) > 0)
    .filter((c) => st.city === 'any' || c.cities.includes(st.city)
                || c.roles.some((r) => roleCities(r).includes(st.city)))
    .filter((c) => st.work === 'any' || isRemote(c))
    .filter((c) => st.abroad === 'any'
                || c.roles.some((r) => r.visa === 'yes' || r.hire_from_abroad === 'yes'))
    .filter((c) => st.mca === 'any' || c.mca != null)
    .filter((c) => st.since === 'any' || c.roles.some(seenSince))
    .filter((c) => st.script === 'any' || c.roles.some(inMyScript))
    .filter(BRACKETS[st.raised] || BRACKETS.any)
    .filter((c) => st.funded === 'any'
                || (c.date != null && days(c.date, snapshot) <= +st.funded))
    .sort(SORTS[st.sort] || SORTS.reqs);
  if (st.view === 'companies') return { items: list, q };
  const rows = [];
  for (const c of list) {
    for (const r of c.roles) {
      // Re-applied here because a company could have satisfied a control
      // through a DIFFERENT role than the one being printed.
      if (q && !r.title.toLowerCase().includes(q) && !c.name.toLowerCase().includes(q)) continue;
      if (st.city !== 'any' && !roleCities(r).includes(st.city)) continue;
      if (st.work !== 'any' && r.workplace !== 'remote') continue;
      if (st.abroad !== 'any' && r.visa !== 'yes' && r.hire_from_abroad !== 'yes') continue;
      if (st.since !== 'any' && !seenSince(r)) continue;
      if (st.script !== 'any' && !inMyScript(r)) continue;
      rows.push({ c, r });
    }
  }
  // The four company sorts order the BLOCKS the roles sit in; `newest` is the
  // one fact that belongs to a role, so it is the one sort that reaches past
  // them. Undated roles sort last and are never dated to force it.
  if (st.sort === 'newest') {
    const at = (x) => (FIRSTSEEN.get(x.r.url) || {}).date || '';
    rows.sort((x, y) => at(y).localeCompare(at(x)));
  }
  return { items: rows, q };
}

<script>
// ================================ the register =============================
// ponytail: the register mounts REAL rows and pages at 120 rather than
// virtualising a 6,423-row window. Measured: 1,080 rows mount in 118ms with a
// cumulative layout shift of 0, which is well inside what a reader can feel.
// Ceiling: somewhere past three or four thousand mounted rows the append cost
// starts to show on a mid-range phone, and at that point this becomes a
// windowed list — which would also cost the browser's own find-in-page, so it
// is not an upgrade to make before the numbers ask for it.
const PAGE = 120, MILE = 250;
let CUR = { items: [], q: '' };
let printed = 0, lastBand = null, openName = null, justDeclined = false;
let askCounted = false;
// The shortlist is never gated. It is the reader's own writing, and asking
// somebody to sign in to read what they themselves wrote down would be the
// toll booth this page exists not to be.
// Stolen from r01-a, and taken further: "nine results is an answer, and asking
// on top of an answer is a toll". A reader who has set a word in the sentence
// has told us what they came for, and the register answers in full — the ask
// does not appear at all. It is asked of the reader who is browsing, which is
// the read the measurement is actually about, and it costs the gate a bypass
// it was always supposed to have.
const narrowed = () => !!(st.q.trim() || st.country || st.dept !== 'any'
  || st.city !== 'any' || st.work !== 'any' || st.abroad !== 'any'
  || st.mca !== 'any' || st.raised !== 'any' || st.funded !== 'any'
  || st.since !== 'any' || st.script !== 'any');
const limitNow = () => (gateOpen || st.view === 'kept' || narrowed() ? Infinity
  : st.view === 'roles' ? FREE_ROLES : FREE_COS);

function marks(r) {
  const out = [];
  const W = { remote: 'mk.remote', hybrid: 'mk.hybrid', onsite: 'mk.onsite' };
  // Absent is absent: most postings state no workplace at all, so a missing
  // mark means "the board did not say" and never "on-site".
  if (W[r.workplace]) out.push(el('span', 'mk', t(W[r.workplace])));
  if (r.visa === 'yes') out.push(el('span', 'mk yes', t('mk.visa.yes')));
  else if (r.visa === 'no') out.push(el('span', 'mk', t('mk.visa.no')));
  if (r.hire_from_abroad === 'yes') out.push(el('span', 'mk yes', t('mk.abroad.yes')));
  else if (r.hire_from_abroad === 'no') out.push(el('span', 'mk', t('mk.abroad.no')));
  // The one thing on a register line that is a claim about a CHANGE rather
  // than about a state, and it is rare on purpose — seven roles tonight.
  // The mark says NEW, not "tonight": it covers the week, and a role first
  // seen three nights ago wearing a "tonight" badge inside a band headed
  // "First seen 3 August" is the page contradicting itself on one line.
  // Both halves of the condition are load-bearing — `confirmed` says we read
  // this board on the previous snapshot too, so a URL that was not there and
  // now is really did appear; without it the mark would be worn by every role
  // of every company we simply could not check last night.
  const seen = FIRSTSEEN.get(r.url);
  if (seen && seen.confirmed && freshlySeen(seen)) {
    const b = el('span', 'mk fresh', t('new'));
    b.title = `${t('band.seen', { date: fmtDate(seen.date) })} — ${t('band.conf')}`;
    out.push(b);
  }
  return out;
}

function roleRow(it, i) {
  const { c, r } = it;
  const row = el('div', 'row');
  row.tabIndex = -1;
  row.dataset.i = i;
  row.dataset.co = c.name;
  // The lens paints the row and says why on the row. A dimmed line that does
  // not state its reason is a page with an opinion it will not defend.
  const lens = it.gone ? null : lensOf(r);
  if (lens) row.classList.add(lens);
  if (it.gone) row.classList.add('gone');
  // The index is the handle: it opens what we hold on this ONE role. A role
  // has two destinations — the posting and the company — and neither of them
  // is the evidence, so the evidence gets its own control.
  const ix = el('button', 'ix', String(i + 1).padStart(4, '0'));
  ix.type = 'button';
  ix.setAttribute('aria-label', t('role.aria', { title: r.title }));
  ix.setAttribute('aria-expanded', 'false');
  ix.addEventListener('click', (e) => { e.stopPropagation(); toggleRole(row, it); });
  row.append(ix);
  const ti = el('span', 'ti');
  const a = link(r.url, r.title);
  if (CUR.q && r.title.toLowerCase().includes(CUR.q)) a.style.color = 'var(--lamp)';
  ti.append(a, ...marks(r), ...lensMarks(r, lens, it.gone));
  const sub = el('span', 'sub');
  const places = canonPlaces(r.locations);
  sub.append(el('span', null, places.length ? placeLine(r.locations, 3) : ''));
  ti.append(sub);
  row.append(ti);
  const co = el('button', 'co');
  co.type = 'button';
  co.append(el('span', null, c.name), el('span', 'cch', '›'));
  co.setAttribute('aria-label', t('about.aria', { name: c.name }));
  co.setAttribute('aria-expanded', 'false');
  co.addEventListener('click', (e) => { e.stopPropagation(); toggle(row, c); });
  row.append(co, keepBtn(r, c));
  // Clicking the line itself opens the evidence. The link and the two buttons
  // keep their own destinations; everything else on the row is the row.
  row.addEventListener('click', (e) => {
    if (e.target.closest('a, button')) return;
    toggleRole(row, it);
  });
  return row;
}
// The keep. One control, two states, and its own line in the bookplate.
function keepBtn(r, c) {
  const on = KEPT.has(r.url);
  const b = el('button', 'kp', on ? '✓' : '+');
  b.type = 'button';
  b.setAttribute('aria-pressed', String(on));
  b.setAttribute('aria-label', t(on ? 'keep.off' : 'keep.on', { title: r.title }));

// The band head — the register's rhythm. Under the newest sort the bands are

function bandKey(it) {
  if (st.view === 'companies') return st.sort === 'name' ? 'L' + it.name[0].toUpperCase() : null;
  // The shortlist bands by the night the READER kept each row — the only date
  // this view owns, and the same organizing idea one person along.
  if (st.view === 'kept') return 'K' + ((it.kept && it.kept.at) || '');
  if (st.sort === 'newest' && FIRSTSEEN.size) {
    // Confirmed-ness is part of the KEY, not a property read off the band's
    // first row. The artifact writes two buckets per night and a night may
    // hold both, so a band keyed on the date alone could print "these really
    // did appear" over rows for which we cannot say that.
    const e = FIRSTSEEN.get(it.r.url);

function bandRun(items, from) {

function mountMore() {
  const reg = $('#reg');
  reg.querySelector('.tail')?.remove();
  const cap = Math.min(CUR.items.length, limitNow());
  const to = Math.min(cap, printed + PAGE);
  const frag = document.createDocumentFragment();
  for (let i = printed; i < to; i++) {
    const it = CUR.items[i];
    const k = bandKey(it);
    if (k != null && k !== lastBand) {
      frag.append(bandNode(k, it, bandRun(CUR.items, i)));
      lastBand = k;
    }
    if (i > 0 && i % MILE === 0) {
      const m = el('div', 'mile');
      m.append(el('i'), el('b', null,
        t('mile', { n: count(i), rest: count(CUR.items.length - i) })), el('i'));
      frag.append(m);

    frag.append(st.view === 'companies' ? companyRow(it, i) : roleRow(it, i));

  printed = to;
  reg.append(frag);

function tail(cap) {

    b.type = 'button';
    b.addEventListener('click', () => mountMore());
    box.append(b);
    // Reading is the verb of this page, so the register extends itself as you
    // approach the end of what is printed. The button stays because it is the
    // keyboard's way in and the answer when IntersectionObserver is not there.

    if (es.some((e) => e.isIntersecting)) { io.disconnect(); mountMore(); }

// ------------------------------- FLOW 1, the ask ---------------------------
function askBlock(cap) {
  const seenCos = new Set();
  for (let i = 0; i < cap; i++) {
    seenCos.add(st.view === 'roles' ? CUR.items[i].c.name : CUR.items[i].name);
  }
  // The companies BEHIND the ask, not the companies mentioned past it: a
  // company whose first role you have already read is one you have already
  // met, and counting it again would inflate what signing in buys you. The
  // page's whole claim is that it does not overstate what it holds, and that
  // has to survive contact with its own sales pitch.
  const allCos = st.view === 'roles'
    ? new Set(CUR.items.map((x) => x.c.name)).size : CUR.items.length;
  const restCos = allCos - seenCos.size;
  const restRoles = st.view === 'roles' ? CUR.items.length - cap
    : CUR.items.slice(cap).reduce((n, c) => n + c.roles.length, 0);
  const head = st.view === 'roles'
    ? t('ask.head.roles', { n: count(cap), cos: count(seenCos.size) })
    : t('ask.head.cos', { n: count(cap) });
  const box = el('aside', 'ask');
  box.setAttribute('aria-label', head);
  box.append(el('h2', null, head));
  box.append(el('p', null, t('ask.body',
    { rest: count(restCos), roles: count(restRoles) })));
  // The motive the whole round 1 was missing: declining prints everything, so
  // "yes" has to buy something nameable that "no" does not. It does now, and
  // it is the only thing on this page an account could actually carry.
  if (KEPT.size) box.append(el('p', null, t('ask.kept', { n: count(KEPT.size) })));
  else box.append(el('p', null, t('ask.kept0')));
  box.append(el('p', 'fine', t('ask.fine')));
  if (clerkAnswered && !window.Clerk) box.append(el('p', 'fine', t('ask.noclerk')));
  const acts = el('div', 'acts');
  // The sign-in half exists only where there is something to sign into. A page
  // whose auth never loaded shows the reading half alone, which is honest,
  // rather than a button that cannot sign anybody in.
  if (window.Clerk) {
    const yes = el('button', 'yes', t('ask.yes'));
    yes.type = 'button';
    yes.addEventListener('click', () => {
      tally.yes += 1; saveTally();

    });

  const no = el('button', 'no', t('ask.no'));
  no.type = 'button';
  no.addEventListener('click', () => {
    tally.no += 1; gateOpen = true; justDeclined = true; saveTally();
    mountMore();

  acts.append(no);
  box.append(acts);

  if (tally.shown) {

      { shown: count(tally.shown), yes: count(tally.yes), no: count(tally.no) })));
  }
  return box;

// ================================= the nothing =============================
// Four ways of showing nothing, and they are four different facts. One

// avoid.
// ---------------------- FLOW 3, the language boundary -----------------------
// The search is a raw substring over titles the boards themselves wrote, so a
// reader searching in Japanese finds nothing — correct, and a dead end. This
// is the way through, and it is built out of the only words on this page that

  // substrings of one another and are obviously the same question.
  const cjk = Object.values(SCRIPT_RE).some((re) => re.test(q));
  const near = (a) => {
    const x = a.toLowerCase();

        || (cjk && x.length >= 2 && q.length >= 2 && x.slice(0, 2) === q.slice(0, 2));

      if (n) { seen.add(label); out.push({ kind: 'dept', value: d, label, n }); }

}
