<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROLE·ATLAS</title>
<meta name="color-scheme" content="dark">
<!-- A missing favicon is a 404, and a 404 is a failed request the reader's
     network tab reports as a broken page. One data: URI is cheaper. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------------
     VARIANT r01-b — THE NIGHT DESK.

     Lane B departs. The Swiss atlas answers this data as a printed plate: one
     white grid, hairline rules, one red, everything in the third person. This
     answers it as a person on a night desk reading a wire to somebody who is
     still awake and worried. So: no grid, no chrome, warm dark paper, a serif
     for the voice and a mono for the evidence, and a page that speaks in the
     first person and in sentences.

     The single carrying idea: THE QUERY IS A SENTENCE. There is no filter
     bank. The controls are words inside one line of English (or Japanese, or
     Hindi) that the reader edits in place — "Show me roles matching anything
     in all fifteen countries in any field — newest first." Every filter the
     Swiss page had is a word in that sentence; the narrow ones are further
     clauses the sentence grows on request. A page that talks has to be honest
     about what it does not know, so absence still renders as absence and every
     derived fact still says it was derived.

     Colour discipline: ONE accent, the lamp. #F0A93B means exactly one thing —
     THIS IS LIVE: a departed word in the sentence, the open row, the roles
     that appeared tonight. Nothing else on the page is ever that colour, so a
     lamp-coloured thing at the edge of your eye is always something you did.

     Type discipline: the voice is Newsreader; every NUMBER and every piece of
     machine evidence is mono. A number is never set in the serif, so counts
     line up as columns without a single table, and the reader can tell a thing
     we read from a thing we said by its shape alone.
     ------------------------------------------------------------------------ */
  :root {
    --night:  #14100C;   /* the paper, at the hour this page is read */
    --night2: #1B1610;   /* a raised surface: a hovered row, the ask */
    --night3: #221C15;   /* the deepest recess: the unfolded entry */
    --rule:   #2E2721;   /* hairline */
    --rule2:  #493F34;   /* structural */
    --paper:  #F2E9DC;   /* the voice */
    --paper2: #C0B4A5;   /* the aside */
    --paper3: #8B8175;   /* apparatus, and things that are absent */
    --lamp:   #F0A93B;   /* LIVE. Nowhere else. */
    --lamp-d: #7A5417;   /* the lamp at rest, for rules only */
    --measure: 38rem;    /* the reading measure — prose never runs wider */
    --gut: 1.6rem;
    --serif: Newsreader, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; overflow-x: clip; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; padding: 0 0 5rem; overflow-x: clip;
    background: var(--night); color: var(--paper);
    font-family: var(--serif); font-size: 17px; line-height: 1.55;
    font-optical-sizing: auto; font-weight: 400;
    -webkit-font-smoothing: antialiased;
    /* The desk lamp. One radial pool of warmth at the top of the sheet, fixed,
       so the page reads as a lit thing rather than as a dark theme. It is
       painted on the body's own background so it can never intercept a click. */
    background-image: radial-gradient(120rem 46rem at 22% -14rem,
                      rgba(240,169,59,.085), rgba(240,169,59,0) 70%);
    background-attachment: fixed;
  }
  .wrap { max-width: 74rem; margin-inline: auto; padding-inline: var(--gut); }
  /* Every number, every code, every date the build wrote. */
  .n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums;
              font-feature-settings: "tnum" 1; letter-spacing: -0.01em; }
  .lamp { color: var(--lamp); }
  .micro { font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
           text-transform: uppercase; color: var(--paper3); }
  a { color: inherit; text-decoration-color: var(--rule2);
      text-underline-offset: .18em; text-decoration-thickness: 1px; }
  a:hover { color: var(--lamp); text-decoration-color: var(--lamp); }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px;
                   border-radius: 1px; }
  button { font: inherit; color: inherit; }

  /* ------------------------------- the letterhead ------------------------- */
  .head { padding-top: 1.5rem; display: flex; flex-wrap: wrap;
          align-items: baseline; gap: .5rem 1.4rem;
          border-bottom: 1px solid var(--rule); padding-bottom: .7rem; }
  .brand { font-family: var(--mono); font-size: 11px; letter-spacing: .3em;
           text-transform: uppercase; color: var(--paper2); }
  .brand b { color: var(--paper); font-weight: 700; }
  .head .stamp { margin-inline-start: auto; }
  /* Hidden until Clerk answers. A page whose auth never loads shows no control
     at all — honest — rather than a Sign in that cannot sign anybody in.
     `visibility`, not `display`: hidden by display, the slot took no space and
     then took 30px the moment Clerk answered, which pushed the whole page down
     and was the single largest layout shift on the page (measured: 0.17 of a
     0.18 CLS). The slot holds its berth from the first paint and either fills
     it or does not. */
  /* `align-self: center` rather than the header's baseline: an EMPTY flex
     item has no baseline to align, so the reserved slot and the filled one
     sat on different lines and the header still moved 5px. Centred, its
     height is its own and the flex line never changes. */
  #account { visibility: hidden; height: 1.9rem; min-width: 1px;
             align-self: center; display: flex; align-items: center; }
  #account[data-ready] { visibility: visible; }
  #account button {
    background: none; border: 1px solid var(--rule2); border-radius: 0;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; padding: .2rem .7rem; cursor: pointer;
    color: var(--paper2);
    /* Exactly the height the empty slot reserves, so filling it changes
       nothing. Reserved at 1.9rem and filled at 1.55rem, the header SHRANK
       five pixels when Clerk answered and took the whole page up with it. */
    min-height: 1.9rem; display: inline-flex; align-items: center; }
  #account button:hover { border-color: var(--lamp); color: var(--lamp); }

  /* ---------------------------------- the lede ---------------------------- */
  .lede { padding: 2.6rem 0 1.6rem; }
  .lede h1 {
    margin: 0 0 .8rem; max-width: 22ch;
    font-size: clamp(2.1rem, 6.4vw, 3.6rem); line-height: 1.06;
    font-weight: 400; letter-spacing: -0.022em;
    font-style: italic; color: var(--paper);
  }
  .lede p { margin: 0; max-width: var(--measure); color: var(--paper2);
            font-size: 1.0625rem; line-height: 1.62; }
  /* A date or a count must not break across two lines mid-token: "am 4. /
     August 2026" reads as two facts. */
  .lede p .n { color: var(--paper); white-space: nowrap; }
  /* Skeletons, sized to what each block becomes, because layout shift is the
     one thing a page cannot apologise for afterwards. Measured, not guessed:
     the page loaded at 0.57 CLS before these — the footer sat in the viewport
     while the register was empty and was thrown a screen and a half down the
     moment 120 rows arrived, which counts as a shift because the reader was
     looking at it. Reserving a screen for the register puts the footer below
     the fold from the first paint, and the two smaller reservations hold the
     lede's own sentence and the country band. */
  #lands:empty { display: block; min-height: 5.3rem; }
  #reg:empty { display: block; min-height: 100vh; }
  @media (max-width: 46rem) { #lands:empty { min-height: 3.9rem; } }

  /* ------------------------------- THE SENTENCE --------------------------- */
  /* The instrument. Nine controls set as words inside one line of prose: each
     is a native <select> or <input> lying invisibly on top of the word that
     shows its value, so the reader gets the platform's own keyboard and touch
     behaviour and the page gets type that sets to its content. A select sized
     by its widest option would blow a hole in the sentence. */
  .askline { padding: .4rem 0 1.5rem; }
  .sentence {
    margin: 0; max-width: 48rem;
    font-size: clamp(1.18rem, 2.6vw, 1.5rem); line-height: 1.85;
    color: var(--paper2); letter-spacing: -0.012em;
  }
  .slot { position: relative; display: inline-block; vertical-align: baseline;
          white-space: nowrap; }
  .slot > .val {
    color: var(--paper); font-weight: 500;
    border-bottom: 1px dashed var(--rule2); padding-bottom: .06em;
  }
  .slot > select, .slot > input {
    position: absolute; inset: -.25em -.35em; width: calc(100% + .7em);
    height: calc(100% + .5em);
    opacity: 0; appearance: none; -webkit-appearance: none;
    font: inherit; border: 0; padding: 0; margin: 0; cursor: pointer;
    background: transparent; color: transparent;
  }
  .slot:hover > .val { color: var(--lamp); border-bottom-color: var(--lamp); }
  .slot:has(> :focus-visible) > .val {
    outline: 2px solid var(--lamp); outline-offset: 3px; }
  /* A departed control is visible from across the room: the moment a word
     leaves its default it takes the lamp and keeps it until it is put back. */
  .slot.set > .val { color: var(--lamp); border-bottom-color: var(--lamp);
                     border-bottom-style: solid; }
  /* The search word is a real input, so its glyphs are the reader's own and
     the caret has to show. It sits ON the line rather than under it. */
  /* The sizer stays IN FLOW and invisible so the slot is as wide as the text
     the reader has typed; the input lies on top of it. An input sized by CSS
     would either clip the word or blow a hole in the sentence. */
  /* The sizer and the input must be set IDENTICALLY or the slot is the wrong
     width: italic on one and roman on the other left a gap in English and, in
     Devanagari — where the oblique is synthesised and the metrics diverge
     further — printed the typed word over the next word of the sentence. */
  .slot.q > .val, .slot.q > input { font-style: italic; }
  .slot.q > .val { visibility: hidden; white-space: pre; }
  .slot.q > input { opacity: 1; color: var(--lamp); cursor: text;
                    inset: -.25em 0; width: 100%; }
  .slot.q > input::placeholder { color: var(--paper); opacity: 1;
                                 font-style: italic; }
  .slot.q > input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .clauses { display: inline; }
  .clauses[hidden] { display: none; }
  /* Adding a clause is a different act from editing a word, so it is set in a
     different voice: the mono apparatus, not the sentence's own serif. It sat
     in the serif for one pass and read as a fourth control the reader could
     not work out how to change. */
  .grow {
    appearance: none; background: none; border: 0; border-radius: 0;
    margin: 0 0 0 .5rem; padding: .3rem 0; cursor: pointer;
    vertical-align: baseline; white-space: nowrap;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--paper3);
  }
  .grow:hover { color: var(--lamp); }

  /* ------------------------- the countries, as a line of type ------------- */
  /* This is the plate index, and it is type rather than a map. Fifteen names
     that wrap like a paragraph, each carrying its own count. A country nobody
     is hiring in KEEPS ITS LINE and prints its zero — a country we read and
     found empty is a finding, and dropping it would read as one nobody
     looked at. */
  .lands { margin: 0 0 1.2rem; padding: .9rem 0 0; border-top: 1px solid var(--rule);
           display: flex; flex-wrap: wrap; gap: .1rem 0; align-items: baseline; }
  .land { appearance: none; background: none; border: 0; border-radius: 0;
          margin: 0; padding: .3rem .62rem .3rem 0; cursor: pointer;
          font-family: var(--serif); font-size: .95rem; color: var(--paper2);
          display: inline-flex; align-items: baseline; gap: .3rem; }
  .land .lc { font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
              color: var(--paper3); }
  .land .ln { font-family: var(--mono); font-size: .78rem; color: var(--paper3);
              font-variant-numeric: tabular-nums; }
  .land:hover { color: var(--lamp); }
  .land:hover .lc, .land:hover .ln { color: var(--lamp); }
  .land[aria-pressed="true"] { color: var(--lamp); }
  .land[aria-pressed="true"] .lc, .land[aria-pressed="true"] .ln { color: var(--lamp); }
  .land[aria-pressed="true"] .lb { border-bottom: 1px solid var(--lamp); }
  .land.nil { color: var(--paper3); }
  .land.nil .ln { text-decoration: line-through;
                  text-decoration-color: var(--rule2); }

  /* --------------------------------- the rail ----------------------------- */
  /* Where you are, always. A sticky column beside the register carrying the
     reader's depth as a mono counter, a filled bar, and the name of the band
     they are inside. It is the only thing on the page that moves while you
     read, which is why it is the only thing that may. */
  .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  @media (min-width: 64rem) {
    .body { grid-template-columns: 10.5rem minmax(0, 1fr); gap: 0 2.6rem; }
  }
  .rail { display: none; }
  @media (min-width: 64rem) {
    .rail { display: block; position: sticky; top: 1.4rem; align-self: start;
            padding-top: .55rem; }
  }
  .rail .rk { display: block; margin-bottom: .3rem; }
  .rail .rn { font-family: var(--mono); font-size: 1.35rem; color: var(--paper);
              font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
              display: block; }
  .rail .rt { font-family: var(--mono); font-size: .74rem; color: var(--paper3);
              display: block; }
  .rail .bar { margin: .8rem 0; height: 8rem; width: 2px; background: var(--rule);
               position: relative; }
  .rail .bar i { position: absolute; inset-inline-start: -1px; top: 0; width: 4px;
                 background: var(--lamp); display: block; }
  .rail .rband { display: block; font-size: .9rem; line-height: 1.3;
                 color: var(--paper2); max-width: 9.5rem; }
  .rail .rhint { display: block; margin-top: 1.1rem; font-family: var(--mono);
                 font-size: 9.5px; letter-spacing: .1em; line-height: 1.7;
                 color: var(--paper3); text-transform: uppercase; }

  /* ------------------------------- the register --------------------------- */
  .tally { padding: .1rem 0 .5rem; display: flex; flex-wrap: wrap;
           gap: .3rem .8rem; align-items: baseline; }
  .tally .big { font-family: var(--mono); font-size: 1rem; color: var(--paper);
                font-variant-numeric: tabular-nums; }
  #reg { margin: 0; padding: 0; list-style: none; }

  /* A band head: the night a set of roles was first seen, or the company a set
     of roles belongs to. The register's rhythm comes from here — the list is
     never a flat 6,423 rows, it is bands of rows with an airy line between. */
  .band { padding: 2rem 0 .5rem; border-bottom: 1px solid var(--rule);
          display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .8rem; }
  .band:first-child { padding-top: .4rem; }
  .band h2 { margin: 0; font-size: 1.5rem; font-weight: 400; line-height: 1.15;
             letter-spacing: -0.02em; color: var(--paper); }
  .band h2 em { font-style: italic; }
  .band .bn { font-family: var(--mono); font-size: .8rem; color: var(--paper3);
              font-variant-numeric: tabular-nums; margin-inline-start: auto;
              white-space: nowrap; }
  .band .bnote { flex-basis: 100%; margin: .28rem 0 0; max-width: var(--measure);
                 font-size: .8125rem; line-height: 1.5; color: var(--paper3);
                 font-style: italic; }
  .band.tonight h2 { color: var(--lamp); }

  /* One line of the register. Rows are a grid rather than flexed text so the
     mono index, the title and the company keep their columns at every measure,
     and so a row can never change shape halfway down the page. */
  .row { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto;
         gap: 0 1rem; align-items: baseline; width: 100%; text-align: start;
         padding: .62rem .5rem .62rem .1rem; margin: 0;
         border: 0; border-bottom: 1px solid var(--rule);
         border-inline-start: 2px solid transparent;
         background: none; position: relative; }
  .row:hover { background: var(--night2); }
  .row.open { background: var(--night2); border-inline-start-color: var(--lamp); }
  .row .ix { font-family: var(--mono); font-size: 10.5px; color: var(--paper3);
             font-variant-numeric: tabular-nums; letter-spacing: .04em;
             padding-top: .3em; }
  .row.open .ix, .row:hover .ix { color: var(--lamp); }
  .row .ti { font-size: 1.0625rem; line-height: 1.35; letter-spacing: -0.012em;
             overflow-wrap: anywhere; }
  .row .ti a { color: var(--paper); text-decoration: none; font-weight: 500; }
  .row .ti a:hover, .row .ti a:focus-visible { color: var(--lamp);
    text-decoration: underline; text-decoration-color: var(--lamp); }
  /* The apply affordance is visible at rest. A list where only hover says
     "these are links" is a list that reads as prose. */
  .row .ti a::after { content: "\00a0↗"; font-size: .78em; color: var(--paper3); }
  .row .ti a:hover::after { color: var(--lamp); }
  .row .sub { display: block; margin-top: .12rem; font-size: .8125rem;
              line-height: 1.45; color: var(--paper3); overflow-wrap: anywhere; }
  .row .sub .sep { color: var(--rule2); }
  /* The company cell is a button into the entry: a role has two destinations,
     the posting and the company, and one row may not swallow both. */
  .co { appearance: none; background: none; border: 0; border-radius: 0;
        margin: 0; padding: 0; cursor: pointer; text-align: end;
        font-family: var(--serif); font-size: .875rem; color: var(--paper2);
        white-space: nowrap; max-width: 12rem; overflow: hidden;
        text-overflow: ellipsis; }
  .co:hover, .co:focus-visible { color: var(--lamp); }
  .co .cch { font-family: var(--mono); font-size: .7rem; color: var(--paper3);
             margin-inline-start: .35rem; }
  .co:hover .cch { color: var(--lamp); }
  /* The company register's own line: the same three columns, a different unit,
     and the whole line is the button because a company has one destination. */
  .row.crow { cursor: pointer; }
  .row.crow .ti { font-weight: 500; }
  .row .cnt { font-family: var(--mono); font-size: .82rem; color: var(--paper2);
              font-variant-numeric: tabular-nums; white-space: nowrap;
              text-align: end; }
  .row.open .cnt, .row:hover .cnt { color: var(--lamp); }

  /* The marks. Square, hairline, mono — evidence, never decoration. `open`
     facts take the frame; a stated `no` is a fact too and takes the ink. */
  .mk { font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
        text-transform: uppercase; border: 1px solid var(--rule2);
        padding: .12em .34em .06em; color: var(--paper3); white-space: nowrap;
        margin-inline-start: .4rem; display: inline-block;
        vertical-align: .1em; }
  .mk.yes { border-color: var(--rule2); color: var(--paper2); }
  /* The one exception to "the lamp is only live state": a role that appeared
     tonight IS live state — it is the only thing on a register line that is a
     claim about a change rather than about a fact, and there are seven of them. */
  .mk.fresh { border-color: var(--lamp); color: var(--lamp); }

  /* ------------------------------- the entry ------------------------------ */
  /* A role reveals itself without a page turn and without losing the scroll:
     the entry unfolds in place, directly under the line that opened it, and
     the rows below simply move down. Nothing scrolls, nothing is replaced. */
  .entry { border-bottom: 1px solid var(--rule);
           border-inline-start: 2px solid var(--lamp);
           background: var(--night3); overflow: hidden;
           display: grid; grid-template-rows: 1fr; }
  .entry > .inner { min-height: 0; padding: 1.1rem 1.3rem 1.4rem;
                    overflow-wrap: anywhere; }
  @keyframes unfold { from { grid-template-rows: 0fr; } to { grid-template-rows: 1fr; } }
  .entry { animation: unfold .22s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .entry { animation: none; } }
  .entry h3 { margin: 0 0 .1rem; font-size: 1.6rem; font-weight: 400;
              letter-spacing: -0.024em; line-height: 1.1; }
  .entry .ehead { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem;
                  align-items: baseline; margin-bottom: .9rem; }
  .entry .eclose { margin-inline-start: auto; appearance: none; background: none;
                   border: 1px solid var(--rule2); border-radius: 0; cursor: pointer;
                   font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
                   text-transform: uppercase; padding: .3rem .6rem;
                   color: var(--paper3); }
  .entry .eclose:hover { border-color: var(--lamp); color: var(--lamp); }
  .entry .said { margin: 0 0 1rem; max-width: var(--measure); }
  .entry .said p { margin: 0 0 .18rem; font-size: .95rem; line-height: 1.5;
                   color: var(--paper); }
  .entry .said .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
                    text-transform: uppercase; color: var(--paper3);
                    margin-inline-end: .55rem; }
  /* Scoped past `.entry .said p`, which is one element more specific and was
     setting this line at reading size — a provenance stamp shouting over the
     three lines it is stamping. */
  .entry .said p.prov { margin: .3rem 0 0; font-family: var(--mono); font-size: 9.5px;
                 letter-spacing: .1em; text-transform: uppercase; color: var(--paper3); }
  /* The receipt: this register's one strong claim is "proven by the board",
     and the receipt is where a single entry proves it. Every line is a fact
     the build wrote; the ones it did not write do not print at all. */
  /* The receipt is ONE grid and its rows are display:contents, so the key
     column sizes itself to the longest label in whatever language is loaded
     and still aligns across every row. A fixed track was right in English and
     broke "STELLENSEITE" across two lines in German (measured at 380px). */
  .rcpt { font-family: var(--mono); font-size: 11px; line-height: 1.5;
          color: var(--paper2); border: 1px solid var(--rule);
          border-inline-start: 2px solid var(--lamp-d);
          padding: .55rem .75rem; margin: 0 0 1rem; max-width: 32rem;
          display: grid; grid-template-columns: auto minmax(0, 1fr);
          gap: 0 .8rem; }
  .rcpt .rr { display: contents; }
  .rcpt .rk, .rcpt .rv { padding: .18rem 0; margin: 0; }
  .rcpt .rr + .rr .rk, .rcpt .rr + .rr .rv { border-top: 1px solid var(--rule); }
  .rcpt .rk { font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
              color: var(--paper3); white-space: nowrap; }
  .entry .facts { margin: 0 0 1rem; max-width: var(--measure); font-size: .9rem;
                  line-height: 1.55; color: var(--paper2); }
  .entry .facts p { margin: 0 0 .25rem; }
  .entry .facts .n { color: var(--paper); }
  .entry .rl { list-style: none; margin: .2rem 0 0; padding: 0;
               border-top: 1px solid var(--rule); }
  .entry .rl li { border-bottom: 1px solid var(--rule); padding: .38rem 0;
                  font-size: .95rem; line-height: 1.4; }
  .entry .rl li a { color: var(--paper); text-decoration: none; font-weight: 500; }
  .entry .rl li a:hover { color: var(--lamp); text-decoration: underline; }
  .entry .rl li a::after { content: "\00a0↗"; font-size: .78em; color: var(--paper3); }
  .entry .rl .loc { color: var(--paper3); font-size: .8125rem; }

  .ask .no { background: none; color: var(--paper2); border: 1px solid var(--rule2); }

  .mile { display: flex; align-items: center; gap: .9rem; padding: 1.1rem 0;

  .srcs { margin: 1.6rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule);

    :root { --gut: 1.1rem; }

    /* The snapshot stamp takes its own line rather than sharing one with the
       account button: it opens as an em dash and becomes a long localised date,
       and at this width that difference decided whether the header was two
       lines or three — a header that grows a line moves the entire page. */
    .head .stamp { flex-basis: 100%; order: 3; margin-inline-start: 0; }
    .sentence { font-size: 1.12rem; line-height: 1.95; }
    .row { grid-template-columns: 2.6rem minmax(0, 1fr); gap: 0 .7rem;
           padding-block: .7rem; }
    /* At a hand's width the company drops under the title rather than fighting
       it for the line. It is still its own control, still 44px tall. */
    .co, .row .cnt { grid-column: 2; text-align: start; margin-top: .3rem;
                     max-width: 100%; padding: .35rem 0; }
    /* The country band stops wrapping and becomes one scrolling line. Fifteen
       44px names wrapped eight rows deep pushed the register most of a screen
       down the page, and the register is what the reader came for. The strip
       scrolls inside ITSELF — the body still never moves sideways — and it
       fades at its trailing edge so the fact that there is more is visible
       rather than inferred. */
    .lands { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
             scrollbar-width: none; padding-bottom: .2rem;
             -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
             mask-image: linear-gradient(to right, #000 88%, transparent); }
    .lands::-webkit-scrollbar { display: none; }
    .land { flex: none; padding-inline-end: .9rem; }
    .entry > .inner { padding: 1rem .9rem 1.2rem; }
    .rcpt { gap: 0 .6rem; padding: .5rem .6rem; }
    .ask { padding: 1.1rem 1rem 1.2rem; }
    .band h2 { font-size: 1.3rem; }
  }
  /* Touch. A word inside a sentence must NOT become a 44px block — that would
     shred the paragraph's line rhythm — so the slot grows its invisible select
     instead, which is the thing a finger actually hits. The register's two
     controls do grow: the title keeps `display: inline` and takes block padding
     (which enlarges the hit region without moving a single glyph), and the
     company button, which sits on its own line at this width, takes a real
     min-height. */
  @media (pointer: coarse), (max-width: 46rem) {
    .slot > select { inset: -.55em -.4em; height: calc(100% + 1.1em); }
    .row .ti a { padding-block: .55rem; }
    .co { min-height: 44px; display: inline-flex; align-items: center; }
    .land { min-height: 44px; }
  }

const MODE = /^(remote|hybrid)$/i;

  const seen = new Map();

    if (!x) continue;

      const place = MODE.test(m[1]) ? m[2] : m[1];
      x = `${mode[0].toUpperCase()}${mode.slice(1).toLowerCase()} — ${place}`;

function select() {
  const q = st.q.trim().toLowerCase();
  const hitsIn = (c) => (q ? c.roles.filter((r) => r.title.toLowerCase().includes(q)).length : 0);
  let list = SCOPED;
  // The field cuts at ROLE level, before anything counts: a company stays on
  // the register while one of its roles is in the field, and every count then
  // speaks about those roles alone.
  if (st.dept !== 'any') {
    list = list.map((c) => {
      const roles = c.roles.filter((r) => deptOf(r) === st.dept);
      return roles.length ? { ...c, roles } : null;
    }).filter(Boolean);
  }
  list = list
    .filter((c) => !q || c.name.toLowerCase().includes(q) || hitsIn(c) > 0)
    .filter((c) => st.city === 'any' || c.cities.includes(st.city)
                || c.roles.some((r) => roleCities(r).includes(st.city)))
    .filter((c) => st.work === 'any' || isRemote(c))
    .filter((c) => st.abroad === 'any'
                || c.roles.some((r) => r.visa === 'yes' || r.hire_from_abroad === 'yes'))
    .filter((c) => st.mca === 'any' || c.mca != null)
    .filter(BRACKETS[st.raised] || BRACKETS.any)
    .filter((c) => st.funded === 'any'
                || (c.date != null && days(c.date, snapshot) <= +st.funded))
    .sort(SORTS[st.sort] || SORTS.reqs);
  if (st.view === 'companies') return { items: list, q };
  const rows = [];
  for (const c of list) {
    for (const r of c.roles) {
      // Re-applied here because a company could have satisfied a control
      // through a DIFFERENT role than the one being printed.
      if (q && !r.title.toLowerCase().includes(q) && !c.name.toLowerCase().includes(q)) continue;
      if (st.city !== 'any' && !roleCities(r).includes(st.city)) continue;
      if (st.work !== 'any' && r.workplace !== 'remote') continue;
      if (st.abroad !== 'any' && r.visa !== 'yes' && r.hire_from_abroad !== 'yes') continue;
      rows.push({ c, r });
    }
  }
  // The four company sorts order the BLOCKS the roles sit in; `newest` is the
  // one fact that belongs to a role, so it is the one sort that reaches past
  // them. Undated roles sort last and are never dated to force it.
  if (st.sort === 'newest') {
    const at = (x) => (FIRSTSEEN.get(x.r.url) || {}).date || '';
    rows.sort((x, y) => at(y).localeCompare(at(x)));
  }
  return { items: rows, q };
}
</script>
<script>
// ================================ the register =============================
// ponytail: the register mounts REAL rows and pages at 120 rather than
// virtualising a 6,423-row window. Measured: 1,080 rows mount in 118ms with a
// cumulative layout shift of 0, which is well inside what a reader can feel.
// Ceiling: somewhere past three or four thousand mounted rows the append cost
// starts to show on a mid-range phone, and at that point this becomes a
// windowed list — which would also cost the browser's own find-in-page, so it
// is not an upgrade to make before the numbers ask for it.
const PAGE = 120, MILE = 250;
let CUR = { items: [], q: '' };
let printed = 0, lastBand = null, openName = null, justDeclined = false;
let askCounted = false;
const limitNow = () => (gateOpen ? Infinity
  : st.view === 'roles' ? FREE_ROLES : FREE_COS);

function marks(r) {
  const out = [];
  const W = { remote: 'mk.remote', hybrid: 'mk.hybrid', onsite: 'mk.onsite' };
  // Absent is absent: most postings state no workplace at all, so a missing
  // mark means "the board did not say" and never "on-site".
  if (W[r.workplace]) out.push(el('span', 'mk', t(W[r.workplace])));
  if (r.visa === 'yes') out.push(el('span', 'mk yes', t('mk.visa.yes')));
  else if (r.visa === 'no') out.push(el('span', 'mk', t('mk.visa.no')));
  if (r.hire_from_abroad === 'yes') out.push(el('span', 'mk yes', t('mk.abroad.yes')));
  else if (r.hire_from_abroad === 'no') out.push(el('span', 'mk', t('mk.abroad.no')));
  // The one thing on a register line that is a claim about a CHANGE rather
  // than about a state, and it is rare on purpose — seven roles tonight.
  // The mark says NEW, not "tonight": it covers the week, and a role first
  // seen three nights ago wearing a "tonight" badge inside a band headed
  // "First seen 3 August" is the page contradicting itself on one line.
  // Both halves of the condition are load-bearing — `confirmed` says we read
  // this board on the previous snapshot too, so a URL that was not there and
  // now is really did appear; without it the mark would be worn by every role
  // of every company we simply could not check last night.
  const seen = FIRSTSEEN.get(r.url);
  if (seen && seen.confirmed && freshlySeen(seen)) {
    const b = el('span', 'mk fresh', t('new'));
    b.title = `${t('band.seen', { date: fmtDate(seen.date) })} — ${t('band.conf')}`;
    out.push(b);
  }
  return out;
}

function roleRow(it, i) {
  const { c, r } = it;
  const row = el('div', 'row');
  row.tabIndex = -1;
  row.dataset.i = i;
  row.dataset.co = c.name;
  row.append(el('span', 'ix', String(i + 1).padStart(4, '0')));
  const ti = el('span', 'ti');
  const a = link(r.url, r.title);
  if (CUR.q && r.title.toLowerCase().includes(CUR.q)) a.style.color = 'var(--lamp)';
  ti.append(a, ...marks(r));
  const sub = el('span', 'sub');
  const places = canonPlaces(r.locations);
  sub.append(el('span', null, places.length ? placeLine(r.locations, 3) : ''));
  ti.append(sub);
  row.append(ti);
  const co = el('button', 'co');
  co.type = 'button';
  co.append(el('span', null, c.name), el('span', 'cch', '›'));
  co.setAttribute('aria-label', t('about.aria', { name: c.name }));
  co.setAttribute('aria-expanded', 'false');
  co.addEventListener('click', (e) => { e.stopPropagation(); toggle(row, c); });
  row.append(co);
  return row;
}
function companyRow(c, i) {
  const row = el('button', 'row crow');
  row.type = 'button';
  row.tabIndex = -1;
  row.dataset.i = i;
  row.dataset.co = c.name;
  row.append(el('span', 'ix', String(i + 1).padStart(4, '0')));
  const ti = el('span', 'ti', c.name);
  const places = wherePieces(c);
  if (places.length) {
    ti.append(el('span', 'sub', places.slice(0, 4).join(' · ')
      + (places.length > 4 ? ` +${count(places.length - 4)}` : '')));
  }
  row.append(ti, el('span', 'cnt', plural('role', c.roles.length)));
  row.setAttribute('aria-expanded', 'false');
  row.addEventListener('click', () => toggle(row, c));
  return row;
}

// The band head — the register's rhythm. Under the newest sort the bands are
// the NIGHTS we first saw the roles, which is a fact the artifact carries and
// this page only prints; under every other sort they are the companies the
// roles belong to. Either way the list is never a flat six thousand lines.
function bandKey(it) {
  if (st.view === 'companies') return st.sort === 'name' ? it.name[0].toUpperCase() : null;
  if (st.sort === 'newest' && FIRSTSEEN.size) {
    // Confirmed-ness is part of the KEY, not a property read off the band's
    // first row. The artifact writes two buckets per night and a night may
    // hold both, so a band keyed on the date alone could print "these really
    // did appear" over rows for which we cannot say that.
    const e = FIRSTSEEN.get(it.r.url);
    return 'D' + (e && e.date ? e.date + (e.confirmed ? '\u0001c' : '\u0001u') : '');
  }
  return 'C' + it.c.name;
}
function bandNode(key, it, n) {
  const b = el('div', 'band');
  if (key.startsWith('D')) {
    const [date, kind] = key.slice(1).split('\u0001');
    const tonight = date && date === snapshot;
    if (tonight) b.classList.add('tonight');
    const h = el('h2');
    h.append(date
      ? el('em', null, tonight ? t('band.tonight') : t('band.seen', { date: fmtDate(date) }))
      : el('em', null, t('band.undated')));
    b.append(h, el('span', 'bn', plural('role', n)));
    b.append(el('p', 'bnote', !date ? t('band.undated.note')
      : kind === 'c' ? t('band.conf') : t('band.unconf')));
  } else if (key.startsWith('C')) {
    const c = it.c;
    const h = el('h2', null, c.name);
    b.append(h, el('span', 'bn', plural('role', n)));
  } else {
    b.append(el('h2', null, key), el('span', 'bn', plural('co', n)));
  }
  return b;
}
// How many consecutive items share a band, counted once so the head can state
// its own size rather than being a bare label.
function bandRun(items, from) {
  const k = bandKey(items[from]);
  let j = from;
  while (j < items.length && bandKey(items[j]) === k) j++;
  return j - from;
}

function mountMore() {
  const reg = $('#reg');
  reg.querySelector('.tail')?.remove();
  const cap = Math.min(CUR.items.length, limitNow());
  const to = Math.min(cap, printed + PAGE);
  const frag = document.createDocumentFragment();
  for (let i = printed; i < to; i++) {
    const it = CUR.items[i];
    const k = bandKey(it);
    if (k != null && k !== lastBand) {
      frag.append(bandNode(k, it, bandRun(CUR.items, i)));
      lastBand = k;
    }
    if (i > 0 && i % MILE === 0) {
      const m = el('div', 'mile');
      m.append(el('i'), el('b', null,
        t('mile', { n: count(i), rest: count(CUR.items.length - i) })), el('i'));
      frag.append(m);
    }
    frag.append(st.view === 'roles' ? roleRow(it, i) : companyRow(it, i));
  }
  printed = to;
  reg.append(frag);
  reg.append(tail(cap));
  updateRail();
}

function tail(cap) {
  const box = el('div', 'tail');
  if (justDeclined) {
    box.append(el('p', 'mile', t('ask.done')));
    justDeclined = false;
  }
  if (printed < cap) {
    const b = el('button', 'keep',
      t('keep', { n: count(Math.min(PAGE, cap - printed)) }));
    b.type = 'button';
    b.addEventListener('click', () => mountMore());
    box.append(b);
    // Reading is the verb of this page, so the register extends itself as you
    // approach the end of what is printed. The button stays because it is the
    // keyboard's way in and the answer when IntersectionObserver is not there.
    watch(b);
  } else if (cap < CUR.items.length) {
    box.append(askBlock(cap));
  }
  return box;
}
let io = null;
function watch(node) {
  if (!('IntersectionObserver' in window)) return;
  io?.disconnect();
  io = new IntersectionObserver((es) => {
    if (es.some((e) => e.isIntersecting)) { io.disconnect(); mountMore(); }
  }, { rootMargin: '900px 0px' });
  io.observe(node);
}

// ------------------------------- FLOW 1, the ask ---------------------------
function askBlock(cap) {
  const seenCos = new Set();
  for (let i = 0; i < cap; i++) {
    seenCos.add(st.view === 'roles' ? CUR.items[i].c.name : CUR.items[i].name);
  }
  // The companies BEHIND the ask, not the companies mentioned past it: a
  // company whose first role you have already read is one you have already
  // met, and counting it again would inflate what signing in buys you. The
  // page's whole claim is that it does not overstate what it holds, and that
  // has to survive contact with its own sales pitch.
  const allCos = st.view === 'roles'
    ? new Set(CUR.items.map((x) => x.c.name)).size : CUR.items.length;
  const restCos = allCos - seenCos.size;
  const restRoles = st.view === 'roles' ? CUR.items.length - cap
    : CUR.items.slice(cap).reduce((n, c) => n + c.roles.length, 0);
  const head = st.view === 'roles'
    ? t('ask.head.roles', { n: count(cap), cos: count(seenCos.size) })
    : t('ask.head.cos', { n: count(cap) });
  const box = el('aside', 'ask');
  box.setAttribute('aria-label', head);
  box.append(el('h2', null, head));
  box.append(el('p', null, t('ask.body',
    { rest: count(restCos), roles: count(restRoles) })));
  box.append(el('p', 'fine', t('ask.fine')));
  if (clerkAnswered && !window.Clerk) box.append(el('p', 'fine', t('ask.noclerk')));
  const acts = el('div', 'acts');
  // The sign-in half exists only where there is something to sign into. A page
  // whose auth never loaded shows the reading half alone, which is honest,
  // rather than a button that cannot sign anybody in.
  if (window.Clerk) {
    const yes = el('button', 'yes', t('ask.yes'));
    yes.type = 'button';
    yes.addEventListener('click', () => {
      tally.yes += 1; saveTally();
      try { window.Clerk.openSignIn(); } catch { /* the other half still works */ }
    });
    acts.append(yes);
  }
  const no = el('button', 'no', t('ask.no'));
  no.type = 'button';
  no.addEventListener('click', () => {
    tally.no += 1; gateOpen = true; justDeclined = true; saveTally();
    mountMore();
  });
  acts.append(no);
  box.append(acts);
  if (!askCounted) { askCounted = true; tally.shown += 1; saveTally(); }
  if (tally.shown) {
    box.append(el('p', 'tick', t('ask.tick',
      { shown: count(tally.shown), yes: count(tally.yes), no: count(tally.no) })));
  }
  return box;
}

// ================================== the entry ==============================
// A role reveals itself without a page turn and without losing the scroll: the
// entry unfolds directly under the line that opened it, and the rows below move
// down. Nothing is replaced, so the reader's position never moves under them.
function toggle(row, c) {
  const already = row.nextElementSibling?.classList.contains('entry');
  document.querySelectorAll('#reg .entry').forEach((e) => e.remove());
  document.querySelectorAll('#reg .row.open').forEach((r) => {
    r.classList.remove('open');
    (r.querySelector('.co') || r).setAttribute('aria-expanded', 'false');
  });
  if (already) { openName = null; return; }
  openName = c.name;
  row.classList.add('open');
  (row.querySelector('.co') || row).setAttribute('aria-expanded', 'true');
  row.after(entryNode(c));
}
function rr(box, k, v) {
  const p = el('p', 'rr');
  const val = el('span', 'rv');
  if (typeof v === 'string') val.textContent = v; else val.append(v);
  p.append(el('span', 'rk', k), val);
  box.append(p);
}
function entryNode(c) {
  const wrap = el('div', 'entry');
  const box = el('div', 'inner');
  const head = el('div', 'ehead');
  head.append(el('h3', null, c.name));
  const close = el('button', 'eclose', t('e.close'));
  close.type = 'button';
  close.addEventListener('click', () => {
    const row = wrap.previousElementSibling;
    wrap.remove();
    if (row) {
      row.classList.remove('open');
      (row.querySelector('.co') || row).setAttribute('aria-expanded', 'false');
      row.focus();
    }
    openName = null;
  });
  head.append(close);
  box.append(head);

  // Three lines a machine wrote, and a line saying who checked them. A company
  // with no entry renders NOTHING — no placeholder, no "description
  // unavailable" — the same absent-is-absent rule as every mark on the page.
  const d = DESCRIPTIONS[c.name];
  if (d) {
    const said = el('div', 'said');
    for (const [k, v] of [['e.what', d.what], ['e.forwhom', d.for_whom],
                          ['e.why', d.why_them]]) {
      if (typeof v !== 'string' || !v.trim()) continue;
      const p = el('p');
      p.append(el('span', 'k', t(k)), el('span', null, v));
      said.append(p);
    }
    if (said.children.length) {
      if (d.ai) {
        said.append(el('p', 'prov', `${t('e.ai')} · ${d.source === 'board' ? t('e.ai.board')
          : d.checked ? t('e.ai.checked') : t('e.ai.unver')}`));
      }
      box.append(said);
    }
  }

  // The receipt. This register's one strong claim is "proven by the board", and
  // this is where a single entry proves it. Every line is a fact the build
  // wrote; the ones it did not write (fetch time, HTTP code) do not print.
  const rcpt = el('div', 'rcpt');
  const host = BOARDS[c.ats]
    ? BOARDS[c.ats].replace(/^https?:\/\//, '').replace(/\/$/, '') : c.ats;
  rr(rcpt, t('r.board'), `${host}/${c.slug}`);
  rr(rcpt, t('r.read'), fmtDate(snapshot) || '—');
  const verdict = BUILDREP && BUILDREP.companies ? BUILDREP.companies[c.name] : null;
  if (verdict) rr(rcpt, t('r.verdict'), verdict === 'listed' ? t('r.listed') : verdict);
  rr(rcpt, t('r.roles'), t('r.roles.v', { n: count(c.total ?? c.roles.length) })
    + (c.total > c.roles.length ? ` · ${t('r.roles.scope', { n: count(c.roles.length) })}` : ''));
  if (BUILDREP && BUILDREP.checked != null && BUILDREP.corpus_size != null) {
    rr(rcpt, t('r.corpus'), t('r.corpus.v', {
      checked: count(BUILDREP.checked), corpus: count(BUILDREP.corpus_size),
      listed: count((BUILDREP.counts && BUILDREP.counts.listed) ?? BUILDREP.listed ?? 0) }));
  }
  const led = el('a', null, t('r.ledger.v'));
  led.href = '../data/build-report.json';
  rr(rcpt, t('r.ledger'), led);
  box.append(rcpt);

  const facts = el('div', 'facts');
  // Three absences in one line is honest but reads as noise, so a wholly dark
  // funding record collapses to one clause. Any single known fact brings the
  // full line back, with the absences said one field at a time.
  const dark = c.amount == null && !c.round_letter && !c.date;
  const f = el('p');
  if (dark) f.append(el('span', null, t('e.dark') + ' '));
  else {
    const amt = money(c.amount, c.currency);
    f.append(el('span', null,
      (amt ? t('e.raised', { amount: amt }) : t('e.dark').replace(/\.$/, ''))
      + ' · ' + (c.round_letter ? t('e.round', { letter: c.round_letter }) : t('e.noround'))
      + ' · ' + (c.date ? t('e.announced', { date: fmtDate(c.date) }) : t('e.nodate'))
      + ' · '));
  }
  f.append(link(c.source_url, t('e.source')));
  facts.append(f);
  const places = wherePieces(c);
  if (places.length) {
    facts.append(el('p', null, t('e.hiring', { places: listOf(places.slice(0, 6))
      + (places.length > 6 ? ` +${count(places.length - 6)}` : '') })));
  }
  if (c.salary) {
    facts.append(el('p', null, t('e.salary', {
      amt: `₹${c.salary.avg_lpa.toFixed(1)}L`, n: count(c.salary.reports),
      date: fmtDate(c.salary.observed) })));
  }
  if (c.mca) {
    const p = el('p');
    p.append(el('span', 'cin', c.mca.cin), el('span', null, ' · ' + t('e.mca', {
      name: c.mca.name, year: c.mca.incorporated.slice(0, 4), status: c.mca.status })));
    facts.append(p);
  }
  if (c.uk) {
    const p = el('p');
    const num = link(c.uk.url, c.uk.number);
    p.append(el('span', null, t('e.uk', { name: c.uk.name,
      year: c.uk.incorporated.slice(0, 4), status: c.uk.status }) + ' · '), num);
    facts.append(p);
  }
  if (RULES[c.qualified_by]) {
    facts.append(el('p', null, t('e.qual', { rule: t(RULES[c.qualified_by]) })));
  }
  box.append(facts);

  // The company's own roles, in this scope. A search puts the matching titles
  // at the head — ordering, never filtering: every role is still here.
  const q = CUR.q;
  const list = q ? [...c.roles].sort((a, b) => Number(b.title.toLowerCase().includes(q))
                                             - Number(a.title.toLowerCase().includes(q)))
                 : c.roles;
  box.append(el('p', 'micro', t('e.roles.head')));
  const ul = el('ul', 'rl');
  const items = list.map((r) => {
    const li = el('li', q && r.title.toLowerCase().includes(q) ? 'hit' : null);
    li.append(link(r.url, r.title));
    const loc = canonPlaces(r.locations);
    if (loc.length) li.append(el('span', 'loc', ' — ' + placeLine(r.locations, 3)));
    li.append(...marks(r));
    return li;
  });
  const CAP = 8;
  if (items.length > CAP + 2) {
    for (const li of items.slice(CAP)) li.hidden = true;
    const more = el('button', 'morebtn', t('e.more', { n: count(items.length - CAP) }));
    more.type = 'button';
    more.addEventListener('click', () => {
      for (const li of items) li.hidden = false;
      more.remove();
    });
    ul.append(...items);
    box.append(ul, more);
  } else {
    ul.append(...items);
    box.append(ul);
  }
  wrap.append(box);
  return wrap;
}

// ================================= the nothing =============================
// Four ways of showing nothing, and they are four different facts. One
// sentence for all four would be the ambiguous zero this register exists to
// avoid.
function nothing() {
  const box = el('div', 'none');
  const tops = COUNTRIES.map(([n]) => [n, companies.filter((c) => c.countries.includes(n)).length])
    .filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
  if (!companies.length) box.append(el('p', null, t('none.build')));
  else if (!SCOPED.length) {
    box.append(el('p', null, t('none.country', { scope: scopeName() })));
    if (tops.length) {
      box.append(el('p', 'fine', t('none.country2', {
        name: countryName(CODE[tops[0][0]], tops[0][0]),
        n: count(tops[0][1]), total: count(companies.length) })));
    }
  } else if (st.abroad !== 'any') {
    box.append(el('p', null, t('none.abroad', { scope: scopeName() })));
  } else {
    box.append(el('p', null, t('none.filters')));
    box.append(el('p', 'fine', t('none.fine')));
  }
  const b = el('button', null, t('none.reset'));
  b.type = 'button';
  b.addEventListener('click', () => {
    Object.assign(st, { q: '', country: null, dept: 'any', city: 'any', work: 'any',
                        abroad: 'any', mca: 'any', raised: 'any', funded: 'any' });
    reset();
  });
  box.append(b);
  return box;
}

// ================================== the rail ===============================
// Where you are, always. The only thing on the page that moves while you read,
// which is why it is the only thing that may.
let railRow = null;
function updateRail() {
  const rail = $('#rail');
  if (!rail.offsetParent && rail.children.length) return;   // folded away at this width
  const total = CUR.items.length;
  const at = railRow ? +railRow.dataset.i + 1 : Math.min(1, total);
  rail.replaceChildren();
  rail.append(el('span', 'micro rk', scopeName()));
  rail.append(el('span', 'rn', count(at)));
  rail.append(el('span', 'rt', t('rail.of', { n: count(total) })));
  const bar = el('span', 'bar');
  const i = el('i');
  i.style.height = (total ? Math.max(2, Math.round(at / total * 100)) : 0) + '%';
  bar.append(i);
  rail.append(bar);
  const band = railRow?.dataset.band;
  if (band) rail.append(el('span', 'rband', band));
  rail.append(el('span', 'rhint', t('rail.hint')));
}
let ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    // elementFromPoint rather than an observer over six thousand rows: one
    // hit-test a frame is cheaper than a thousand live observations, and the
    // answer is exactly "what is the reader looking at".
    const hit = document.elementFromPoint(innerWidth / 2, 90);
    const row = hit && hit.closest ? hit.closest('#reg .row') : null;
    if (row && row !== railRow) {
      railRow = row;
      let b = row.previousElementSibling;
      while (b && !b.classList.contains('band')) b = b.previousElementSibling;
      row.dataset.band = b ? b.querySelector('h2').textContent : '';
      updateRail();
    }
  });
}, { passive: true });

// ================================== the pass ===============================
function reset() {
  if (!companies.length && !bootDone) return;
  scopeCompanies();
  syncSentence();
  syncLands();
  CUR = select();
  writeURL();
  printed = 0; lastBand = null; railRow = null;
  io?.disconnect();
  const reg = $('#reg');
  reg.replaceChildren();
  const head = $('#tally');
  head.replaceChildren(el('span', 'big',
    st.view === 'roles'
      ? t('tally.roles', { n: count(CUR.items.length),
                           total: count(companies.reduce((n, c) => n + c.roles.length, 0)) })
      : t('tally.cos', { n: count(CUR.items.length), total: count(companies.length) })));
  if (!CUR.items.length) { reg.append(nothing()); updateRail(); return; }
  mountMore();
}

// The keyboard path. Somebody who lives here for an hour should never have to
// reach for the mouse.
addEventListener('keydown', (e) => {
  const typing = e.target.closest?.('input, select, textarea');
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q')?.focus(); return; }
  if (e.key === 'Escape') {
    if (typing) { e.target.blur(); return; }
    const open = $('#reg .entry');
    if (open) { open.previousElementSibling?.focus(); open.previousElementSibling
      ?.classList.remove('open'); open.remove(); openName = null; }
    return;
  }
  if (typing) return;
  const rows = [...document.querySelectorAll('#reg .row')];
  if (!rows.length) return;
  const here = rows.indexOf(document.activeElement.closest?.('#reg .row'));
  const step = (d) => {
    e.preventDefault();
    const next = rows[Math.min(rows.length - 1, Math.max(0, (here < 0 ? -1 : here) + d))];
    next?.focus();
    next?.scrollIntoView({ block: 'center',
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };
  if (e.key === 'j' || e.key === 'ArrowDown') step(1);
  else if (e.key === 'k' || e.key === 'ArrowUp') step(-1);
  else if (e.key === 'Enter' && here >= 0) {
    e.preventDefault();
    const row = rows[here];
    const c = (st.view === 'roles' ? CUR.items[+row.dataset.i].c : CUR.items[+row.dataset.i]);
    toggle(row, c);
  }
});

// ================================== the shell ==============================
function applyLocale() {
  document.documentElement.lang = LOC;
  document.documentElement.dir = (LOCALES.find((l) => l[0] === LOC) || [])[2] || 'ltr';
  document.title = t('title');
  $('#desk').textContent = t('desk');
  $('#snapk').textContent = t('snapk');
  $('#lede1').textContent = t('lede1');
  $('#boot') && ($('#boot').textContent = t('boot'));
  const lede2 = $('#lede2');
  {
    // The four numbers in the opening sentence are set in the mono, because on
    // this page every number is -- so the counts read as things we measured,
    // sitting inside a thing we wrote. The template is WALKED rather than
    // interpolated, so a placeholder can become an element instead of a string.
    // Written BEFORE the data arrives, with an em dash where each number will
    // go. A reserved blank box would have to be one height for eight languages
    // and is wrong in seven of them; the sentence itself is the right
    // skeleton, because it is already the right shape. The dash is also the
    // honest thing to print for a number we do not have yet — the same mark
    // the snapshot stamp uses, and the same rule as everywhere else on the
    // page: a fact we do not hold renders as no fact, never as a zero.
    const roles = companies.reduce((n, c) => n + c.roles.length, 0);
    const em = '\u2014';
    const vals = companies.length
      ? { roles: count(roles), companies: count(companies.length),
          countries: count(COUNTRIES.length), date: fmtDate(snapshot) }
      : { roles: em, companies: em, countries: count(COUNTRIES.length), date: em };
    const raw = S[LOC].lede2 ?? S.en.lede2;
    const out = [];
    let at = 0;
    for (const m of raw.matchAll(/\{(\w+)\}/g)) {
      if (m.index > at) out.push(document.createTextNode(raw.slice(at, m.index)));
      out.push(el('span', 'n', vals[m[1]] ?? m[0]));
      at = m.index + m[0].length;
    }
    if (at < raw.length) out.push(document.createTextNode(raw.slice(at)));
    lede2.replaceChildren(...out);
  }
  // The sentence is built BEFORE the data arrives. It is the page's
  // instrument, it is three lines tall, and painting it late threw everything
  // under it down the page the moment the fetch resolved. Its country list is
  // this page's own apparatus and needs no data; its field and city lists open
  // empty and fill on the same pass that fills the register.
  //
  // The country BAND is deliberately not built early, and that is the same
  // rule pointing the other way: every name down there states a count, and a
  // band of fifteen zeros would be a claim we have no build behind.
  scopeCompanies();
  syncSentence();
  buildLangs();
  buildFooter();
}
function buildLangs() {
  const nav = $('#langs');
  const nodes = [el('span', 'micro lk', t('lang.k'))];
  for (const [code, name] of LOCALES) {
    const b = el('button', null, name);
    b.type = 'button';
    b.lang = code;
    b.setAttribute('aria-current', String(code === LOC));
    b.setAttribute('aria-label', t('lang.aria', { name }));
    b.addEventListener('click', () => {
      if (code === LOC) return;
      LOC = code;
      try { localStorage.setItem('ra.lang', LOC); } catch { /* private mode */ }
      applyLocale();
      reset();
    });
    nodes.push(b);
  }
  nav.replaceChildren(...nodes);
}
function buildFooter() {
  const notes = $('#notes');
  const out = [];
  // Filled from the data's own integrity block, so it is empty until a dataset
  // loads: a count with no build behind it would be the exact claim it denies.
  if (INTEGRITY) {
    out.push(el('p', null, t('f.integrity', {
      checked: count(INTEGRITY.checked), corpus: count(INTEGRITY.corpus_size),
      unchecked: count(INTEGRITY.unchecked) })));
  }
  if (FIRSTSEEN.size && companies.length) {
    let dated = 0, unconf = 0, total = 0;
    for (const c of companies) for (const r of c.roles) {
      total += 1;
      const e2 = FIRSTSEEN.get(r.url);
      if (!e2) continue;
      dated += 1;
      if (!e2.confirmed) unconf += 1;
    }
    out.push(el('p', null, t('f.firstseen', { dated: count(dated),
      total: count(total), unconf: count(unconf) })));
  }
  for (const k of ['f.n1', 'f.n2', 'f.n3', 'f.n4', 'f.n5']) out.push(el('p', null, t(k)));
  notes.replaceChildren(...out);
  const srcs = $('#srcs');
  const a1 = el('a', null, t('f.data')); a1.href = '../data/companies.json';
  const a2 = el('a', null, t('f.report')); a2.href = '../data/build-report.json';
  const a3 = el('a', null, t('f.seen')); a3.href = '../data/first-seen.json';
  srcs.replaceChildren(a1, a2, a3);
  if (snapshot) srcs.append(el('span', null, t('f.snapshot', { date: fmtDate(snapshot) })));
}

let INTEGRITY = null, bootDone = false;
function load(data) {
  if (data.schema_version !== SCHEMA) {
    // Refusing to render beats rendering fields that may have moved.
    $('#tally').replaceChildren(el('span', null,
      t('schema', { want: SCHEMA, got: data.schema_version, src })));
    return;
  }
  companies = data.companies || [];
  snapshot = data.snapshot || '';
  INTEGRITY = data.integrity || null;
  $('#snapshot').textContent = fmtDate(snapshot);
  $('#snapshot').dateTime = snapshot;
  DEFAULT_SORT = FIRSTSEEN.size ? 'newest' : 'reqs';
  if (!qp.get('s')) st.sort = DEFAULT_SORT;
  bootDone = true;
  applyLocale();
  reset();
}

readURL();
applyLocale();
// Enrichment, never a dependency: each of these resolves to an empty value on
// any failure, so a missing file costs its own feature and nothing else. The
// register is a public document that renders without all three.
const descReady = fetch('../data/descriptions.json', { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
const repReady = fetch('../data/build-report.json', { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : null)).catch(() => null);
const seenReady = fetch(seenSrc, { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : null)).catch(() => null);

// no-cache, not no-store: revalidate every load, but let a 304 keep the bytes.
// On a page whose whole claim is "as of the snapshot date", a browser inventing
// a freshness lifetime for the data is the bug.
fetch(src, { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
  .then(async (data) => {
    const d = await descReady;
    DESCRIPTIONS = d && typeof d === 'object' && !Array.isArray(d) ? d : {};
    const rep = await repReady;
    BUILDREP = rep && typeof rep === 'object' && !Array.isArray(rep) ? rep : null;
    // The artifact is written grouped by DATE, because that is what makes it
    // diffable one night at a time; the page asks the opposite question six
    // thousand times a render, so it is inverted once, here.
    const seen = await seenReady;
    FIRSTSEEN = new Map();
    for (const [day, buckets] of Object.entries((seen && seen.dates) || {})) {
      for (const [kind, urls] of Object.entries(buckets || {})) {
        if (!Array.isArray(urls)) continue;
        for (const u of urls) FIRSTSEEN.set(u, { date: day, confirmed: kind === 'confirmed' });
      }
    }
    load(data);
  })
  .catch((e) => {
    $('#tally').replaceChildren(el('span', null, t('err', { src, msg: e.message })));
  });
</script>

<script>
// Auth is ADDITIVE, and these guards are the whole point of it. The register is
// a public document that must render when Clerk is blocked, offline, slow or
// broken — so nothing here runs before the data, nothing here can throw into
// the page, and a failed load leaves the header exactly as it was: no control
// at all, rather than a Sign in that cannot sign anybody in.
//
// `clerkAnswered` is not the same as "Clerk is here": it says the question has
// been settled either way, which is what lets the ask print its own line about
// sign-in being unavailable instead of leaving a silent gap where a button
// would be.
addEventListener('load', async () => {
  clerkAnswered = true;
  const slot = document.getElementById('account');
  if (!slot || !window.Clerk) { document.querySelector('#reg .ask') && reset(); return; }
  try {
    // afterSignOutUrl is THIS url, deliberately. Clerk's default sends the
    // reader to `/`, which drops the query string — and the query string is
    // this page's whole session. Signing out should cost you your name, not
    // your place in the register.
    await window.Clerk.load({ afterSignOutUrl: location.href });
  } catch { return; }
  const paint = () => {
    slot.replaceChildren();
    if (window.Clerk.user) {
      const mount = document.createElement('div');
      slot.append(mount);
      window.Clerk.mountUserButton(mount);
      if (!gateOpen) { gateOpen = true; saveTally(); reset(); }
    } else {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t('ask.yes');
      b.addEventListener('click', () => { tally.yes += 1; saveTally(); window.Clerk.openSignIn(); });
      slot.append(b);
    }
    slot.dataset.ready = '';
  };
  paint();
  window.Clerk.addListener(paint);
  // The ask was very probably painted before Clerk answered; repaint it so its
  // sign-in half appears now that there is something behind it.
  if (document.querySelector('#reg .ask')) reset();
});
</script>
