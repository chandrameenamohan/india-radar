<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROLE·ATLAS</title>
<!-- A missing favicon is a 404, and a 404 is a failed network request the gate
     would have to explain. One data: URI is cheaper than an icon file. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====================== r02-a — THE OVERPRINT ============================
     An atlas sheet is printed in plates, one per colour, registered to each
     other. The base plate here is the register: 371 companies, 6,423 roles,
     black, identical for everyone, never rearranged to flatter anybody.
     The SECOND plate is the reader. Where they stand, what they can reach,
     what they folded, what has been surveyed since they last read — all of it
     is magenta, printed OVER the base and nowhere else.

     That gives the page one rule it can be held to: the overprint may only be
     laid where a fact exists. A board that said nothing about hiring from
     abroad gets no magenta, because there is nothing to print. 5,671 of the
     6,423 roles here are in exactly that state, and the sheet's honest
     appearance under a standpoint is mostly bare — which is the finding.

     Magenta as the revision colour is not decoration either: it is what an
     Ordnance Survey sheet and an aeronautical chart both overprint in. */
  :root {
    --sheet:  #FBFAF7;   /* survey paper, warm */
    --ink:    #16181A;   /* the base plate */
    --ink-2:  #53585D;   /* prose that is not the claim */
    --ink-3:  #656B72;   /* apparatus: labels, marginalia. Measured, not
                            picked: this is the lightest grey that still clears
                            WCAG AA at 10px on all three grounds this page has
                            (paper 5.16, plate 4.57, wash 4.57). The first pass
                            shipped #7E848A, which is 3.62 and a fail. */
    --rule:   #DEDAD1;   /* hairline */
    --rule-2: #16181A;   /* structural rule */
    --plate:  #F0ECE3;   /* the one fill */
    --over:   #C4006B;   /* THE OVERPRINT. The reader, and only the reader. */
    --over-2: #8E0A55;   /* overprint on a wash, for contrast */
    --wash:   #FCE7F1;   /* overprint wash */
    --gut:    1.6rem;
    --rowh:   30px;      /* fixed, so the gauge can be true to scale */
    --rail:   20.5rem;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    margin: 0; padding: 0; background: var(--sheet); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  ::selection { background: var(--wash); color: var(--ink); }
  /* Focus is the reader, so focus is magenta. Same plate as the standpoint,
     the cursor and the folds — one colour, one meaning, no exceptions. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--over); outline-offset: 1px; border-radius: 1px;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
           cursor: pointer; text-align: inherit; }
  .mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace;
                font-variant-numeric: tabular-nums; }
  .micro { font-size: 10.5px; line-height: 1.15; text-transform: uppercase;
           letter-spacing: .13em; font-weight: 600; color: var(--ink-3); }
  .hide { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }

  /* ------------------------------ title block ---------------------------- */
  /* A drafting sheet states its own particulars in a ruled block: what it is,
     what it was surveyed from, what one line on it means. This is that block,
     and the scale line is the page's promise to the gauge further down. */
  .block {
    border-bottom: 1.5px solid var(--rule-2);
    padding: 0 var(--gut);
  }
  .blockgrid {
    max-width: 96rem; margin-inline: auto;
    display: grid; grid-template-columns: minmax(0,1.5fr) repeat(3, minmax(0,1fr));
    gap: 0; align-items: stretch;
  }
  .cell { padding: .95rem 1rem .85rem 0; border-inline-end: 1px solid var(--rule);
          display: flex; flex-direction: column; gap: .3rem; }
  .cell + .cell { padding-inline-start: 1rem; }
  .cell:last-child { border-inline-end: 0; padding-inline-end: 0; }
  h1 { margin: 0; font-size: clamp(1.55rem, 3.6vw, 2.35rem); font-weight: 700;
       letter-spacing: -.035em; line-height: .95; text-transform: uppercase; }
  h1 .dot { color: var(--ink-3); font-weight: 400; }
  .thesis { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; max-width: 34ch; }
  .cell .v { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .cell .v.sm { font-size: 13px; }

  /* the reader's own controls sit in the last cell, and they are the only
     things in the title block that are not about the survey */
  .youbar { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
  .youbar select {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--ink);
    background: var(--sheet); border: 1px solid var(--rule-2);
    padding: .3rem 1.4rem .3rem .45rem; border-radius: 0; cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: right .62rem center, right .38rem center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  html[dir="rtl"] .youbar select { background-position: left .62rem center, left .38rem center; }
  .account { display: none; }
  .account[data-ready] { display: flex; align-items: center; min-height: 1.5rem; }
  .account button { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                    font-weight: 600; border: 1px solid var(--rule-2);
                    padding: .32rem .6rem; }
  .account button:hover { background: var(--ink); color: var(--sheet); }

  /* --------------------------- the two plates ---------------------------- */
  .body {
    max-width: 96rem; margin-inline: auto; padding-inline: var(--gut);
    display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
    gap: 0 2rem; align-items: start;
  }
  /* the margin: everything the reader states and everything drawn from it */
  #rail {
    position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
    padding: 1.1rem 1rem 3rem 0; border-inline-end: 1px solid var(--rule);
    scrollbar-width: thin;
  }
  .sect { padding-bottom: 1.05rem; margin-bottom: 1.05rem;
          border-bottom: 1px solid var(--rule); }
  .sect:last-child { border-bottom: 0; }
  .sect > h2 { margin: 0 0 .55rem; font-size: 10.5px; line-height: 1.15;
               text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
               color: var(--ink-3); display: flex; justify-content: space-between;
               gap: .5rem; align-items: baseline; }

  /* ---------------------------- the standpoint --------------------------- */
  /* Nine selects were the incumbent's control and r01-a shipped them again.
     This is what replaced them: not a filter bank but three first-person
     statements, because the question the register could never answer was
     never "which department" — it was "could I do any of this". Nothing here
     is inferred. A reader who states nothing is overprinted with nothing. */
  #stand { border: 1.5px solid var(--over); padding: .7rem .75rem .8rem; }
  #stand h2 { color: var(--over-2); margin-bottom: .5rem; }
  .stmt { margin-bottom: .7rem; }
  .stmt:last-child { margin-bottom: 0; }
  .stmt > .lbl { display: block; font-size: 11px; color: var(--ink-2);
                 margin-bottom: .3rem; }
  .stmt select {
    width: 100%; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--sheet); border: 1px solid var(--over);
    padding: .34rem 1.5rem .34rem .45rem; border-radius: 0; cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--over) 50%),
                      linear-gradient(135deg, var(--over) 50%, transparent 50%);
    background-position: right .7rem center, right .46rem center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  html[dir="rtl"] .stmt select { background-position: left .7rem center, left .46rem center; }
  .chips { display: flex; flex-wrap: wrap; gap: .28rem; }
  .chip {
    font-size: 12px; line-height: 1; padding: .34rem .45rem;
    border: 1px solid var(--rule-2); color: var(--ink); background: var(--sheet);
    min-height: 26px; display: inline-flex; align-items: center;
  }
  .chip[aria-pressed="true"] { border-color: var(--over); background: var(--wash);
                               color: var(--over-2); font-weight: 600; }
  .stnote { font-size: 11.5px; line-height: 1.35; color: var(--ink-2);
            margin: .6rem 0 0; }
  /* The note is blank until the corpus lands and then says four lines. Its
     height is reserved so the margin does not jolt when the numbers arrive —
     on a phone the register sits directly under it. */
  #standnote { min-height: 62px; }
  .stnote b { font-weight: 600; color: var(--ink); }
  #standclear { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                font-weight: 600; color: var(--over-2);
                border-bottom: 1px solid var(--over); }

  /* ------------------------------- the tally ----------------------------- */
  /* Three widths that add to the register. Nothing here is a percentage the
     page rounds up: the bar is the count. The silent band is the widest and
     is meant to be — a reader should see, before they read one row, how much
     of this corpus has said nothing about them. */
  .tally { display: flex; height: 12px; border: 1px solid var(--rule-2); }
  .tally i { display: block; height: 100%; }
  .tally .b-open   { background: var(--over); }
  .tally .b-silent { background: var(--sheet);
    background-image: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 4px); }
  .tally .b-closed { background: var(--ink); }
  .tkey { margin: .5rem 0 0; display: grid; gap: .28rem; }
  .tkey > div { display: grid; grid-template-columns: 10px minmax(0,1fr) auto;
                gap: .45rem; align-items: baseline; font-size: 11.5px;
                color: var(--ink-2); }
  .tkey .sw { width: 10px; height: 10px; border: 1px solid var(--rule-2);
              align-self: center; }
  .tkey .sw.open { background: var(--over); border-color: var(--over); }
  .tkey .sw.silent { background-image: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 4px); }
  .tkey .sw.closed { background: var(--ink); }
  .tkey .n { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
             font-size: 11.5px; color: var(--ink); }
  #onlybtn {
    margin-top: .7rem; width: 100%; font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; font-weight: 600; border: 1px solid var(--over);
    color: var(--over-2); padding: .45rem; min-height: 32px;
  }
  #onlybtn[aria-pressed="true"] { background: var(--over); color: #fff; }
  #onlybtn[disabled] { border-color: var(--rule); color: var(--ink-3); cursor: default; }

  /* ------------------------------- the gauge ----------------------------- */
  /* Stolen from r01-c, which was the only variant in round 1 with an honest
     answer to "make 6,423 feel like abundance rather than a wall": a gauge
     drawn at true scale rather than a scrollbar. This one carries a second
     plate too — every reachable role is one magenta hairline at its own
     depth, so the shape of your chances in the whole sheet is visible before
     you scroll to any of them. */
  .gaugewrap { display: grid; grid-template-columns: 30px minmax(0,1fr);
               gap: .6rem; align-items: stretch; }
  #gauge { display: block; width: 30px; height: 168px; border: 1px solid var(--rule-2);
           background: var(--sheet); cursor: pointer; }
  .gmeta { display: flex; flex-direction: column; justify-content: flex-start;
           gap: .1rem; font-size: 11.5px; color: var(--ink-2); }
  .gmeta .big { font-family: "IBM Plex Mono", monospace; font-size: 1.35rem;
                font-weight: 500; color: var(--ink); line-height: 1;
                font-variant-numeric: tabular-nums; }

  /* ----------------------------- the countries --------------------------- */
  .clist { display: grid; gap: 1px; }
  .crow { display: grid; grid-template-columns: 2.1rem minmax(0,1fr) 3.2rem;
          gap: .4rem; align-items: center; width: 100%; padding: .18rem 0;
          font-size: 12px; min-height: 26px; }
  .crow:hover .cbar { outline: 1px solid var(--ink-3); }
  .crow[aria-pressed="true"] { font-weight: 600; }
  .crow[aria-pressed="true"] .cc2 { background: var(--ink); color: var(--sheet); }
  .cc2 { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
         letter-spacing: .04em; padding: .1rem .18rem; text-align: center; }
  .cbar { position: relative; height: 9px; background: var(--plate); }
  .cbar i { position: absolute; inset-block: 0; inset-inline-start: 0;
            background: var(--ink); display: block; }
  .cbar u { position: absolute; inset-block: 0; inset-inline-start: 0;
            background: var(--over); display: block; height: 100%; }
  .crow .n { font-family: "IBM Plex Mono", monospace; font-size: 11px;
             text-align: end; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* -------------------------------- the folds ---------------------------- */
  /* A book you actually use has folded corners. They are the reader's marks,
     so they are the reader's colour, and they are the one thing on this page
     that can report a disappearance: the register carries no departures, but
     a fold the corpus no longer holds is a role that is gone. */
  .folds { display: grid; gap: .3rem; }
  .fold { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .4rem;
          align-items: start; font-size: 12px; line-height: 1.3; }
  .fold .t { display: block; }
  .fold .c { display: block; color: var(--ink-3); font-size: 11px; }
  .fold.gone .t { text-decoration: line-through; color: var(--ink-3); }
  .fold .x { color: var(--over-2); font-size: 15px; line-height: 1;
             min-width: 26px; min-height: 26px; }
  .goneline { font-size: 11.5px; color: var(--ink-2); margin: .5rem 0 0; }
  #foldout { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
             font-weight: 600; border-bottom: 1px solid var(--rule-2); margin-top: .6rem;
             display: inline-block; }

  /* ================================ the sheet ============================= */
  #main { padding: 1.1rem 0 5rem; min-width: 0; }

  /* the revision slip: tipped in above the sheet, only for a reader who has
     been here before, and only ever stating what the data carries */
  #slip { border: 1px solid var(--over); border-inline-start-width: 4px;
          padding: .7rem .85rem .75rem; margin-bottom: 1.1rem; background: var(--sheet); }
  #slip h2 { margin: 0 0 .3rem; font-size: 10.5px; text-transform: uppercase;
             letter-spacing: .13em; font-weight: 600; color: var(--over-2); }
  #slip p { margin: 0 0 .35rem; font-size: 13px; line-height: 1.45; max-width: 62ch; }
  #slip p:last-child { margin-bottom: 0; }
  #slip .num { font-weight: 600; }
  #slip .quiet { color: var(--ink-2); font-size: 12px; }

  .findbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .8rem;
             align-items: end; padding-bottom: .5rem; }
  .findbar label { display: block; }
  #q { width: 100%; font: inherit; font-size: 14px; color: var(--ink);
       background: var(--sheet); border: 0; border-bottom: 1.5px solid var(--rule-2);
       padding: .3rem .1rem; border-radius: 0; }
  #q::placeholder { color: var(--ink-3); }
  /* The scope line states the rule the sheet was dealt by, which is a clause,
     not a label — so it wraps. Only the counts are held to their nouns, with a
     non-breaking space, so "6,423 roles" can never break across a line. */
  .scope { text-align: end; font-size: 12px; color: var(--ink-2); }
  .scope .n { font-family: "IBM Plex Mono", monospace; font-weight: 500;
              color: var(--ink); font-variant-numeric: tabular-nums; }
  .scope .pair { white-space: nowrap; }

  /* the column heads, and the register's own rule */
  .heads, .r { display: grid; align-items: center;
    grid-template-columns: 1.7rem 3rem minmax(0,1fr) 11rem 4.6rem 3.9rem 1.6rem;
    gap: 0 .55rem; }
  .heads { border-bottom: 1.5px solid var(--rule-2); padding-bottom: .3rem;
           position: sticky; top: 0; background: var(--sheet); z-index: 3; }
  .heads > span { font-size: 10px; text-transform: uppercase; letter-spacing: .11em;
                  font-weight: 600; color: var(--ink-3); }
  .heads .e { text-align: end; }

  #sheet { position: relative; }
  /* The row's whole width is one target. The button carries the label; the
     spans beside it are ink and take no clicks, so the fold stays the only
     other thing on the line that can be pressed. */
  .r > .open { position: absolute; inset: 0; z-index: 0; }
  .r > span { position: relative; z-index: 1; pointer-events: none; }
  .r > .fd { position: relative; z-index: 2; }
  .r .sc { font-size: 9.5px; font-weight: 600; letter-spacing: .08em;
           color: var(--ink-3); border: 1px solid var(--rule); padding: 0 .18rem;
           margin-inline-end: .3rem; }
  .r .sc.read { color: var(--over-2); border-color: var(--over); }
  .r {
    height: var(--rowh); border-bottom: 1px solid var(--rule);
    content-visibility: auto; contain-intrinsic-size: auto var(--rowh);
    position: relative;
  }
  /* the overprint column. A tick where a fact exists; a rule where facts run
     consecutively, so a cluster of reachable roles reads as one mark rather
     than as confetti. Nothing at all where a board said nothing. */
  .r > .o { display: block; height: 100%; position: relative; }
  .r.reach > .o::before {
    content: ""; position: absolute; inset-inline-start: .45rem;
    inset-block: 9px; width: 3px; background: var(--over);
  }
  .r.reach.runs > .o::before { inset-block: 0; }
  .r.closed > .o::after {
    content: ""; position: absolute; inset-inline-start: .45rem; top: 50%;
    width: 3px; height: 1.5px; background: var(--ink-3);
  }
  .r .cc { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
           color: var(--ink-2); letter-spacing: .03em;
           overflow: hidden; text-overflow: clip; white-space: nowrap; }
  .r .tt { display: block; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; font-size: 13.5px; }
  .r .co { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           font-size: 12.5px; color: var(--ink-2); }
  .r .wp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
           color: var(--ink-3); overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .r .dt { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3);
           text-align: end; font-variant-numeric: tabular-nums; }
  /* the dog-ear. Folded corners are drawn folded. */
  .r .fd { justify-self: end; width: 1.6rem; height: 100%; position: relative; }
  .r .fd::after {
    content: ""; position: absolute; top: 50%; inset-inline-end: 2px;
    transform: translateY(-50%);
    width: 0; height: 0; border-inline-start: 9px solid transparent;
    border-bottom: 9px solid var(--rule);
  }
  .r .fd:hover::after { border-bottom-color: var(--ink-3); }
  .r .fd[aria-pressed="true"]::after { border-bottom-color: var(--over); }
  /* a lens dims, it does not delete: under a standpoint the rows whose facts
     do not reach the reader stay legible and stay countable, they just stop
     competing for the eye. Silence is not exclusion. */
  #sheet.lens .r:not(.reach) .tt { color: var(--ink-2); }
  #sheet.lens .r:not(.reach) { opacity: .58; }
  #sheet.lens .r:not(.reach):hover, #sheet.lens .r.cur:not(.reach) { opacity: 1; }
  /* the cursor is the reader */
  .r.cur { background: var(--wash); }
  .r.cur::before { content: ""; position: absolute; inset-block: 0;
                   inset-inline-start: 0; width: 2px; background: var(--over); }
  .r.folded .co { color: var(--over-2); }

  /* the depth stamp: a hairline every hundred lines, printing the depth and
     the night the sheet has reached. Rhythm that states a fact. */
  .stamp { display: grid; grid-template-columns: 1.7rem minmax(0,1fr) auto;
           gap: .55rem; align-items: center; height: 26px;
           border-bottom: 1px solid var(--rule); }
  .stamp .ln { height: 1px; background: var(--rule); }
  .stamp .n, .stamp .d { font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
                         color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .stamp .d { padding-inline-start: .6rem; }

  /* ---------------------------- the evidence sheet ------------------------ */
  /* Stolen outright from r01-c: the role opens where it sits, and everything
     the register holds about it is printed at once. A field the corpus does
     not carry prints as nothing. The two mobility fields are the exception,
     and only because their silence is the finding this page is built on. */
  .ev { border-bottom: 1px solid var(--rule-2); border-top: 1.5px solid var(--rule-2);
        background: var(--plate); padding: .9rem 1rem 1rem 2.25rem; }
  .ev h3 { margin: 0 0 .1rem; font-size: 1.02rem; font-weight: 600; line-height: 1.25; }
  .ev .sub { margin: 0 0 .7rem; font-size: 12.5px; color: var(--ink-2); }
  .evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
            gap: .55rem 1.4rem; }
  .fld { display: block; }
  .fld .k { display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: .11em; font-weight: 600; color: var(--ink-3); }
  .fld .v { display: block; font-size: 13px; }
  .fld .v .num, .fld .v.num { font-family: "IBM Plex Mono", monospace;
                              font-variant-numeric: tabular-nums; }
  .fld.said .v { color: var(--over-2); font-weight: 600; }
  .fld.silent .v { color: var(--ink-3); font-style: italic; }
  .evacts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
  .evacts a, .evacts button {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
    border: 1px solid var(--rule-2); padding: .45rem .7rem; min-height: 32px;
    display: inline-flex; align-items: center; text-decoration: none;
  }
  .evacts a:hover, .evacts button:hover { background: var(--ink); color: var(--sheet); }
  .evacts .keep { border-color: var(--over); color: var(--over-2); }
  .evacts .keep:hover { background: var(--over); color: #fff; }
  .evacts .keep[aria-pressed="true"] { background: var(--over); color: #fff; }
  .deriv { margin: .8rem 0 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.4;
           max-width: 70ch; border-top: 1px solid var(--rule); padding-top: .5rem; }
  .desc { margin: .55rem 0 0; display: grid; gap: .2rem; max-width: 70ch; }
  .desc p { margin: 0; font-size: 12.5px; line-height: 1.4; }
  .desc .dk { font-size: 10px; text-transform: uppercase; letter-spacing: .11em;
              font-weight: 600; color: var(--ink-3); margin-inline-end: .4rem; }

  /* ------------------------------ empty states ---------------------------- */
  .empty { padding: 1.6rem 0 0; max-width: 62ch; }
  .empty h2 { margin: 0 0 .4rem; font-size: 1.05rem; font-weight: 600; }
  .empty p { margin: 0 0 .55rem; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
  .empty .num { font-family: "IBM Plex Mono", monospace; color: var(--ink); font-weight: 500; }
  .gloss { display: flex; flex-wrap: wrap; gap: .4rem; margin: .3rem 0 .8rem; }
  .gloss button { border: 1px solid var(--over); color: var(--over-2); font-size: 12px;
                  padding: .35rem .55rem; min-height: 30px; }
  .gloss button:hover { background: var(--over); color: #fff; }
  .glossnote { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }

  /* --------------------------------- the ask ------------------------------ */
  /* Not a wall and not a modal: a card bound in at the exact line the free
     printing stops, stating in numbers what is left, what signing in does,
     and what it does NOT do. It prints its own counter back — r01-b's best
     idea — because a page that measures a reader owes them the reading. */
  #ask { border-top: 1.5px solid var(--rule-2); margin-top: 0;
         padding: 1.2rem 0 0; }
  #ask .card { border: 1.5px solid var(--over); padding: 1.05rem 1.15rem 1.1rem;
               max-width: 56rem; }
  /* Answered and declined: the card steps back to a line and an offer. */
  #ask .card.quiet { border-color: var(--rule); }
  #ask h2 { margin: 0 0 .5rem; font-size: 1.12rem; font-weight: 600; letter-spacing: -.015em; }
  #ask p { margin: 0 0 .6rem; font-size: 13.5px; line-height: 1.5; max-width: 64ch; }
  #ask p.fine { color: var(--ink-2); font-size: 12.5px; }
  #ask .num { font-family: "IBM Plex Mono", monospace; font-weight: 600;
              font-variant-numeric: tabular-nums; }
  .askacts { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .85rem; }
  .askacts button {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
    padding: .6rem .9rem; min-height: 44px; border: 1px solid var(--rule-2);
    display: inline-flex; align-items: center;
  }
  .askacts .yes { background: var(--over); border-color: var(--over); color: #fff; }
  .askacts .yes:hover { background: var(--over-2); border-color: var(--over-2); }
  .askacts button:not(.yes):hover { background: var(--ink); color: var(--sheet); }
  .counter { margin: .8rem 0 0; font-size: 11px; letter-spacing: .06em;
             color: var(--ink-3); font-family: "IBM Plex Mono", monospace;
             font-variant-numeric: tabular-nums; }

  /* --------------------------------- footer ------------------------------- */
  footer { border-top: 1.5px solid var(--rule-2); margin-top: 2.5rem;
           padding: 1.4rem var(--gut) 4rem; }
  .foot { max-width: 96rem; margin-inline: auto; display: grid;
          grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1.2rem 2rem; }
  .note { font-size: 11.5px; line-height: 1.5; color: var(--ink-2); max-width: 46ch; }
  .note h3 { margin: 0 0 .25rem; font-size: 10px; text-transform: uppercase;
             letter-spacing: .12em; font-weight: 600; color: var(--ink-3); }
  /* The sources are links in a line of prose, which on a phone is a 15px-tall
     target. They are set as a row of struck chips instead — same sentence, a
     hand can hit them. */
  .srcs { margin-top: 1.2rem; font-size: 11.5px; color: var(--ink-3);
          display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .srcs a { color: var(--ink); text-decoration: none; border: 1px solid var(--rule-2);
            padding: .3rem .5rem; min-height: 32px; display: inline-flex;
            align-items: center; font-weight: 500; }
  .srcs a:hover { background: var(--ink); color: var(--sheet); }
  /* the bookplate, kept from r01-a: every byte this copy holds about the
     reader, printed, with the control that burns it */
  #plate { max-width: 96rem; margin: 1.4rem auto 0; border: 1px solid var(--rule-2);
           padding: .85rem 1rem .95rem; }
  #plate h3 { margin: 0 0 .45rem; font-size: 10px; text-transform: uppercase;
              letter-spacing: .12em; font-weight: 600; color: var(--ink-3); }
  #plate dl { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr);
              gap: .1rem .8rem; font-size: 12px; }
  #plate dt { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-size: 11.5px; }
  #plate dd { margin: 0; overflow-wrap: anywhere; }
  #plate .none { font-size: 12px; color: var(--ink-2); }
  #burn { margin-top: .7rem; font-size: 11px; text-transform: uppercase;
          letter-spacing: .1em; font-weight: 600; border: 1px solid var(--rule-2);
          padding: .45rem .7rem; min-height: 32px; }
  #burn:hover { background: var(--ink); color: var(--sheet); }

  /* ------------------------------- the key -------------------------------- */
  #keypanel[hidden] { display: none; }
  #keypanel {
    position: fixed; inset-block: 0; inset-inline-end: 0; width: min(26rem, 92vw);
    background: var(--sheet); border-inline-start: 1.5px solid var(--rule-2);
    padding: 1.1rem 1.2rem 3rem; overflow-y: auto; z-index: 40;
    box-shadow: -18px 0 40px -30px rgba(0,0,0,.5);
  }
  #keypanel h2 { margin: 0 0 .6rem; font-size: 1rem; font-weight: 600; }
  #keypanel dl { margin: 0 0 1rem; display: grid;
                 grid-template-columns: auto minmax(0,1fr); gap: .35rem .7rem;
                 font-size: 12.5px; align-items: baseline; }
  #keypanel dt { font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
                 border: 1px solid var(--rule); padding: .05rem .3rem; justify-self: start;
                 min-width: 1.1rem; text-align: center; }
  /* The mark for "nothing is printed" is nothing. A bordered empty box would be
     a mark, which is the opposite of what that row says. */
  #keypanel dt:empty { border-color: transparent; }
  #keypanel dd { margin: 0; color: var(--ink-2); }
  #keyclose { position: absolute; inset-inline-end: 1rem; top: .9rem; font-size: 11px;
              text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
              min-height: 32px; min-width: 32px; }
  #keybtn { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
            font-weight: 600; border: 1px solid var(--rule-2); padding: .32rem .6rem; }
  #keybtn:hover { background: var(--ink); color: var(--sheet); }

  /* -------------------------- the registration mark ----------------------- */
  /* A press registers its second plate with a cross. This one appears only
     once the reader has stated something, because until then there is no
     second plate to register. */
  #reg { position: fixed; inset-inline-end: .6rem; top: .6rem; width: 18px; height: 18px;
         pointer-events: none; z-index: 2; opacity: 0; }
  #reg.on { opacity: 1; }
  #reg::before, #reg::after { content: ""; position: absolute; background: var(--over); }
  #reg::before { inset-inline-start: 8px; inset-block: 0; width: 1.5px; }
  #reg::after { inset-block-start: 8px; inset-inline: 0; height: 1.5px; }

  /* The loading line sits INSIDE the register, on the first row's own line, so
     that when the rows arrive they land where it stood. Held in its own box at
     the top of the page it pushed 57px of the document down the moment it went,
     which is a 0.34 layout shift on a page whose whole argument is precision. */
  #status { margin: 0; padding: .5rem 0 0; font-size: 13px; color: var(--ink-2); }

  /* --------------------------------- motion -------------------------------- */
  /* Every moving thing on this page is in this block and nowhere else, so the
     reduced-motion promise is one query rather than a habit. */
  @media (prefers-reduced-motion: no-preference) {
    .r, .chip, #onlybtn, .fold, #reg { transition: background-color .12s ease,
                                       opacity .16s ease, color .12s ease; }
    #reg { transition: opacity .3s ease; }
    .ev { animation: unfold .18s ease-out; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-3px); } }
  }
  /* No smooth scrolling anywhere, at any setting. Every scroll this page makes
     is a jump to a place the reader asked for — a cursor step, a plate change,
     a depth on the gauge — and animating a 195,000px sheet is not motion that
     carries meaning, it is a wait. */

  /* -------------------------------- narrow --------------------------------- */
  @media (max-width: 62rem) {
    :root { --rowh: 52px; --gut: 1rem; }
    .blockgrid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .cell:nth-child(2) { border-inline-end: 0; padding-inline-end: 0; }
    .cell:nth-child(odd) { padding-inline-start: 0; }
    .cell:nth-child(n+3) { border-top: 1px solid var(--rule); padding-top: .7rem; }
    .thesis { max-width: none; }
    /* On a phone the margin cannot sit beside the sheet, and stacking it whole
       above the register would put three screens of apparatus in front of the
       first job — which is the opposite of what the free sample is for. So the
       rail dissolves (display: contents) and its sections take their own places
       in one column: the standpoint and the tally in front of the register,
       because they are the invitation; the gauge and the folds behind it,
       because they are instruments for a reader already inside. */
    .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0;
            padding-inline: var(--gut); }
    #rail { display: contents; }
    #stand { order: 1; margin-bottom: 1rem; }
    .s-tally { order: 2; }
    .s-countries { order: 3; }
    #main { order: 4; }
    .s-gauge { order: 5; border-top: 1.5px solid var(--rule-2); padding-top: 1rem; }
    #foldsect { order: 6; }
    /* fifteen countries as eight rows rather than fifteen */
    .clist { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: .9rem; }
    .heads, .r { grid-template-columns: 1.5rem minmax(0,1fr) 2.6rem 1.9rem;
                 grid-template-areas: "o t c f" "o m c f"; }
    /* Four columns on a phone, so the column heads are four too: the three
       that have nowhere to go are struck, and the rest are placed by name
       rather than by their order in the source. */
    .heads { grid-template-areas: "o t c f"; }
    .heads .h-co, .heads .h-dt, .heads .h-wp { display: none; }
    .heads .h-o { grid-area: o; }
    .heads .h-f { grid-area: f; }
    .heads #h-role { grid-area: t; }
    .heads #h-cc { grid-area: c; text-align: end; }
    .r > .o { grid-area: o; }
    .r .tt { grid-area: t; white-space: normal; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
             font-size: 13.5px; line-height: 1.25; align-self: end; }
    .r .co { grid-area: m; align-self: start; font-size: 11.5px; }
    .r .wp { display: none; }
    .r .cc { grid-area: c; text-align: end; }
    .r .dt { display: none; }
    .r .fd { grid-area: f; width: 1.9rem; }
    .r .fd::after { border-inline-start-width: 11px; border-bottom-width: 11px; }
    .stamp { grid-template-columns: 1.5rem minmax(0,1fr) auto; }
    .ev { padding-inline-start: 1rem; }
    .findbar { grid-template-columns: minmax(0,1fr); }
    /* A finger is not a cursor. Everything pressable grows to 44px on the one
       layout that is actually held in a hand. */
    .chip, .crow, .fold .x, #foldout, .gloss button, .evacts a, .evacts button,
    .srcs a, #burn, #keybtn, .account button, #standclear { min-height: 44px; }
    .crow { padding-block: .5rem; }
    .fold .x { min-width: 44px; }
    .stmt select, .youbar select { min-height: 44px; }
    #onlybtn { min-height: 44px; }
    .scope { text-align: start; }
    .gaugewrap { grid-template-columns: 30px minmax(0,1fr); }
    #keypanel { width: 100vw; border-inline-start: 0; }
  }
  @media (max-width: 26rem) {
    .cell { padding-inline-end: .6rem; }
    .cell + .cell { padding-inline-start: .6rem; }
  }
  @media print { #rail, #ask, #keypanel, .findbar { display: none; } }
</style>

  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },

function detectLocale() {
  const saved = LS.get('ra2.edition');
  if (saved && CODES.includes(saved)) return saved;
  for (const want of (navigator.languages || [navigator.language || 'en'])) {
    const w = String(want).toLowerCase();
    const exact = CODES.find((c) => c.toLowerCase() === w);
    if (exact) return exact;
    const base = w.split('-')[0];
    // pt-PT and pt-BR are both Portuguese; a near match in the reader's own
    // language beats an exact match in somebody else's.
    const near = CODES.find((c) => c.toLowerCase().split('-')[0] === base);
    if (near) return near;
  }
  return 'en';
}

// its own posting, so the page reads the characters of the title and nothing

const RE_KANA = /[぀-ヿ]/;
const RE_HAN = /[㐀-鿿豈-﫿]/;

// Japanese reader's script count is 7 where 8 titles are arguably theirs. The
// evidence sheet names the ambiguity rather than picking one quietly. Ceiling:

// this page does not have and a guess this register would have to label.
function scriptOf(title) {
  if (RE_KANA.test(title)) return 'ja';

}

// A role's bearing to the reader. Three states and one of them is silence — the
// state 5,671 of the 6,423 roles are in, and the one every job site on earth
// renders as a maybe. Silence is printed as nothing at all.
//
// The rule the whole page rests on: a border only exists where the reader is on
// the other side of it. Standing in a role's own country, no posting has to say
// anything for the role to be within reach — there is nothing to cross.
// Standing anywhere else, only the posting's own words can open it, and remote
// is NOT one of those words: "Remote — United Kingdom" is a UK job worked from
// a UK sofa. Conflating the two is the lie this register exists not to tell.
function bearing(r) {
  const open = r.visa === 'yes' || r.abroad === 'yes';
  const closed = r.visa === 'no' || r.abroad === 'no';
  // The workplace statement is a gate on reach, never a source of a "no" the
  // board did not print: a board that named no workplace stays silent.
  if (SP.work === 'remote') {
    if (r.wp && r.wp !== 'remote') return 'closed';
    if (r.wp !== 'remote') return 'silent';
  }
  if (SP.where && SP.where !== 'ELSEWHERE' && r.cc.includes(SP.where)) return 'reach';
  if (open) return 'reach';
  if (closed) return 'closed';
  return 'silent';
}

// The deal. r01-a's worst mark was that its free sample was forty lines of one
// American company's sales org, because canonical order front-loads the biggest
// board. This does not sort the register — it DEALS it: newest night first,
// and inside a night one line per company at a time, round the table, until the
// hands are empty. The first screen is therefore forty different companies in a
// dozen countries, which is what a reader needs to believe the thing is real.
// Stated rather than silent: the finder line prints the rule.
function deal() {
  const nth = new Map();                 // "date|company" -> how many dealt so far
  const keyed = ROLES.map((r, i) => {
    const d = r.seen || '';
    const k = `${d}|${r.co}`;
    const n = (nth.get(k) || 0);
    nth.set(k, n + 1);
    return { i, d, n, co: COMPANIES[r.co].name };
  });
  keyed.sort((a, b) => {
    if (a.d !== b.d) return a.d === '' ? 1 : b.d === '' ? -1 : (a.d < b.d ? 1 : -1);
    if (a.n !== b.n) return a.n - b.n;
    return a.co < b.co ? -1 : a.co > b.co ? 1 : a.i - b.i;
  });
  ORDER = keyed.map((k) => k.i);
}

        loc: Array.isArray(r.locations) ? r.locations : [],
        wp: r.workplace || null, dep: r.department || null,
        visa: r.visa || 'unknown', abroad: r.hire_from_abroad || 'unknown',
        seen: seen ? seen.date : null, conf: seen ? seen.confirmed : false,
        sc: scriptOf(String(r.title || '')),
        hay: `${String(r.title || '')}␀${c.name}`.toLowerCase(),
      });
      URLSET.add(r.url);
    }
  });
  TOTALS.roles = ROLES.length;
  TOTALS.companies = COMPANIES.length;
  TOTALS.said = 0;
  for (const r of ROLES) {
    if (r.sc !== 'latn') { TOTALS[r.sc]++; TOTALS.nonlatn++; }
    if (r.visa === 'yes' || r.abroad === 'yes') TOTALS.said++;
  }
  deal();
  const st = $('#status');
  if (st) st.remove();          // the rows land exactly where this line stood
  paint();
  computeSlip();
  recompute();
}

// ============================ the current view ==============================
let Q = '';                 // the finder
let CSEL = '';              // the country strip's one selection
let ONLY = false;           // print only the overprint
const FREE = 300;           // lines a copy prints before it asks
let entitled = false;

function recompute() {
  const q = Q.trim().toLowerCase();
  VIEW = [];
  for (const i of ORDER) {
    const r = ROLES[i];
    if (CSEL && !r.cc.includes(CSEL)) continue;
    if (q && !r.hay.includes(q)) continue;
    if (ONLY && bearing(r) !== 'reach') continue;
    VIEW.push(i);
  }
  syncURL();
  build();
  paintRail();
}

function syncURL() {
  const p = new URLSearchParams(location.search);
  Q ? p.set('q', Q) : p.delete('q');
  CSEL ? p.set('c', CODE[CSEL]) : p.delete('c');
  ONLY ? p.set('only', '1') : p.delete('only');
  const s = p.toString();
  // The URL is the session, so a find can be sent to somebody. replaceState so
  // the back button still leaves the page rather than walking a keystroke log.
  history.replaceState(null, '', s ? `?${s}` : location.pathname);
}

// ============================== building the sheet ===========================
const SHEET = $('#sheet');
let rowEls = [];
let ROWH = 30, STAMPH = 26;
let cur = -1;                 // the cursor's index into VIEW
let openIdx = -1;             // the role whose evidence sheet is open, index into VIEW
let evHeight = 0;
let buildToken = 0;

const STAMP_EVERY = 100;
const rowTop = (n) => n * ROWH + Math.floor(n / STAMP_EVERY) * STAMPH;

function build() {
  const token = ++buildToken;
  SHEET.replaceChildren();
  rowEls = [];
  cur = -1; openIdx = -1; evHeight = 0;
  $('#ask').classList.add('hide');
  $('#emptyslot').replaceChildren();

  const shown = entitled ? VIEW.length : Math.min(FREE, VIEW.length);
  if (!shown) { SHEET.style.minHeight = '0px'; REACH = []; paintEmpty(); paintGauge(); return; }
  // Height reserved before a single row lands, so nothing below the sheet moves
  // while the chunks arrive. Layout shift is a hard mark on this page.
  SHEET.style.minHeight = `${rowTop(shown)}px`;

  let at = 0;
  const chunk = () => {
    if (token !== buildToken) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(shown, at + 700);
    for (; at < end; at++) {
      if (at && at % STAMP_EVERY === 0) frag.append(stampEl(at));
      frag.append(rowEl(at));
    }
    SHEET.append(frag);
    if (at < shown) { requestAnimationFrame(chunk); return; }
    measure();
    redress();
    paintAsk(shown);
    if (cur >= 0) cur = -1;
  };
  chunk();
}

function measure() {
  const r0 = SHEET.querySelector('.r');
  const s0 = SHEET.querySelector('.stamp');
  if (r0) ROWH = r0.offsetHeight || ROWH;
  if (s0) STAMPH = s0.offsetHeight || STAMPH;
  SHEET.style.minHeight = '0px';
}

function stampEl(n) {
  const s = el('div', 'stamp');
  s.setAttribute('aria-hidden', 'true');
  s.append(el('span', 'n', count(n)), el('span', 'ln'), el('span', 'd', ''));
  const r = ROLES[VIEW[n]];
  if (r && r.seen) s.lastChild.textContent = fmtDate(r.seen, true);
  return s;
}

function rowEl(n) {
  const i = VIEW[n];
  const r = ROLES[i];
  const c = COMPANIES[r.co];
  const row = el('div', 'r');
  row.setAttribute('role', 'listitem');
  row.dataset.n = String(n);

  const open = el('button', 'open');
  open.type = 'button';
  open.tabIndex = -1;
  open.setAttribute('aria-expanded', 'false');
  open.setAttribute('aria-label', t('row.aria', {
    title: r.t, company: c.name, country: r.cc.map(cname).join(', ') || '—',
  }));
  row.append(open);

  row.append(el('span', 'o'));
  // Two codes then a plus: a COUNT of more, never a claim about which. Three
  // codes overran the column and printed themselves over the role title.
  const codes = r.cc.map((x) => CODE[x] || '').filter(Boolean);
  row.append(el('span', 'cc', codes.length > 2
    ? `${codes[0]}\u00b7${codes[1]}+` : codes.join('\u00b7') || '\u2014'));

  const tt = el('span', 'tt');
  if (r.sc !== 'latn') {
    const sc = el('span', 'sc mono', `${SCRIPT_TAG[r.sc]} `);
    tt.append(sc);
  }
  tt.append(document.createTextNode(r.t));
  tt.title = r.t;
  row.append(tt);

  row.append(el('span', 'co', c.name));
  row.append(el('span', 'wp', r.wp ? t(WORKPLACE[r.wp]) : ''));
  row.append(el('span', 'dt', r.seen ? r.seen.slice(5) : ''));

  const fd = el('button', 'fd');
  fd.type = 'button';
  fd.tabIndex = -1;
  fd.setAttribute('aria-pressed', String(FOLDS.has(r.u)));
  fd.setAttribute('aria-label', t('fold.aria', { title: r.t }));
  row.append(fd);

  dressRow(row, r);
  rowEls[n] = row;
  return row;
}

// The overprint, applied. Separated from rowEl on purpose: stating a standpoint
// re-inks the second plate over six thousand rows and must not rebuild one of
// them, because rebuilding is where the jank and the lost scroll live.
function dressRow(row, r) {
  const b = bearing(r);
  row.classList.toggle('reach', b === 'reach');
  row.classList.toggle('closed', b === 'closed');
  row.classList.toggle('folded', FOLDS.has(r.u));
  const sc = row.querySelector('.sc');
  if (sc) sc.classList.toggle('read', SP.reads.includes(r.sc));
}
function redress() {
  REACH = [];
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (!row) continue;
    dressRow(row, ROLES[VIEW[n]]);
    if (row.classList.contains('reach')) REACH.push(n);
  }
  // runs: consecutive reachable lines join into one rule in the margin, so a
  // cluster of possibility reads as a mark rather than as confetti
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (!row) continue;
    const a = n > 0 && rowEls[n - 1] && rowEls[n - 1].classList.contains('reach');
    const c = n + 1 < rowEls.length && rowEls[n + 1] && rowEls[n + 1].classList.contains('reach');
    row.classList.toggle('runs', row.classList.contains('reach') && (a || c));
  }
  SHEET.classList.toggle('lens', standpointStated());
  paintGauge();
}

// ================================ the folds ==================================
// A book somebody uses has folded corners. The register carries no departures —
// build-report's `departed` is empty on this snapshot — so the page cannot tell
// a reader what vanished. Their own folds can, and that is the whole reason the
// fold stores the title and the company beside the URL: a fold whose posting is
// no longer in the corpus is a role that is gone, and it prints struck through.
// ponytail: the folds live in this browser and nowhere else, and the ask says
// so in as many words. Ceiling: the Worker already exists — carrying them is a
// PUT keyed on the Clerk session and a merge on load. Until that is built, the
// list downloads as plain text, so "kept here" never means "kept from you".
let FOLDS = new Map();
function loadFolds() {
  try {
    const raw = JSON.parse(LS.get('ra2.folds') || '[]');
    if (Array.isArray(raw)) {
      for (const f of raw) {
        if (f && typeof f.u === 'string') FOLDS.set(f.u, { u: f.u, t: String(f.t || ''), c: String(f.c || ''), at: String(f.at || '') });
      }
    }
  } catch { /* an unreadable list is an empty one */ }
}
function saveFolds() { LS.set('ra2.folds', JSON.stringify([...FOLDS.values()])); }
function toggleFold(i) {
  const r = ROLES[i];
  if (FOLDS.has(r.u)) { FOLDS.delete(r.u); bump('ra2.fold.off'); }
  else {
    FOLDS.set(r.u, { u: r.u, t: r.t, c: COMPANIES[r.co].name, at: new Date().toISOString().slice(0, 10) });
    bump('ra2.fold.on');
  }
  saveFolds();
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (row && ROLES[VIEW[n]].u === r.u) {
      row.classList.toggle('folded', FOLDS.has(r.u));
      row.querySelector('.fd').setAttribute('aria-pressed', String(FOLDS.has(r.u)));
    }
  }
  if (openIdx >= 0 && VIEW[openIdx] === i) {
    const b = SHEET.querySelector('.ev .keep');
    if (b) { b.setAttribute('aria-pressed', String(FOLDS.has(r.u))); b.textContent = FOLDS.has(r.u) ? t('ev.unkeep') : t('ev.keep'); }
  }
  paintFolds(); paintPlate();
}

// ============================= the evidence sheet ============================
// Taken from r01-c, which was the only variant in round 1 where a role opened
// where it sat. Everything the register holds, printed at once; a fact the
// corpus does not carry prints as nothing. The two mobility fields are the one
// exception and only because on this page their silence IS the finding.
function closeEv() {
  const ev = SHEET.querySelector('.ev');
  if (ev) ev.remove();
  if (openIdx >= 0 && rowEls[openIdx]) rowEls[openIdx].querySelector('.open').setAttribute('aria-expanded', 'false');
  openIdx = -1; evHeight = 0;
  paintGauge();
}
function openEv(n) {
  if (openIdx === n) { closeEv(); return; }
  closeEv();
  const row = rowEls[n];
  if (!row) return;
  const i = VIEW[n];
  const r = ROLES[i];
  const c = COMPANIES[r.co];
  const ev = el('section', 'ev');
  ev.setAttribute('aria-label', t('ev.aria'));

  ev.append(el('h3', null, r.t));
  const sub = el('p', 'sub');
  sub.append(document.createTextNode(c.name));
  if (r.cc.length) sub.append(document.createTextNode(` · ${r.cc.map(cname).join(' · ')}`));
  ev.append(sub);

  const g = el('div', 'evgrid');
  const fld = (k, v, cls) => {
    if (v == null || v === '') return;
    const f = el('div', `fld${cls ? ` ${cls}` : ''}`);
    f.append(el('span', 'k', t(k)), el('span', 'v', v));
    g.append(f);
  };
  // What the posting itself said about somebody who is not already there. This
  // is the only place on the page where silence is printed as words, because
  // this is the question the reader came with.
  const sayVisa = r.visa === 'yes' ? t('ev.visa.yes') : r.visa === 'no' ? t('ev.visa.no') : null;
  const sayAb = r.abroad === 'yes' ? t('ev.abroad.yes') : r.abroad === 'no' ? t('ev.abroad.no') : null;
  fld('ev.k.visa', sayVisa || t('ev.notsaid'), sayVisa ? 'said' : 'silent');
  fld('ev.k.abroad', sayAb || t('ev.notsaid'), sayAb ? 'said' : 'silent');
  fld('ev.k.workplace', r.wp ? t(WORKPLACE[r.wp]) : t('ev.notsaid'), r.wp ? '' : 'silent');
  fld('ev.k.where', canonPlaces(r.loc).join(' · '));
  // The board's own department string, printed exactly as the board wrote it.
  // Round 1's variants translated a handful of these; the field is 900 free-text
  // values a board typed ("8548 Payins - Eng"), which makes it a source claim,
  // and translating a source claim is the one thing this register may not do.
  fld('ev.k.dept', r.dep || null);
  if (r.seen) {
    fld('ev.k.seen', `${fmtDate(r.seen, true)}${r.conf ? '' : ` · ${t('ev.unconfirmed')}`}`);
  }
  fld('ev.k.board', `${fmtDate(snapshot, true)} · ${c.ats}`);
  fld('ev.k.raised', c.amount != null ? money(c) : null);
  fld('ev.k.round', c.round_letter ? t('round.series', { letter: c.round_letter }) : t('round.none'),
      c.round_letter ? '' : 'silent');
  fld('ev.k.funded', c.date ? fmtDate(c.date, true) : null);
  fld('ev.k.rule', c.qualified_by ? t(RULES[c.qualified_by] || 'rule.stage') : null);
  if (r.sc !== 'latn') fld('ev.k.script', t(`script.${r.sc}`), 'said');
  if (c.mca) fld('ev.k.cin', `${c.mca.cin} · ${c.mca.name}`);
  if (c.uk) fld('ev.k.uk', `${c.uk.number} · ${c.uk.name}`);
  if (c.salary) fld('ev.k.salary', t('ev.salary.v', { n: count(c.salary.avg_lpa), r: count(c.salary.reports), d: fmtDate(c.salary.observed, true) }));
  if (BUILDREP && BUILDREP.companies && BUILDREP.companies[c.name]) {
    fld('ev.k.verdict', BUILDREP.companies[c.name]);
  }
  ev.append(g);

  const d = DESCRIPTIONS[c.name];
  if (d) {
    const box = el('div', 'desc');
    for (const [k, v] of [['d.what', d.what], ['d.forwhom', d.for_whom], ['d.whythem', d.why_them]]) {
      if (typeof v !== 'string' || !v.trim()) continue;
      const p = el('p');
      p.append(el('span', 'dk', t(k)), document.createTextNode(v));
      box.append(p);
    }
    if (box.children.length) { box.append(el('p', 'glossnote', t('d.machine'))); ev.append(box); }
  }

  const acts = el('div', 'evacts');
  if (/^https?:\/\//i.test(r.u)) {
    const a = el('a', null, t('ev.open'));
    a.href = r.u; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  }
  const keep = el('button', 'keep', FOLDS.has(r.u) ? t('ev.unkeep') : t('ev.keep'));
  keep.type = 'button';
  keep.setAttribute('aria-pressed', String(FOLDS.has(r.u)));
  keep.addEventListener('click', () => toggleFold(i));
  acts.append(keep);
  if (c.source_url && /^https?:\/\//i.test(c.source_url)) {
    const a = el('a', null, t('ev.source'));
    a.href = c.source_url; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  }
  const cl = el('button', null, t('ev.close'));
  cl.type = 'button';
  cl.addEventListener('click', () => { closeEv(); focusRow(n); });
  acts.append(cl);
  ev.append(acts);

  // Every derived thing on this sheet names itself as derived, here, in one
  // paragraph, rather than being quietly indistinguishable from a board's claim.
  ev.append(el('p', 'deriv', t('ev.deriv')));

  row.after(ev);
  row.querySelector('.open').setAttribute('aria-expanded', 'true');
  openIdx = n;
  evHeight = ev.offsetHeight;
  paintGauge();
  bump('ra2.ev.open');
}

// Locations are fifteen countries' boards typed by fifteen sets of hands. This
// is typesetting, never invention: split the board's own separators, hold the
// mode words to one idiom, dedupe, and name no place a board did not.
const MODE = /^(remote|hybrid)$/i;
function canonPlaces(list) {
  const seen = new Map();
  for (const raw of list.flatMap((s) => String(s).split(/\s*;\s*/))) {
    let s = raw.trim().replace(/\s+/g, ' ');
    if (!s) continue;
    const m = s.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (m && (MODE.test(m[1]) || MODE.test(m[2]))) {
      const mode = MODE.test(m[1]) ? m[1] : m[2];
      const place = MODE.test(m[1]) ? m[2] : m[1];
      s = `${mode[0].toUpperCase()}${mode.slice(1).toLowerCase()} — ${place}`;
    }
    const k = s.toLowerCase();
    if (!seen.has(k)) seen.set(k, s);
  }
  return [...seen.values()].slice(0, 4);
}

// ================================== the rail =================================
function bearingCounts(list) {
  let reach = 0, closed = 0, silent = 0;
  for (const i of list) {
    const b = bearing(ROLES[i]);
    if (b === 'reach') reach++; else if (b === 'closed') closed++; else silent++;
  }
  return { reach, closed, silent, all: list.length };
}

function buildRail() {
  // where I stand
  const w = $('#where');
  w.replaceChildren();
  const add = (v, label) => { const o = el('option', null, label); o.value = v; w.append(o); };
  add('', t('sp.where.none'));
  add('ELSEWHERE', t('sp.where.else'));
  for (const c of COUNTRIES) add(c, cname(c));
  w.value = SP.where;
  w.addEventListener('change', () => { SP.where = w.value; saveStandpoint(); afterStandpoint(); });

  // what I read
  const rd = $('#reads');
  rd.replaceChildren();
  for (const [code, label] of LOCALES) {
    const b = el('button', 'chip', label);
    b.type = 'button';
    b.dataset.code = code;
    b.setAttribute('aria-pressed', String(SP.reads.includes(code)));
    b.addEventListener('click', () => {
      const at = SP.reads.indexOf(code);
      if (at >= 0) SP.reads.splice(at, 1); else SP.reads.push(code);
      b.setAttribute('aria-pressed', String(SP.reads.includes(code)));
      saveStandpoint(); afterStandpoint();
    });
    rd.append(b);
  }

  // how I can work
  const wk = $('#work');
  wk.replaceChildren();
  const addw = (v, label) => { const o = el('option', null, label); o.value = v; wk.append(o); };
  addw('', t('sp.work.any'));
  addw('remote', t('sp.work.remote'));
  wk.value = SP.work;
  wk.addEventListener('change', () => { SP.work = wk.value; saveStandpoint(); afterStandpoint(); });

}
// Bound once, on controls the markup already holds — buildRail() is called at
// boot AND on an edition change, and a listener added there would fire twice.
$('#standclear').addEventListener('click', () => {
  SP.where = ''; SP.reads = []; SP.work = '';
  saveStandpoint();
  $('#where').value = ''; $('#work').value = '';
  for (const b of $('#reads').querySelectorAll('.chip')) b.setAttribute('aria-pressed', 'false');
  afterStandpoint();
});
$('#onlybtn').addEventListener('click', () => {
  ONLY = !ONLY;
  $('#onlybtn').setAttribute('aria-pressed', String(ONLY));
  bump('ra2.only');
  recompute();
});

// Stating a standpoint re-inks the second plate. It does NOT rebuild the sheet
// unless the reader is holding the overprint-only view, because rebuilding is
// where the scroll position and the frame budget both go.
function afterStandpoint() {
  bump('ra2.standpoint.set');
  $('#reg').classList.toggle('on', standpointStated());
  $('#standclear').classList.toggle('hide', !standpointStated());
  if (ONLY) { recompute(); return; }
  redress();
  paintRail();
}

function paintRail() {
  // Before the corpus lands the margin is drawn at full height and empty. Not
  // zeroes: a page that prints "0 postings said they would hire from abroad"
  // for a hundred milliseconds has stated something the data does not say, and
  // that is the one rule here with no exceptions.
  const ready = ROLES.length > 0;
  const q = Q.trim().toLowerCase();
  // the country strip counts under the finder but not under its own selection,
  // so choosing a country never makes the other fourteen look empty
  const base = [];
  for (const i of ORDER) {
    const r = ROLES[i];
    if (q && !r.hay.includes(q)) continue;
    base.push(i);
  }
  const c = bearingCounts(VIEW);

  const tally = $('#tally');
  tally.replaceChildren();
  const total = Math.max(1, c.all);
  const seg = (cls, n) => { const s = el('i', cls); s.style.width = `${(n / total) * 100}%`; tally.append(s); };
  seg('b-open', c.reach); seg('b-silent', c.silent); seg('b-closed', c.closed);
  tally.setAttribute('aria-label', t('tally.aria', {
    reach: count(c.reach), silent: count(c.silent), closed: count(c.closed) }));

  const tk = $('#tkey');
  tk.replaceChildren();
  for (const [cls, key, n] of [['open', 'tally.reach', c.reach],
                               ['silent', 'tally.silent', c.silent],
                               ['closed', 'tally.closed', c.closed]]) {
    const row = el('div');
    row.append(el('span', `sw ${cls}`), el('span', null, t(key)),
               el('span', 'n', ready ? count(n) : ''));
    tk.append(row);
  }

  const ob = $('#onlybtn');
  ob.textContent = ONLY ? t('only.off') : t('only.on');
  ob.disabled = !ready || (c.reach === 0 && !ONLY);

  // the standpoint's own note: what stating this actually did, in numbers
  const note = $('#standnote');
  note.replaceChildren();
  const say = (key, vars) => { const p = el('span', null, `${t(key, vars)} `); note.append(p); };
  if (!ready) { /* nothing to say yet, so nothing is said */ }
  else if (!standpointStated()) {
    say('sp.note.none', { n: count(TOTALS.said) });
  } else if (SP.where === 'ELSEWHERE') {
    say('sp.note.else', { n: count(c.reach), m: count(c.all) });
  } else if (SP.where) {
    const here = base.filter((i) => ROLES[i].cc.includes(SP.where)).length;
    say('sp.note.in', { country: cname(SP.where), n: count(here) });
  } else {
    say('sp.note.partial');
  }
  if (SP.reads.length) {
    say('sp.note.reads', { n: count(TOTALS.nonlatn), m: count(TOTALS.roles) });
  }
  if (SP.work === 'remote') say('sp.note.remote');

  // the countries, as bars. Navigation and geometry in one control: the bar is
  // the count and the magenta inside it is what said yes to somebody.
  const cl = $('#clist');
  cl.replaceChildren();
  const per = COUNTRIES.map((name) => {
    let n = 0, reach = 0;
    for (const i of base) {
      const r = ROLES[i];
      if (!r.cc.includes(name)) continue;
      n++;
      if (bearing(r) === 'reach') reach++;
    }
    return { name, n, reach };
  });
  const max = Math.max(1, ...per.map((p) => p.n));
  for (const p of per) {
    const b = el('button', 'crow');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(CSEL === p.name));
    b.setAttribute('aria-label', t('country.aria', { country: cname(p.name), n: count(p.n) }));
    b.append(el('span', 'cc2 mono', CODE[p.name]));
    const bar = el('span', 'cbar');
    const ink = el('i'); ink.style.width = `${(p.n / max) * 100}%`;
    const ov = el('u'); ov.style.width = `${(p.reach / max) * 100}%`;
    bar.append(ink, ov);
    b.append(bar, el('span', 'n', ready ? count(p.n) : ''));
    b.addEventListener('click', () => {
      CSEL = CSEL === p.name ? '' : p.name;
      bump('ra2.country');
      recompute();
      window.scrollTo({ top: 0, behavior: 'instant' });
    });
    cl.append(b);
  }

  paintFolds();
  paintScope();
}

function paintScope() {
  const s = $('#scope');
  s.replaceChildren();

// ================================== the gauge ================================
// r01-c's idea, carried one step: depth at true scale, and every reachable line
// struck at its own depth, so the shape of what is open to you in the whole
// sheet is visible before you have scrolled to any of it.
const GA = $('#gauge');
let REACH = [];          // indices into rowEls, rebuilt by redress()
let gaugeAt = -1, gaugeN = -1;
function paintGauge() {
  const ctx = GA.getContext('2d');
  const W = GA.width, H = GA.height;
  ctx.clearRect(0, 0, W, H);
  const n = rowEls.length;
  if (!n) { $('#depthnow').textContent = '0'; return; }
  const full = rowTop(n) + evHeight;
  ctx.fillStyle = '#F0ECE3';
  ctx.fillRect(0, 0, W, H);
  // The reachable lines, from the index REDRESS built. Walking all 6,423 rows
  // and asking each one for a class was ~40ms a frame on a throttled machine —
  // a gauge that made the scrolling it measures stutter.
  ctx.fillStyle = '#C4006B';
  const th = Math.max(1, Math.round(H / n));
  for (const i of REACH) ctx.fillRect(0, Math.floor((rowTop(i) / full) * H), W, th);
  // where the reader is: the viewport, drawn as a window
  const box = SHEET.getBoundingClientRect();
  const top = -box.top;
  const y0 = Math.max(0, (top / full) * H);
  const y1 = Math.min(H, ((top + window.innerHeight) / full) * H);
  ctx.strokeStyle = '#16181A';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, Math.max(1, y0), W - 2, Math.max(2, y1 - y0));
  // Formatting a number through Intl every frame is not free either; the
  // readout only changes when the line under the top of the sheet changes.
  const at = Math.max(1, Math.min(n, indexAtY(Math.max(0, top)) + 1));
  if (at !== gaugeAt) { gaugeAt = at; $('#depthnow').textContent = count(at); }
  if (n !== gaugeN) { gaugeN = n; $('#gaugenote').textContent = t('gauge.of', { n: count(n) }); }
}
const topAt = (n) => rowTop(n) + (openIdx >= 0 && n > openIdx ? evHeight : 0);
function indexAtY(y) {
  let lo = 0, hi = Math.max(0, rowEls.length - 1);
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (topAt(mid) <= y) lo = mid; else hi = mid - 1; }
  return lo;
}
let gaugeTick = 0;
addEventListener('scroll', () => {
  if (gaugeTick) return;
  gaugeTick = requestAnimationFrame(() => { gaugeTick = 0; paintGauge(); });
}, { passive: true });
GA.addEventListener('click', (e) => {
  const n = rowEls.length;
  if (!n) return;
  const r = GA.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  const box = SHEET.getBoundingClientRect();
  const sheetTop = box.top + window.scrollY;
  window.scrollTo({ top: sheetTop + frac * (rowTop(n) + evHeight) - 80, behavior: 'instant' });
});

// =============================== the revision slip ===========================
// The corpus diffs itself nightly and this is the reader's half of that diff.
// It states appearances because first-seen carries them, and it states nothing
// about departures because the build's `departed` ledger is empty — the one
// place this page CAN report a disappearance is the reader's own folds.
let SLIP = null;             // what the diff found, computed once per load
function computeSlip() {
  const last = LS.get('ra2.lastsnapshot');
  const visits = bump('ra2.visits');
  let gone = 0;
  for (const f of FOLDS.values()) if (!URLSET.has(f.u)) gone++;
  LS.set('ra2.lastsnapshot', snapshot);
  LS.set('ra2.lastread', new Date().toISOString().slice(0, 10));
  if (!last || visits <= 1) { SLIP = null; renderSlip(); return; }
  let appeared = 0, mine = 0;
  if (last !== snapshot) {
    for (const r of ROLES) {
      // "Only confirmed roles may be called new" — first-seen.json's own note.
      // An unconfirmed first sighting means we had not read that board the
      // night before, which is not the same as the role not being there.
      if (!r.seen || !r.conf || r.seen <= last) continue;
      appeared++;
      if (SP.where && SP.where !== 'ELSEWHERE' && r.cc.includes(SP.where)) mine++;
    }
  }
  SLIP = { last, same: last === snapshot, appeared, mine, gone, where: SP.where };
  renderSlip();
}
function renderSlip() {
  const slip = $('#slip');
  if (!SLIP) { slip.classList.add('hide'); return; }
  slip.replaceChildren();
  slip.append(el('h2', null, t('slip.h')));
  if (SLIP.same) {
    slip.append(el('p', null, t('slip.same', { date: fmtDate(snapshot, true) })));
  } else {
    const p = el('p');
    p.append(document.createTextNode(`${t('slip.since.a', { date: fmtDate(SLIP.last, true) })} `));
    p.append(el('span', 'num', count(SLIP.appeared)));
    p.append(document.createTextNode(` ${t('slip.since.b')}`));
    if (SLIP.where && SLIP.where !== 'ELSEWHERE') {
      p.append(document.createTextNode(' '));
      p.append(el('span', 'num', count(SLIP.mine)));
      p.append(document.createTextNode(` ${t('slip.since.mine', { country: cname(SLIP.where) })}`));
    }
    slip.append(p);
    slip.append(el('p', 'quiet', t('slip.nodepart')));
  }
  if (SLIP.gone) {
    const p = el('p');
    p.append(el('span', 'num', count(SLIP.gone)));
    p.append(document.createTextNode(` ${t('slip.foldsgone')}`));
    slip.append(p);
  }
  slip.classList.remove('hide');
}

// ==================================== the ask ================================
// Bound in at the line the free printing stops, never over the register, never
// before anything of value. It suppresses itself when the view already fits —
// r01-a's rule, and the right one: an answer is not a place to ask a question.
let askShown = false;
let declinedHere = false;      // "on this visit", kept exactly: see below
function paintAsk(shown) {
  const ask = $('#ask');
  ask.replaceChildren();
  if (entitled || VIEW.length <= FREE) { ask.classList.add('hide'); return; }
  // Nothing is asked until the provider has answered. A copy where Clerk is
  // blocked prints in full four seconds later, and a card that flashed up in
  // the meantime would have counted an ask this page then withdrew — which is
  // the one thing a gate that exists to MEASURE must not do to its own numbers.
  if (clerkState === 'waiting') { ask.classList.add('hide'); return; }
  const rest = VIEW.length - shown;
  // Asked once and declined: the card said nothing here would ask again on this
  // visit, so nothing here does. The offer stays as one line, because stranding
  // a reader who said no at line 300 would be a punishment, not an answer.
  if (declinedHere) {
    const card = el('div', 'card quiet');
    card.append(el('p', null, t('ask.declined')));
    const acts = el('div', 'askacts');
    acts.append(printButton());
    card.append(acts, counterLine());
    ask.append(card);
    ask.classList.remove('hide');
    return;
  }
  const co = new Set(); const cs = new Set();
  for (const i of VIEW) { co.add(ROLES[i].co); for (const x of ROLES[i].cc) cs.add(x); }
  const card = el('div', 'card');
  card.append(el('h2', null, t('ask.h')));

  const p1 = el('p');
  p1.append(el('span', 'num', count(shown)), document.createTextNode(` ${t('ask.p1.a')} `));
  p1.append(el('span', 'num', count(rest)), document.createTextNode(` ${t('ask.p1.b', {
    co: count(co.size), cs: count(cs.size) })}`));
  card.append(p1);
  card.append(el('p', null, t('ask.p2')));
  card.append(el('p', 'fine', t('ask.p3')));

  const acts = el('div', 'askacts');
  if (clerkState === 'out') {
    const yes = el('button', 'yes', t('ask.signin'));
    yes.type = 'button';
    yes.addEventListener('click', () => {
      bump('ra2.ask.click');
      try { window.Clerk.openSignIn(); } catch { /* a provider that will not open */ }
    });
    acts.append(yes);
  }
  acts.append(printButton());
  const no = el('button', null, t('ask.no'));
  no.type = 'button';
  no.addEventListener('click', () => {
    LS.set('ra2.ask.answer', 'declined');
    bump('ra2.ask.declined');
    declinedHere = true;
    paintAsk(shown);
    paintPlate();
  });
  acts.append(no);
  card.append(acts);
  card.append(counterLine());
  ask.append(card);
  ask.classList.remove('hide');
  if (!askShown) { askShown = true; bump('ra2.ask.shown'); paintPlate(); }
}

// ================================ empty states ===============================
// The dead end round 1 left a Japanese reader in: type a Japanese word, get
// zero, and the page shrugs. The evidence stays in its source language — that
// is correct and it is not an answer. So the page says WHY there is nothing,
// counts what is actually printed in that script, and offers its own gloss,
// marked as its own and never as a board's.
function paintEmpty() {
  const slot = $('#emptyslot');
  slot.replaceChildren();
  if (VIEW.length) return;
  const box = el('section', 'empty');
  const q = Q.trim();
  box.append(el('h2', null, t('empty.h')));

  if (q) {
    const sc = scriptOf(q);
    const p = el('p');
    p.append(document.createTextNode(t('empty.q', { q })));
    box.append(p);
    if (sc !== 'latn') {
      const p2 = el('p');
      p2.append(document.createTextNode(`${t('empty.script.a')} `));
      p2.append(el('span', 'num', count(TOTALS[sc] || 0)));
      p2.append(document.createTextNode(` ${t('empty.script.b', { n: count(TOTALS.roles) })}`));
      box.append(p2);
      if ((TOTALS[sc] || 0) > 0) {
        const g = el('div', 'gloss');
        const b = el('button', null, t('empty.showscript', { n: count(TOTALS[sc]) }));
        b.type = 'button';
        b.addEventListener('click', () => { setQuery(''); showScript(sc); });
        g.append(b);
        box.append(g);
      }
    }
    const gl = GLOSS[LOCALE] || {};
    const hits = [];
    const ql = q.toLowerCase();
    for (const [word, term] of Object.entries(gl)) {
      if (ql.includes(word.toLowerCase()) || word.toLowerCase().includes(ql)) {
        if (!hits.includes(term)) hits.push(term);
      }
      if (hits.length >= 5) break;
    }
    if (hits.length) {
      box.append(el('p', null, t('empty.gloss')));
      const g = el('div', 'gloss');
      for (const term of hits) {
        const b = el('button', null, term);
        b.type = 'button';
        b.addEventListener('click', () => { bump('ra2.gloss'); setQuery(term); });
        g.append(b);
      }
      box.append(g);
      box.append(el('p', 'glossnote', t('empty.gloss.note')));
    }
  }
  if (CSEL || ONLY || standpointStated()) {
    const g = el('div', 'gloss');
    if (CSEL) {
      const b = el('button', null, t('empty.clear.country', { country: cname(CSEL) }));
      b.type = 'button';
      b.addEventListener('click', () => { CSEL = ''; recompute(); });
      g.append(b);
    }

      const b = el('button', null, t('only.off'));
      b.type = 'button';
      b.addEventListener('click', () => { ONLY = false; $('#onlybtn').setAttribute('aria-pressed', 'false'); recompute(); });
      g.append(b);
    }
    box.append(g);
  }
  slot.append(box);
}
// Not a filter the reader can compose: one shot, from the empty state, at the
// only question it answers — "show me what IS printed in my script".
function showScript(sc) {
  VIEW = ORDER.filter((i) => ROLES[i].sc === sc);

  window.scrollTo({ top: 0, behavior: 'instant' });

// ================================= the keyboard ==============================
// Round 1's shared tell: press j after scrolling and the cursor warps back to
// wherever it was left. A cursor is attention, not a data structure, so before
// it moves it re-seats on the line the eye is actually on.
function headsBottom() {
  const h = document.querySelector('.heads');
  return h ? h.getBoundingClientRect().bottom : 0;
}
function visibleRange() {
  const box = SHEET.getBoundingClientRect();
  const top = headsBottom() - box.top + 2;
  const bot = window.innerHeight - box.top - 4;
  return [indexAtY(Math.max(0, top)), indexAtY(Math.max(0, bot))];
}
function focusRow(n, scroll = true) {
  if (n < 0 || n >= rowEls.length) return;
  // Clear by query, not by remembered index: the cursor can be re-seated from
  // somewhere the index no longer points at, and a stale `.cur` left behind is
  // two cursors on the sheet — which is what shipped the first time this ran.
  for (const stale of SHEET.querySelectorAll('.r.cur')) {
    stale.classList.remove('cur');
    stale.querySelector('.open').tabIndex = -1;
  }
  cur = n;
  const row = rowEls[n];
  row.classList.add('cur');
  const b = row.querySelector('.open');
  b.tabIndex = 0;
  b.focus({ preventScroll: true });
  // 'nearest' and instant: a cursor step should never animate, and after a
  // re-seat the target is already on screen, so this usually moves nothing.
  if (scroll) row.scrollIntoView({ block: 'nearest', behavior: 'instant' });
}
function moveCursor(d) {
  if (!rowEls.length) return;
  const [vt, vb] = visibleRange();
  // The re-seat. A cursor is attention, not a data structure: if it is not on
  // screen it does not get to decide where the next line is — the eye does.
  let from = cur;
  if (from < 0 || from < vt || from > vb) from = d > 0 ? vt - 1 : vb + 1;
  focusRow(Math.max(0, Math.min(rowEls.length - 1, from + d)));
}
addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (e.key === 'Escape') {
    if (!$('#keypanel').hidden) { closeKey(); return; }
    if (typing) { e.target.blur(); return; }
    if (openIdx >= 0) { const n = openIdx; closeEv(); focusRow(n); return; }
    return;
  }
  if (typing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'j': case 'ArrowDown': e.preventDefault(); moveCursor(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveCursor(-1); break;
    case 'Enter': if (cur >= 0) { e.preventDefault(); openEv(cur); } break;
    case 'f': if (cur >= 0) { e.preventDefault(); toggleFold(VIEW[cur]); } break;
    case 'o': e.preventDefault(); $('#onlybtn').click(); break;
    case '/': e.preventDefault(); $('#q').focus(); $('#q').select(); break;
    case 'g': e.preventDefault(); window.scrollTo({ top: 0, behavior: 'instant' }); focusRow(0, false); break;
    case 'G': e.preventDefault(); focusRow(rowEls.length - 1); break;
    case '?': e.preventDefault(); openKey(); break;
    default: break;
  }
});
SHEET.addEventListener('click', (e) => {
  const fd = e.target.closest('.fd');
  const row = e.target.closest('.r');
  if (!row) return;
  const n = parseInt(row.dataset.n, 10);
  if (fd) { toggleFold(VIEW[n]); return; }
  if (e.target.closest('.open')) { focusRow(n, false); openEv(n); }
});
