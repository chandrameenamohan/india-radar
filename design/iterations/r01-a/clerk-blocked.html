     lines, with a control that throws it away. It is the whole of what the
     page knows, and it never left the machine. */
  .bookplate { margin: 1.6rem 0 0; padding: .85rem 1rem .9rem;
               border: 1px solid var(--rule-2); }
  .bookplate .bpk { display: block; color: var(--ink-3); margin-bottom: .5rem; }
  .bookplate dl { display: grid; grid-template-columns: max-content minmax(0, 1fr);
                  gap: .3rem 1.1rem; margin: 0; font-size: .8125rem; }
  .bookplate dt { color: var(--ink-3); font-size: 10px; text-transform: uppercase;
                  letter-spacing: .12em; font-weight: 600; padding-top: .12rem; }
  .bookplate dd { margin: 0; color: var(--ink); font-weight: 500;
                  overflow-wrap: anywhere; }
  .bookplate .bpnote { margin: .75rem 0 0; font-size: .75rem; line-height: 1.5;
                       color: var(--ink-2); }
  .bookplate .bpforget {
    appearance: none; background: none; border: 0; border-bottom: 1px solid var(--ink-3);
    border-radius: 0; margin: .6rem 0 0; padding: 0 0 .1rem; font: inherit;
    font-size: 11px; text-transform: uppercase; letter-spacing: .11em;
    font-weight: 700; color: var(--ink); cursor: pointer;
  }
  .bookplate .bpforget:hover { color: var(--red); border-bottom-color: var(--red); }
  .bookplate .bpforget:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  @media (max-width: 30rem) {
    .bookplate dl { grid-template-columns: minmax(0, 1fr); gap: .1rem; }
    .bookplate dd { margin-bottom: .35rem; }
  }

  /* ------------------------------- keyboard path -------------------------- */
  /* Flow 2's "someone who lives here for an hour should never touch a mouse".
     J and K move a cursor by LINE through a register whose lines each hold two
     or three tab stops of their own. The cursor is a red spine on the row — the
     same mark selection uses, one weight lighter — so the reader can tell at a
     glance which of the two reds is "where I am" and which is "what is open". */
  .irow.cursor { background: var(--wash); box-shadow: inset 2px 0 0 var(--red); }
  .irow.cursor:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  /* The keyboard card: the same drop-sheet grammar as the key, listed in the
     key card itself so it is discoverable rather than folklore. */
  .keys { display: grid; grid-template-columns: max-content minmax(0, 1fr);
          gap: .3rem .9rem; margin: .5rem 0 0; }
  .keys kbd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size: 10px; font-weight: 700; letter-spacing: .04em;
              border: 1px solid var(--rule-2); padding: .12rem .32rem .08rem;
              white-space: nowrap; }
  .keys span { font-size: .8125rem; color: var(--ink-2); }

  /* --------------------------------- touch -------------------------------- */
  /* A hairline page still has to be operable with a thumb. Every control the
     register owns is grown to the 44px the platform asks for wherever the
     pointer is coarse, and nowhere else — a mouse does not need a 44px plate
     chip, and growing them on a desk would blunt the chart. */
  /* `pointer: coarse` alone is not "this is a touchscreen": a headless browser
     with no mouse attached reports coarse, and so does a desk with a graphics
     tablet plugged in — measured, and it blew every plate chip up to 44px on a
     1440px sheet. `hover: none` is the second half of the question, and both
     halves together are what actually means a thumb. */
  @media (pointer: coarse) and (hover: none) {
    /* The filter bank is the page's most-used control and it was the one that
       failed the measurement: a hairline-underlined select is 33px tall, which
       is a comfortable click and a miss with a thumb. The rule stays a hairline
       — the bank's whole look is that it is not a box — the type just gets the
       room it needs under it. */
    #controls input, #controls select { padding: .6rem 0 .62rem; min-height: 44px; }
    .pirow { padding: .8rem 0 .78rem; }
    .mk { width: max(2.75rem, var(--dsz, 8px)); height: max(2.75rem, var(--dsz, 8px)); }
    .irow { padding-top: .78rem; padding-bottom: .8rem; }
    #status .vsw button, #status .pib, .spreadfold, .roles .morebtn,
    .bookplate .bpforget { min-height: 44px; display: inline-flex;
                           align-items: center; }
    #folio .fstep { min-width: 44px; min-height: 44px; }
    .rh .rhbtn { min-height: 40px; }
    .fplate { padding: .5rem .55rem; }
  }

  /* ------------------------------- reduced motion ------------------------- */
  /* One place, everything, last word. The page's motions are the page turn's
     sweep, the traverse bracket's glide, the row-ghost fade and the berthing
     scroll; a reader who has asked for stillness gets an instant page, and the
     script reads the same query before it ever calls scrollIntoView. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
    .sweep { display: none; }
  }
</style>
</head>
<body>
<header>
  <!-- T8.4 widened the data from India to fifteen countries, so the wording that
       said "India role" everywhere now says "role". The country tabs and the
       openness badges are T8.5's; this is only the page not claiming that a
       Berlin posting is in India. -->
  <div class="masthead">
    <h1>Role<span class="mid">·</span>Atlas</h1>
    <div class="aside">
      <!-- SPEC v3 feature 17. Empty markup on purpose: the script fills it once
           Clerk has answered which of the two states the reader is in, and
           render() never touches it. Nothing below the header reads it — an
           account changes who the reader is, never what the register shows. -->
      <div class="account" id="account"></div>
      <!-- r01-a: the edition imprint. A volume states on its title page which
           edition this copy is, and for a reference volume the edition IS the
           language its apparatus is set in. So the language control is not a
           globe in a corner: it is the imprint, in the margin where a volume
           states its own identity, and footnote 06 states what an edition does
           and does not translate. Options are filled by the script in each
           language's own name — nobody looks for their language under an
           English exonym. -->
      <div class="imprint">
        <span class="k micro" id="edlabel">Edition</span>
        <select id="lang"></select>
      </div>
      <p class="snapshot"><span class="k">Snapshot</span><time id="snapshot">—</time></p>
      <!-- Candidate 1: the restamp. The open plate's designation, struck where
           an atlas sheet strikes its number. render() re-stamps it on every
           page turn, so the header always says which plate is open. -->
      <div class="platestamp" id="platestamp" aria-live="polite">
        <span class="pnum" id="pnum">Plate 01</span>
        <span class="pname" id="pname">World — all countries</span>
      </div>
    </div>
  </div>
  <p class="thesis"><span>Funded software companies with an open role on their own job board —
    proven by the board, not by a claim.</span></p>
  <!-- Round 10: the index map is a real one. Built in load() from the data,
       because the dots are the dataset and every marker states the build's
       count — a chart rendered before the fetch would be an empty world. -->
  <!-- Candidate 1: the plate-index is the instrument. The tab strip is gone;
       this band is the sole navigation. Sixteen plates — the world, and each
       of the fifteen countries — every one a framed chip on the chart. -->
  <nav id="plate" aria-label="Plates — click a country to turn the page to its plate"></nav>
</header>

<div id="controls">
  <!-- Round 1 (candidate 1): the mobile fold. Presentation only — folding
       hides controls, never clears them, and the tally says what is set. -->
  <button id="ffold" type="button" aria-expanded="true">
    <span class="micro">Filters &amp; sort</span>
    <span class="micro" id="fcount"></span>
    <span class="chev" aria-hidden="true">▴</span>
  </button>
  <!-- T5.4: the box reads role titles too. A company matches on its own name OR
       on any title it is hiring for, and the register says which — a name match
       is visible in the name, a title match prints its count under the row's
       roles. So the placeholder states both, because a search box that silently
       widened would just look like it had started returning strangers. -->
  <label class="q-always"><span class="lbl">Search</span><input id="q" type="search" placeholder="company or role title" autocomplete="off"></label>
  <!-- T5.4: the city filter is every plate's now. India's cities ship with the
       build (src/india.py canonicalises the spellings); for the other fourteen
       countries no such field exists, so the list is read off the plate's own
       location strings — conservatively, and said aloud in note 06. -->
  <label><span class="lbl">Hiring city</span><select id="city"><option value="any">Any city</option></select></label>
  <!-- T5.4, T9.2. Read off the title first — a derivation — and off the board's
       own word only where the title places nothing. The options carry their live
       counts; a role neither can place stays reachable as Unclassified rather
       than being guessed into a bucket; and the apparatus note under the bank
       splits the two provenances while the filter is set. -->
  <label><span class="lbl">Department</span><select id="dept"><option value="any">Any department</option></select></label>
  <!-- SPEC feature 10's remote-only filter. T5.2 left it out deliberately: it
       filters on a field no row carried until T4.1, and a control that can only
       return nothing is worse than no control. -->
  <label><span class="lbl">Workplace</span><select id="remote">
    <option value="any">Any</option>
    <option value="remote">Remote roles</option>
  </select></label>
  <!-- SPEC feature 15's filter: a company with a role whose posting said yes to
       either question. It is an OR and not an AND — the two facts are read
       independently (src/openness.py), and a company that will relocate you
       without sponsoring is still one that will hire you from abroad. -->
  <label><span class="lbl">Foreign hires</span><select id="openness">
    <option value="any">Any</option>
    <option value="open">Open to foreign hires</option>
  </select></label>
  <!-- SPEC feature 10's MCA-verified filter, now that a row can carry a CIN.
       Labelled by what the register actually holds rather than as a quality
       mark: the slice covers subsidiaries of foreign-incorporated parents, so
       an India-founded company can never appear in it (footer). -->
  <label class="india-only"><span class="lbl">MCA register</span><select id="mca">
    <option value="any">Any</option>
    <option value="matched">Has an India registration</option>
  </select></label>
  <label><span class="lbl">Raised</span><select id="bracket">
    <option value="any">Any amount</option>
    <option value="small">Under $10M</option>
    <option value="mid">$10M – $50M</option>
    <option value="large">$50M and up</option>
  </select></label>
  <label><span class="lbl">Funded</span><select id="recency">
    <option value="any">Any time</option>
    <option value="90">Last 90 days</option>
    <option value="365">Last 12 months</option>
  </select></label>
  <label><span class="lbl">Sort by</span><select id="sort">
    <option value="reqs">Open roles</option>
    <option value="raised">Amount raised</option>
    <option value="date">Most recently funded</option>
    <option value="name">Name</option>
    <!-- T15.2, and the first sort in this bank that is a fact about a ROLE
         rather than about its company: the other four order the company blocks
         the roles sit in. It has nothing to order in the company register and
         nothing to read where no role carries a date, so it leaves the row in
         both cases — the openness control's rule, one control along. -->
    <option value="newest">Newest roles</option>
  </select></label>
  <!-- Round 5: where the foreign-hires filter has nothing to offer it leaves
       the row (a permanently disabled select is furniture, not honesty) and
       its fact prints here instead — an apparatus note, filled by render().
       T5.4 files the coverage notes here too, one line per set filter. -->
  <div id="fchip" hidden></div>
</div>

<p id="status" role="status">Loading…</p>

<!-- The plate index: the drop sheet the status line's "Plates 02–16" control
     opens — fifteen country plates as one typographic index, built from the
     data in plate() because every line states a count. -->
<div id="pindex" hidden aria-label="Plate index — one line per country plate"></div>

<!-- r01-a — the running head. It sits between the status line and the register
     in document order and is `position: sticky`, so it behaves exactly as a
     running head does: invisible as a thing while you are on the title page,
     and the top of every page thereafter. Everything in it is measured live —
     the plate, the quire, the reference span under the eye, the traverse. -->
<div id="runhead" hidden>
  <div class="rh">
    <span class="rhk rhplate" id="rhplate"></span>
    <span class="rhsig" id="rhsig"></span>
    <span class="rhbar" id="rhbar" aria-hidden="true">
      <span class="rhext" id="rhext"></span><span class="rhnow" id="rhnow"></span>
    </span>
    <span class="rhref" id="rhref"></span>
    <span class="rhk rhcount" id="rhcount"></span>
    <button class="rhbtn" id="keybtn" type="button" aria-expanded="false" aria-controls="keycard"></button>
  </div>
</div>

<!-- The key. Built by the script because every specimen in it is drawn with the
     page's own rules and every definition is set in the reader's edition. -->
<div id="keycard" hidden role="dialog" aria-modal="false" aria-labelledby="keytitle"></div>

<!-- The split sheet: the index of companies on the left, one gazetteer entry
     at a time on the right. The head strip is decoration only — the lines
     carry their own meaning — so it is aria-hidden. -->
<main>
  <div id="board" hidden>
    <div id="indexcol">
      <div id="indexhead" aria-hidden="true">
        <span>Ref</span><span>Company</span><span>Roles</span>
      </div>
      <div id="index"></div>
    </div>
    <aside id="sheet" aria-label="Gazetteer entry"></aside>
  </div>
  <!-- Round 9: the continuation spread. The split board holds the first
       sixteen entries beside the sticky sheet; the rest of the register runs
       here in full-width hairline columns, numbering continuous — a gazetteer
       spread, not a left-edge tail with dead paper beside it. -->
  <section id="spread" hidden aria-label="Register, continued">
    <div id="spreadhead"><span class="micro" id="spreadlabel"></span></div>
    <div id="spreadrows"></div>
  </section>
</main>

<footer>
  <div class="notes">
    <!-- T5.3. Filled from the data file's own `integrity` block, so it is empty
         until a dataset loads and stays empty for one this page refuses to read —
         a count with no build behind it would be the exact claim this says. -->
    <p id="integrity"></p>
    <!-- T15.2. Filled from data/first-seen.json, and empty without it: the
         count of roles we cannot call new is the honest half of this feature,
         so it prints beside the register rather than sitting in the file. -->
    <p id="firstseen"></p>
    <!-- r01-a: the standing notes move into the string table with everything
         else. They were the page's largest block of hardcoded English and the
         one a translated edition most obviously has to carry — the doctrine
         paragraphs are where the register explains why it refuses to guess,
         and a reader who cannot read them is being asked to take that on
         trust. Filled by paint(); empty markup so nothing prints twice. -->
    <p id="note02"></p>
    <p id="note03"></p>
    <p id="note04"></p>
    <p id="note05"></p>
    <p id="note06"></p>
    <!-- The edition note: what an edition of this volume translates, and what
         it will not. It is a doctrine paragraph, not a settings caption. -->
    <p id="note07"></p>
  </div>
  <p class="sources"><a id="src1" href="../data/build-report.json">build report</a> ·
     <a id="src2" href="../data/companies.json">the data</a> ·
     <a id="src3" href="../data/first-seen.json">first seen</a></p>
  <!-- r01-a — the bookplate. The gate's whole justification is that it MEASURES,
       and a measurement a reader cannot see is telemetry with better manners.
       This is every byte this page keeps about this reader, printed in plain
       lines in their own edition, with the control that burns it. -->
  <section class="bookplate" id="bookplate" hidden aria-labelledby="bpk"></section>
</footer>

<script>
// The site is a renderer and nothing else: it reads the JSON the build wrote and
// never recomputes a fact. The snapshot date in particular ships with the data,
// because a date taken at render time would claim a freshness the JSON lacks.
const SCHEMA = 10;                                 // src/build.py SCHEMA_VERSION
const DEFAULT_SRC = '../data/companies.json';

// Test seam: e2e drives this same page over a fixture dataset (data/companies.json
// is legitimately empty until slug resolution improves). Same-origin relative
// paths only -- a ?data= pointing at another host would render someone else's
// rows under our name.
const asked = new URLSearchParams(location.search).get('data');
const src = asked && !/^[a-z]+:|^\/\//i.test(asked) ? asked : DEFAULT_SRC;

// T15.2. The same seam for the first-seen artifact, and it needs its own: the
// e2e's dataset is seventeen invented roles, so the dates for them have to be
// invented alongside — and the real artifact holds 6,505 URLs none of which
// appear in it. Same same-origin guard, for the same reason.
const DEFAULT_SEEN = '../data/first-seen.json';
const askedSeen = new URLSearchParams(location.search).get('seen');
const seenSrc = askedSeen && !/^[a-z]+:|^\/\//i.test(askedSeen) ? askedSeen : DEFAULT_SEEN;

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;     // never innerHTML: see the seam above
  return node;
};
const link = (href, text) => {
  // A row's URLs come from the data, so they are untrusted here; javascript: is
  // the one that matters. Anything not http(s) renders as plain text.
  if (!/^https?:\/\//i.test(href)) return el('span', null, text);
  const a = el('a', null, text);
  a.href = href;
  a.rel = 'noopener';
  a.target = '_blank';
  return a;
};

// ============================ THE EDITION (flow 3) ==========================
// r01-a. A volume is issued in editions, and an edition of a reference work is
// the language its APPARATUS is set in — its labels, its key, its running head,
// its marginalia, the names it gives countries. The plates themselves do not
// change between editions and neither does anything a source wrote: a Berlin
// board's role title is German in the Japanese edition too, because translating
// a source claim would be the one lie this register exists not to tell.
//
// Everything the page owns lives in this table and nothing outside it. That is
// the only structure that makes "no orphaned English" checkable rather than
// hoped for: a string not in here is a string that cannot be set, and
// i18n-check.py beside this file holds the eight key sets to each other, to
// their placeholders, and to the code paths that ask for them. "I read it
// carefully" is not a translation strategy; a script that exits non-zero is.
//
// Keys are dotted and short. `{x}` interpolates. A counted noun is stored as
// `key.one` / `key.other` and picked through Intl.PluralRules, so a locale that
// has one plural category (ja, zh) simply never asks for the other.
const LOCALES = [
  ['en',      'English',    'ltr'],
  ['es',      'Español',    'ltr'],
  ['pt-BR',   'Português',  'ltr'],
  ['fr',      'Français',   'ltr'],
  ['de',      'Deutsch',    'ltr'],
  ['ja',      '日本語',      'ltr'],
  ['zh-Hans', '简体中文',    'ltr'],
  ['hi',      'हिन्दी',       'ltr'],
];
const LOCALE_DIR = Object.fromEntries(LOCALES.map(([c, , d]) => [c, d]));

// The strings. One block per edition, every block holding every key.
const LANGS = {};

LANGS.en = {
  'doc.title': 'ROLE·ATLAS — funded companies hiring, proven by their own job board',
  'mast.thesis': 'Funded software companies with an open role on their own job board — proven by the board, not by a claim.',
  'mast.snapshot': 'Snapshot',
  'ed.label': 'Edition',
  'ed.aria': 'Edition — the language this volume’s apparatus is set in',
  'acct.signin': 'Sign in',
  'st.loading': 'Loading…',

  'plate.n': 'Plate {n}',
  'plate.world': 'World — all countries',
  'plate.nav': 'Plates — choose a country to turn the page to its plate',
  'p01.return': '↩ Return to ',

  'ft.n04': 'The MCA data we hold lists companies registered in India as subsidiaries of a parent incorporated abroad. An India-founded company cannot appear in it at all, so a missing CIN says nothing about a company — and a present one is a registration, not an endorsement.',
  'ft.n05': 'A role’s department is read two ways, and the filter says which while it is set. First from the title by keyword, which places 86% of the roles at this snapshot. Where the title says nothing we can place, we take the board’s own word for it — boards state one on 99.6% of postings, though what they state is an internal org chart rather than a craft, so it fills the gap and never overrules a title we could read. Where neither places a role it stays Unclassified rather than being guessed into a bucket. A plate’s hiring city list is India’s from the build, and elsewhere is parsed off the location strings: a place is taken only where the board named its country beside it, so a posting that says “Remote — Germany”, or lists five cities at once, contributes no city at all.',

  'ft.integrity': 'Comprobadas {checked} de las {corpus} empresas financiadas de nuestro corpus. Las otras {unchecked} no se pudieron comprobar — sin portal de empleo que pudiéramos encontrar, o con uno que no pudimos leer — así que quedan fuera en lugar de aparecer como que no contratan. Esto no es toda empresa financiada que contrata en los quince países que vigilamos; es toda la que pudimos probar.',
  'ft.firstseen': 'Cada puesto lleva la fecha en que lo vimos por primera vez — {dated} de {total} en este corte. Un puesto se marca como nuevo sólo cuando leímos el portal de su empresa tanto en el corte anterior como en este; {unconfirmed} llevan fecha pero sin confirmar, lo que significa que los vimos por primera vez una noche en que no pudimos comparar, y no que sean nuevos ni que sean viejos. Los puestos que desaparecen no se reportan en absoluto: la noche que medimos, 176 de los 179 que se esfumaron eran empresas que no pudimos comprobar, y 3 se habían cerrado.',

  'ft.n03': 'Las insignias de visado y de contratación desde el extranjero se leen de lo que dice la oferta, y la mayoría de las ofertas no dicen nada en absoluto — el 92 % de las que medimos. Un puesto sin insignia es uno cuya oferta no lo dijo, que no es lo mismo que un no; donde una oferta sí dice que no, el puesto lo indica.',
  'ft.n04': 'Los datos del MCA que tenemos listan empresas registradas en India como filiales de una matriz constituida en el extranjero. Una empresa fundada en India no puede aparecer allí en absoluto, así que un CIN ausente no dice nada sobre una empresa — y uno presente es un registro, no un aval.',
  'ft.n05': 'El área de un puesto se lee de dos maneras, y el filtro dice cuál mientras está activo. Primero del título por palabras clave, lo que ubica el 86 % de los puestos en este corte. Donde el título no dice nada que podamos ubicar, tomamos la palabra del propio portal — los portales indican una en el 99,6 % de las ofertas, aunque lo que indican es un organigrama interno y no un oficio, así que rellena el hueco y nunca sobreescribe un título que sí pudimos leer. Donde ninguno ubica un puesto, queda Sin clasificar en lugar de adivinarse dentro de una casilla. La lista de ciudades de una lámina es la de India desde la compilación, y en el resto se analiza de las cadenas de ubicación: un lugar se toma sólo donde el portal nombró su país al lado, así que una oferta que dice «Remoto — Alemania», o que lista cinco ciudades a la vez, no aporta ninguna ciudad.',
  'ft.n06': 'Las láminas y sus coordenadas son el aparato propio de esta página. Cada marcador se sitúa en un único punto de anclaje fijo por país — la capital, salvo el de India, que es Bengaluru — así que una coordenada aquí sitúa el marcador de un país, nunca la oficina de una empresa. Cada punto pequeño es una empresa listada, dibujada en el anclaje de su país. La escala de longitud no es constante — se aprieta donde la lámina está vacía, sobre todo de 30°E a 90°E — y la retícula imprime cada cambio de paso, de modo que la banda gasta su papel donde está el registro.',
  'ft.n07': 'Este volumen se publica en ocho ediciones. Una edición compone el aparato — las etiquetas, la clave, el titulillo, estas notas y los nombres de los países que cubren las láminas — en un idioma, y no cambia nada más. Los nombres de empresa, los títulos de los puestos, las ciudades, las áreas de los portales y el texto de cualquier registro se quedan exactamente como los escribieron sus fuentes: el título de un puesto de un portal berlinés está en alemán en todas las ediciones, porque traducir la afirmación de una fuente sería la única mentira que este registro existe para no contar. Los recuentos, las fechas y los importes se componen según las convenciones de la propia edición.',

  'ft.integrity': 'Vérifiées {checked} des {corpus} entreprises financées de notre corpus. Les {unchecked} autres n’ont pas pu l’être — aucun site d’emploi trouvable, ou un site illisible pour nous — elles sont donc laissées de côté plutôt que présentées comme ne recrutant pas. Ceci n’est pas toute entreprise financée qui recrute dans les quinze pays que nous surveillons ; c’est toute celle que nous avons pu prouver.',

  'ft.n02': 'Chaque entreprise ici présentait au moins un poste ouvert, dans l’un des pays que couvre ce radar, sur son propre site d’emploi à la date du relevé. Une entreprise que nous n’avons pas pu vérifier est exclue plutôt que présentée comme « ne recrute pas ».',
  'ft.n03': 'Les mentions de visa et de recrutement à l’étranger sont lues dans ce que dit l’annonce, et la plupart des annonces ne disent rien du tout — 92 % de celles que nous avons mesurées. Un poste sans mention est un poste dont l’annonce n’a rien dit, ce qui n’est pas la même chose qu’un non ; là où une annonce dit non, le poste le dit.',
  'ft.n04': 'Les données MCA que nous détenons listent les entreprises immatriculées en Inde comme filiales d’une maison mère constituée à l’étranger. Une entreprise fondée en Inde ne peut pas y figurer du tout, donc un CIN absent ne dit rien d’une entreprise — et un CIN présent est une immatriculation, non un agrément.',
  'ft.n05': 'Le domaine d’un poste est lu de deux façons, et le filtre dit laquelle tant qu’il est actif. D’abord depuis l’intitulé par mots-clés, ce qui situe 86 % des postes sur ce relevé. Là où l’intitulé ne dit rien que nous sachions situer, nous prenons le mot du site — les sites en indiquent un sur 99,6 % des annonces, même si ce qu’ils indiquent est un organigramme interne plutôt qu’un métier, cela comble donc le vide et ne prime jamais sur un intitulé que nous savions lire. Là où ni l’un ni l’autre ne situe un poste, il reste Non classé plutôt que d’être deviné dans une case. La liste de villes d’une planche est celle de l’Inde issue de la compilation, et ailleurs elle est analysée depuis les chaînes de localisation : un lieu n’est retenu que là où le site a nommé son pays à côté, si bien qu’une annonce disant « Télétravail — Allemagne », ou listant cinq villes d’un coup, n’apporte aucune ville.',
  'ft.n06': 'Les planches et leurs coordonnées sont l’appareil propre de cette page. Chaque marqueur se tient sur un unique point d’ancrage fixe par pays — la capitale, sauf pour l’Inde, où c’est Bengaluru — donc une coordonnée place ici le marqueur d’un pays, jamais le bureau d’une entreprise. Chaque petit point est une entreprise inscrite, tracée à l’ancrage de son pays. L’échelle des longitudes n’est pas constante — elle se resserre là où la planche est vide, surtout de 30°E à 90°E — et le graticule imprime chaque changement de pas, de sorte que la bande dépense son papier là où se trouve le registre.',
  'ft.n07': 'Ce volume paraît en huit éditions. Une édition compose l’appareil — les libellés, la légende, le titre courant, ces notes et les noms des pays que couvrent les planches — dans une langue, et ne change rien d’autre. Les noms d’entreprise, les intitulés de poste, les villes, les domaines des sites et le texte de tout registre restent exactement tels que leurs sources les ont écrits : l’intitulé d’un poste sur un site berlinois est en allemand dans toutes les éditions, car traduire l’affirmation d’une source serait le seul mensonge que ce registre existe pour ne pas dire. Les décomptes, les dates et les montants sont composés selon les conventions de l’édition elle-même.',

  'ft.integrity': '{checked} der {corpus} finanzierten Unternehmen unseres Korpus geprüft. Die übrigen {unchecked} konnten nicht geprüft werden — kein auffindbares Stellenportal oder eines, das wir nicht lesen konnten — sie bleiben daher weg, statt als „stellt nicht ein“ zu erscheinen. Dies ist nicht jedes finanzierte Unternehmen, das in den fünfzehn Ländern einstellt, die wir beobachten; es ist jedes, das wir belegen konnten.',
  'ft.firstseen': 'Jede Stelle trägt das Datum, an dem wir sie zuerst gesehen haben — {dated} von {total} an diesem Stichtag. Als neu markiert wird eine Stelle nur dort, wo wir das Portal ihres Unternehmens auch am vorherigen Stichtag gelesen haben; {unconfirmed} sind datiert, aber unbestätigt, was heißt, dass wir sie in einer Nacht zum ersten Mal gesehen haben, in der wir nicht vergleichen konnten — und nicht, dass sie neu oder alt sind. Verschwundene Stellen werden gar nicht berichtet: in der Nacht, die wir gemessen haben, waren 176 der 179 Verschwundenen Unternehmen, die wir nicht prüfen konnten, und 3 waren geschlossen.',
  'ft.n02': 'Jedes Unternehmen hier hatte am Stichtag mindestens eine offene Stelle auf seinem eigenen Stellenportal, in einem der Länder, die dieses Radar abdeckt. Ein Unternehmen, das wir nicht prüfen konnten, wird ausgeschlossen, statt als „stellt nicht ein“ gezeigt zu werden.',
  'ft.n03': 'Die Hinweise zu Visum und Einstellung aus dem Ausland werden daraus gelesen, was eine Ausschreibung sagt, und die meisten Ausschreibungen sagen überhaupt nichts — 92 % der von uns gemessenen. Eine Stelle ohne Hinweis ist eine, deren Ausschreibung nichts gesagt hat, was nicht dasselbe ist wie ein Nein; wo eine Ausschreibung Nein sagt, sagt die Stelle es.',
  'ft.n04': 'Die MCA-Daten, die wir halten, führen Unternehmen, die in Indien als Tochtergesellschaften einer im Ausland gegründeten Mutter eingetragen sind. Ein in Indien gegründetes Unternehmen kann darin überhaupt nicht vorkommen, eine fehlende CIN sagt also nichts über ein Unternehmen — und eine vorhandene ist eine Eintragung, keine Empfehlung.',
  'ft.n05': 'Der Bereich einer Stelle wird auf zwei Wegen gelesen, und der Filter sagt, auf welchem, solange er gesetzt ist. Zuerst aus dem Titel per Stichwort, was 86 % der Stellen an diesem Stichtag zuordnet. Wo der Titel nichts sagt, was wir zuordnen können, nehmen wir das Wort des Portals — Portale nennen einen Bereich bei 99,6 % der Ausschreibungen, auch wenn sie damit ein internes Organigramm nennen und kein Handwerk; es füllt also die Lücke und überstimmt nie einen Titel, den wir lesen konnten. Wo keines von beiden eine Stelle zuordnet, bleibt sie „Nicht zugeordnet“, statt in eine Schublade geraten zu werden. Die Ortsliste eines Blattes stammt für Indien aus dem Build, sonst wird sie aus den Ortsangaben gelesen: ein Ort wird nur dort übernommen, wo das Portal sein Land danebengesetzt hat, sodass eine Ausschreibung mit „Remote — Deutschland“ oder mit fünf Städten auf einmal gar keinen Ort beisteuert.',
  'ft.n06': 'Die Blätter und ihre Koordinaten sind der eigene Apparat dieser Seite. Jede Marke sitzt auf genau einem festen Ankerpunkt je Land — der Hauptstadt, außer bei Indien, wo es Bengaluru ist — eine Koordinate setzt hier also die Marke eines Landes, nie das Büro eines Unternehmens. Jeder kleine Punkt ist ein verzeichnetes Unternehmen, gezeichnet am Anker seines Landes. Der Längenmaßstab ist nicht konstant — er wird enger, wo das Blatt leer ist, am stärksten von 30°O bis 90°O — und das Gradnetz druckt jeden Wechsel des Maßstabs, sodass das Band sein Papier dort ausgibt, wo das Verzeichnis ist.',
  'ft.n07': 'Dieser Band erscheint in acht Ausgaben. Eine Ausgabe setzt den Apparat — die Beschriftungen, die Zeichenerklärung, den Kolumnentitel, diese Anmerkungen und die Namen der Länder, die die Blätter abdecken — in einer Sprache und ändert sonst nichts. Unternehmensnamen, Stellentitel, Orte, Portalbereiche und der Wortlaut jedes Registers bleiben genau so, wie ihre Quellen sie geschrieben haben: der Stellentitel eines Berliner Portals ist in jeder Ausgabe deutsch, denn die Behauptung einer Quelle zu übersetzen wäre die eine Lüge, für deren Vermeidung es dieses Verzeichnis gibt. Zählungen, Daten und Beträge werden nach den Konventionen der jeweiligen Ausgabe gesetzt.',

  'ft.n04': '我们持有的MCA数据，收录的是在印度登记为境外设立母公司之子公司的企业。在印度创办的公司根本不可能出现在其中，因此缺少CIN并不说明这家公司的任何情况 — 而有CIN是一项登记，不是一份背书。',
  'ft.n05': '职位的职能有两种读法，筛选生效时会说明用的是哪一种。先按关键词从职位名判定，本快照日可判定86%。职位名无法判定时，采用招聘页自己的说法 — 招聘页在99.6%的职位上都写了一个，但写的是内部组织架构而非工种，因此它只用来补空，绝不覆盖我们读得出的职位名。两者都无法判定的职位保留为「未归类」，而不是猜进某个格子。图版的工作城市清单，印度部分来自构建，其余则从工作地字符串中解析：只有招聘页在地名旁写明国家时才采纳该地名，因此写着「远程 — 德国」或一次列出五座城市的职位说明，不会贡献任何城市。',
  'ft.n06': '图版及其坐标是本页自己的辅助装置。每个标记都落在每个国家唯一固定的锚点上 — 首都，印度除外，其锚点是班加罗尔 — 因此这里的坐标定位的是一个国家的标记，绝不是某家公司的办公室。每个小点是一家在册公司，绘在其所属国家的锚点上。经度比例并不恒定 — 图版为空之处会收紧，尤以东经30°至90°为甚 — 经纬网会印出每一次比例变化，因此这条带把纸张花在名录所在之处。',
  'ft.n07': '本卷刊行八个版本。一个版本把辅助文字 — 标签、图例、书眉、这些注记，以及图版所覆盖国家的名称 — 用一种语言排出，除此之外不改动任何东西。公司名、职位名、城市名、招聘页上的部门名，以及各登记簿的措辞，都完全保持来源写下的样子：柏林招聘页上的职位名在每个版本里都是德语，因为翻译来源的陈述，正是这份名录为了不去说而存在的那一个谎。计数、日期与金额按各版本自身的惯例排印。',

// The edition in force, and the reader's own choice remembered. Detection walks

// full tag or on its base language, so a browser asking for pt-PT gets the
// Portuguese edition rather than falling through to English — a near match in
// your own language beats an exact match in someone else's.
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* private mode */ } },

function detectLocale() {
  const saved = LS.get('ra.edition');
  if (saved && CODES.includes(saved)) return saved;
  for (const want of (navigator.languages || [navigator.language || 'en'])) {
    const w = String(want).toLowerCase();
    const exact = CODES.find((c) => c.toLowerCase() === w);
    if (exact) return exact;
    const base = w.split('-')[0];
    // pt-PT and pt-BR are both Portuguese; zh-TW asking for zh gets Hans, which
    // is the only Chinese edition bound. Both are near matches stated as such.
    const near = CODES.find((c) => c.toLowerCase().split('-')[0] === base);

  t(`${base}.${PLURAL.select(n) === 'one' ? 'one' : 'other'}`, { n: count(n) });

    if (pattern.test(text)) { found = name; break; }
  }
  DEPTMEMO.set(text, found);
  return found;
}
// The title, then the board, then neither. `deptSource` is the same decision
// said out loud, for the apparatus note: what a reader is looking at is either
// our reading of the title or the board's own word, and the page has to be able
// to say which without recomputing the answer differently.
function deptOf(role) {
  return bucketOf(role.title) || bucketOf(role.department) || UNCLASSIFIED;
}
function deptSource(role) {
  if (bucketOf(role.title)) return 'title';
  return bucketOf(role.department) ? 'board' : 'neither';
}

// The India CTC benchmark, when one was found (65 of 116 measured). Absence is
// the common case and renders as nothing at all -- no "salary unknown" line,
// because a row saying that for half the site is noise, not information.
//
// The date and the sample size are not footnotes to the figure, they are what
// make it readable: the source recomputes each company on its own schedule
// (measured: nine months apart at the extremes), and averages one salary as
// readily as nine thousand. So the row states both and links the source, rather
// than presenting a bare number as a fact about today.
function salaryLine(s) {
  const line = el('p', 'salary');
  // The figure keeps its source's own unit — ₹L is what AmbitionBox reports and
  // rewriting a lakh into millions would be restating a source's number rather
  // than typesetting it. Only the sentence around it is the edition's.
  line.append(
    el('span', 'ctc', `₹${s.avg_lpa.toFixed(1)}L`),
    el('span', null, t('e.salary', {
      n: pl('n.report', s.reports), date: fmtDate(s.observed, true) })),
    link(s.source_url, 'AmbitionBox'),
  );

}

// The India registration, where the name match was certain enough to publish
// (32 of 116 measured). The registered name ships beside the CIN because it is
// what lets a reader check the join themselves -- "STRIPE INDIA PRIVATE LIMITED"
// under "Stripe" is the whole claim, stated rather than implied. The status is
// the register's own word and is not always "Active": a struck-off India entity
// beside an open India role is a real thing to know.
function registrationLine(m) {
  const line = el('p', 'mca');
  // `m.name`, `m.city` and `m.status` are the register's own words, verbatim in
  // every edition: a status of `Strike Off` is what MCA wrote, and rewriting it

  line.append(

// The UK registration (T9.1). The badge says "Registered in the UK" plainly,

// House covers every UK company.
//
// The number is a LINK, and that is the badge rather than decoration on it: the
// claim is checkable in one click on the register's own public page, which is
// the difference between proven and asserted. The status is the register's word
// verbatim -- `active`, `liquidation`, `administration` -- and is never
// rewritten into a word the register did not use.
function ukRegistrationLine(r) {
  const line = el('p', 'ukreg');
  const number = link(r.url, r.number);
  number.className = 'num';
  line.append(
    el('span', null, t('e.uk.pre')),

const days = (from, to) => (Date.parse(to) - Date.parse(from)) / 86400000;

const brackets = {
  any: () => true,
  small: (c) => c.amount != null && c.amount < 1e7,
  mid: (c) => c.amount != null && c.amount >= 1e7 && c.amount < 5e7,
  large: (c) => c.amount != null && c.amount >= 5e7,
};
const sorts = {
  reqs: (a, b) => b.roles.length - a.roles.length || a.name.localeCompare(b.name),
  raised: (a, b) => (b.amount ?? -1) - (a.amount ?? -1),
  date: (a, b) => (b.date || '').localeCompare(a.date || ''),   // undated sort last
  name: (a, b) => a.name.localeCompare(b.name),
  // T15.2. `newest` is a ROLE fact and has no company comparator of its own, so
  // the company blocks keep the register's canonical order and render() re-sorts
  // the flattened roles themselves. It is written out rather than left missing
  // because `Array.sort(undefined)` is a lexicographic sort of stringified
  // objects — every company would compare as "[object Object]" and the register
  // would scramble into insertion order without saying it had.
  newest: (a, b) => sorts.reqs(a, b),
};

let companies = [];
let snapshot = '';
// Round 2: the reference is a citation, not a row counter. Refs are struck
// ONCE per snapshot, in the register's canonical order (open roles, name to
// break ties — the default sort), and never renumber: sort by name and
// Databricks keeps the ref it carried a second ago, because a ref that moves
// under sort is a row counter wearing a mono font. The row ORDER changes
// around the numbers; the numbers never change under the rows.
let REFS = {};
// The open plate: one country's name, or null for Plate 01 — the whole atlas.
let activeCountry = null;
// The sheet's one entry, remembered by name so a re-render (a filter, a sort)

let selectedName = null;
// True for exactly one render after a row CLICK: the one case where the page
// may move to meet the berthed sheet. Filters and sorts never scroll.
let wantScroll = false;
// The plate index (the "Plates 02–16" drop sheet) and the hand-fold. Both
// presentation: turning a page closes the index, and opening the fold is a
// one-way door for the session — a reader who asked for the whole register
// keeps it through filter changes.
let indexOpen = false;
let spreadOpen = false;
// The roles register runs to 6,422 lines, which is not a page but a download,
// so it prints in pages. Reset by any control change: a reader who narrowed the
// register is asking a new question, not scrolling the old answer. Nothing is
// dropped — the fold says how many are behind it and the tally above always
// states the true total.
const ROLE_PAGE = 200;
let roleCap = ROLE_PAGE;
// The register's unit. Held in a variable rather than read off a control,
// because the control is rebuilt into the status line on every render and state
// that lives inside something we replaceChildren() is state we throw away.
//
// Deep-linkable, like the dataset seam above it: a reader who found the company
// index useful can send someone the company index. Roles is the default because
// a reader arrives looking for a job — and an unknown value is ignored rather
// than honoured, so a typo opens the page rather than a blank.
let view = 'roles';
{
  const want = new URLSearchParams(location.search).get('view');
  if (want === 'companies' || want === 'roles') view = want;
}

// The unit switch. HELD AS A NODE, not rebuilt, for the same reason SHEET is —
// and this one is a measured bug rather than a tidiness preference.
//
// render() rebuilds the status line with replaceChildren, so a control
// constructed there is a DIFFERENT element every render. Blurring the search box
// fires `change`, and `change` re-renders: a reader who typed a search and then
// clicked this switch had their mousedown target detached before the mouseup
// arrived, so no click event ever fired and the FIRST PRESS DID NOTHING.
// Reproduced three times out of three. replaceChildren MOVES a node it already
// holds, so one persistent element sidesteps the whole race.
const VIEWSW = (() => {
  const group = el('span', 'vsw');
  group.id = 'viewsw';
  group.setAttribute('role', 'group');
  for (const unit of ['roles', 'companies']) {
    const b = el('button', null);
    b.type = 'button';
    b.id = unit === 'roles' ? 'vroles' : 'vcompanies';
    b.dataset.unit = unit;
    b.addEventListener('click', () => {
      // The open register is not a destination. Re-rendering what the reader is
      // already reading would announce a state change that did not happen.
      if (view === unit) return;
      view = unit;
      roleCap = ROLE_PAGE;        // a new unit is a new question, not a scroll
      render();
    });
    group.append(b);
  }
  return group;
})();

// Repainted from `view`; the node itself never changes. Placed into the status
// line by BOTH of render()'s branches, deliberately: filters that meet in an
// empty corner still leave a reader in a register, and the one place a reader
// most needs the other view is the one showing nothing.
function viewSwitch() {
  VIEWSW.dataset.unit = view;                      // what the register is, for tests and CSS
  VIEWSW.setAttribute('aria-label', t('st.unit'));
  for (const b of VIEWSW.children) {
    // Re-set rather than built once: the node persists across renders on
    // purpose (see above) and so has to be re-lettered when the edition turns.
    b.textContent = t(b.dataset.unit === 'roles' ? 'st.roles' : 'st.companies');
    b.setAttribute('aria-pressed', String(b.dataset.unit === view));

// The last plate rendered, for the page-turn sweep: the sweep runs only when
// this changes, so filters and sorts never fire it. '01' is the load state.
let lastTurn = '01';
// Held as a node, not a query: on narrow screens the sheet berths inside the
// index, where the next render's replaceChildren would detach it — the

let DESCRIPTIONS = {};

  .catch(() => ({}));

// the build's verdict on this company, and the corpus arithmetic behind it.
// Enrichment, never a dependency: a missing report costs the receipt its
// verdict and corpus rows, and the receipt says nothing in their place.
let BUILDREP = null;
const buildReady = fetch('../data/build-report.json', { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : null))
  .catch(() => null);

// T15.2 — when we first saw each role, keyed by its posting URL. Enrichment on
// the descriptions' terms: fetched optionally, resolving to null on any failure,
// so a missing file costs the badge and the Newest sort and nothing else. The
// register is a public document that renders without it.
//
// A Map rather than the file's own shape: the artifact is grouped by DATE
// because that is how it is written and diffed one night at a time, and the page
// asks the opposite question 6,422 times a render — what does this URL say.
let FIRSTSEEN = new Map();
const firstSeenReady = fetch(seenSrc, { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : null))
  .catch(() => null);
// A role is called NEW for a week after we first saw it, and no longer. SPEC v3
// "Not a wall" set the cadence from the data — 9 new roles a night, so alerts
// weekly rather than daily — and a badge that outlives its alert would be
// telling a reader something the register no longer means by it.
const NEW_DAYS = 7;
// Inclusive on both ends: `days` is signed, and a role dated AFTER the snapshot
// (a hand build folded in out of order) is not new, it is a build we cannot
// place. Confirmed is checked at the call site, never here — this answers "is it
// recent", and the two questions must stay separable to be testable apart.
const freshlySeen = (entry) =>
  !!entry && entry.date != null && days(entry.date, snapshot) >= 0
  && days(entry.date, snapshot) <= NEW_DAYS;

// What we can say about a company, said in the page's smallest voice: three
// labelled lines and a provenance mark stating a machine wrote them.
function descBlock(d) {
  const block = el('div', 'desc');
  // The three LABELS are the page's; the three lines are a machine's prose about
  // a company and stay in the language they were written in, marked as machine
  // prose. Translating them would put a second machine between the reader and a
  // claim that already carries one.
  for (const [k, v] of [['d.what', d.what], ['d.forwhom', d.for_whom],
                        ['d.whythem', d.why_them]]) {
    if (typeof v !== 'string' || !v.trim()) continue;   // a missing line is no line
    const line = el('p', 'dline');
    line.append(el('span', 'dk micro', t(k)), el('span', 'dv', v));
    block.append(line);
  }
  if (!block.children.length) return null;
  // Provenance in two halves, because they answer two different questions.
  // `ai` says a machine wrote these lines. `checked` says a pass afterwards
  // opened the company's OWN website and read it against the board we publish
  // their roles from, and found no contradiction (T10.5).
  //
  // The second half exists because a company the corpus holds no address for
  // cannot be checked at all -- 45 listed rows were in that state when T10.5
  // started, and their three lines looked exactly like the ones somebody had
  // read. An unverified description is not a wrong one. It is one nobody has
  // stood behind, and the page has to be able to say which it is showing.
  // A THIRD provenance, because a third source now exists. Six companies serve
  // no readable website — openai.com answers 403 to every path, getparker.com
  // 404s, sorare.com serves a browser gate — and were blank for it. Their own
  // job BOARD describes them plainly, and the board is the source this whole
  // register rests on ("proven by their own job board"), so it is a first-party
  // source rather than a fallback to hearsay.
  //
  // It gets its own line rather than borrowing one. "Checked against their own
  // site" would be false — no site was read. "Unverified" would be untrue in the
  // other direction: it was read, off a first-party source, just not the one the
  // audit uses. A page that prints where a claim came from cannot round the
  // answer to the nearest existing string.
  if (d.ai) {
    block.append(el('p', 'prov', t(d.source === 'board' ? 'd.prov.board'
      : d.checked ? 'd.prov.checked' : 'd.prov.un')));
  }
  return block;
}

// The countries the open plate covers, and what to call them in a sentence.
const scope = () => (activeCountry ? [activeCountry] : COUNTRIES);
const scopeName = () => (activeCountry ? cname(activeCountry) : t('scope.all'));

// A company as one country view shows it: the roles in that scope, and every
// derived fact recomputed off THOSE roles. A row under the UK tab that counted
// its Bengaluru roles and printed a Bengaluru location would be answering a
// question nobody asked. The India enrichments go the same way -- an average
// India CTC or an India registration beside a list of London roles is this site
// inventing a fact, which is why the build attaches them to India rows only
// (SPEC v2). Returns null for a company with nothing in this scope.
function inScope(c, covers) {
  const roles = c.roles.filter((r) => r.countries.some((x) => covers.includes(x)));
  if (!roles.length) return null;
  const india = covers.includes('India');
  return {
    ...c,
    roles,
    total: c.roles.length,                       // what the board holds, for the row to say so
    countries: c.countries.filter((x) => covers.includes(x)),
    cities: india ? c.cities : [],               // `cities` is India's, from the build
    salary: india ? c.salary : null,
    mca: india ? c.mca : null,
    // Companies House knows UK companies and nobody else, so the badge follows
    // its register the way the India ones follow theirs: on a plate that does
    // not cover the UK, a UK registration beside a list of Tokyo roles would be
    // this site answering a question nobody asked.
    uk: covers.includes('United Kingdom') ? c.uk : null,
  };
}

// How many listed companies have a role in these countries -- the same rule as
// build.py's country_counts (a company in two of them is counted in both), so a
// tab and build-report.json cannot disagree. It counts the listed set and never
// the filtered one: a number that moved with the search box would stop being the
// build's number.
const listedIn = (covers) =>
  companies.filter((c) => c.countries.some((x) => covers.includes(x))).length;

// One plate-chip: a square dot at the true anchor, and beside it a framed
// label — plate number, name (code where the box is small), count — that
// reads as the button it is. Zeros included — a marker at zero is a country
// we read and found nobody hiring in, which is a finding, and a chart missing
// the marker would read as a country nobody looked at.
function marker([name, code, lat, lon, , side], X, Y) {
  const n = listedIn([name]);
  const mk = el('button', `mk lb-${side}${n ? '' : ' nil'}`);
  mk.type = 'button';
  mk.dataset.country = name;
  // A chip is a toggle into its plate, and render() turns exactly one of them
  // (or the Plate 01 strip) on. The red chip a sighted reader sees is stated
  // here too, so a screen reader is told which plate is open rather than left
  // to infer it from a colour.
  mk.setAttribute('aria-pressed', 'false');
  mk.style.left = X.toFixed(2) + '%';
  mk.style.top = Y.toFixed(2) + '%';
  // Round 2: the dot is scaled by the count — area, so sqrt — and the label
  // steps out past its own dot's radius. A register that is 97% one country
  // now LOOKS like one: India's marker dominates the band the way its 116
  // companies dominate the data, and thirteen zeros stay small and hollow.
  if (n) {
    const sz = Math.round(7 + 1.6 * Math.sqrt(n));
    mk.style.setProperty('--dsz', sz + 'px');
    // Round 6: the stand-off is measured from the button's EDGE, not its
    // centre — the .lb-* rules offset the label from the box, and a scaled
    // marker's box IS its dot. At sz/2 + 2 the offset was swallowed by the
    // dot's own radius, so India's 24px dot printed 3px over the left border
    // of its own label at 390px (measured). One dot-width of stand-off puts
    // the frame clear of the dot at every count.
    mk.style.setProperty('--r', (sz + 2) + 'px');
  }
  mk.title = t('mk.title',
    { no: plateNo(name), country: cname(name), coord: dms(lat, lon) });
  const lb = el('span', 'mlb');
  lb.append(el('span', 'mno', plateNo(name)),
            el('span', 'mcd', code),
            el('span', 'mnm', cname(name)),
            el('b', n ? null : 'nil', count(n)));
  mk.append(el('span', 'mdot'), lb);
  mk.setAttribute('aria-label', t('mk.aria',
    { no: plateNo(name), country: cname(name), n: pl('n.company', n) }));
  mk.addEventListener('click', () => goCountry(name));
  // The reverse of the index→chart light: pointing at a marker asks the index
  // "who is here?", and the index answers by ghosting everyone else.
  mk.addEventListener('mouseenter', () => preview(name, true));
  mk.addEventListener('mouseleave', () => preview(name, false));
  return mk;
}

// The chart itself: graticule, company dots, the framed Europe region, its
// enlarged inset, and one marker per country. Built from the data in load()
// because the dots ARE the dataset — one per listed company, fanned in a
// deterministic sunflower spiral at its country's anchor, so 116 companies in
// India print as the blot they are and a chart drawn before the fetch would
// be an empty world claiming nobody anywhere.
function plate() {
  const main = el('div', 'chartmain');
  // Meridians every 30° labelled at the foot; parallels every 30°, the
  // equator in the heavier line — the graticule states the band's scale.
  for (const lon of [0, 30, 60, 90, 120, 150, 180]) {
    const m = el('span', 'mer');
    m.style.left = px(lon).toFixed(2) + '%';
    const l = el('span', 'gl', lon === 0 ? '0°' : `${lon}°E`);
    // 180° sits a hair from the band's edge; right-anchored it stays whole.
    if (lon === 180) l.style.right = '0';
    else l.style.left = px(lon).toFixed(2) + '%';
    l.style.bottom = '0';
    main.append(m, l);
  }
  for (const lat of [60, 30, 0, -30]) {
    const p = el('span', lat === 0 ? 'par eq' : 'par');
    p.style.top = py(lat).toFixed(2) + '%';
    const l = el('span', 'gl', lat === 0 ? '0°' : `${Math.abs(lat)}°${lat > 0 ? 'N' : 'S'}`);
    l.style.top = `calc(${py(lat).toFixed(2)}% - 10px)`;
    l.style.left = '0';
    main.append(p, l);
  }
  // The dots: one per listed company, at its country's anchor. The spiral is
  // tighter and the dots smaller than round 10's — at 0.17rem and 3px the 116
  // India dots fused into one grey blot that read as a printing fault. Thinned,
  // the same 116 dots read as what they are: a dense cluster with countable
  // edges. Still exactly one dot per listed company; nothing is sampled away.
  for (const [name, , lat, lon, eu] of PLATE) {
    const n = listedIn([name]);
    for (let k = 0; k < n; k++) {
      // European dots carry their window's class: at a hand's width the band
      // is too compressed for them to read as anything but specks, and the
      // inset — its own full-width panel there — restates the same companies
      // at legible scale, so the CSS drops them from the band alone (52rem).
      const d = el('span', 'cdot' + (eu ? ' eu' : ''));
      const r = 0.125 * Math.sqrt(k), a = k * 2.39996;
      d.style.left = `calc(${px(lon).toFixed(2)}% + ${(r * Math.cos(a)).toFixed(2)}rem)`;
      d.style.top = `calc(${py(lat).toFixed(2)}% + ${(r * Math.sin(a)).toFixed(2)}rem)`;
      main.append(d);
    }
  }
  // Europe, enlarged in the inset. Round 10 also framed the source region on
  // the main band; with every European marker living in the inset that frame
  // enclosed nothing but graticule — an empty rectangle in the band's top-left
  // corner, apparatus pointing at no content. It is gone, and the inset says
  // in its own label which window it enlarges, which is all the frame said.
  const inset = el('div', 'inset');
  inset.append(el('span', 'ilabel', t('chart.eu')));
  // Round 4: the inset draws the graticule it claims. A framed box titled
  // 12°W–27°E holding floating chips was cartography by assertion; two
  // meridians and two parallels, labelled in the band's own voice, make
  // every position inside checkable against the frame.
  for (const lon of [0, 15]) {
    const m = el('span', 'mer');
    m.style.left = ex(lon).toFixed(2) + '%';
    const l = el('span', 'gl', lon === 0 ? '0°' : `${lon}°E`);
    l.style.left = ex(lon).toFixed(2) + '%';
    l.style.bottom = '0';
    inset.append(m, l);
  }
  for (const lat of [60, 45]) {
    const p = el('span', 'par');
    p.style.top = ey(lat).toFixed(2) + '%';
    const l = el('span', 'gl', `${lat}°N`);
    l.style.top = `calc(${ey(lat).toFixed(2)}% - 10px)`;
    l.style.right = '2px';
    inset.append(p, l);
  }
  for (const c of PLATE) {
    const [, , lat, lon, eu] = c;
    (eu ? inset : main).append(
      marker(c, eu ? ex(lon) : px(lon), eu ? ey(lat) : py(lat)));
  }
  // The index strip: Plate 01 — the whole atlas — as a working button, and
  // beside it the band's own instruction. This is the two-second answer to
  // "is the map clickable": a strip that says so, over chips framed like
  // the buttons they are.
  const strip = el('button', 'p01');
  strip.id = 'p01';
  strip.type = 'button';
  strip.append(el('span', 'lft'), el('span', 'hint'));
  strip.addEventListener('click', () => {
    activeCountry = null;
    render();
  });
  $('#plate').replaceChildren(strip, main, inset);
  // The sixteen-plate index the status control opens: one line per country
  // plate — number · code · name · anchor · count — every line a door. The
  // same navigation the chart's chips carry, restated as type, for the
  // reader who wants the list rather than the map.
  $('#pindex').replaceChildren(...PLATE.map(([name, code, lat, lon]) => {
    const n = listedIn([name]);
    const b = el('button', 'pirow' + (n ? '' : ' nil'));
    b.type = 'button';
    b.append(el('span', 'pino', plateNo(name)),
             el('span', 'pico', code),
             el('span', 'pinm', cname(name)),
             el('span', 'picd', dms(lat, lon)),
             el('span', 'pict', count(n)));
    b.setAttribute('aria-label', t('mk.aria',
      { no: plateNo(name), country: cname(name), n: pl('n.company', n) }));
    b.addEventListener('click', () => goCountry(name));
    return b;
  }));
}

// Every country marker on the chart, wherever it lives (main band or inset).
const markers = () => document.querySelectorAll('#plate .mk');

// The plate preview (styles above). Presentation only — it reads the rendered
// rows and touches no filter state, so wandering the plate can never change
// what a click would have shown.
function preview(name, on) {
  for (const row of document.querySelectorAll('#index .irow, #spread .irow')) {
    const here = (row.dataset.countries || '').split('|').includes(name);
    row.classList.toggle('ghost', on && !here);
    row.classList.toggle('held', on && here);
  }
}

// Turning the page: a chip is a door into its country's plate, and the open
// chip is a toggle — clicking the plate already open turns back to Plate 01,
// so the chart alone can walk everywhere. There is no other navigation.
function goCountry(name) {
  activeCountry = activeCountry === name ? null : name;
  render();
}

// One role: what it's called, where it is, how it's worked, and what its posting
// said about hiring from abroad. The title IS the apply link -- a separate
// "apply" button beside it would be two controls for one destination.
function roleItem(r, q) {
  // The searched-for title prints red — the register line's "matches 2 roles"
  // and the two lines it counts, said at both scales (T5.4).
  const item = el('li', q && r.title.toLowerCase().includes(q) ? 'hit' : null);
  // The title and its places are the board's own words and stay in them.
  item.append(link(r.url, r.title), el('span', 'loc', ` — ${placeLine(r.locations, 4)}`));
  // Absent is absent: 822 of 1,112 published India roles state no workplace at
  // all (Greenhouse never does), so a missing badge means "not stated", not
  // "on-site". The openness badges below follow the same rule, for the same
  // reason and at ten times the scale.
  if (WORKPLACE[r.workplace]) {
    item.append(el('span', 'tag workplace', t(WORKPLACE[r.workplace])));
  }
  for (const field of ['visa', 'hire_from_abroad']) {
    const said = OPENNESS[field][r[field]];        // undefined where it said nothing
    if (said) item.append(el('span', `tag ${said[0]}`, t(said[1])));
  }
  return item;
}

// One index line: merged reference (row index · plate coordinate), the name
// with its places beneath, and the count in red. The line is a button into
// the sheet — the index is the master, the gazetteer entry the detail.
function indexRow(c, repeated, hits) {
  const reqs = c.roles.length;
  const ref = REFS[c.name] || '—';
  // Round 11: one anatomy for every line. Round 10 ran entries under five
  // roles in on a single line and stacked the rest, so the register changed
  // shape partway down and the continuation spread's three columns stopped
  // scanning as columns. A register whose rows are not the same shape is not
  // a register.
  const button = el('button', 'irow');
  button.type = 'button';
  button.dataset.countries = c.countries.join('|');   // the plate preview reads this
  button.dataset.ref = ref;                           // the row's own citation
  // Atlas index discipline (render() computes `repeated`): the coordinate's
  // ink prints only where the reference CHANGES from the line above — B3 a
  // hundred times is wallpaper — but the value stays in the markup on every
  // line for hover, selection, and the pointer's title.
  const iref = el('span', 'iref', ref + '·');
  // Round 3: the citation resolves, like a real atlas index. Each country
  // code in the gutter is a live cross-reference — clicking ·GB turns the
  // page to Plate 03 with this company held — so the apparatus stops being
  // decoration the moment a reader tests it.
  const igr = el('span', repeated ? 'igr same' : 'igr');
  const pairs = c.countries.map((x) => [x, CODE[x]]).filter(([, cd]) => cd);
  pairs.slice(0, 2).forEach(([nation, cd], i) => {
    if (i) igr.append('·');
    const cite = el('span', 'igc', cd);
    cite.dataset.country = nation;
    cite.title = t('cite.title', { no: plateNo(nation), country: cname(nation) });
    igr.append(cite);
  });
  if (pairs.length > 2) igr.append('+');
  iref.append(igr);
  iref.title = cnames(c.countries);
  const namecell = el('span', 'iname', c.name);
  // The places, set as a registry entry rather than as prose: the list holds
  // one line and elides where it must, and the "+N" saying how many more is
  // its own cell so the ellipsis can never eat the count. A company hiring in
  // six places used to wrap three lines deep in the index; nothing is dropped
  // here either -- the entry opens with all of them.
  // Round 3: the index line speaks in city names — "Jakarta", never
  // "Jakarta, Ind…". An ellipsis and a "+N" both saying "there's more" was
  // the row double-signalling; short tokens let +N carry the count alone.
  // The gazetteer entry keeps every place in full.
  // Round 4: ONE truncation grammar. The register used to speak two — "+N"
  // in the wide index, a CSS ellipsis in the narrow spread columns — so
  // fitPlaces() now measures each line where it actually sits and drops
  // whole places into the +N count until what remains fits. The full list
  // rides in the dataset; the gazetteer entry still prints every place.
  const places = [...new Set(wherePieces(c)
    .map((p) => p.includes('—') ? p : p.split(',')[0].trim()))];
  if (places.length) {
    const cell = el('span', 'iwhere');
    cell.dataset.places = places.join('|');
    cell.append(el('span', 'ipl', places.join(' · ')), el('span', 'ipn', ''));
    namecell.append(cell);
  }
  // T5.4: the search's receipt. A term that matched role titles rather than
  // the company name leaves the row otherwise unexplained, so the count cell
  // says how many titles it is in — printed only while a term is in the box.
  const reqcell = el('span', 'ireqs', pl('n.role', reqs));
  const said = hits ? t('row.hits', { n: pl('n.role', hits) }) : '';
  if (said) reqcell.append(el('span', 'ihit', said));
  button.append(iref, namecell, reqcell);
  button.setAttribute('aria-label', said
    ? t('row.aria.hits', { name: c.name, n: pl('n.role', reqs), hits: said })
    : t('row.aria', { name: c.name, n: pl('n.role', reqs) }));
  // Live cartography: pointing at an index line lights its cell(s) on the
  // masthead plate, so the static index up top answers the line under the
  // cursor. Presentation only — no filter state changes on hover.
  const light = (on) => {
    for (const cell of markers()) {
      if (c.countries.includes(cell.dataset.country)) cell.classList.toggle('lit', on);
    }
  };
  button.addEventListener('mouseenter', () => light(true));
  button.addEventListener('mouseleave', () => light(false));
  button.addEventListener('click', (ev) => {
    selectedName = c.name;
    wantScroll = true;
    // A click on a gutter citation turns the page as well as opening the
    // entry; anywhere else on the line only opens the entry.
    const cite = ev.target.closest('.igc');
    if (cite) activeCountry = cite.dataset.country;
    render();
  });
  return button;
}

// One ROLE line, set in the index's own anatomy: the same three columns as
// indexRow, so switching the register's unit never changes the shape of a line.
// The reference gutter cites the role's OWN countries, not its company's — a
// London job under a company also hiring in Tokyo prints ·GB and nothing else,
// which is the rule inScope follows one level up.
function roleRow(c, r, repeatedCo) {
  const ref = REFS[c.name] || '—';
  const row = el('div', 'irow jrow');
  row.dataset.countries = r.countries.join('|');   // the plate preview reads this
  row.dataset.ref = ref;
  const iref = el('span', 'iref', ref + '·');
  const igr = el('span', 'igr');
  r.countries.map((x) => [x, CODE[x]]).filter(([, cd]) => cd).slice(0, 2)
    .forEach(([nation, cd], i) => {
      if (i) igr.append('·');
      const cite = el('span', 'igc', cd);
      cite.dataset.country = nation;
      cite.title = t('cite.title', { no: plateNo(nation), country: cname(nation) });
      // The company line resolves its citations through the row button's own
      // handler; this row is not a button, so each citation carries its own.
      cite.addEventListener('click', () => { activeCountry = nation; render(); });
      igr.append(cite);
    });
  iref.append(igr);
  iref.title = cnames(r.countries);
  const namecell = el('span', 'iname');
  namecell.append(link(r.url, r.title));
  // Absent is absent, the rule roleItem states at the other scale: 822 of the
  // published India roles state no workplace at all, so a missing badge means
  // the board did not say — never "on-site".
  if (WORKPLACE[r.workplace]) {
    namecell.append(el('span', 'tag workplace', t(WORKPLACE[r.workplace])));
  }
  // T15.2 — the new badge, and both halves of the condition are load-bearing.
  // `confirmed` says we read this company's board on the previous snapshot as
  // well as this one, so a URL that was not there and now is really did appear;
  // without it the badge would be worn by every role of every company we simply
  // could not check last night, which is 176 of the 179 changes SPEC measured on
  // 2026-08-01. `freshlySeen` says it happened this week. A role with no entry,
  // an unconfirmed one and an old one all render nothing at all: absence stays
  // absence, and there is no "old" badge for the same reason there is no "not
  // hiring" one.
  const seen = FIRSTSEEN.get(r.url);
  if (seen && seen.confirmed && freshlySeen(seen)) {
    const badge = el('span', 'tag fresh', t('tag.new'));
    badge.title = t('tag.new.title', { date: fmtDate(seen.date) });
    namecell.append(badge);
  }
  // The role's own locations, never the company's city list: `cities` is a
  // build-level India fact attached to a COMPANY, and printing it under one of
  // its roles would place a job in a city no posting named.
  const places = canonPlaces(r.locations);
  if (places.length) {
    const cell = el('span', 'iwhere');
    cell.dataset.places = places.join('|');
    cell.append(el('span', 'ipl', places.join(' · ')), el('span', 'ipn', ''));
    namecell.append(cell);
  }
  // The index discipline, one column over. The register is sorted by open roles
  // and Databricks holds 295 of them, so the roles view printed the same
  // company name in ink on 295 consecutive lines — the exact wallpaper the
  // gutter's coordinate was quieted to avoid, at eleven times the scale, and it
  // made three hundred lines look like one undifferentiated block.
  //
  // So the name takes ink where the company CHANGES and the margin's grey where
  // it repeats. Nothing is dropped: the text is still there, still a button,
  // still announced in full — the eye simply gets a mark at every company
  // boundary, and the scroll gains the rhythm it had no way to show.
  const cobtn = el('button', 'ireqs cobtn' + (repeatedCo ? ' same' : ''), c.name);
  cobtn.type = 'button';
  cobtn.setAttribute('aria-label', t('row.co.aria', { name: c.name }));
  cobtn.addEventListener('click', () => {
    selectedName = c.name;
    wantScroll = true;
    render();
  });
  const light = (on) => {
    for (const cell of markers()) {
      if (r.countries.includes(cell.dataset.country)) cell.classList.toggle('lit', on);
    }
  };
  row.addEventListener('mouseenter', () => light(true));
  row.addEventListener('mouseleave', () => light(false));
  row.append(iref, namecell, cobtn);
  return row;
}

// The inset locator map: the masthead chart reprinted at thumbnail size —
// the same projection, every anchor a faint dot, this company's country
// dot(s) in red. Apparatus, never content — it is aria-hidden and the
// coordinate stamp beside it states the fact aloud.
function locator(countries) {
  const map = el('span', 'locator');
  map.setAttribute('aria-hidden', 'true');
  const eq = el('span', 'leq');
  eq.style.top = py(0).toFixed(2) + '%';
  map.append(eq);
  for (const lon of [0, 60, 120, 180]) {
    const m = el('span', 'lmer');
    m.style.left = px(lon).toFixed(2) + '%';
    map.append(m);
  }
  for (const [name, , lat, lon] of PLATE) {
    const d = el('span', countries.includes(name) ? 'ld on' : 'ld');
    d.style.left = px(lon).toFixed(2) + '%';
    d.style.top = py(lat).toFixed(2) + '%';
    map.append(d);
  }
  return map;
}

// The sheet's berth: its own column on wide screens; directly under the
// selected index line on narrow ones, where a second column cannot exist —
// and directly under a selected SPREAD line at any width, spanning the
// spread's columns, so the entry opens where the reader is.
const narrow = matchMedia('(max-width: 62rem)');
function placeSheet(rowEl) {
  const inSpread = !!(rowEl && rowEl.closest('#spread'));
  if (rowEl && (narrow.matches || inSpread)) rowEl.after(SHEET);
  else $('#board').append(SHEET);
  // With the sheet berthed in the spread, the board's right column would be
  // sixteen rows of dead paper — the board closes to one full-measure column.
  $('#board').classList.toggle('nosheet', inSpread && !narrow.matches);
}
// Crossing the fold's own breakpoint re-renders: the sheet re-berths and the
// hand-fold appears or unfolds at the measure the reader is actually at.
narrow.addEventListener('change', () => render());

// One gazetteer entry, filed on the sheet. The same facts and the same
// honest-absence rules as every round: an absent description, salary, or
// registration renders nothing at all.
function entry(c, q) {
  const reqs = c.roles.length;

  const meta = el('p', 'entrymeta');
  // The entry cites its STABLE register ref — the number the index line
  // carries under every sort — never its position in today's ordering.
  meta.append(
    el('span', 'micro', t('e.gaz',
      { ref: REFS[c.name] || '—', n: count(companies.length) })),
    el('span', 'micro', t('e.ref', { ref: gridref(c.countries) })));

  const head = el('div', 'plateline');
  const refbox = el('div', 'sheetref');
  refbox.append(el('span', 'sc', gridref(c.countries)));
  // The coordinate stamp: the country's chart anchor, in degrees and minutes.
  // An anchor places a marker on the chart, never an office — the footer says
  // so — and a second country prints as "+", a count, not a claim.
  const cd = COORD[c.countries[0]];
  if (cd) {
    refbox.append(el('span', 'scoord',
      dms(cd[0], cd[1]) + (c.countries.length > 1 ? ' +' : '')));
  }
  refbox.append(el('span', 'sn', cnames(c.countries)));
  // The reciprocal citation (round 3): the index's ·GB resolves to this
  // sheet, so the sheet answers back — every plate the company is filed
  // under, as working cross-references. Only multi-plate entries carry the
  // line; a single country is already said above. The full country list
  // comes from the unscoped register — a UK view must still cite India.
  const filedIn = (companies.find((x) => x.name === c.name) || c).countries;
  if (filedIn.length > 1) {
    const fu = el('p', 'filed');
    fu.append(el('span', 'fk micro', t('e.filed')));
    for (const nation of filedIn) {
      const b = el('button', 'fplate' + (activeCountry === nation ? ' here' : ''));
      b.type = 'button';
      b.textContent = `${t('plate.n', { n: plateNo(nation) })} · ${CODE[nation] || nation}`;
      b.title = activeCountry === nation
        ? t('e.here', { country: cname(nation) })
        : t('cite.title', { no: plateNo(nation), country: cname(nation) });
      b.addEventListener('click', () => {
        selectedName = c.name; activeCountry = nation; wantScroll = true; render();
      });
      fu.append(b);
    }
    refbox.append(fu);
  }
  // The verification receipt (round 5): the sheet's right half was the page's
  // one dead zone, sitting under its strongest claim — "proven by the board,
  // not by a claim" — with no per-entry evidence. The receipt is that
  // evidence, struck like a customs stamp: the board we read, the snapshot we
  // read it on, the build report's verdict, the roles we counted, and the
  // corpus arithmetic that admitted the company. Every line is a fact the
  // build wrote; the lines it did not write (fetch time, HTTP code) do not
  // print at all — honest absence, applied to ourselves.
  const rcpt = el('aside', 'receipt');
  rcpt.setAttribute('aria-label', t('e.rcpt.aria'));
  const rhead = el('p', 'rhead');
  rhead.append(el('span', null, t('e.rcpt.head')),
               el('span', 'rno', `№ ${REFS[c.name] || '—'}`));
  rcpt.append(rhead);
  const rrow = (k, v) => {
    const p = el('p', 'rrow');
    const val = el('span', 'rv');
    if (typeof v === 'string') val.textContent = v; else val.append(v);
    p.append(el('span', 'rk', k), val);
    rcpt.append(p);
  };
  // The board address breaks before its slug, never inside a word — a
  // receipt that prints "datab / ricks" reads as a typo, not a fact.
  const bhost = BOARDS[c.ats]
    ? BOARDS[c.ats].replace(/^https?:\/\//, '').replace(/\/$/, '') : c.ats;
  const bval = el('span');
  bval.append(el('span', null, bhost), document.createElement('wbr'),
              el('span', null, '/' + c.slug));
  rrow(t('e.rcpt.board'), bval);
  rrow(t('e.rcpt.read'), snapshot ? fmtDate(snapshot, true) : '—');
  // The build's own verdict on this company, from the report — absent report,
  // absent line. A verdict this page has no wording for prints the report's own
  // word rather than being rounded to the nearest one it does.
  const verdict = BUILDREP && BUILDREP.companies
    ? BUILDREP.companies[c.name] : null;
  if (verdict) rrow(t('e.rcpt.verdict'),
    verdict === 'listed' ? t('e.rcpt.listed') : verdict);
  rrow(t('e.rcpt.roles'), t('e.rcpt.onboard', { n: count(c.total || reqs) })
    + (c.total > reqs ? t('e.rcpt.scope', { n: count(reqs) }) : ''));
  if (BUILDREP && BUILDREP.checked != null && BUILDREP.corpus_size != null) {
    rrow(t('e.rcpt.corpus'), t('e.rcpt.corpusv',
      { n: count(BUILDREP.checked), m: count(BUILDREP.corpus_size) })
      + (BUILDREP.counts && BUILDREP.counts.listed != null
         ? t('e.rcpt.listedn', { n: count(BUILDREP.counts.listed) }) : ''));
  }
  const ledger = el('a', null, t('e.rcpt.ledgerv'));
  ledger.href = '../data/build-report.json';
  rrow(t('e.rcpt.ledger'), ledger);
  head.append(locator(c.countries), refbox, rcpt);

  const body = el('div', 'detail');
  // Three absences in one line ("undisclosed · not stated · not stated") is
  // honest but reads as noise, so the fully-dark case collapses to one clause.
  // Any single known fact brings back the full line, absences said per-field.
  const dark = c.amount == null && !c.round_letter && !c.date;
  const funding = el('p', null, dark ? t('e.dark')
    : t('e.funding', { money: money(c), round: round(c), date: when(c) }));
  funding.append(link(c.source_url, t('e.fundsrc')));
  // Under a country view the row shows that country's roles, so it says so
  // rather than letting the reader find the other twelve on the board and
  // conclude the site cannot count.
  const board = el('p', null,
    t('e.board', { n: pl('n.role', reqs), where: where(c) })
    + (c.total > reqs ? t('e.board.of', { n: count(c.total) }) : '') + ' · ');
  board.append(BOARDS[c.ats]
    ? link(BOARDS[c.ats] + c.slug, `${c.ats}/${c.slug}`)
    : el('span', null, `${c.ats}/${c.slug}`));

  // A 75-role board must not bury the atlas: the list opens at eight and states
  // the remainder as a count in red. One click shows every role — nothing is
  // withheld, only folded — and short lists never grow the extra control.
  const roles = el('ul', 'roles');
  // Under a search the matching titles lead the list. The list folds at eight,
  // and a company with a 236-role board can easily hold its ten matches past
  // the fold — so a mark nobody scrolls to is a mark that does not explain
  // anything. Ordering, not filtering: every role is still here, and the list
  // returns to the board's own order the moment the box is empty.
  const shownRoles = q
    ? [...c.roles].sort((a, b) => Number(b.title.toLowerCase().includes(q))
                                - Number(a.title.toLowerCase().includes(q)))
    : c.roles;
  const items = shownRoles.map((r) => roleItem(r, q));
  const CAP = 8;
  if (items.length > CAP + 2) {
    for (const li of items.slice(CAP)) li.hidden = true;
    const fold = el('li', 'more');
