    const btn = el('button', 'morebtn',
      t('e.more', { n: count(items.length - CAP) }));
    btn.type = 'button';
    btn.addEventListener('click', () => {
      for (const li of items) li.hidden = false;
      fold.remove();
    });
    fold.append(btn);
    roles.append(...items, fold);
  } else {
    roles.append(...items);
  }
  // The description leads the detail -- what the company is, before where it
  // hires. Only for companies with an entry; the rest start at the board line.
  const said = DESCRIPTIONS[c.name];
  const desc = said ? descBlock(said) : null;
  if (desc) body.append(desc);
  body.append(board, roles, funding);
  if (c.salary) body.append(salaryLine(c.salary));
  if (c.mca) body.append(registrationLine(c.mca));
  if (c.uk) body.append(ukRegistrationLine(c.uk));
  body.append(el('p', null,
    t('e.qualified', { rule: t(RULES[c.qualified_by] || 'rule.stage') })));

  SHEET.replaceChildren(meta, head, el('h2', null, c.name), body);
}

function render() {
  const covers = scope();
  // Round 4: turning a page is FELT. Whenever the open plate changes, one red
  // rule wipes left-to-right across the register in 150ms — the folio's
  // page-turn, drawn in the page's own hairline voice. Presentation only;
  // reduced-motion readers get an instant turn (CSS).
  const pn = plateNo(activeCountry);
  if (pn !== lastTurn) {
    lastTurn = pn;
    document.querySelector('.sweep')?.remove();
    const s = el('span', 'sweep');
    s.addEventListener('animationend', () => s.remove());
    document.querySelector('main').append(s);
  }
  // The plate index closes when a page turns: an index is Plate 01's margin,
  // and a turned plate already states where it is.
  if (activeCountry) indexOpen = false;
  $('#pindex').hidden = !indexOpen;
  // The chart states the open plate: the open chip turns red, and a red
  // crosshair spans the band (or the inset, for a European plate) through
  // its anchor. Under Plate 01 no chip lights and no crosshair is drawn —
  // a chart entirely on would be a highlight meaning nothing.
  // The band's height states the page: Plate 01 compressed (an index of
  // mostly-zero markers earns no more), a turned plate at full working scale.
  $('#plate').classList.toggle('turned', !!activeCountry);
  for (const cell of markers()) {
    const on = activeCountry != null && covers.includes(cell.dataset.country);
    cell.toggleAttribute('data-on', on);
    cell.setAttribute('aria-pressed', String(on));
  }
  for (const arm of document.querySelectorAll('#plate .xh')) arm.remove();
  if (activeCountry) {
    const p = PLATE.find((x) => x[0] === activeCountry);
    if (p) {
      const [, , lat, lon, eu] = p;
      const box = document.querySelector(eu ? '#plate .inset' : '#plate .chartmain');
      const h = el('span', 'xh h'), v = el('span', 'xh v');
      h.style.top = (eu ? ey(lat) : py(lat)).toFixed(2) + '%';
      v.style.left = (eu ? ex(lon) : px(lon)).toFixed(2) + '%';
      box.append(h, v);
    }
  }
  // The header restamps, the way an atlas page carries its number: the strip
  // and the masthead stamp both say which plate is open.
  $('#pnum').textContent = t('plate.n', { n: plateNo(activeCountry) });
  $('#pname').textContent = activeCountry
    ? `${cname(activeCountry)} — ${CODE[activeCountry]}`
    : t('plate.world');
  const strip = $('#p01');
  if (strip) {
    strip.setAttribute('aria-pressed', String(!activeCountry));
    const lft = strip.querySelector('.lft'), hint = strip.querySelector('.hint');
    lft.replaceChildren();
    const p01 = t('plate.n', { n: '01' });
    if (activeCountry) {
      lft.append(el('span', null, t('p01.return')),
                 el('span', 'no', p01),
                 el('span', null, t('p01.allc')));
      hint.textContent = t('p01.hint.open',
        { n: plateNo(activeCountry), country: cname(activeCountry) });
    } else {
      lft.append(el('span', 'no', p01), el('span', null, t('p01.index')));
      hint.textContent = t('p01.hint.idx');
    }
    strip.setAttribute('aria-label',
      t(activeCountry ? 'p01.aria.return' : 'p01.aria.open'));
  }
  // The MCA filter follows the India-only enrichment it reads: on a plate with
  // no India in it, it is hidden AND cleared here, because a filter holding a
  // value while invisible is a plate that silently shows nothing and gives the
  // reader no control to blame. (The city filter left this class in T5.4 — it
  // is every plate's now, rebuilt from the plate's own roles below.)
  for (const label of document.querySelectorAll('#controls .india-only')) {
    label.hidden = !covers.includes('India');
    if (label.hidden) label.querySelector('select').value = 'any';
  }

  const q = $('#q').value.trim().toLowerCase();
  const recency = $('#recency').value;
  const here = companies.map((c) => inScope(c, covers)).filter(Boolean);

  // ---- the two derived selects, rebuilt for the open plate ----
  // Both are built from `here` and not from the filtered set: a list of options
  // that shrank as you used the other filters would be a control describing
  // itself rather than the plate. Both keep the reader's value where the new
  // plate still offers it, and clear it where it does not — an invisible filter
  // is one nobody can clear (the same rule the MCA control follows above).
  const fill = (sel, opts, head) => {
    // The signature carries the LABELS, not just the values: a department
    // option states a count, and two plates can hold the same departments at
    // different counts — signed on values alone, the second plate would print
    // the first one's numbers.
    const sig = opts.map((o) => o.join('␀')).join('|');
    if (sel.dataset.sig === sig) return;
    const was = sel.value;
    sel.replaceChildren(el('option', null, head), ...opts.map(([v, label]) => {
      const o = el('option', null, label);
      o.value = v;
      return o;
    }));
    sel.options[0].value = 'any';
    sel.value = opts.some(([v]) => v === was) ? was : 'any';
    sel.dataset.sig = sig;
  };
  // The city list. India's cities are the build's; every other plate's are
  // parsed off its own roles (see cityOf). Under Plate 01 the list runs across
  // all fifteen, so each place carries the plate code it was read from — 121
  // bare city names spanning a continent would be a list, not an index.
  const cityHome = new Map();
  for (const c of here) {
    for (const place of c.cities) if (!cityHome.has(place)) cityHome.set(place, 'India');
    for (const r of c.roles) {
      for (const place of roleCities(r)) {
        if (!cityHome.has(place)) cityHome.set(place, r.countries[0]);
      }
    }
  }
  // Sorted by the EDITION's collation, not by ASCII: a Spanish reader expects
  // ñ after n and a German one expects ö beside o, and localeCompare with no
  // locale argument sorts by whatever the machine happens to be set to.
  const cityOpts = uniqCased([...cityHome.keys()])
    .sort((a, b) => a.localeCompare(b, LOCALE))
    .map((place) => [place, activeCountry || !CODE[cityHome.get(place)]
      ? place : `${place} · ${CODE[cityHome.get(place)]}`]);
  fill($('#city'), cityOpts, t('f.city.any'));
  // A plate whose postings never name a city leaves the row, the way the
  // openness control does at zero yield: Singapore's boards say "Singapore,
  // Singapore" and nothing finer, and a select holding one option that filters
  // nothing is furniture. The fact prints below instead.
  const citySel = $('#city');
  citySel.closest('label').hidden = !cityOpts.length;
  if (!cityOpts.length && citySel.value !== 'any') citySel.value = 'any';
  // The department list, each option stating what it would return. Ordered by
  // weight rather than alphabetically — the register is sorted by mass and so
  // is this — with Unclassified last, always present when it has anything in
  // it, so the derivation's limits are a line on the page rather than a gap.
  const deptN = new Map();
  // Counted beside the options, because the note under the bank has to say how
  // many of these labels are our reading of a title and how many are the board's
  // own word (T9.2). Two passes over the same roles would be two chances to
  // disagree with the list they are describing.
  const deptFrom = { title: 0, board: 0, neither: 0 };
  for (const c of here) {
    for (const r of c.roles) {
      const d = deptOf(r);
      deptN.set(d, (deptN.get(d) || 0) + 1);
      deptFrom[deptSource(r)] += 1;
    }
  }
  // The department NAMES are this page's own taxonomy (the DEPTS table), not a
  // board's word, so they are apparatus and the edition sets them. The value
  // stays the English key — it is what `deptOf` compares against, and a filter
  // whose value changed with the edition would drop the reader's choice every
  // time they turned the volume into another language.
  const deptOpts = [...deptN].filter(([d]) => d !== UNCLASSIFIED)
    .sort((a, b) => b[1] - a[1] || t(`dept.${a[0]}`).localeCompare(t(`dept.${b[0]}`), LOCALE));
  if (deptN.has(UNCLASSIFIED)) deptOpts.push([UNCLASSIFIED, deptN.get(UNCLASSIFIED)]);
  fill($('#dept'), deptOpts.map(([d, n]) =>
    [d, t('f.dept.opt', { dept: t(`dept.${d}`), n: pl('n.role', n) })]),
    t('f.dept.any'));
  const city = $('#city').value;
  const dept = $('#dept').value;

  // The fold's tally: how many filters are set while the bank is shut. Sort
  // and search are excluded — one always has a value, the other stays visible.
  // Read AFTER the rebuild above, never before: a plate that no longer offers
  // last plate's city has just cleared it, and a tally taken first would count
  // a filter that is no longer set.
  const set = ['city', 'dept', 'remote', 'openness', 'mca', 'bracket', 'recency']
    .filter((id) => { const n = document.getElementById(id);
                      return !n.closest('label').hidden && n.value !== 'any'; })
    .length;
  $('#fcount').textContent = set ? t('f.set', { n: count(set) }) : '';
  // A departed filter shows its state on the control itself: red until
  // cleared. Sort always has a value and never reddens.
  for (const n of document.querySelectorAll('#controls select')) {
    n.classList.toggle('set', n.id !== 'sort' && n.value !== 'any');
  }
  $('#q').classList.toggle('set', !!$('#q').value.trim());
  // T15.2 — the Newest sort withdraws, on the openness control's rule (round 5)
  // and the MCA control's: a control that cannot work leaves the row rather than
  // sitting disabled, and clears itself on the way out, because a sort holding a
  // value while invisible orders the register by something nobody can see.
  //
  // Two ways it cannot work, and they are different facts. In the COMPANY
  // register there is nothing role-shaped to order — the other four sorts are
  // company facts and this one is not. And with no artifact loaded (it is
  // optional, and a build predating the backfill has none) there is no date to
  // read. Read here rather than at the sort itself, which is thirty lines below
  // and would then be ordering by a control it had just hidden.
  const roleView = view === 'roles';
  const sortable = roleView && FIRSTSEEN.size > 0;
  const sortSel = $('#sort');
  sortSel.querySelector('option[value="newest"]').hidden = !sortable;
  if (!sortable && sortSel.value === 'newest') sortSel.value = 'reqs';
  // The openness control's one non-default option states its own yield for
  // the open plate, before the click: 92% of postings say nothing (note 03),
  // so zero is this filter's common answer. Round 5: at zero the control
  // LEAVES THE ROW — round 4's disabled select was honest but spent a prime
  // filter slot on permanent furniture. Its fact now prints as a one-line
  // apparatus note under the bank, and the control returns the moment a
  // plate has a nonzero bucket. The count ignores the other filters — it is
  // what this option ALONE would show here.
  const openN = here.filter(opensToForeignHires).length;
  const openSel = $('#openness');
  openSel.options[1].textContent = t('f.foreign.yesn', { n: count(openN) });
  const fchip = $('#fchip');
  const notes = [];
  if (!openN) {
    if (openSel.value !== 'any') openSel.value = 'any';
    openSel.closest('label').hidden = true;
    notes.push(t('note.foreign.out', { scope: scopeName() }));
  } else {
    openSel.closest('label').hidden = false;
  }
  if (!cityOpts.length) notes.push(t('note.city.out', { scope: scopeName() }));
  // T5.4, the coverage notes. RAISED and FUNDED filter on fields most of the
  // register does not state — 36 of 322 companies at this snapshot — so a
  // reader who sets one watches nine tenths of the page leave and has no way
  // to know it left over a silence. The numbers are counted here, off the open
  // plate, every render: a hardcoded pair would be a claim about a build that
  // has since moved. The line prints only while the filter is set.
  const covered = (label, has, field) => {
    const n = here.filter(has).length;
    notes.push(t('note.covered', { label: t(label), n: count(n),
      m: pl('n.company', here.length), field: t(field) }));
  };
  if ($('#bracket').value !== 'any') covered('f.raised', (c) => c.amount != null, 'note.amount');
  if (recency !== 'any') covered('f.funded', (c) => !!c.date, 'note.date');
  // And the department's provenance, said where it is being used rather than
  // only in the footer: the classification is ours, read off the title, and
  // the two numbers say how much of this plate it could place.
  if (dept !== 'any') {
    const all = here.reduce((n, c) => n + c.roles.length, 0);
    notes.push(t('note.dept', { all: count(all), title: count(deptFrom.title),
      board: count(deptFrom.board) }));
  }
  fchip.replaceChildren(...notes.map((t) => el('p', 'fnote', t)));
  fchip.hidden = !notes.length;

  // The department filter cuts at ROLE level, before anything counts: a company
  // stays on the register while one of its roles is in the department, and the
  // row, the entry and every count then speak about those roles alone — the
  // same rule a country plate follows (inScope), applied to a second axis.
  const listed = dept === 'any' ? here : here.map((c) => {
    const roles = c.roles.filter((r) => deptOf(r) === dept);
    return roles.length ? { ...c, roles } : null;
  }).filter(Boolean);
  // T5.4: the search reads role titles as well as company names. `hits` is how
  // many of the company's roles IN VIEW carry the term — the number the row
  // prints to say why it is here.
  const hits = (c) => (q ? c.roles.filter((r) => r.title.toLowerCase().includes(q)).length : 0);
  const shown = listed
    .filter((c) => !q || c.name.toLowerCase().includes(q) || hits(c) > 0)
    .filter((c) => city === 'any' || c.cities.includes(city)
                || c.roles.some((r) => roleCities(r).includes(city)))
    .filter((c) => $('#remote').value === 'any' || isRemote(c))
    .filter((c) => $('#openness').value === 'any' || opensToForeignHires(c))
    .filter((c) => $('#mca').value === 'any' || c.mca != null)
    .filter(brackets[$('#bracket').value])
    .filter((c) => recency === 'any' || (c.date != null && days(c.date, snapshot) <= +recency))
    .sort(sorts[$('#sort').value]);

  // ---- the register's unit: one line per role, or one per company ----
  // The plate and the department already cut at ROLE level (inScope, `listed`
  // above), so the flatten re-applies only the controls a company could have
  // satisfied through a DIFFERENT role than the one being printed. A
  // remote-filtered ROLE list showing the on-site jobs of a company with one
  // remote opening elsewhere would be the register answering a question nobody
  // asked — the same fault inScope exists to prevent one level up.
  const remote = $('#remote').value;
  const openness = $('#openness').value;
  const roleRows = [];
  if (roleView) {
    for (const c of shown) {
      for (const r of c.roles) {
        // A company-name match shows that company's roles: a reader searching
        // "Stripe" is asking for Stripe's jobs, not for jobs called Stripe.
        if (q && !r.title.toLowerCase().includes(q)
              && !c.name.toLowerCase().includes(q)) continue;
        // The city is read off the ROLE's own locations. A company matched by
        // the build's India city list can hold roles in three other cities, and
        // this filter may not put a job somewhere no posting named it.
        if (city !== 'any' && !roleCities(r).includes(city)) continue;
        if (remote !== 'any' && r.workplace !== 'remote') continue;
        if (openness !== 'any' && r.visa !== 'yes' && r.hire_from_abroad !== 'yes') continue;
        roleRows.push({ c, r });
      }
    }
  }
  // The roles keep their company's rank, and their board's order within it. The
  // four original sort controls are all COMPANY facts — open roles, amount,
  // date, name — so ordering 6,422 roles by one of them is ordering the company
  // blocks they sit in; re-sorting the roles themselves would claim an order the
  // data has no field for.
  //
  // T15.2 gave it one field: first_seen is a fact about a ROLE, so Newest is the
  // one sort that has to reach past the company blocks and order the flattened
  // list itself. Undated roles sort last and are never dated to force it — an
  // absence sorted as an old date would be the register inventing the fact it
  // exists to avoid. The sort is stable, so roles sharing a date keep the
  // canonical company order underneath.
  if (roleView && $('#sort').value === 'newest') {
    const seenAt = (it) => (FIRSTSEEN.get(it.r.url) || {}).date || '';
    roleRows.sort((x, y) => seenAt(y).localeCompare(seenAt(x)));
  }
  const items = roleView ? roleRows : shown;
  const total = items.length;
  // ---- the binding (flow 1) ----
  // The abridged copy is bound short, and SHORT is the whole of it: the lines
  // that are here are complete lines — name, places, count, provenance, receipt
  // — and the ones that are not here are simply not sewn in. Nothing is blurred,
  // greyed, teased or counted down, and the tally below still states the true
  // total, so the card never has to imply a number the register would not print.
  //
  // A narrow question is never abridged: a search that yields nine lines shows
  // nine lines and no card, because a reader who asked something specific has
  // already been answered and an ask at that moment is a toll on an answer.
  const bound = binding(items.length);
  const page = (roleView ? items.slice(0, roleCap) : items).slice(0, bound.cap);
  const companyOf = (it) => (roleView ? it.c : it);

  // `prev` feeds the atlas index discipline: indexRow() suppresses the
  // coordinate ink on a line whose reference equals the line above, so the
  // gutter reads as an index (quiet until the plate turns), not wallpaper.
  let prev = null;
  const rows = page.map((it, i) => {
    const c = companyOf(it);
    if (roleView) {
      // A quire always opens with its company struck in full, whatever came
      // before it: the continuation spread runs in columns, so the line above a
      // column's first row is not the line beside it, and a grey "same as
      // above" at the head of a column would be pointing at nothing. Thirty-two
      // lines is close enough to a column that every column gets a name.
      const node = roleRow(c, it.r, c.name === prev && i % QUIRE !== 0);
      prev = c.name;
      node.dataset.reqs = c.roles.length;
      return node;
    }
    const r = gridref(c.countries);
    const node = indexRow(c, r === prev, hits(c));
    node.dataset.reqs = c.roles.length;   // the tier rules below read this
    prev = r;
    return node;
  });
  // The head strip names the unit the register is printing. Under roles the
  // third column holds the company rather than a count, so both labels move.
  $('#indexhead').replaceChildren(
    el('span', null, t('h.ref')),
    el('span', null, t(roleView ? 'h.role' : 'h.company')),
    el('span', null, t(roleView ? 'h.company' : 'h.roles')));
  // Round 9: the split. The board keeps the first entries beside the sticky
  // sheet; a register long enough to outrun any sheet continues in the
  // full-width spread below, refs unbroken. Short registers stay whole —
  // a spread of four lines is a caption, not a spread.
  const CAPB = 16;
  const split = page.length > CAPB * 2;
  // Unhidden BEFORE the balance pass below measures it: a hidden board
  // measures zero high, and a balance struck against zero keeps nothing.
  $('#board').hidden = !page.length;
  // The quires. `rows` itself is never touched — the balance pass slices it, the
  // selection indexes it, and a marker spliced into that array would put the
  // sheet beside the wrong line. sewn() interleaves the marks on the way into
  // the DOM instead, so the register is a bound volume in the document and a
  // flat list everywhere the code reasons about it.
  $('#index').replaceChildren(...sewn(split ? rows.slice(0, CAPB) : rows, 0));
  $('#spreadrows').replaceChildren(...(split ? sewn(rows.slice(CAPB), CAPB) : []));
  $('#spread').hidden = !split;
  // The sheet always shows one worked entry — the reader's pick while it is
  // still on the board, else the first line — so a gazetteer never opens to a
  // blank plate, and the honest-absence rules are visible without a click.
  const at = page.length
    ? Math.max(0, page.findIndex((it) => companyOf(it).name === selectedName)) : -1;
  // The crosshair's map arm: the open entry's marker(s) hold a red ring,
  // cleared first so yesterday's selection never lingers on the chart.
  for (const cell of markers()) cell.classList.remove('sel');
  if (at >= 0) {
    // The sheet is always a COMPANY entry, in both views: a role's detail is
    // its company's board, its funding and its registrations, and a second
    // gazetteer keyed on jobs would restate all of it one line at a time.
    const sel = companyOf(page[at]);
    selectedName = sel.name;
    rows[at].setAttribute('aria-current', 'true');
    entry(sel, q);
    for (const cell of markers()) {
      if (sel.countries.includes(cell.dataset.country)) cell.classList.add('sel');
    }
  } else {
    selectedName = null;
    SHEET.replaceChildren();
  }
  placeSheet(rows[at] || null);
  // Round 2: the board balances to the entry. A short gazetteer entry used to
  // leave several hundred pixels of bare paper under its closing rule while
  // sixteen index rows ran on beside it. Now the top register keeps only as
  // many rows as the open entry's height covers (six at least, and the spread
  // keeps substance), so the two columns close together. A selected row that
  // falls past the cut takes its entry with it: the sheet re-berths beside it
  // in the spread, which is where the reader's eye already is. Measured, not
  // guessed — the sheet is in the document by now.
  if (split && at >= 0 && !narrow.matches
      && SHEET.parentElement === $('#board')) {
    const rowH = rows[0].offsetHeight || 1;
    const keep = Math.max(6, Math.min(rows.length - 5, 28,
      Math.round(SHEET.offsetHeight / rowH)));
    if (keep !== CAPB) {
      $('#index').replaceChildren(...sewn(rows.slice(0, keep), 0));
      $('#spreadrows').replaceChildren(...sewn(rows.slice(keep), keep));
      if (at >= keep) placeSheet(rows[at]);
    }
  }
  if (split) {
    // The continuation states a count, never a ref range: refs are citations
    // struck in canonical order, so under any other sort a range would lie.
    const more = $('#spreadrows').querySelectorAll('.irow').length;
    $('#spreadlabel').textContent = t(roleView ? 'sp.cont.roles' : 'sp.cont.co',
      { n: count(more), m: count(page.length) });
    $('#spread').hidden = !more;
  }
  // Round 3: the hand-fold. On a phone the full register printed a 9,400px
  // page; past the first two-score entries the spread now folds behind its
  // own continuation rule, stated as a count. Nothing is dropped — one press
  // prints the rest — and the open entry can never fold: the cut steps past
  // it, so the berthed sheet always sits beside a printed line.
  $('#spread .spreadfold')?.remove();
  if (split && narrow.matches && !spreadOpen) {
    const tail = [...$('#spreadrows').querySelectorAll('.irow')];
    const cut = Math.max(40 - CAPB, at + 1 - CAPB);
    if (tail.length > cut + 8) {
      for (const r of tail.slice(cut)) r.hidden = true;
      const fold = el('button', 'spreadfold',
        t('sp.fold', { n: count(tail.length - cut) }));
      fold.type = 'button';
      fold.dataset.manual = '1';   // the hand-fold is a reader's choice, not a scroll's
      fold.addEventListener('click', () => { spreadOpen = true; render(); });
      $('#spread').append(fold);
    }
  }
  // The roles fold, on every width rather than a phone's — and in this variant
  // it is a FALLBACK rather than the mechanism. Scrolling is this page's primary
  // verb (flow 2), so a reader who reaches the foot of a printed page gets the
  // next one without being asked to press anything: the sentinel below the
  // register loads it as the fold comes into view. The button stays because a
  // reader who cannot scroll — a keyboard, a screen reader, a browser with no
  // observer — must still be able to turn the page, and because it is the thing
  // that STATES what is behind it. Nothing is hidden behind the automatic path
  // that is not stated on the manual one.
  //
  // The binding cap is the one thing neither path crosses: past it the card is
  // the next thing on the sheet, and a page that auto-loaded past its own ask
  // would be a gate that never asked.
  if (roleView && total > page.length && !$('#spread .spreadfold')
      && !bound.abridged) {
    const rest = total - page.length;
    const fold = el('button', 'spreadfold', t('sp.rolefold',
      { n: count(Math.min(ROLE_PAGE, rest)), m: count(rest) }));
    fold.type = 'button';
    fold.addEventListener('click', (ev) => {
      // A press is a reader asking, so it re-arms the automatic turns the
      // scroll spent. `ev.isTrusted` separates the two: the observer's own
      // synthetic click must not top up its own allowance.
      if (ev.isTrusted) autoLeft = AUTO_TURNS;
      roleCap += ROLE_PAGE;
      render();
    });
    $('#spread').append(fold);
  }
  tierRules();
  // The card, bound in where the paper stops. Placed after every fold so it is
  // the last thing on the sheet and the first thing a reader meets when they
  // run out of register — never between them and a line they already had.
  placeAsk(bound);
  // The berthed sheet arrives where the reader is, smoothly: only after a row
  // CLICK, and only where the sheet files inline (narrow screens, the spread)
  // — a filter change or a desktop split selection never moves the page.
  if (wantScroll && at >= 0 && SHEET.parentElement !== $('#board')) {
    const row = rows[at];
    requestAnimationFrame(() =>
      row.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  }
  wantScroll = false;
  // Three ways to show nothing, and they are three different facts: a build that
  // listed nobody, a country nobody was hiring in, and filters that met in an
  // empty corner. One sentence for all three would be the ambiguous zero.
  // A shown plate states its designation the way an atlas sheet does — the
  // number struck as a stamp, then the sheet range its scope covers on the
  // masthead grid, then the count. The empty states stay plain sentences:
  // a stamp certifies a sheet that exists.
  if (page.length) {
    // One vocabulary (round 1): the atlas binds PLATES, the index prints
    // REFS — "chart" said the same thing in a third register and is gone.
    // A country plate states its ref and anchor; Plate 01 states its range.
    const chs = PLATE.filter(([n]) => covers.includes(n));
    let sheetEl;
    if (chs.length === 1) {
      sheetEl = el('span', 'psheet', `${chs[0][1]} · ${dms(chs[0][2], chs[0][3])}`);
    } else {
      // Round 3: "Plates 02–16" was the page's one broken promise — a span
      // dressed like its working neighbours that did nothing. It is now the
      // door it looked like: the control that opens the plate index.
      sheetEl = el('button', 'psheet pib');
      sheetEl.type = 'button';
      sheetEl.setAttribute('aria-controls', 'pindex');
      sheetEl.setAttribute('aria-expanded', String(indexOpen));
      const chev = el('span', 'pchev', indexOpen ? '▴' : '▾');
      sheetEl.append(el('span', null, t('st.plates') + ' '), chev);
      sheetEl.addEventListener('click', () => {
        indexOpen = !indexOpen;
        $('#pindex').hidden = !indexOpen;
        sheetEl.setAttribute('aria-expanded', String(indexOpen));
        chev.textContent = indexOpen ? '▴' : '▾';
      });
    }
    // Round 6: at a hand's width the register header carries the COUNT and
    // nothing else. "Plate 01 · all countries" was struck five times before the
    // first company row — masthead stamp, index strip, this line's stamp, this
    // line's scope name, and again beside the stepper — so the reader walked
    // four restatements to reach the register. The scope name is nested rather
    // than hidden as a sibling, so the interpunct beside it never dangles; the
    // wide sheet, which has the room, keeps both.
    const tally = el('span');
    // The tally counts what MATCHED, never what is printed: the roles register
    // pages, and a number that shrank to the size of the visible page would
    // make the fold's own count unreadable and the register look smaller than
    // the snapshot it is reporting.
    const corpusRoles = companies.reduce((n, c) => n + c.roles.length, 0);
    tally.append(el('span', 'pscope',
                   `${activeCountry ? cname(activeCountry) : t('st.allc')} — `),
                 el('span', null, roleView
                   ? t('st.tally.roles', { n: count(total), m: count(corpusRoles) })
                   : t('st.tally.co',
                       { n: count(shown.length), m: count(companies.length) })));
    $('#status').replaceChildren(
      el('span', 'pstamp', t('plate.n', { n: plateNo(activeCountry) })),
      el('span', 'psep', '·'),
      sheetEl,
      el('span', 'psep', '·'),
      viewSwitch(),
      el('span', 'psep', '·'),
      tally,
      folioMark());
  } else {
    // Four empty states, four different facts: an empty build; a plate we
    // read with nobody hiring — said with a bearing toward where the
    // register's mass is, so an empty plate is a finding with a way onward,
    // not a dead end; the openness filter meeting the 92%-silent field
    // (note 03); and filters meeting in an empty corner.
    const tops = PLATE.map(([n]) => [n, listedIn([n])])
      .filter(([, n]) => n).sort((a, b) => b[1] - a[1]);
    // The folio rides the empty states too: an empty plate is a finding, and
    // the corner mark is its way onward to the next plate with something on it.
    $('#status').replaceChildren(el('span', null, !companies.length
      ? t('em.build')
      : !here.length
        ? t('em.plate', { scope: scopeName() })
          + (tops.length
             ? t('em.plate.most', { no: plateNo(tops[0][0]),
                 country: cname(tops[0][0]), n: count(tops[0][1]),
                 m: count(companies.length) })
             : '')
        : $('#openness').value !== 'any' && !openN
          ? t('em.foreign', { scope: scopeName() })
          : t(roleView ? 'em.role' : 'em.co')),
      // The switch rides the empty states too. A reader whose filters met in an
      // empty corner is the one who most needs the other register, and an empty
      // page that also withdrew the way out of it would be a dead end.
      el('span', 'psep', '·'),
      viewSwitch(),
      folioMark());
  }
  seps();
  // The board is a table of rows that exist; with nothing to list, showing
  // its rules and head strip would claim a table is there. (Hidden/unhidden
  // where the rows are placed, above — before the balance pass measures.)
  fitPlaces();
  // The running head reads what this render printed against what the register
  // holds. `total` is the matched count, not the corpus, because the head has
  // to describe the sheet the reader is on — a traverse bar drawn against 6,423
  // while the filters show 12 would put the bracket in the wrong hemisphere.
  headTotals = { printed: page.length, total };
  watchRows();
  watchFold();
  measureHead();
  paintHead();
  cursorTo(null);   // a re-rendered register has no line under the cursor
  savePlace();
}

// Round 5, the spread's scale bands: 103 continued entries in three identical
// columns were a gray wall with no foothold. Under the register's canonical
// sort the count runs monotonically, so the spread now prints a small mono
// threshold rule where the tier drops — 10+ / 2–9 / 1 open roles — the way an
// atlas separates its scale bands. Only under the open-roles sort: under any
// other order the tiers are not bands, and a rule would lie. The walk starts
// from the board's last printed line, so a band that began up in the split
// register never restates itself at the spread's top.
function tierRules() {
  // The loop variables are `node` and `band` rather than `t`: `t` is now the
  // edition's lookup, and a local shadowing it inside a function that has to set
  // a translated string is a bug waiting for the first non-English reader.
  for (const node of document.querySelectorAll('#spreadrows .trule')) node.remove();
  // The bands are a company fact — 10+ / 2–9 / 1 OPEN ROLES — so under the roles
  // register they would print a rule between two jobs at the same company.
  if (view === 'roles') return;
  if ($('#sort').value !== 'reqs' || $('#spread').hidden) return;
  const tier = (n) => (n >= 10 ? 'tier.10' : n >= 2 ? 'tier.2' : 'tier.1');
  const last = [...document.querySelectorAll('#index .irow')].pop();
  let prev = last ? tier(+last.dataset.reqs || 0) : null;
  for (const r of document.querySelectorAll('#spreadrows .irow:not([hidden])')) {
    const band = tier(+r.dataset.reqs || 0);
    if (band !== prev) r.before(el('div', 'trule', t(band)));
    prev = band;
  }
}

// Round 4, one truncation grammar: every register line elides places by
// dropping WHOLE names into its +N count, measured where the line actually
// sits — the wide index and the narrow spread columns speak identically.
// A lone place too long even alone wraps whole rather than slicing; the
// CSS ellipsis remains only as a safety net this pass keeps from firing.
function fitPlaces() {
  for (const cell of document.querySelectorAll('.iwhere')) {
    const all = (cell.dataset.places || '').split('|').filter(Boolean);
    if (!all.length || !cell.clientWidth) continue;   // a folded row measures zero
    const ipl = cell.querySelector('.ipl'), ipn = cell.querySelector('.ipn');
    ipl.style.whiteSpace = '';
    let k = all.length;
    for (; k >= 1; k--) {
      ipl.textContent = all.slice(0, k).join(' · ');
      ipn.textContent = k < all.length ? `+${all.length - k}` : '';
      if (ipl.scrollWidth <= ipl.clientWidth + 1) break;
    }
    if (k < 1) {
      ipl.textContent = all[0];
      ipn.textContent = all.length > 1 ? `+${all.length - 1}` : '';
      ipl.style.whiteSpace = 'normal';
    }
  }
}

// The status line's punctuation, made wrap-aware: an interpunct exists to
// separate two segments on ONE line, so a separator whose neighbours have
// parted onto different lines hides — no dot may dangle at a line's end or
// open a line. Re-run on every status build and on resize.
function seps() {
  for (const sep of document.querySelectorAll('#status .psep')) {
    sep.style.visibility = '';
    const prev = sep.previousElementSibling, next = sep.nextElementSibling;
    const s = sep.getBoundingClientRect();
    if ((prev && s.top >= prev.getBoundingClientRect().bottom - 1)
     || (next && next.getBoundingClientRect().top >= s.bottom - 1)) {
      sep.style.visibility = 'hidden';
    }
  }
}

// The folio's mechanism: plates step in atlas order, every one of them, and
// the walk wraps at either end. Round 6: the stepper used to skip the empty
// plates while the counter beside it read "01 / 16" — so the next arrow from
// Plate 01 jumped to Plate 03 and the mark said the page had turned once. Of
// sixteen plates only four carry companies; a stepper that visits four of them
// and counts to sixteen is a counter that lies. It now visits all sixteen, and
// an empty plate prints the finding it already had — a plate we read, with
// nobody hiring, and a bearing to where the register's mass is (render()).
function plateStep(d) {
  if (!companies.length) return;
  const seq = [null, ...PLATE.map(([n]) => n)];
  const i = Math.max(0, seq.indexOf(activeCountry));
  activeCountry = seq[(i + d + seq.length) % seq.length];
  render();
}

// The folio corner: the open plate's number as a dog-eared page mark —
// "03 / 16" — its halves stepping to the previous and next plate of the
// sixteen the mark counts. Built fresh per render because the number is
// the render's.
function folioMark() {
  const f = el('span');
  f.id = 'folio';
  const step = (d, glyph, lbl) => {
    const b = el('button', 'fstep', glyph);
    b.type = 'button';
    b.title = lbl;
    b.setAttribute('aria-label', lbl);
    b.addEventListener('click', () => plateStep(d));
    return b;
  };
  // Round 6: the stepper's caption is gone. It restated the plate name the
  // masthead stamp had already struck, and it existed only to fill the line
  // the folio took for itself at a hand's width; the folio now rides the
  // count's line, so there is no empty half to fill.
  f.append(step(-1, '‹', t('st.prev')),
           el('span', 'fno', t('st.folio', { n: plateNo(activeCountry) })),
           step(1, '›', t('st.next')));
  return f;
}

// ======================= THE BOUND VOLUME (r01-a) ===========================
// Everything below is this variant's own: the binding and its reply card
// (flow 1), the running head, the quire marks and the keyboard path (flow 2),
// and paint(), which is the edition applied to every fixed string on the page
// (flow 3). Nothing here reads the corpus except through counts render() has
// already taken — the page is still a renderer.

// Counts the footer's two long sentences need, kept off the DOM so the edition
// can re-set them without the dataset being read twice.
let INTEGRITY = null, SEENCOUNTS = null;

// ------------------------------- the binding --------------------------------
// Forty lines. Measured against what the brief asks for rather than picked: a
// signed-out reader has to be able to tell the register is honest, and that
// takes several companies WITH their receipts, their provenance and their
// absences — not a teaser and not a wall. Forty roles is eight to twelve
// companies at this snapshot's shape, three screens of reading, and one full
// quire plus a little, so the card lands just past a signature mark rather than
// in the middle of one.
//
// `entitled` is true when the reader signed in, when they answered the card by
// asking for the rest, or when we could not ask at all. The third case is the
// invariant the brief calls hard: Clerk blocked, offline, slow or broken must
// never cost a reader a line of a public register, so a gate that cannot ask
// does not withhold.
const BOUND_LINES = 40;
let entitled = false;
let clerkState = 'waiting';        // waiting · out · in · absent
let askShownThisSession = false;

function binding(n) {
  if (entitled) return { cap: Infinity, abridged: false, bound: n, total: n };
  return { cap: BOUND_LINES, abridged: n > BOUND_LINES,
           bound: Math.min(n, BOUND_LINES), total: n };
}

// The counters. This is the entire measurement — four integers and a string in
// this browser, no network call, no identifier, nothing that leaves. The
// bookplate prints all of it, which is the only reason it is defensible to
// keep at all: a count a reader cannot see is not a measurement, it is
// surveillance with a good excuse.
const bump = (k) => LS.set(k, String((+LS.get(k) || 0) + 1));
function answerCard(how) {
  LS.set('ra.ask.answer', how);
  LS.set('ra.ask.answered', new Date().toISOString());
  if (how === 'printed') LS.set('ra.bypass', '1');
  entitled = true;
  render();
  paintBookplate();
}

// The card itself. Built once and re-set, never rebuilt: a card rebuilt on
// every render would detach its own buttons between mousedown and mouseup —
// the same race the unit switch was fixed for, and the same fix.
let ASKCARD = null;
function askCard() {
  if (ASKCARD) return ASKCARD;
  const card = el('section', null);
  card.id = 'askcard';
  card.setAttribute('aria-labelledby', 'asktitle');
  const eyebrow = el('span', 'aeyebrow micro');
  const h = el('h2', null); h.id = 'asktitle';
  const body = el('p', 'abody');
  const acount = el('p', 'acount');
  const acts = el('div', 'acts');
  const why = el('p', 'awhy');
  const signin = el('button', 'aprimary');
  signin.type = 'button';
  signin.addEventListener('click', () => {
    // Clerk's own modal, on this page. The register behind it keeps its plate,
    // its filters and its search — the ask never navigates, and the place is
    // written to this browser besides, so even a reader whose provider bounces
    // them through a redirect comes back to the line they were on.
    savePlace();
    try { window.Clerk.openSignIn(); } catch { /* a provider that will not open */ }
  });
  const bypass = el('button', 'asecondary');
  bypass.type = 'button';
  bypass.addEventListener('click', () => answerCard('printed'));
  acts.append(signin, bypass);
  card.append(eyebrow, h, body, acount, acts, why);
  ASKCARD = { card, eyebrow, h, body, acount, acts, signin, bypass, why };
  return ASKCARD;
}

function placeAsk(bound) {
  const c = askCard();
  if (!bound.abridged) { c.card.remove(); return; }
  // You cannot ask before you know there is anyone to ask. While the provider
  // is still answering, the copy stays bound — the register only ever grows
  // from here, so nothing a reader has already started reading can vanish —
  // but no card is printed and nothing is counted. Measured: without this the
  // card appeared for the second before a BLOCKED Clerk timed out, and the
  // counter recorded an ask that no reader was ever in a position to answer.
  if (clerkState === 'waiting') { c.card.remove(); return; }
  const unit = view === 'roles' ? 'n.role' : 'n.entry';
  c.eyebrow.textContent = t('ask.eyebrow', { n: count(bound.bound) });
  c.h.textContent = t('ask.title');
  c.body.textContent = t('ask.body', {
    bound: pl(unit, bound.bound), total: count(bound.total) });
  c.acount.replaceChildren(
    el('span', 'an', count(bound.bound)),
    el('span', 'ak micro', t('ask.n.bound')),
    el('span', 'an', count(bound.total)),
    el('span', 'ak micro', t('ask.n.total')));
  c.signin.textContent = t('ask.signin');
  c.bypass.textContent = t('ask.bypass');
  c.why.textContent = t('ask.why');
  // The control that cannot work does not print. A "Sign in" beside a provider
  // that never loaded is the exact broken control the brief forbids — and the
  // page does not reach here in that state anyway, because a copy we could not
  // ask about prints in full.
  c.signin.hidden = clerkState !== 'out';
  // Bound in at the foot of the register, after every fold, so it is the next
  // thing on the sheet and never a thing between the reader and a line.
  const host = $('#spread').hidden ? document.querySelector('main') : $('#spread');
  host.append(c.card);
  if (!askShownThisSession) {
    askShownThisSession = true;
    bump('ra.ask.shown');
    paintBookplate();
  }
}

// --------------------------------- the quires --------------------------------
// Signature marks, every thirty-two lines. The letters are the compositor's
// sequence — A to Z without J, U or W, which a case did not distinguish from I,
// V and VV — and they double past Z (AA, BB, CC) exactly as a long book's do.
// A binder's mark is the reason a book can be sewn in the right order; here it
// is the reason six thousand register lines have a rhythm instead of a length.
const QUIRE = 32;
const SIGSEQ = 'ABCDEFGHIKLMNOPQRSTVXYZ';
const sigLabel = (k) =>
  SIGSEQ[k % SIGSEQ.length].repeat(Math.floor(k / SIGSEQ.length) + 1);
function sewn(nodes, offset) {
  const out = [];
  nodes.forEach((node, i) => {
    const line = offset + i;
    if (line % QUIRE === 0) {
      const mark = el('div', 'sig');
      mark.append(el('span', 'sigl', sigLabel(line / QUIRE)),
                  el('span', 'sign', t('sig.from', { n: count(line + 1) })));
      mark.setAttribute('aria-label',
        `${t('sig.mark', { letter: sigLabel(line / QUIRE) })} — `
        + t('sig.from', { n: count(line + 1) }));
      out.push(mark);
    }
    node.dataset.line = String(line + 1);
    out.push(node);
  });
  return out;
}

// ------------------------------ the running head -----------------------------
// A reference volume's running head answers "where am I" on a page the reader
// did not open at. This one is measured live: the plate, the quire under the
// eye, the span of lines on screen, and a traverse bar drawn to scale — the
// whole register as a track, what this copy prints as a solid segment, and the
// viewport as a red bracket riding it. The bar is the only place the abridged
// binding is visible as a PROPORTION rather than as a sentence, which is what
// makes the card's numbers checkable rather than assertable.
let HEADOBS = null;
const VISIBLE = new Set();
let headQueued = false;
let headTotals = { printed: 0, total: 0 };
let headSpan = [1, 1];

function watchRows() {
  if (!('IntersectionObserver' in window)) return;
  if (!HEADOBS) {
    HEADOBS = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) VISIBLE.add(e.target); else VISIBLE.delete(e.target);
      }
      queueHead();
    }, { threshold: 0 });
  }
  HEADOBS.disconnect();
  VISIBLE.clear();
  headSpan = [1, 1];   // a new register is a new set of lines to be somewhere in
  // Every fourth line, plus the first and the last. A running head is accurate
  // to the line a reader can see, not to the pixel, and six thousand observers
  // to say "lines 231–248" instead of "lines 232–248" is a bad trade on a phone.
  const rows = document.querySelectorAll('#index .irow, #spreadrows .irow:not([hidden])');
  rows.forEach((r, i) => {
    if (i % 4 === 0 || i === rows.length - 1) HEADOBS.observe(r);
  });
}
const queueHead = () => {
  if (headQueued) return;
  headQueued = true;
  requestAnimationFrame(() => { headQueued = false; paintHead(); });
};
function paintHead() {
  const head = $('#runhead');
  if (!headTotals.total) { head.hidden = true; return; }
  head.hidden = false;
  $('#rhplate').textContent = t('rh.plate', { n: plateNo(activeCountry) });
  // With no register line on screen — the reader is in the footer, or in the
  // masthead — the head holds its last reading rather than snapping to line 1.
  // A running head that says "Lines 1–1" while you stand in the back matter is
  // not neutral, it is wrong, and the whole point of the mark is that it can be
  // trusted at a glance.
  const lines = [...VISIBLE].map((r) => +r.dataset.line).filter(Boolean);
  if (lines.length) headSpan = [Math.min(...lines), Math.max(...lines)];
  const [lo, hi] = headSpan;
  $('#rhsig').replaceChildren(
    el('b', null, sigLabel(Math.floor((lo - 1) / QUIRE))));
  $('#rhref').textContent = t('rh.lines', { a: count(lo), b: count(hi) });
  $('#rhcount').textContent = t(view === 'roles' ? 'rh.count.roles' : 'rh.count.co',
    { n: count(headTotals.total) });
  const pct = (n) => Math.max(0, Math.min(100, (n / headTotals.total) * 100));
  $('#rhext').style.left = '0%';
  $('#rhext').style.width = pct(headTotals.printed) + '%';
  $('#rhnow').style.left = pct(lo - 1) + '%';
  $('#rhnow').style.width = Math.max(0.6, pct(hi) - pct(lo - 1)) + '%';
}
function measureHead() {
  const h = $('#runhead').offsetHeight || 0;
  document.documentElement.style.setProperty('--head-h', h + 'px');
}

// --------------------------------- the key -----------------------------------
// Twelve marks and the keyboard, drawn rather than described. The specimens are
// the page's own rules — a red dot in the key is the same red dot the chart
// prints — so the key can never drift from the sheet it explains.
const KEYROWS = [
  ['kx-red', 'key.red'],
  ['kx-dot', 'key.dot'],
  ['kx-nil', 'key.nil'],
  ['kx-ring', 'key.ring'],
  ['kx-rule', 'key.rule'],
  ['kx-hair', 'key.hair'],
  ['kx-mono|014', 'key.ref'],
  ['kx-mono dim|·IN', 'key.gr'],
  ['kx-mono|C', 'key.sig'],
  ['kx-num|12', 'key.count'],
  ['kx-mono dim|—', 'key.absent'],
];
function buildKey() {
  const card = $('#keycard');
  const inner = el('div', 'keyin');
  const head = el('div', 'keyhead');
  const h = el('h2', null, t('key.title')); h.id = 'keytitle';
  const close = el('button', 'kclose', t('key.close'));
  close.type = 'button';
  close.addEventListener('click', () => toggleKey(false));
  head.append(h, close);
  const intro = el('p', 'kdef', t('key.intro'));
  intro.style.margin = '.7rem 0 .2rem';
  intro.style.maxWidth = '62ch';
  const rows = el('div', 'keyrows');
  for (const [spec, key] of KEYROWS) {
    const [cls, text] = spec.split('|');
    const row = el('p', 'keyrow');
    const box = el('span', 'kspec');
    box.append(el('span', cls, text || null));
    row.append(box, el('span', 'kdef', t(key)));
    rows.append(row);
  }
  // The keyboard belongs in the key for the same reason the marks do: it is a
  // convention this page invented and a reader cannot induce it from the page.
  const kb = el('div', 'keyrow');
  const kbbox = el('span', 'kspec');
  kbbox.append(el('span', 'kx-mono', '⌨'));
  const kbdef = el('div', 'kdef');
  kbdef.append(el('b', null, t('key.keyboard')));
  const grid = el('div', 'keys');
  for (const [combo, key] of [['J / K', 'kb.jk'], ['Enter', 'kb.enter'],
                              ['← / →', 'kb.arrows'], ['/', 'kb.slash'],
                              ['?', 'kb.k'], ['Esc', 'kb.esc']]) {
    grid.append(el('kbd', null, combo), el('span', null, t(key)));
  }
  kbdef.append(grid);
  kb.append(kbbox, kbdef);
  rows.append(kb);
  inner.append(head, intro, rows);
  card.replaceChildren(inner);
}
let keyOpen = false;
function toggleKey(want) {
  keyOpen = want == null ? !keyOpen : want;
  const card = $('#keycard');
  if (keyOpen) buildKey();
  card.hidden = !keyOpen;
  const btn = $('#keybtn');
  btn.setAttribute('aria-expanded', String(keyOpen));
  if (keyOpen) card.querySelector('.kclose').focus();
  else btn.focus();
}

// ------------------------------- the bookplate -------------------------------
function paintBookplate() {
  const box = $('#bookplate');
  const opened = LS.get('ra.opened');
  const answer = LS.get('ra.ask.answer') || '';
  const shown = +LS.get('ra.ask.shown') || 0;
  const noask = +LS.get('ra.ask.noask') || 0;
  const k = el('span', 'bpk micro', t('bp.k')); k.id = 'bpk';
  const dl = el('dl');
  const row = (label, value) => {
    dl.append(el('dt', null, t(label)), el('dd', null, value));
  };
  // An absent fact is absent here too: a copy opened for the first time in this
  // very second has no "first opened" to print, so it prints none.
  if (opened) row('bp.opened', fmtDate(opened, true));
  row('bp.edition', (LOCALES.find(([c]) => c === LOCALE) || [, LOCALE])[1]);
  row('bp.binding', entitled
    ? t('bp.binding.complete')
    : t('bp.binding.abridged', { n: count(BOUND_LINES) }));
  row('bp.card',
    answer === 'signed' ? t('bp.card.signed')
    : answer === 'printed' ? t('bp.card.printed')
    : noask && !shown ? t('bp.card.noask')
    : shown ? t('bp.card.shown', { n: pl('n.time', shown) })
    : t('bp.card.none'));
  row('bp.place', t('bp.place.kept'));
  const note = el('p', 'bpnote', t('bp.note'));
  const forget = el('button', 'bpforget', t('bp.forget'));
  forget.type = 'button';
  forget.addEventListener('click', () => {
    for (const key of ['ra.opened', 'ra.ask.answer', 'ra.ask.answered',
                       'ra.ask.shown', 'ra.ask.noask', 'ra.bypass',
                       'ra.place', 'ra.edition']) LS.del(key);
    // Forgetting is not a sign-out: Clerk holds the session and this page holds
    // no credential to drop. What it does drop is the bypass, so an unsigned
    // reader who asked to forget goes back to the abridged copy they arrived
    // with — anything else would be the page keeping a state it just promised
    // to burn.
    entitled = clerkState === 'in' || clerkState === 'absent';
    askShownThisSession = false;
    render();
    paintBookplate();
  });
  box.replaceChildren(k, dl, note, forget);
  box.hidden = false;
}

// -------------------------------- your place ---------------------------------
// Signing in must not cost the reader their place, and neither should a reload,
// a language change or a provider that bounces you off the page and back. The
// plate, the unit, the sort, the search term and every filter are written to
// this browser and restored on arrival. The bookplate says so, and Forget
// throws it away with everything else.
const PLACE_FIELDS = ['q', 'city', 'dept', 'remote', 'openness', 'mca',
                      'bracket', 'recency', 'sort'];
function savePlace() {
  const state = { country: activeCountry, view };
  for (const id of PLACE_FIELDS) {
    const node = document.getElementById(id);
    if (node) state[id] = node.value;
  }
  LS.set('ra.place', JSON.stringify(state));
}
function restorePlace() {
  let state = null;
  try { state = JSON.parse(LS.get('ra.place') || 'null'); } catch { state = null; }
  if (!state || typeof state !== 'object') return null;
  if (state.country && COUNTRIES.includes(state.country)) activeCountry = state.country;
  // A `?view=` in the URL is someone SENDING you a register, and a link beats a
  // memory: the remembered unit only applies where the address said nothing.
  const asking = new URLSearchParams(location.search).get('view');
  if (!asking && (state.view === 'roles' || state.view === 'companies')) {
    view = state.view;
  }
  for (const id of PLACE_FIELDS) {
    const node = document.getElementById(id);
    if (!node || state[id] == null) continue;
    // A select whose options render() has not built yet keeps the wanted value
    // for the second pass below; anything else is set now.
    if (id === 'city' || id === 'dept') continue;
    node.value = state[id];
  }
  return state;
}

// --------------------------------- the edition -------------------------------
// Every fixed string on the page, set from the table. Called on load and again
// whenever the edition changes; it touches no filter state and reads no data
// beyond the two count blocks load() handed it.
const USDF = () => {
  try {
    return new Intl.NumberFormat(LOCALE, { style: 'currency', currency: 'USD',
      notation: 'compact', maximumFractionDigits: 0 });
  } catch { return { format: (n) => `$${Math.round(n / 1e6)}M` }; }
};
function paint() {
  const doc = document.documentElement;
  doc.lang = LOCALE;
  doc.dir = LOCALE_DIR[LOCALE] || 'ltr';
  document.title = t('doc.title');
  const set = (sel, text) => { const n = $(sel); if (n) n.textContent = text; };
  set('.thesis span', t('mast.thesis'));
  set('.snapshot .k', t('mast.snapshot'));
  set('#edlabel', t('ed.label'));
  $('#plate').setAttribute('aria-label', t('plate.nav'));
  $('#pindex').setAttribute('aria-label', t('plate.nav'));
  SHEET.setAttribute('aria-label', t('e.sheet.aria'));

  // The edition select, in each language's own name — nobody hunts for their
  // language under someone else's word for it.

function load(data) {

    $('#status').textContent = t('err.schema',

    .map((c, i) => [c.name, String(i + 1).padStart(3, '0')]));

  // reads is set by the edition. The two must not be the same operation.
  $('#snapshot').textContent = fmtDate(snapshot, true);

  // companies made it; this says how many we asked about, and the difference is
  // the whole reason to trust the ones that did. The build counts it -- a
  // renderer counting its own rows would always report everything it has as
  // everything there is.

  // after load, and paint() has to be able to re-set these sentences without
  // re-reading a dataset it does not own.
  const counted = data.integrity;

  // the honest half of the feature and it is the larger half, so it prints in
  // the apparatus rather than staying inside the file. Counted over the roles on
  // this register, not over the artifact, which also remembers postings that
  // have since closed: the reader is being told about the page in front of them.

  // sentence about zero dates would be a claim with nothing behind it.
  if (FIRSTSEEN.size) {
    let dated = 0, unconfirmed = 0, total = 0;
    for (const c of companies) for (const r of c.roles) {
      total += 1;
      const seen = FIRSTSEEN.get(r.url);
      if (!seen) continue;
      dated += 1;
      if (!seen.confirmed) unconfirmed += 1;

  // plate holds, so they are render()'s, rebuilt whenever the page turns.
  // Built here rather than in the markup because a chip states its count, and
  // the count is a fact about the data -- a chart rendered before the fetch
  // would show sixteen zeros it has no build behind, the same claim the
  // integrity footer refuses to make.
  plate();
  paint();      // the footer's counted sentences, now that there are counts
  render();

  // from the open plate, so a reader's remembered city or department is applied
  // on a second pass — and only where the plate still offers it, which is the
  // same rule render() applies when a page turns. Silent when it does not:
  // a filter restored onto a plate that cannot honour it would show an empty
  // register with no control to blame.
  let again = false;

    const node = document.getElementById(id);
    if (!want || want === 'any' || !node) continue;
    if ([...node.options].some((o) => o.value === want)) { node.value = want; again = true; }

// at its first page: a reader who just filtered is not scrolling the old answer.
//
// GUARDED ON THE VALUES, and that is a bug fix rather than an optimisation.
// `change` fires when a text input BLURS, whatever its value, so every click
// away from the search box re-rendered the entire register. Harmless-looking
// until a control lives in something render() rebuilds: pressing the unit switch
// blurred the box, the blur re-rendered, replaceChildren detached and reinserted
// the button BETWEEN mousedown and mouseup, and the browser cancelled the click.

    .map((n) => n.value).join('␀');

// page rather than about throughput. A render over 6,423 roles is a 270–360ms
// task — measured on this data, and the same before this round as after it — so
// answering every keystroke synchronously meant a reader typing "engineer" paid
// eight of them and watched their own characters arrive late. A select is one
// decision and still answers instantly; a search term is eight decisions in a
// row and only the last one is a question. 120ms sits under the threshold where
// a reader reads a pause as the page thinking, and it takes the stutter out.

$('#keybtn').addEventListener('click', () => toggleKey());

// alone cannot give them that: in the roles register every line carries an apply
// link and a company button, so a reader who tabs out of the search box walks
// four hundred stops to reach the footer. J and K are the answer — a cursor that
// moves by LINE, focusing whichever element the line leads with, so the reader
// arrives somewhere a screen reader can announce and Enter can act on.
//

// (roleRow), and taking those links out of the tab order to make the register
// one stop would trade a real affordance for a tidy number — the reader who
// needs Tab most is the one who would lose the links.
//

// wants aria-activedescendant and a container that owns the arrow keys, and the
// container here is two DOM subtrees (the split board and the spread) whose row

$('#lang').addEventListener('change', (e) => {

// Scrolling is this page's primary verb, so reaching the foot of a printed page
// turns to the next one without a press. The sentinel sits below the register
// and fires once per page; the fold button stays for readers who never scroll
// and for the statement of what is behind it. Both stop at the binding, which
// is the one edge in this page a scroll may not cross on its own.

// and the pressed path are the same line of code, so they can never disagree
// about what the next page holds, and the binding edge needs no second guard —
// render() does not build a fold past it, so there is nothing there to observe.
// Two guards, and the second one is a measured bug rather than caution.

// an agent scrolling to scrollHeight in a loop — keeps the fold inside the

  window.Clerk.addListener(paintAccount);   // sign-in and sign-out both land here
});
</script>
