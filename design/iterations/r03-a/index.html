// board. This does not sort the register — it DEALS it: newest night first,
// and inside a night one line per company at a time, round the table, until the
// hands are empty. The first screen is therefore forty different companies in a
// dozen countries, which is what a reader needs to believe the thing is real.
// Stated rather than silent: the finder line prints the rule.
function deal() {
  const nth = new Map();                 // "date|company" -> how many dealt so far
  const keyed = ROLES.map((r, i) => {
    const d = r.seen || '';
    const k = `${d}|${r.co}`;
    const n = (nth.get(k) || 0);
    nth.set(k, n + 1);
    return { i, d, n, co: COMPANIES[r.co].name };
  });
  keyed.sort((a, b) => {
    if (a.d !== b.d) return a.d === '' ? 1 : b.d === '' ? -1 : (a.d < b.d ? 1 : -1);
    if (a.n !== b.n) return a.n - b.n;
    return a.co < b.co ? -1 : a.co > b.co ? 1 : a.i - b.i;
  });
  ORDER = keyed.map((k) => k.i);
}

function load(data) {
  if (data.schema_version !== SCHEMA) {
    // A renderer must not guess at a contract it does not hold. It may,
    // however, still be holding last night's sheet — see fallback().
    fallback({ kind: 'schema', got: data.schema_version });
    return;
  }
  COMPANIES = Array.isArray(data.companies) ? data.companies : [];
  snapshot = String(data.snapshot || '');
  ROLES = [];
  COMPANIES.forEach((c, ci) => {
    for (const r of (c.roles || [])) {
      const seen = FIRSTSEEN.get(r.url);
      ROLES.push({
        t: String(r.title || ''), u: String(r.url || ''), co: ci,
        cc: Array.isArray(r.countries) ? r.countries : [],
        loc: Array.isArray(r.locations) ? r.locations : [],
        wp: r.workplace || null, dep: r.department || null,
        visa: r.visa || 'unknown', abroad: r.hire_from_abroad || 'unknown',
        seen: seen ? seen.date : null, conf: seen ? seen.confirmed : false,
        sc: scriptOf(String(r.title || '')),
        hay: `${String(r.title || '')}␀${c.name}`.toLowerCase(),
      });
      URLSET.add(r.url);
    }
  });
  TOTALS.roles = ROLES.length;
  TOTALS.companies = COMPANIES.length;
  TOTALS.said = 0;
  for (const r of ROLES) {
    if (r.sc !== 'latn') { TOTALS[r.sc]++; TOTALS.nonlatn++; }
    if (r.visa === 'yes' || r.abroad === 'yes') TOTALS.said++;
  }
  deal();
  const st = $('#status');
  if (st) st.remove();          // the rows land exactly where this line stood
  paint();
  computeSlip();
  recompute();
  // Written after the sheet is on screen and never before it: keeping a copy
  // for tomorrow is not worth a frame of tonight.
  setTimeout(writeCopy, 0);
}

// ============================= the kept copy =================================
// The morning after the build moves. Mid-round-2 the nightly rewrote the corpus
// from schema 10 to 11 and every variant in the harness went dark together —
// each refusing honestly, which is correct, and none of them designing what
// comes next. The reader's folds survive a schema bump in localStorage; the
// register they point into does not, so an 11pm reader met an apology and an
// empty page. A page that diffs itself nightly must expect to be stale nightly.
//
// So this browser keeps last night's sheet, and prints it when tonight's cannot
// be read. Every rule the register lives by still holds over a copy: it says
// what it is in the panel, it says it again in the depth stamp every hundred
// lines so it cannot be scrolled away from, it is set on a colder paper, and it
// refuses outright the two things only tonight's register could answer — the
// diff, and whether a folded corner has left its board.
let PARTIAL = false;        // the copy holds fewer lines than the sheet carried
let STALE = null;
const COPY_KEY = 'ra2.copy';

function writeCopy() {
  if (!ROLES.length || STALE) return;
  const cos = COMPANIES.map((c) => { const o = Object.assign({}, c); delete o.roles; return o; });
  const folded = new Set([...FOLDS.keys()]);
  const pack = (n) => {
    const take = ORDER.slice(0, n);
    const held = new Set(take);
    // Whatever the budget, the reader's own corners are in the copy. They are
    // the part of this sheet somebody was actually using.
    if (folded.size) for (const i of ORDER) {
      if (!held.has(i) && folded.has(ROLES[i].u)) { take.push(i); held.add(i); }
    }
    // Everything the evidence sheet prints goes into the copy, including the
    // board's own locations, last night's descriptions and last night's build
    // verdicts. A copy that dropped a field would render its absence as the
    // corpus having nothing to say, which is the quiet kind of lie — the whole
    // page turns on a reader being able to trust that nothing means nothing.
    return JSON.stringify({ v: 1, snapshot, of: ROLES.length, at: today(), cos,
      desc: DESCRIPTIONS, rep: (BUILDREP && BUILDREP.companies) || null,
      rows: take.map((i) => {
        const r = ROLES[i];
        return [r.t, r.u, r.co, r.cc, r.wp, r.dep, r.visa, r.abroad, r.seen,
                r.conf ? 1 : 0, r.loc];
      }) });
  };
  // How much of the sheet is kept is not a number this page picked: it is how
  // much this browser would take. It is tried whole first and halved until it
  // fits, and the panel prints the number that survived.
  // ponytail: 2.5M UTF-16 characters is the ceiling this page will take of a
  // store it does not own — the origin's quota is shared with everything else
  // on it, and a page that fills it to the brim breaks its neighbours rather
  // than itself. Ceiling: a real answer is IndexedDB, or the Worker.
  let n = ROLES.length;
  for (;;) {
    const body = pack(n);
    if (body.length <= 2500000) {
      try { localStorage.setItem(COPY_KEY, body); return; }
      catch { /* quota, or a browser holding nothing at all */ }
    }
    if (n <= 250) { try { localStorage.removeItem(COPY_KEY); } catch { /* nothing */ } return; }
    n = Math.floor(n / 2);
  }
}

function readCopy() {
  try {
    const raw = JSON.parse(LS.get(COPY_KEY) || 'null');
    if (!raw || raw.v !== 1 || !Array.isArray(raw.rows) || !Array.isArray(raw.cos)
        || !raw.rows.length || !raw.snapshot) return null;
    return raw;
  } catch { return null; }
}

function fallback(why) {
  const copy = readCopy();
  STALE = { why, copy };
  document.body.classList.add('stale');
  const st = $('#status');
  if (st) st.textContent = '';
  if (!copy) { renderStale(); if (st) st.textContent = ''; return; }

  COMPANIES = copy.cos;
  snapshot = String(copy.snapshot);
  ROLES = copy.rows.map((row) => ({
    t: String(row[0] || ''), u: String(row[1] || ''), co: row[2] | 0,
    cc: Array.isArray(row[3]) ? row[3] : [], loc: Array.isArray(row[10]) ? row[10] : [],
    wp: row[4] || null, dep: row[5] || null,
    visa: row[6] || 'unknown', abroad: row[7] || 'unknown',
    seen: row[8] || null, conf: !!row[9],
    sc: scriptOf(String(row[0] || '')),
    hay: `${String(row[0] || '')} ${(copy.cos[row[2] | 0] || {}).name || ''}`.toLowerCase(),
  }));
  URLSET = new Set(ROLES.map((r) => r.u));
  PARTIAL = ROLES.length < (copy.of || ROLES.length);
  TOTALS.roles = ROLES.length;
  TOTALS.companies = COMPANIES.length;
  TOTALS.said = 0; TOTALS.nonlatn = 0; TOTALS.ja = 0; TOTALS.zh = 0; TOTALS.hi = 0;
  for (const r of ROLES) {
    if (r.sc !== 'latn') { TOTALS[r.sc]++; TOTALS.nonlatn++; }
    if (r.visa === 'yes' || r.abroad === 'yes') TOTALS.said++;
  }
  // The rows were written in the order they were dealt, so the copy is dealt.
  ORDER = ROLES.map((_, i) => i);
  // Last night's, not tonight's. Tonight's build verdict is a judgement made
  // about a register this page could not read, and printing it beside a kept
  // row would attach it to a sheet it was never about. The copy carries the
  // ones that were true of the sheet it is a copy of.
  DESCRIPTIONS = (STALE.copy.desc && typeof STALE.copy.desc === 'object') ? STALE.copy.desc : {};
  BUILDREP = STALE.copy.rep ? { companies: STALE.copy.rep } : null;
  if (st) st.remove();
  paint();
  renderStale();
  SLIP = null; renderSlip();
  recompute();
}

function renderStale() {
  const box = $('#stale');
  box.replaceChildren();
  if (!STALE) { box.classList.add('hide'); return; }
  box.append(el('h2', null, t('stale.h')));
  box.append(el('p', null, STALE.why.kind === 'schema'
    ? t('stale.why.schema', { got: STALE.why.got, want: SCHEMA })
    : t('stale.why.load', { msg: STALE.why.msg || '' })));
  if (!STALE.copy) { box.append(el('p', 'quiet', t('stale.none'))); box.classList.remove('hide'); return; }
  const p = el('p');
  p.append(document.createTextNode(t('stale.have', {
    date: fmtDate(STALE.copy.snapshot, true),
    n: count(ROLES.length), m: count(STALE.copy.of || ROLES.length) })));
  box.append(p);
  box.append(el('p', 'quiet', t('stale.nodiff')));
  box.classList.remove('hide');
}

// ============================ the current view ==============================
let Q = '';                 // the finder
let CSEL = '';              // the country strip's one selection
let ONLY = false;           // print only the overprint
let NEAR = false;           // nearest capital first, rather than the deal
let KEEPSONLY = false;      // print only the corners this reader folded
let KEEPNIGHT = '';         // …and only the ones touched on one night
const FREE = 300;           // lines a copy prints before it asks
let entitled = false;

const touchedOn = (f, d) => !!f && (f.at === d || f.ap === d || f.an === d);

function recompute() {
  const q = Q.trim().toLowerCase();
  VIEW = [];
  for (const i of ORDER) {
    const r = ROLES[i];
    if (CSEL && !r.cc.includes(CSEL)) continue;
    if (q && !r.hay.includes(q)) continue;
    if (ONLY && bearing(r) !== 'reach') continue;
    if (KEEPSONLY && !FOLDS.has(r.u)) continue;
    if (KEEPNIGHT && !touchedOn(FOLDS.get(r.u), KEEPNIGHT)) continue;
    VIEW.push(i);
  }
  // Nearest first is a re-ordering, not a filter: nothing leaves the sheet, and
  // a posting that named no country keeps its place in the deal at the end,
  // because "no distance stated" is not "far away".
  if (NEAR) {
    const at = new Map(VIEW.map((i, n) => [i, n]));
    VIEW.sort((a, b) => {
      const ka = roleKm(ROLES[a]), kb = roleKm(ROLES[b]);
      if (ka === null && kb === null) return at.get(a) - at.get(b);
      if (ka === null) return 1;
      if (kb === null) return -1;
      return ka === kb ? at.get(a) - at.get(b) : ka - kb;
    });
  }
  syncURL();
  build();
  paintRail();
}

function syncURL() {
  const p = new URLSearchParams(location.search);
  Q ? p.set('q', Q) : p.delete('q');
  CSEL ? p.set('c', CODE[CSEL]) : p.delete('c');
  ONLY ? p.set('only', '1') : p.delete('only');
  NEAR ? p.set('near', '1') : p.delete('near');
  // The keeps and the night stay OUT of the URL deliberately. The finder and
  // the country are the sheet, and a sheet can be sent to somebody; what this
  // reader folded and which night they folded it on is not a view of the
  // register, it is the reader, and it does not belong in a link.
  const s = p.toString();
  // The URL is the session, so a find can be sent to somebody. replaceState so
  // the back button still leaves the page rather than walking a keystroke log.
  history.replaceState(null, '', s ? `?${s}` : location.pathname);
}

// ============================== building the sheet ===========================
const SHEET = $('#sheet');
let rowEls = [];
let ROWH = 30, STAMPH = 26;
let cur = -1;                 // the cursor's index into VIEW
let openIdx = -1;             // the role whose evidence sheet is open, index into VIEW
let evHeight = 0;
let buildToken = 0;

const STAMP_EVERY = 100;
const rowTop = (n) => n * ROWH + Math.floor(n / STAMP_EVERY) * STAMPH;

function build() {
  const token = ++buildToken;
  SHEET.replaceChildren();
  rowEls = [];
  cur = -1; openIdx = -1; evHeight = 0;
  $('#ask').classList.add('hide');
  $('#emptyslot').replaceChildren();

  const shown = entitled ? VIEW.length : Math.min(FREE, VIEW.length);
  if (!shown) { SHEET.style.minHeight = '0px'; REACH = []; paintEmpty(); paintGauge(); return; }
  // Height reserved before a single row lands, so nothing below the sheet moves
  // while the chunks arrive. Layout shift is a hard mark on this page.
  SHEET.style.minHeight = `${rowTop(shown)}px`;

  let at = 0;
  const chunk = () => {
    if (token !== buildToken) return;
    const frag = document.createDocumentFragment();
    const end = Math.min(shown, at + 700);
    for (; at < end; at++) {
      if (at && at % STAMP_EVERY === 0) frag.append(stampEl(at));
      frag.append(rowEl(at));
    }
    SHEET.append(frag);
    if (at < shown) { requestAnimationFrame(chunk); return; }
    measure();
    redress();
    paintAsk(shown);
    if (cur >= 0) cur = -1;
  };
  chunk();
}

function measure() {
  const r0 = SHEET.querySelector('.r');
  const s0 = SHEET.querySelector('.stamp');
  if (r0) ROWH = r0.offsetHeight || ROWH;
  if (s0) STAMPH = s0.offsetHeight || STAMPH;
  SHEET.style.minHeight = '0px';
}

function stampEl(n) {
  const s = el('div', 'stamp');
  s.setAttribute('aria-hidden', 'true');
  s.append(el('span', 'n', count(n)), el('span', 'ln'), el('span', 'd', ''));
  // On a kept copy the stamp stops printing the night the sheet has reached and
  // prints what the sheet IS instead, every hundred lines: a reader who scrolled
  // past the panel at the top must not be able to get back to a page that looks
  // like tonight's.
  if (STALE) { s.lastChild.textContent = t('stale.mark', { date: fmtDate(snapshot, true) }); return s; }
  const r = ROLES[VIEW[n]];
  if (r && r.seen) s.lastChild.textContent = fmtDate(r.seen, true);
  return s;
}

function rowEl(n) {
  const i = VIEW[n];
  const r = ROLES[i];
  const c = COMPANIES[r.co];
  const row = el('div', 'r');
  row.setAttribute('role', 'listitem');
  row.dataset.n = String(n);

  const open = el('button', 'open');
  open.type = 'button';
  open.tabIndex = -1;
  open.setAttribute('aria-expanded', 'false');
  open.setAttribute('aria-label', t('row.aria', {
    title: r.t, company: c.name, country: r.cc.map(cname).join(', ') || '—',
  }));
  row.append(open);

  row.append(el('span', 'o'));
  // Two codes then a plus: a COUNT of more, never a claim about which. Three
  // codes overran the column and printed themselves over the role title.
  const codes = r.cc.map((x) => CODE[x] || '').filter(Boolean);
  row.append(el('span', 'cc', codes.length > 2
    ? `${codes[0]}\u00b7${codes[1]}+` : codes.join('\u00b7') || '\u2014'));

  const tt = el('span', 'tt');
  if (r.sc !== 'latn') {
    const sc = el('span', 'sc mono', `${SCRIPT_TAG[r.sc]} `);
    tt.append(sc);
  }
  tt.append(document.createTextNode(r.t));
  tt.title = r.t;
  row.append(tt);

  row.append(el('span', 'co', c.name));
  row.append(el('span', 'wp', r.wp ? t(WORKPLACE[r.wp]) : ''));
  row.append(el('span', 'dt'));

  const fd = el('button', 'fd');
  fd.type = 'button';
  fd.tabIndex = -1;
  fd.setAttribute('aria-pressed', String(FOLDS.has(r.u)));
  fd.setAttribute('aria-label', t('fold.aria', { title: r.t }));
  row.append(fd);

  dressRow(row, r);
  rowEls[n] = row;
  return row;
}

// The overprint, applied. Separated from rowEl on purpose: stating a standpoint
// re-inks the second plate over six thousand rows and must not rebuild one of
// them, because rebuilding is where the jank and the lost scroll live.
function dressRow(row, r) {
  const b = bearing(r);
  row.classList.toggle('reach', b === 'reach');
  row.classList.toggle('closed', b === 'closed');
  const f = FOLDS.get(r.u);
  const st = f ? stageOf(f) : '';
  row.classList.toggle('folded', !!f);
  row.classList.toggle('applied', st === 'applied' || st === 'answered');
  row.classList.toggle('answered', st === 'answered');
  const fd = row.querySelector('.fd');
  if (fd) fd.setAttribute('aria-pressed', String(!!f));
  const sc = row.querySelector('.sc');
  if (sc) sc.classList.toggle('read', SP.reads.includes(r.sc));
  // The last column belongs to whichever plate has something to say in it. The
  // survey's first-sighting is the base plate's; the reader's own date is the
  // overprint's and is laid over it; under nearest-first the column is the
  // distance, because that is what the reader asked the sheet to be ordered by.
  const dt = row.querySelector('.dt');
  if (!dt) return;
  const km = NEAR ? roleKm(r) : null;
  let text, cls;
  if (km != null) { text = t('near.km', { n: count(km) }); cls = 'dt km'; }
  else if (f && stageDate(f)) { text = stageDate(f).slice(5); cls = 'dt mine'; }
  else { text = r.seen ? r.seen.slice(5) : ''; cls = 'dt'; }
  // Written only when it changed. Stating a standpoint re-inks all 6,423 rows,
  // and replacing a text node with the same string still replaces it: doing
  // that six thousand times cost ten milliseconds a frame for the rest of the
  // session, on a page whose whole promise is that scrolling it feels like
  // something. Measured before believing it.
  if (dt.textContent !== text) dt.textContent = text;
  if (dt.className !== cls) dt.className = cls;
}
function redress() {
  REACH = [];
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (!row) continue;
    dressRow(row, ROLES[VIEW[n]]);
    if (row.classList.contains('reach')) REACH.push(n);
  }
  // runs: consecutive reachable lines join into one rule in the margin, so a
  // cluster of possibility reads as a mark rather than as confetti
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (!row) continue;
    const a = n > 0 && rowEls[n - 1] && rowEls[n - 1].classList.contains('reach');
    const c = n + 1 < rowEls.length && rowEls[n + 1] && rowEls[n + 1].classList.contains('reach');
    row.classList.toggle('runs', row.classList.contains('reach') && (a || c));
  }
  SHEET.classList.toggle('lens', standpointStated());
  paintGauge();
}

// ============================= the reader's nights ===========================
// The overprint rule, turned on the reader's own week: a mark may only be laid
// where a fact exists. A week of somebody's life is mostly nothing, so this
// ledger is mostly nothing, and the strip it draws is mostly blank paper. A
// night this copy was not opened is drawn as NOTHING and never as a zero,
// because a zero would be a claim about a night nobody here was present for.
//
// The one thing this replaces is the round-2 counter line — `asked 1 · signed
// in 0 · printed anyway 0 · declined 0`, which by the end of that round was in
// all three variants in identical form. The same measurement is taken, and the
// same measurement is printed back; it is printed back with the DATE the
// reader answered on, which is a thing only this ledger can say.
const today = () => {
  // The reader's own midnight, not UTC's: "tonight" is a fact about where the
  // reader is sitting. Every date this page stores is written this way and read
  // back through fmtDate's UTC parse, so the key and the printed date agree.
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const NIGHT_CAP = 120;      // ponytail: a ledger this browser keeps forever is
                            // a store that grows forever. Ceiling: the oldest
                            // nights fall off the end, and the strip says so.
let NIGHTS = new Map();
function loadNights() {
  try {
    const raw = JSON.parse(LS.get('ra2.nights') || 'null');
    if (raw && typeof raw === 'object') {
      for (const [d, v] of Object.entries(raw)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(d) && v && typeof v === 'object') NIGHTS.set(d, v);
      }
    }
  } catch { /* an unreadable ledger is an empty one */ }
}
function saveNights() {
  const keys = [...NIGHTS.keys()].sort();
  while (keys.length > NIGHT_CAP) NIGHTS.delete(keys.shift());
  LS.set('ra2.nights', JSON.stringify(Object.fromEntries([...NIGHTS.entries()].sort())));
}
// `when` is the night the thing actually happened on, which is not always
// tonight: taking back an application made on Tuesday must give Tuesday its
// mark back, not take one off tonight — a night is a record of that night.
function markNight(what, n, when) {
  const d = when || today();
  const rec = NIGHTS.get(d) || {};
  if (what === 'read') rec.r = 1;
  else if (what === 'kept' || what === 'applied' || what === 'answered') {
    const k = what[0];
    rec[k] = Math.max(0, (rec[k] || 0) + (n == null ? 1 : n));
    if (!rec[k]) delete rec[k];
  } else rec[what] = 1;
  NIGHTS.set(d, rec);
  saveNights();
  if (ROLES.length) { paintNights(); paintPlate(); }
}
const nightTouched = (rec) => !!(rec && (rec.k || rec.a || rec.w || rec.printed
  || rec.signed || rec.declined));

// ================================ the folds ==================================
// A book somebody uses has folded corners. The register carries no departures —
// build-report's `departed` is empty on this snapshot — so the page cannot tell
// a reader what vanished. Their own folds can, and that is the whole reason the
// fold stores the title and the company beside the URL: a fold whose posting is
// no longer in the corpus is a role that is gone, and it prints struck through.
//
// From round 3 a fold also holds a STATE, and every state holds the date the
// reader put it there: folded → applied → answered. Each of the three is a
// reader-stated fact, never an inferred one, exactly like the standpoint, and
// each burns with everything else. This is the whole product one step past the
// register — a shelf becomes a workbench the moment a thing on it can move.
// ponytail: the folds live in this browser and nowhere else, and the ask says
// so in as many words. Ceiling: the Worker already exists — carrying them is a
// PUT keyed on the Clerk session and a merge on load. Until that is built, the
// list downloads as plain text, so "kept here" never means "kept from you".
let FOLDS = new Map();
const STAGES = ['kept', 'applied', 'answered'];
const stageOf = (f) => (f && f.an ? 'answered' : f && f.ap ? 'applied' : 'kept');
const stageDate = (f) => (f.an || f.ap || f.at || '');
function loadFolds() {
  try {
    const raw = JSON.parse(LS.get('ra2.folds') || '[]');
    if (Array.isArray(raw)) {
      for (const f of raw) {
        if (f && typeof f.u === 'string') FOLDS.set(f.u, { u: f.u, t: String(f.t || ''),
          c: String(f.c || ''), at: String(f.at || ''),
          ap: f.ap ? String(f.ap) : '', an: f.an ? String(f.an) : '' });
      }
    }
  } catch { /* an unreadable list is an empty one */ }
}
function saveFolds() { LS.set('ra2.folds', JSON.stringify([...FOLDS.values()])); }
// Forward one stage, or back one. Back is not a delete: taking back "applied"
// leaves the corner folded, because the reader folded it and that is still true.
function step(url, dir) {
  const f = FOLDS.get(url);
  if (!f) return;
  const at = STAGES.indexOf(stageOf(f));
  const to = at + dir;
  if (to < 0 || to > 2) return;
  if (dir > 0) {
    if (to === 1) f.ap = today();
    if (to === 2) f.an = today();
    markNight(STAGES[to]);
    bump(`ra2.${STAGES[to]}`);
  } else {
    if (at === 2) { markNight('answered', -1, f.an); f.an = ''; }
    else if (at === 1) { markNight('applied', -1, f.ap); f.ap = ''; }
  }
  saveFolds();
  restrike(url);
  paintFolds(); paintPlate();
  if (KEEPNIGHT) recompute();
}
// One role's marks, re-laid wherever it is currently printed. Separated from a
// rebuild on purpose: advancing a state must not cost the reader their scroll.
function restrike(url) {
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (row && ROLES[VIEW[n]].u === url) dressRow(row, ROLES[VIEW[n]]);
  }
  if (openIdx >= 0 && ROLES[VIEW[openIdx]] && ROLES[VIEW[openIdx]].u === url) {
    const n = openIdx;
    closeEv(); openEv(n, true);
  }
}
function toggleFold(i) {
  const r = ROLES[i];
  if (FOLDS.has(r.u)) {
    const f = FOLDS.get(r.u);
    // Unfolding a corner unmakes everything the reader said about that line,
    // so the nights it was said on give their marks back. A ledger that only
    // ever counts up is a ledger that cannot be corrected.
    if (f.an) markNight('answered', -1, f.an);
    if (f.ap) markNight('applied', -1, f.ap);
    markNight('kept', -1, f.at);
    FOLDS.delete(r.u); bump('ra2.fold.off');
  } else {
    FOLDS.set(r.u, { u: r.u, t: r.t, c: COMPANIES[r.co].name, at: today(), ap: '', an: '' });
    bump('ra2.fold.on');
    markNight('kept');
  }
  saveFolds();
  for (let n = 0; n < rowEls.length; n++) {
    const row = rowEls[n];
    if (row && ROLES[VIEW[n]].u === r.u) dressRow(row, ROLES[VIEW[n]]);
  }
  // The evidence sheet grows a control the moment a corner is folded, so it is
  // restruck whole rather than having one button's label swapped under it.
  if (openIdx >= 0 && VIEW[openIdx] === i) { const n = openIdx; closeEv(); openEv(n, true); }
  paintFolds(); paintPlate();
  if (KEEPSONLY || KEEPNIGHT) recompute();
}

// ============================= the evidence sheet ============================
// Taken from r01-c, which was the only variant in round 1 where a role opened
// where it sat. Everything the register holds, printed at once; a fact the
// corpus does not carry prints as nothing. The two mobility fields are the one
// exception and only because on this page their silence IS the finding.
function closeEv() {
  const ev = SHEET.querySelector('.ev');
  if (ev) ev.remove();
  if (openIdx >= 0 && rowEls[openIdx]) rowEls[openIdx].querySelector('.open').setAttribute('aria-expanded', 'false');
  openIdx = -1; evHeight = 0;
  paintGauge();
}
function openEv(n, quiet) {
  if (openIdx === n && !quiet) { closeEv(); return; }
  closeEv();
  const row = rowEls[n];
  if (!row) return;
  const i = VIEW[n];
  const r = ROLES[i];
  const c = COMPANIES[r.co];
  const ev = el('section', 'ev');
  ev.setAttribute('aria-label', t('ev.aria'));

  ev.append(el('h3', null, r.t));
  const sub = el('p', 'sub');
  sub.append(document.createTextNode(c.name));
  if (r.cc.length) sub.append(document.createTextNode(` · ${r.cc.map(cname).join(' · ')}`));
  ev.append(sub);

  const g = el('div', 'evgrid');
  const fld = (k, v, cls) => {
    if (v == null || v === '') return;
    const f = el('div', `fld${cls ? ` ${cls}` : ''}`);
    f.append(el('span', 'k', t(k)), el('span', 'v', v));
    g.append(f);
  };
  // What the posting itself said about somebody who is not already there. This
  // is the only place on the page where silence is printed as words, because
  // this is the question the reader came with.
  const sayVisa = r.visa === 'yes' ? t('ev.visa.yes') : r.visa === 'no' ? t('ev.visa.no') : null;
  const sayAb = r.abroad === 'yes' ? t('ev.abroad.yes') : r.abroad === 'no' ? t('ev.abroad.no') : null;
  fld('ev.k.visa', sayVisa || t('ev.notsaid'), sayVisa ? 'said' : 'silent');
  fld('ev.k.abroad', sayAb || t('ev.notsaid'), sayAb ? 'said' : 'silent');
  fld('ev.k.workplace', r.wp ? t(WORKPLACE[r.wp]) : t('ev.notsaid'), r.wp ? '' : 'silent');
  fld('ev.k.where', canonPlaces(r.loc).join(' · '));
  // The board's own department string, printed exactly as the board wrote it.
  // Round 1's variants translated a handful of these; the field is 900 free-text
  // values a board typed ("8548 Payins - Eng"), which makes it a source claim,
  // and translating a source claim is the one thing this register may not do.
  fld('ev.k.dept', r.dep || null);
  if (r.seen) {
    fld('ev.k.seen', `${fmtDate(r.seen, true)}${r.conf ? '' : ` · ${t('ev.unconfirmed')}`}`);
  }
  fld('ev.k.board', `${fmtDate(snapshot, true)} · ${c.ats}`);
  {
    // Derived, and marked ≈ in the value itself. r02-c found this and it is the
    // best wordless answer in either round to "what could I do": state where
    // you stand and the register becomes a staircase.
    const km = roleKm(r);
    if (km === 0) fld('ev.k.dist', t('near.home'));
    else if (km != null) fld('ev.k.dist', t('near.km', { n: count(km) }));
  }
  fld('ev.k.raised', c.amount != null ? money(c) : null);
  fld('ev.k.round', c.round_letter ? t('round.series', { letter: c.round_letter }) : t('round.none'),
      c.round_letter ? '' : 'silent');
  fld('ev.k.funded', c.date ? fmtDate(c.date, true) : null);
  fld('ev.k.rule', c.qualified_by ? t(RULES[c.qualified_by] || 'rule.stage') : null);
  if (r.sc !== 'latn') fld('ev.k.script', t(`script.${r.sc}`), 'said');
  if (c.mca) fld('ev.k.cin', `${c.mca.cin} · ${c.mca.name}`);
  if (c.uk) fld('ev.k.uk', `${c.uk.number} · ${c.uk.name}`);
  if (c.salary) fld('ev.k.salary', t('ev.salary.v', { n: count(c.salary.avg_lpa), r: count(c.salary.reports), d: fmtDate(c.salary.observed, true) }));
  if (BUILDREP && BUILDREP.companies && BUILDREP.companies[c.name]) {
    fld('ev.k.verdict', BUILDREP.companies[c.name]);
  }
  ev.append(g);

  const d = DESCRIPTIONS[c.name];
  if (d) {
    const box = el('div', 'desc');
    for (const [k, v] of [['d.what', d.what], ['d.forwhom', d.for_whom], ['d.whythem', d.why_them]]) {
      if (typeof v !== 'string' || !v.trim()) continue;
      const p = el('p');
      p.append(el('span', 'dk', t(k)), document.createTextNode(v));
      box.append(p);
    }
    if (box.children.length) { box.append(el('p', 'glossnote', t('d.machine'))); ev.append(box); }
  }

  const acts = el('div', 'evacts');
  if (/^https?:\/\//i.test(r.u)) {
    const a = el('a', null, t('ev.open'));
    a.href = r.u; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  }
  const keep = el('button', 'keep', FOLDS.has(r.u) ? t('ev.unkeep') : t('ev.keep'));
  keep.type = 'button';
  keep.setAttribute('aria-pressed', String(FOLDS.has(r.u)));
  keep.addEventListener('click', () => toggleFold(i));
  acts.append(keep);
  // The one control the whole register was missing. Every variant in two rounds
  // ended at "Open the posting ↗", which makes the keeps a shelf: nothing on
  // them can change, so coming back to them next week teaches nothing. These
  // two buttons are the workbench, and each is one reader-stated bit with a
  // date on it — the same standing as the standpoint, and burnt the same way.
  const f0 = FOLDS.get(r.u);
  if (f0) {
    const st = stageOf(f0);
    if (st !== 'answered') {
      const nextKey = st === 'kept' ? 'keep.do.applied' : 'keep.do.answered';
      const fwd = el('button', 'keep', t(nextKey));
      fwd.type = 'button';
      fwd.setAttribute('aria-label', t('keep.do.aria', { do: t(nextKey), title: r.t }));
      fwd.addEventListener('click', () => step(r.u, 1));
      acts.append(fwd);
    }
    if (st !== 'kept') {
      const back = el('button', null, t('keep.back'));
      back.type = 'button';
      back.addEventListener('click', () => step(r.u, -1));
      acts.append(back);
    }
  }
  if (c.source_url && /^https?:\/\//i.test(c.source_url)) {
    const a = el('a', null, t('ev.source'));
    a.href = c.source_url; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  }
  const cl = el('button', null, t('ev.close'));
  cl.type = 'button';
  cl.addEventListener('click', () => { closeEv(); focusRow(n); });
  acts.append(cl);
  ev.append(acts);

  const mine = readerLine(r.u);
  if (mine) ev.append(mine);

  // Every derived thing on this sheet names itself as derived, here, in one
  // paragraph, rather than being quietly indistinguishable from a board's claim.
  ev.append(el('p', 'deriv', t('ev.deriv')));
  if (SP.where && SP.where !== 'ELSEWHERE') ev.append(el('p', 'deriv', t('near.note')));

  row.after(ev);
  row.querySelector('.open').setAttribute('aria-expanded', 'true');
  openIdx = n;
  evHeight = ev.offsetHeight;
  paintGauge();
  if (!quiet) bump('ra2.ev.open');
}

// The reader's own record of one line, in the reader's own colour. The applied
// state's sentence is the page's central rule turned around and pointed at the
// reader's week: this register prints a board's silence as nothing at all,
// because silence is not a no, and a company that has not written back has not
// said anything either. At 11pm that is the difference between a week that
// failed and a week that is still open.
function readerLine(url) {
  const f = FOLDS.get(url);
  if (!f) return null;
  const st = stageOf(f);
  const p = el('p', 'mineline');
  if (st === 'answered') {
    p.textContent = t('keep.answered.line', { date: fmtDate(f.an, true) });
  } else if (st === 'applied') {
    const n = Math.max(0, days(f.ap, today()));
    p.textContent = n < 1 ? t('keep.silence.today')
      : t('keep.silence', { date: fmtDate(f.ap, true), n: count(n) });
  } else if (f.at) {
    p.textContent = t('keep.on.kept', { date: fmtDate(f.at, true) });
  } else return null;
  return p;
}

// Locations are fifteen countries' boards typed by fifteen sets of hands. This
// is typesetting, never invention: split the board's own separators, hold the
// mode words to one idiom, dedupe, and name no place a board did not.
const MODE = /^(remote|hybrid)$/i;
function canonPlaces(list) {
  const seen = new Map();
  for (const raw of list.flatMap((s) => String(s).split(/\s*;\s*/))) {
    let s = raw.trim().replace(/\s+/g, ' ');
    if (!s) continue;
    const m = s.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (m && (MODE.test(m[1]) || MODE.test(m[2]))) {
      const mode = MODE.test(m[1]) ? m[1] : m[2];
      const place = MODE.test(m[1]) ? m[2] : m[1];
      s = `${mode[0].toUpperCase()}${mode.slice(1).toLowerCase()} — ${place}`;
    }
    const k = s.toLowerCase();
    if (!seen.has(k)) seen.set(k, s);
  }
  return [...seen.values()].slice(0, 4);
}

// ================================== the rail =================================
function bearingCounts(list) {
  let reach = 0, closed = 0, silent = 0;
  for (const i of list) {
    const b = bearing(ROLES[i]);
    if (b === 'reach') reach++; else if (b === 'closed') closed++; else silent++;
  }
  return { reach, closed, silent, all: list.length };
}

function buildRail() {
  // where I stand
  const w = $('#where');
  w.replaceChildren();
  const add = (v, label) => { const o = el('option', null, label); o.value = v; w.append(o); };
  add('', t('sp.where.none'));
  add('ELSEWHERE', t('sp.where.else'));
  for (const c of COUNTRIES) add(c, cname(c));
  w.value = SP.where;
  w.addEventListener('change', () => { SP.where = w.value; saveStandpoint(); afterStandpoint(); });

  // what I read
  const rd = $('#reads');
  rd.replaceChildren();
  for (const [code, label] of LOCALES) {
    const b = el('button', 'chip', label);
    b.type = 'button';
    b.dataset.code = code;
    b.setAttribute('aria-pressed', String(SP.reads.includes(code)));
    b.addEventListener('click', () => {
      const at = SP.reads.indexOf(code);
      if (at >= 0) SP.reads.splice(at, 1); else SP.reads.push(code);
      b.setAttribute('aria-pressed', String(SP.reads.includes(code)));
      saveStandpoint(); afterStandpoint();
    });
    rd.append(b);
  }

  // how I can work
  const wk = $('#work');
  wk.replaceChildren();
  const addw = (v, label) => { const o = el('option', null, label); o.value = v; wk.append(o); };
  addw('', t('sp.work.any'));
  addw('remote', t('sp.work.remote'));
  wk.value = SP.work;
  wk.addEventListener('change', () => { SP.work = wk.value; saveStandpoint(); afterStandpoint(); });

}
// Bound once, on controls the markup already holds — buildRail() is called at
// boot AND on an edition change, and a listener added there would fire twice.
$('#standclear').addEventListener('click', () => {
  SP.where = ''; SP.reads = []; SP.work = '';
  saveStandpoint();
  $('#where').value = ''; $('#work').value = '';
  for (const b of $('#reads').querySelectorAll('.chip')) b.setAttribute('aria-pressed', 'false');
  afterStandpoint();
});
$('#onlybtn').addEventListener('click', () => {
  ONLY = !ONLY;
  $('#onlybtn').setAttribute('aria-pressed', String(ONLY));
  bump('ra2.only');
  recompute();
});
$('#nearbtn').addEventListener('click', () => {
  NEAR = !NEAR;
  bump('ra2.near');
  recompute();
  window.scrollTo({ top: 0, behavior: 'instant' });
});
$('#keepsonly').addEventListener('click', () => {
  KEEPSONLY = !KEEPSONLY;
  KEEPNIGHT = '';
  bump('ra2.keeps.only');
  recompute();
  window.scrollTo({ top: 0, behavior: 'instant' });
});
$('#nightclear').addEventListener('click', () => {
  KEEPNIGHT = '';
  recompute();
});

// Stating a standpoint re-inks the second plate. It does NOT rebuild the sheet
// unless the reader is holding the overprint-only view, because rebuilding is
// where the scroll position and the frame budget both go.
function afterStandpoint() {
  bump('ra2.standpoint.set');
  $('#reg').classList.toggle('on', standpointStated());
  $('#standclear').classList.toggle('hide', !standpointStated());
  // Erase the country and the staircase goes with it: an ordering measured
  // from a standpoint nobody is standing in any more is not an ordering.
  const wasNear = NEAR;
  if (!(SP.where && SP.where !== 'ELSEWHERE' && CAPITALS[SP.where])) NEAR = false;
  if (ONLY || NEAR || wasNear) { recompute(); return; }
  redress();
  paintRail();
}

function paintRail() {
  // Before the corpus lands the margin is drawn at full height and empty. Not
  // zeroes: a page that prints "0 postings said they would hire from abroad"
  // for a hundred milliseconds has stated something the data does not say, and
  // that is the one rule here with no exceptions.
  const ready = ROLES.length > 0;
  const q = Q.trim().toLowerCase();
  // the country strip counts under the finder but not under its own selection,
  // so choosing a country never makes the other fourteen look empty
  const base = [];
  for (const i of ORDER) {
    const r = ROLES[i];
    if (q && !r.hay.includes(q)) continue;
    base.push(i);
  }
  const c = bearingCounts(VIEW);

  const tally = $('#tally');
  tally.replaceChildren();
  const total = Math.max(1, c.all);
  const seg = (cls, n) => { const s = el('i', cls); s.style.width = `${(n / total) * 100}%`; tally.append(s); };
  seg('b-open', c.reach); seg('b-silent', c.silent); seg('b-closed', c.closed);
  tally.setAttribute('aria-label', t('tally.aria', {
    reach: count(c.reach), silent: count(c.silent), closed: count(c.closed) }));

  const tk = $('#tkey');
  tk.replaceChildren();
  for (const [cls, key, n] of [['open', 'tally.reach', c.reach],
                               ['silent', 'tally.silent', c.silent],
                               ['closed', 'tally.closed', c.closed]]) {
    const row = el('div');
    row.append(el('span', `sw ${cls}`), el('span', null, t(key)),
               el('span', 'n', ready ? count(n) : ''));
    tk.append(row);
  }

  const ob = $('#onlybtn');
  ob.textContent = ONLY ? t('only.off') : t('only.on');
  ob.disabled = !ready || (c.reach === 0 && !ONLY);

  // The staircase control exists only once there is somewhere to measure from.
  const nb = $('#nearbtn');
  const canNear = !!(SP.where && SP.where !== 'ELSEWHERE' && CAPITALS[SP.where]);
  nb.classList.toggle('hide', !canNear);
  nb.textContent = NEAR ? t('near.off') : t('near.on');
  nb.setAttribute('aria-pressed', String(NEAR));

  // the standpoint's own note: what stating this actually did, in numbers
  const note = $('#standnote');
  note.replaceChildren();
  const say = (key, vars) => { const p = el('span', null, `${t(key, vars)} `); note.append(p); };
  if (!ready) { /* nothing to say yet, so nothing is said */ }
  else if (!standpointStated()) {
    say('sp.note.none', { n: count(TOTALS.said) });
  } else if (SP.where === 'ELSEWHERE') {
    say('sp.note.else', { n: count(c.reach), m: count(c.all) });
  } else if (SP.where) {
    const here = base.filter((i) => ROLES[i].cc.includes(SP.where)).length;
    say('sp.note.in', { country: cname(SP.where), n: count(here) });
  } else {
    say('sp.note.partial');
  }
  if (SP.reads.length) {
    say('sp.note.reads', { n: count(TOTALS.nonlatn), m: count(TOTALS.roles) });
  }
  if (SP.work === 'remote') say('sp.note.remote');

  // the countries, as bars. Navigation and geometry in one control: the bar is
  // the count and the magenta inside it is what said yes to somebody.
  const cl = $('#clist');
  cl.replaceChildren();
  const per = COUNTRIES.map((name) => {
    let n = 0, reach = 0;
    for (const i of base) {
      const r = ROLES[i];
      if (!r.cc.includes(name)) continue;
      n++;
      if (bearing(r) === 'reach') reach++;
    }
    return { name, n, reach };
  });
  const max = Math.max(1, ...per.map((p) => p.n));
  for (const p of per) {
    const b = el('button', 'crow');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(CSEL === p.name));
    b.setAttribute('aria-label', t('country.aria', { country: cname(p.name), n: count(p.n) }));
    b.append(el('span', 'cc2 mono', CODE[p.name]));
    const bar = el('span', 'cbar');
    const ink = el('i'); ink.style.width = `${(p.n / max) * 100}%`;
    const ov = el('u'); ov.style.width = `${(p.reach / max) * 100}%`;
    bar.append(ink, ov);
    b.append(bar, el('span', 'n', ready ? count(p.n) : ''));
    b.addEventListener('click', () => {
      CSEL = CSEL === p.name ? '' : p.name;
      bump('ra2.country');
      recompute();
      window.scrollTo({ top: 0, behavior: 'instant' });
    });
    cl.append(b);
  }

  paintFolds();
  paintNights();
  paintScope();
}

function paintScope() {
  const s = $('#scope');
  s.replaceChildren();
  // The last column changes what it holds with the ordering, so its head is
  // struck here rather than once at boot: under nearest-first it is a distance.
  $('#h-dt').textContent = NEAR ? t('ev.k.dist') : t('h.seen');
  if (!ROLES.length) return;
  const co = new Set();
  for (const i of VIEW) co.add(ROLES[i].co);
  const pair = (n, key) => {
    const w = el('span', 'pair');
    w.append(el('span', 'n', count(n)), document.createTextNode(`\u00a0${t(key)}`));
    return w;
  };
  s.append(pair(VIEW.length, 'scope.roles'), document.createTextNode(' \u00b7 '),
           pair(co.size, 'scope.companies'));
  // The sheet states the rule it was laid out by, always — the deal, or the
  // staircase, or the one night the reader asked to see again.
  if (KEEPNIGHT) s.append(el('span', null, ` · ${t('nights.only', { date: fmtDate(KEEPNIGHT, true) })}`));
  else if (NEAR) s.append(el('span', null, ` · ${t('scope.near')}`));
  else if (!Q.trim() && !CSEL && !ONLY && !KEEPSONLY) s.append(el('span', null, ` · ${t('scope.deal')}`));
}

function paintFolds() {
  const box = $('#folds');
  box.replaceChildren();
  const all = [...FOLDS.values()];
  $('#foldn').textContent = all.length ? count(all.length) : '';
  const stats = $('#keepstats');
  const only = $('#keepsonly');
  if (!all.length) {
    box.append(el('p', 'stnote', t('folds.none')));
    $('#goneline').classList.add('hide');
    $('#foldout').classList.add('hide');
    stats.classList.add('hide');
    only.classList.add('hide');
    return;
  }
  // A workbench orders itself by what is still open. The ones waiting on
  // somebody else come first, then the ones waiting on the reader, then the
  // ones that are finished with — which is the order they will be looked at in.
  const rank = { applied: 0, kept: 1, answered: 2 };
  all.sort((a, b) => {
    const d = rank[stageOf(a)] - rank[stageOf(b)];
    return d || (stageDate(b) < stageDate(a) ? -1 : 1);
  });
  const tally = { kept: 0, applied: 0, answered: 0 };
  for (const f of all) tally[stageOf(f)]++;
  stats.classList.remove('hide');
  stats.textContent = t('keeps.tally', {
    k: count(all.length), a: count(tally.applied + tally.answered), w: count(tally.answered) });

  let gone = 0;
  for (const f of all.slice(0, 12)) {
    // A fold missing from a PARTIAL sheet is missing from the sheet, not from
    // the board. Departure can only be read off a register that is all there.
    const isGone = URLSET.size > 0 && !PARTIAL && !URLSET.has(f.u);
    if (isGone) gone++;
    const st = stageOf(f);
    const row = el('div', `fold${isGone ? ' gone' : ''} ${st}`);
    const left = el('span');
    left.append(el('span', 't', f.t));
    left.append(el('span', 'c', isGone ? `${f.c} · ${t('folds.gone.mark')}` : f.c));
    left.append(el('span', 'st', t(`keep.on.${st}`, { date: fmtDate(stageDate(f), true) })));
    if (st !== 'answered' && !isGone) {
      const nextKey = st === 'kept' ? 'keep.do.applied' : 'keep.do.answered';
      const go = el('button', 'do', t(nextKey));
      go.type = 'button';
      go.setAttribute('aria-label', t('keep.do.aria', { do: t(nextKey), title: f.t }));
      go.addEventListener('click', () => step(f.u, 1));
      left.append(go);
    }
    const x = el('button', 'x', '×');
    x.type = 'button';
    x.setAttribute('aria-label', t('folds.remove', { title: f.t }));
    x.addEventListener('click', () => {
      if (f.an) markNight('answered', -1, f.an);

// ================================== the nights ===============================
// Visit seven. Every variant in round 2 greeted the SECOND visit with one
// banner and then had nothing to say on the seventh; the material was already
// in localStorage in all three and nobody spent it. This spends it, under the
// same rule as everything else on the magenta plate: a mark only where a fact
// exists. Blank paper is most of it, and blank paper here means a night this
// copy was not opened — which is not a zero, and is not drawn as one.
function nightList() {
  const keys = [...NIGHTS.keys()].sort();
  if (!keys.length) return { first: '', days: [] };
  const first = keys[0];
  const out = [];
  const end = Date.parse(`${today()}T00:00:00Z`);
  let at = Date.parse(`${first}T00:00:00Z`);
  while (at <= end && out.length < 400) {
    const d = new Date(at).toISOString().slice(0, 10);
    out.push({ d, rec: NIGHTS.get(d) || null });
    at += 86400000;
  }

}
function nightWords(rec) {

  if (rec.k) bits.push(t('night.kept', { n: count(rec.k) }));
  if (rec.a) bits.push(t('night.applied', { n: count(rec.a) }));
  if (rec.w) bits.push(t('night.answered', { n: count(rec.w) }));
  if (rec.ask) bits.push(t('night.asked'));
  if (rec.printed) bits.push(t('night.printed'));

}
const SHOWN_NIGHTS = 28;
function paintNights() {
  const box = $('#nights');

  const scale = $('#nightscale');
  scale.replaceChildren();
  const note = $('#nightnote');
  const clear = $('#nightclear');
  if (!days.length) { note.textContent = ''; clear.classList.add('hide'); return; }
  const drawn = days.slice(-SHOWN_NIGHTS);
  box.setAttribute('aria-label', t('nights.aria', { date: fmtDate(drawn[0].d, true) }));
  const now = today();
  for (const { d, rec } of drawn) {
    const has = nightTouched(rec);
    const cell = el(has ? 'button' : 'span', 'nt');
    if (rec && rec.r) cell.classList.add('read');
    if (d === now) cell.classList.add('today');
    const st = rec && rec.w ? 'answered' : rec && rec.a ? 'applied' : rec && rec.k ? 'kept' : '';
    if (st) { cell.classList.add(st); cell.append(el('i')); }
    const words = nightWords(rec);
    cell.setAttribute('aria-label', t('night.aria', { date: fmtDate(d, true), what: words }));
    cell.title = `${fmtDate(d, true)}${words ? ` — ${words}` : ''}`;
    if (has) {
      cell.type = 'button';
      cell.setAttribute('aria-pressed', String(KEEPNIGHT === d));
      cell.addEventListener('click', () => {
        KEEPNIGHT = KEEPNIGHT === d ? '' : d;
        KEEPSONLY = false;

      });
    }

  }

  scale.append(el('span', null, fmtDate(drawn[0].d, true)));
  if (drawn.length > 1) scale.append(el('span', null, fmtDate(drawn[drawn.length - 1].d, true)));

}

// ================================== the gauge ================================
// r01-c's idea, carried one step: depth at true scale, and every reachable line
// struck at its own depth, so the shape of what is open to you in the whole
// sheet is visible before you have scrolled to any of it.
const GA = $('#gauge');
let REACH = [];          // indices into rowEls, rebuilt by redress()
let gaugeAt = -1, gaugeN = -1;
function paintGauge() {
  const ctx = GA.getContext('2d');
  const W = GA.width, H = GA.height;
  ctx.clearRect(0, 0, W, H);
  const n = rowEls.length;
  // An empty sheet has no depth and no extent. r02-a left the last extent it
  // drew standing here, so a search that found two lines was measured against
  // "of 300 printed" — a number belonging to a sheet that was no longer there.
  if (!n) {
    $('#depthnow').textContent = count(0);
    $('#gaugenote').textContent = '';
    gaugeAt = -1; gaugeN = -1;
    return;
  }
  const full = rowTop(n) + evHeight;
  ctx.fillStyle = '#F0ECE3';
  ctx.fillRect(0, 0, W, H);
  // The reachable lines, from the index REDRESS built. Walking all 6,423 rows
  // and asking each one for a class was ~40ms a frame on a throttled machine —
  // a gauge that made the scrolling it measures stutter.
  // Drawn as a DENSITY, not as a set of strikes. At true scale nineteen lines
  // share one pixel row, and a strike that inks the whole row for one of them
  // turned 543 reachable lines into a gauge that looked seven-tenths full —
  // a drawing that overclaimed what the tally right above it counts correctly.
  // Each pixel row is now inked in proportion to how much of it is reachable,
  // with a floor so that a single line on its own is still a visible tick.
  ctx.fillStyle = '#C4006B';
  const rows = Math.max(1, n / H);
  const band = new Float64Array(H);
  for (const i of REACH) {
    const y = Math.min(H - 1, Math.max(0, Math.floor((rowTop(i) / full) * H)));
    band[y]++;
  }
  for (let y = 0; y < H; y++) {
    if (!band[y]) continue;
    ctx.globalAlpha = Math.min(1, Math.max(0.22, band[y] / rows));
    ctx.fillRect(0, y, W, 1);
  }
  ctx.globalAlpha = 1;
  // where the reader is: the viewport, drawn as a window
  const box = SHEET.getBoundingClientRect();
  const top = -box.top;
  const y0 = Math.max(0, (top / full) * H);
  const y1 = Math.min(H, ((top + window.innerHeight) / full) * H);
  ctx.strokeStyle = '#16181A';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, Math.max(1, y0), W - 2, Math.max(2, y1 - y0));
  // Formatting a number through Intl every frame is not free either; the
  // readout only changes when the line under the top of the sheet changes.
  const at = Math.max(1, Math.min(n, indexAtY(Math.max(0, top)) + 1));
  if (at !== gaugeAt) { gaugeAt = at; $('#depthnow').textContent = count(at); }
  if (n !== gaugeN) { gaugeN = n; $('#gaugenote').textContent = t('gauge.of', { n: count(n) }); }
}
const topAt = (n) => rowTop(n) + (openIdx >= 0 && n > openIdx ? evHeight : 0);
function indexAtY(y) {
  let lo = 0, hi = Math.max(0, rowEls.length - 1);
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (topAt(mid) <= y) lo = mid; else hi = mid - 1; }
  return lo;
}
let gaugeTick = 0;
addEventListener('scroll', () => {
  if (gaugeTick) return;
  gaugeTick = requestAnimationFrame(() => { gaugeTick = 0; paintGauge(); });
}, { passive: true });
GA.addEventListener('click', (e) => {
  const n = rowEls.length;
  if (!n) return;
  const r = GA.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  const box = SHEET.getBoundingClientRect();
  const sheetTop = box.top + window.scrollY;
  window.scrollTo({ top: sheetTop + frac * (rowTop(n) + evHeight) - 80, behavior: 'instant' });
});

// =============================== the revision slip ===========================
// The corpus diffs itself nightly and this is the reader's half of that diff.
// It states appearances because first-seen carries them, and it states nothing

// place this page CAN report a disappearance is the reader's own folds.
let SLIP = null;             // what the diff found, computed once per load
function computeSlip() {
  const last = LS.get('ra2.lastsnapshot');
  const visits = bump('ra2.visits');
  let gone = 0;
  for (const f of FOLDS.values()) if (!URLSET.has(f.u)) gone++;
  LS.set('ra2.lastsnapshot', snapshot);
  LS.set('ra2.lastread', new Date().toISOString().slice(0, 10));
  if (!last || visits <= 1) { SLIP = null; renderSlip(); return; }
  let appeared = 0, mine = 0;
  if (last !== snapshot) {

      // An unconfirmed first sighting means we had not read that board the
      // night before, which is not the same as the role not being there.
      if (!r.seen || !r.conf || r.seen <= last) continue;
      appeared++;
      if (SP.where && SP.where !== 'ELSEWHERE' && r.cc.includes(SP.where)) mine++;
    }

}

  } else {
    const p = el('p');
    p.append(document.createTextNode(`${t('slip.since.a', { date: fmtDate(SLIP.last, true) })} `));
    p.append(el('span', 'num', count(SLIP.appeared)));
    p.append(document.createTextNode(` ${t('slip.since.b')}`));
    if (SLIP.where && SLIP.where !== 'ELSEWHERE') {
      p.append(document.createTextNode(' '));
      p.append(el('span', 'num', count(SLIP.mine)));
      p.append(document.createTextNode(` ${t('slip.since.mine', { country: cname(SLIP.where) })}`));
    }

  }

    p.append(el('span', 'num', count(SLIP.gone)));
    p.append(document.createTextNode(` ${t('slip.foldsgone')}`));
    slip.append(p);

  // Round 2 greeted the second visit and had nothing to say on the seventh;
  // this line is different on the seventh because it is built out of them.
  const { first, days } = nightList();
  if (days.length > 1) {
    const opened = days.filter((x) => x.rec && x.rec.r).length;
    slip.append(el('p', 'quiet', t('nights.since', {
      n: count(opened), m: count(days.length), date: fmtDate(first, true) })));
  }

}

// ==================================== the ask ================================
// Bound in at the line the free printing stops, never over the register, never

let askShown = false;

function paintAsk(shown) {
  const ask = $('#ask');
  ask.replaceChildren();
  if (entitled || VIEW.length <= FREE) { ask.classList.add('hide'); return; }
  // Nothing is asked until the provider has answered. A copy where Clerk is
  // blocked prints in full four seconds later, and a card that flashed up in
  // the meantime would have counted an ask this page then withdrew — which is
  // the one thing a gate that exists to MEASURE must not do to its own numbers.
  if (clerkState === 'waiting') { ask.classList.add('hide'); return; }
  const rest = VIEW.length - shown;
  // Asked once and declined: the card said nothing here would ask again on this
  // visit, so nothing here does. The offer stays as one line, because stranding
  // a reader who said no at line 300 would be a punishment, not an answer.
  if (declinedHere) {
    const card = el('div', 'card quiet');
    card.append(el('p', null, t('ask.declined')));
    const acts = el('div', 'askacts');
    acts.append(printButton());
    card.append(acts, askHistory());
    ask.append(card);
    ask.classList.remove('hide');
    return;
  }
  const co = new Set(); const cs = new Set();
  for (const i of VIEW) { co.add(ROLES[i].co); for (const x of ROLES[i].cc) cs.add(x); }
  const card = el('div', 'card');
  card.append(el('h2', null, t('ask.h')));

  const p1 = el('p');
  p1.append(el('span', 'num', count(shown)), document.createTextNode(` ${t('ask.p1.a')} `));
  p1.append(el('span', 'num', count(rest)), document.createTextNode(` ${t('ask.p1.b', {
    co: count(co.size), cs: count(cs.size) })}`));
  card.append(p1);
  card.append(el('p', null, t('ask.p2')));
  card.append(el('p', 'fine', t('ask.p3')));

  const acts = el('div', 'askacts');
  if (clerkState === 'out') {
    const yes = el('button', 'yes', t('ask.signin'));
    yes.type = 'button';
    yes.addEventListener('click', () => {
      bump('ra2.ask.click');
      try { window.Clerk.openSignIn(); } catch { /* a provider that will not open */ }
    });

  }
  acts.append(printButton());

  no.type = 'button';
  no.addEventListener('click', () => {
    LS.set('ra2.ask.answer', 'declined');
    bump('ra2.ask.declined');
    markNight('declined');
    declinedHere = true;
    paintAsk(shown);
    paintPlate();
  });
  acts.append(no);
  card.append(acts);
  card.append(askHistory());
  ask.append(card);
  ask.classList.remove('hide');
  if (!askShown) {
    askShown = true; bump('ra2.ask.shown'); markNight('ask'); paintPlate();
  }
}
// The one control that keeps its word: it prints the rest, it keeps the place,

function printButton() {

// What round 2 printed here was `asked 1 · signed in 0 · printed anyway 0 ·

// ================================ empty states ===============================
// The dead end round 1 left a Japanese reader in: type a Japanese word, get
// zero, and the page shrugs. The evidence stays in its source language — that
// is correct and it is not an answer. So the page says WHY there is nothing,

    if (!r.hay.includes(q)) continue;
    if (ONLY && bearing(r) !== 'reach') continue;
    if (KEEPSONLY && !FOLDS.has(r.u)) continue;
    if (KEEPNIGHT && !touchedOn(FOLDS.get(r.u), KEEPNIGHT)) continue;

  const slot = $('#emptyslot');

      g.append(b);
    }
    if (CSEL) {
      const b = el('button', null, t('empty.clear.country', { country: cname(CSEL) }));
      b.type = 'button';
      b.addEventListener('click', () => { CSEL = ''; recompute(); });
      g.append(b);
    }

      b.type = 'button';

}
// Not a filter the reader can compose: one shot, from the empty state, at the

// ================================= the keyboard ==============================

  const [vt, vb] = visibleRange();
  // The re-seat. A cursor is attention, not a data structure: if it is not on
  // screen it does not get to decide where the next line is — the eye does.
  let from = cur;
  if (from < 0 || from < vt || from > vb) from = d > 0 ? vt - 1 : vb + 1;
  focusRow(Math.max(0, Math.min(rowEls.length - 1, from + d)));
}
addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (e.key === 'Escape') {
    if (!$('#keypanel').hidden) { closeKey(); return; }
    if (typing) { e.target.blur(); return; }
    if (openIdx >= 0) { const n = openIdx; closeEv(); focusRow(n); return; }
    return;
  }
  if (typing) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key) {
    case 'j': case 'ArrowDown': e.preventDefault(); moveCursor(1); break;
    case 'k': case 'ArrowUp': e.preventDefault(); moveCursor(-1); break;
    case 'Enter': if (cur >= 0) { e.preventDefault(); openEv(cur); } break;
    case 'f': if (cur >= 0) { e.preventDefault(); toggleFold(VIEW[cur]); } break;
    // Only where a fact exists, on the keyboard too: `a` does nothing to a line
    // whose corner is not folded, because there is no application without a
    // role the reader has already said they want.
    case 'a': if (cur >= 0 && FOLDS.has(ROLES[VIEW[cur]].u)) {
      e.preventDefault(); step(ROLES[VIEW[cur]].u, 1);
    } break;
    case 'o': e.preventDefault(); $('#onlybtn').click(); break;
    case '/': e.preventDefault(); $('#q').focus(); $('#q').select(); break;
    case 'g': e.preventDefault(); window.scrollTo({ top: 0, behavior: 'instant' }); focusRow(0, false); break;
    case 'G': e.preventDefault(); focusRow(rowEls.length - 1); break;
    case '?': e.preventDefault(); openKey(); break;
    default: break;
  }
});
SHEET.addEventListener('click', (e) => {
  const fd = e.target.closest('.fd');
  const row = e.target.closest('.r');
  if (!row) return;
  const n = parseInt(row.dataset.n, 10);
  if (fd) { toggleFold(VIEW[n]); return; }
  if (e.target.closest('.open')) { focusRow(n, false); openEv(n); }
});

// ================================ the bookplate ==============================
// Kept from r01-a, which is the one thing round 1 agreed it got right: every
// byte this copy holds about the reader, printed back to the reader, beside the
// control that burns it. A page that measures somebody owes them the reading.
function paintPlate() {
  const body = $('#platebody');
  body.replaceChildren();
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('ra2.')) keys.push(k);
    }
  } catch { /* private mode holds nothing, which is the honest answer */ }
  if (!keys.length) { body.append(el('p', 'none', t('plate.none'))); return; }
  // The plate reads the record back in the reader's own language before it
  // reads it back in the browser's. Both, in that order: the sentence is what a
  // person can check, and the keys are what is actually being held.
  const { first, days } = nightList();
  if (days.length) {
    const opened = days.filter((x) => x.rec && x.rec.r).length;
    body.append(el('p', 'none', days.length <= 1 ? t('nights.first')
      : t('nights.since', { n: count(opened), m: count(days.length), date: fmtDate(first, true) })));
  }
  if (FOLDS.size) {
    let ap = 0, an = 0;
    for (const f of FOLDS.values()) { const s = stageOf(f); if (s !== 'kept') ap++; if (s === 'answered') an++; }
    body.append(el('p', 'none', t('keeps.tally', {
      k: count(FOLDS.size), a: count(ap), w: count(an) })));
  }
  body.append(askHistory());
  body.append(el('p', 'micro', t('plate.raw')));
  keys.sort();
  const dl = el('dl');
  for (const k of keys) {
    const v = LS.get(k) || '';
    dl.append(el('dt', null, k), el('dd', null, v.length > 220 ? `${v.slice(0, 220)}…` : v));
  }
  body.append(dl);
}

$('#burn').addEventListener('click', () => {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('ra2.')) keys.push(k);
    }
    for (const k of keys) LS.del(k);
  } catch { /* nothing to burn */ }
  FOLDS = new Map();
  NIGHTS = new Map();
  SP.where = ''; SP.reads = []; SP.work = '';
  KEEPSONLY = false; KEEPNIGHT = ''; NEAR = false;
  // The kept copy went with the rest of the ra2. keys, which is correct: it is
  // this browser's copy of a sheet, held for this reader, and burning the
  // record means burning it. It will be written again on the next good load.
  // `entitled` is deliberately left alone. Burning the record erases what this
  // copy remembers about the reader; it does not take back the lines already
  // printed for them. Re-abridging the sheet here would put the card back on
  // screen and count a fresh ask one pixel after somebody asked to be
  // forgotten, which is the toll booth behaviour, and it would leave the
  // bookplate reading `ra2.ask.shown 1` immediately after saying it was empty.
  // The erased state is honoured on the next load, where it belongs.
  SLIP = null; renderSlip();
  buildRail();
  $('#reg').classList.remove('on');
  $('#standclear').classList.add('hide');
  // recompute rather than build: burning the record also cleared the two
  // filters that were reading it, and the sheet has to be re-selected before
  // it is re-laid, or it prints a view of a record that no longer exists.
  recompute();
  paintPlate();
});

fetch(src, { cache: 'no-cache' })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
  .then(async (data) => {
    const found = await descriptionsReady;
    DESCRIPTIONS = found && typeof found === 'object' && !Array.isArray(found) ? found : {};
    const rep = await buildReady;
    BUILDREP = rep && typeof rep === 'object' && !Array.isArray(rep) ? rep : null;
    // first-seen is written grouped by night, because that is how it is diffed
    // one build at a time; the page asks the inverse question 6,423 times.
    const seenDoc = await firstSeenReady;
    FIRSTSEEN = new Map();
    for (const [day, buckets] of Object.entries((seenDoc && seenDoc.dates) || {})) {
      for (const [kind, urls] of Object.entries(buckets || {})) {
        if (!Array.isArray(urls)) continue;
        for (const u of urls) FIRSTSEEN.set(u, { date: day, confirmed: kind === 'confirmed' });
      }
    }
    load(data);
  })
  .catch((e) => {
    // Offline, 404, a half-written file: whatever the reason, the register is
    // unreadable tonight and this browser may still be holding last night's.
    fallback({ kind: 'load', msg: `${src} — ${e.message}` });
  });

<!-- Accounts. Clerk holds the users, the sessions and the password resets; this
     project holds none of them and stores no credential.

     THE KEY BELOW IS PUBLIC BY DESIGN. The one that must never appear here is
     the SECRET key (`sk_`), which grants admin over every account.

     PINNED TO @5 DELIBERATELY: `@latest` still serves a v4 build, so the tag
     every quickstart reaches for would load v4 under code written against v5. -->
<script
  async crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_cmVndWxhci10cm9sbC01MC5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://regular-troll-50.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
></script>
<script>
// Auth is ADDITIVE and these guards are the whole point of it. The register is
// a public document that must render when Clerk is blocked, offline, slow or
// broken — so nothing here runs before the data, nothing here can throw into
// the page, and a failed load leaves the title block exactly as it was: no
// control at all, rather than a Sign in that cannot sign anybody in.
window.addEventListener('load', async () => {
  const slot = document.getElementById('account');
  const giveUp = () => {
    clearTimeout(CLERK_WAIT);
    if (clerkState !== 'waiting') return;
    clerkState = 'absent';
    bump('ra2.ask.noask');
    entitled = true;
    if (COMPANIES.length) { build(); paintRail(); }
    paintPlate();
  };
  if (!slot || !window.Clerk) { giveUp(); return; }
  try {
    // afterSignOutUrl is THIS url, deliberately: Clerk's default sends the
    // reader to `/` and drops the query string, which on this page is the
    // finder, the country and the overprint switch. Signing out should cost
    // you your name, not your place on the sheet.
    await window.Clerk.load({ afterSignOutUrl: location.href });
  } catch { giveUp(); return; }
  clearTimeout(CLERK_WAIT);
  const paintAccount = () => {
    slot.replaceChildren();
    const signedIn = !!window.Clerk.user;
    if (signedIn) {
      const mount = document.createElement('div');
      slot.append(mount);
      window.Clerk.mountUserButton(mount);
    } else {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t('acct.signin');
      b.addEventListener('click', () => { try { window.Clerk.openSignIn(); } catch { /* will not open */ } });
      slot.append(b);
    }
    slot.dataset.ready = '';
    clerkState = signedIn ? 'in' : 'out';
    if (signedIn) {
      entitled = true;
      if (LS.get('ra2.ask.answer') !== 'printed') {
        LS.set('ra2.ask.answer', 'signed');
        if (!num('ra2.ask.signed')) bump('ra2.ask.signed');
        const rec = NIGHTS.get(today());
        if (!rec || !rec.signed) markNight('signed');
      }
    } else {
      entitled = LS.get('ra2.bypass') === '1';
    }
    // Re-render on any change the provider made, including the one the ask
    // reads to decide whether it may offer a sign-in button at all.
    if (COMPANIES.length) {
      const y = window.scrollY;
      build();
      window.scrollTo({ top: y });
      paintRail();
    }
    paintPlate();
  };
  repaintAccount = paintAccount;   // so an edition change can restrike its one string
  paintAccount();
  window.Clerk.addListener(paintAccount);
});
</script>
