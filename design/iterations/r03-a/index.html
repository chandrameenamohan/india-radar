<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROLE·ATLAS</title>
<!-- A missing favicon is a 404, and a 404 is a failed network request the gate
     would have to explain. One data: URI is cheaper than an icon file. -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ====================== r02-a — THE OVERPRINT ============================
     An atlas sheet is printed in plates, one per colour, registered to each
     other. The base plate here is the register: 371 companies, 6,423 roles,
     black, identical for everyone, never rearranged to flatter anybody.
     The SECOND plate is the reader. Where they stand, what they can reach,
     what they folded, what has been surveyed since they last read — all of it
     is magenta, printed OVER the base and nowhere else.

     That gives the page one rule it can be held to: the overprint may only be
     laid where a fact exists. A board that said nothing about hiring from
     abroad gets no magenta, because there is nothing to print. 5,671 of the
     6,423 roles here are in exactly that state, and the sheet's honest
     appearance under a standpoint is mostly bare — which is the finding.

     Magenta as the revision colour is not decoration either: it is what an
     Ordnance Survey sheet and an aeronautical chart both overprint in. */
  :root {
    --sheet:  #FBFAF7;   /* survey paper, warm */
    --ink:    #16181A;   /* the base plate */
    --ink-2:  #53585D;   /* prose that is not the claim */
    --ink-3:  #656B72;   /* apparatus: labels, marginalia. Measured, not
                            picked: this is the lightest grey that still clears
                            WCAG AA at 10px on all three grounds this page has
                            (paper 5.16, plate 4.57, wash 4.57). The first pass
                            shipped #7E848A, which is 3.62 and a fail. */
    --rule:   #DEDAD1;   /* hairline */
    --rule-2: #16181A;   /* structural rule */
    --plate:  #F0ECE3;   /* the one fill */
    --over:   #C4006B;   /* THE OVERPRINT. The reader, and only the reader. */
    --over-2: #8E0A55;   /* overprint on a wash, for contrast */
    --wash:   #FCE7F1;   /* overprint wash */
    --wash-2: #FBF0F4;   /* the faintest tint the reader's plate lays down */
    --gut:    1.6rem;
    --rowh:   30px;      /* fixed, so the gauge can be true to scale */
    --rail:   20.5rem;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    margin: 0; padding: 0; background: var(--sheet); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }
  ::selection { background: var(--wash); color: var(--ink); }
  /* Focus is the reader, so focus is magenta. Same plate as the standpoint,
     the cursor and the folds — one colour, one meaning, no exceptions. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--over); outline-offset: 1px; border-radius: 1px;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0;
           cursor: pointer; text-align: inherit; }
  .mono, .num { font-family: "IBM Plex Mono", ui-monospace, monospace;
                font-variant-numeric: tabular-nums; }
  .micro { font-size: 10.5px; line-height: 1.15; text-transform: uppercase;
           letter-spacing: .13em; font-weight: 600; color: var(--ink-3); }
  .hide { display: none !important; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }

  /* ------------------------------ title block ---------------------------- */
  /* A drafting sheet states its own particulars in a ruled block: what it is,
     what it was surveyed from, what one line on it means. This is that block,
     and the scale line is the page's promise to the gauge further down. */
  .block {
    border-bottom: 1.5px solid var(--rule-2);
    padding: 0 var(--gut);
  }
  .blockgrid {
    max-width: 96rem; margin-inline: auto;
    display: grid; grid-template-columns: minmax(0,1.5fr) repeat(3, minmax(0,1fr));
    gap: 0; align-items: stretch;
  }
  .cell { padding: .95rem 1rem .85rem 0; border-inline-end: 1px solid var(--rule);
          display: flex; flex-direction: column; gap: .3rem; }
  .cell + .cell { padding-inline-start: 1rem; }
  .cell:last-child { border-inline-end: 0; padding-inline-end: 0; }
  h1 { margin: 0; font-size: clamp(1.55rem, 3.6vw, 2.35rem); font-weight: 700;
       letter-spacing: -.035em; line-height: .95; text-transform: uppercase; }
  h1 .dot { color: var(--ink-3); font-weight: 400; }
  .thesis { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; max-width: 34ch; }
  .cell .v { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .cell .v.sm { font-size: 13px; }

  /* the reader's own controls sit in the last cell, and they are the only
     things in the title block that are not about the survey */
  .youbar { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
  .youbar select {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--ink);
    background: var(--sheet); border: 1px solid var(--rule-2);
    padding: .3rem 1.4rem .3rem .45rem; border-radius: 0; cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: right .62rem center, right .38rem center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  html[dir="rtl"] .youbar select { background-position: left .62rem center, left .38rem center; }
  .account { display: none; }
  .account[data-ready] { display: flex; align-items: center; min-height: 1.5rem; }
  .account button { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                    font-weight: 600; border: 1px solid var(--rule-2);
                    padding: .32rem .6rem; }
  .account button:hover { background: var(--ink); color: var(--sheet); }

  /* --------------------------- the two plates ---------------------------- */
  .body {
    max-width: 96rem; margin-inline: auto; padding-inline: var(--gut);
    display: grid; grid-template-columns: var(--rail) minmax(0, 1fr);
    gap: 0 2rem; align-items: start;
  }
  /* the margin: everything the reader states and everything drawn from it */
  #rail {
    position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
    padding: 1.1rem 1rem 3rem 0; border-inline-end: 1px solid var(--rule);
    scrollbar-width: thin;
  }
  .sect { padding-bottom: 1.05rem; margin-bottom: 1.05rem;
          border-bottom: 1px solid var(--rule); }
  .sect:last-child { border-bottom: 0; }
  .sect > h2 { margin: 0 0 .55rem; font-size: 10.5px; line-height: 1.15;
               text-transform: uppercase; letter-spacing: .13em; font-weight: 600;
               color: var(--ink-3); display: flex; justify-content: space-between;
               gap: .5rem; align-items: baseline; }

  /* ---------------------------- the standpoint --------------------------- */
  /* Nine selects were the incumbent's control and r01-a shipped them again.
     This is what replaced them: not a filter bank but three first-person
     statements, because the question the register could never answer was
     never "which department" — it was "could I do any of this". Nothing here
     is inferred. A reader who states nothing is overprinted with nothing. */
  #stand { border: 1.5px solid var(--over); padding: .7rem .75rem .8rem; }
  #stand h2 { color: var(--over-2); margin-bottom: .5rem; }
  .stmt { margin-bottom: .7rem; }
  .stmt:last-child { margin-bottom: 0; }
  .stmt > .lbl { display: block; font-size: 11px; color: var(--ink-2);
                 margin-bottom: .3rem; }
  .stmt select {
    width: 100%; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--sheet); border: 1px solid var(--over);
    padding: .34rem 1.5rem .34rem .45rem; border-radius: 0; cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--over) 50%),
                      linear-gradient(135deg, var(--over) 50%, transparent 50%);
    background-position: right .7rem center, right .46rem center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  html[dir="rtl"] .stmt select { background-position: left .7rem center, left .46rem center; }
  .chips { display: flex; flex-wrap: wrap; gap: .28rem; }
  .chip {
    font-size: 12px; line-height: 1; padding: .34rem .45rem;
    border: 1px solid var(--rule-2); color: var(--ink); background: var(--sheet);
    min-height: 26px; display: inline-flex; align-items: center;
  }
  .chip[aria-pressed="true"] { border-color: var(--over); background: var(--wash);
                               color: var(--over-2); font-weight: 600; }
  .stnote { font-size: 11.5px; line-height: 1.35; color: var(--ink-2);
            margin: .6rem 0 0; }
  /* The note is blank until the corpus lands and then says four lines. Its
     height is reserved so the margin does not jolt when the numbers arrive —
     on a phone the register sits directly under it. */
  #standnote { min-height: 62px; }
  .stnote b { font-weight: 600; color: var(--ink); }
  #standclear { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                font-weight: 600; color: var(--over-2);
                border-bottom: 1px solid var(--over); }

  /* ------------------------------- the tally ----------------------------- */
  /* Three widths that add to the register. Nothing here is a percentage the
     page rounds up: the bar is the count. The silent band is the widest and
     is meant to be — a reader should see, before they read one row, how much
     of this corpus has said nothing about them. */
  .tally { display: flex; height: 12px; border: 1px solid var(--rule-2); }
  .tally i { display: block; height: 100%; }
  .tally .b-open   { background: var(--over); }
  .tally .b-silent { background: var(--sheet);
    background-image: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 4px); }
  .tally .b-closed { background: var(--ink); }
  .tkey { margin: .5rem 0 0; display: grid; gap: .28rem; }
  .tkey > div { display: grid; grid-template-columns: 10px minmax(0,1fr) auto;
                gap: .45rem; align-items: baseline; font-size: 11.5px;
                color: var(--ink-2); }
  .tkey .sw { width: 10px; height: 10px; border: 1px solid var(--rule-2);
              align-self: center; }
  .tkey .sw.open { background: var(--over); border-color: var(--over); }
  .tkey .sw.silent { background-image: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 4px); }
  .tkey .sw.closed { background: var(--ink); }
  .tkey .n { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums;
             font-size: 11.5px; color: var(--ink); }
  #onlybtn {
    margin-top: .7rem; width: 100%; font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; font-weight: 600; border: 1px solid var(--over);
    color: var(--over-2); padding: .45rem; min-height: 32px;
  }
  #onlybtn[aria-pressed="true"] { background: var(--over); color: #fff; }
  #onlybtn[disabled] { border-color: var(--rule); color: var(--ink-3); cursor: default; }

  /* ------------------------------- the gauge ----------------------------- */
  /* Stolen from r01-c, which was the only variant in round 1 with an honest
     answer to "make 6,423 feel like abundance rather than a wall": a gauge
     drawn at true scale rather than a scrollbar. This one carries a second
     plate too — every reachable role is one magenta hairline at its own
     depth, so the shape of your chances in the whole sheet is visible before
     you scroll to any of them. */
  .gaugewrap { display: grid; grid-template-columns: 30px minmax(0,1fr);
               gap: .6rem; align-items: stretch; }
  #gauge { display: block; width: 30px; height: 168px; border: 1px solid var(--rule-2);
           background: var(--sheet); cursor: pointer; }
  .gmeta { display: flex; flex-direction: column; justify-content: flex-start;
           gap: .1rem; font-size: 11.5px; color: var(--ink-2); }
  .gmeta .big { font-family: "IBM Plex Mono", monospace; font-size: 1.35rem;
                font-weight: 500; color: var(--ink); line-height: 1;
                font-variant-numeric: tabular-nums; }

  /* ----------------------------- the countries --------------------------- */
  .clist { display: grid; gap: 1px; }
  .crow { display: grid; grid-template-columns: 2.1rem minmax(0,1fr) 3.2rem;
          gap: .4rem; align-items: center; width: 100%; padding: .18rem 0;
          font-size: 12px; min-height: 26px; }
  .crow:hover .cbar { outline: 1px solid var(--ink-3); }
  .crow[aria-pressed="true"] { font-weight: 600; }
  .crow[aria-pressed="true"] .cc2 { background: var(--ink); color: var(--sheet); }
  .cc2 { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
         letter-spacing: .04em; padding: .1rem .18rem; text-align: center; }
  .cbar { position: relative; height: 9px; background: var(--plate); }
  .cbar i { position: absolute; inset-block: 0; inset-inline-start: 0;
            background: var(--ink); display: block; }
  .cbar u { position: absolute; inset-block: 0; inset-inline-start: 0;
            background: var(--over); display: block; height: 100%; }
  .crow .n { font-family: "IBM Plex Mono", monospace; font-size: 11px;
             text-align: end; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* -------------------------------- the folds ---------------------------- */
  /* A book you actually use has folded corners. They are the reader's marks,
     so they are the reader's colour, and they are the one thing on this page
     that can report a disappearance: the register carries no departures, but
     a fold the corpus no longer holds is a role that is gone. */
  .folds { display: grid; gap: .3rem; }
  .fold { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .4rem;
          align-items: start; font-size: 12px; line-height: 1.3; }
  .fold .t { display: block; }
  .fold .c { display: block; color: var(--ink-3); font-size: 11px; }
  .fold.gone .t { text-decoration: line-through; color: var(--ink-3); }
  .fold .x { color: var(--over-2); font-size: 15px; line-height: 1;
             min-width: 26px; min-height: 26px; }
  .goneline { font-size: 11.5px; color: var(--ink-2); margin: .5rem 0 0; }
  #foldout { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
             font-weight: 600; border-bottom: 1px solid var(--rule-2); margin-top: .6rem;
             display: inline-block; }
  /* the state a fold is in, and the one control that advances it */
  .fold .st { display: block; font-size: 11px; color: var(--over-2); font-weight: 600;
              letter-spacing: .02em; }
  .fold .do { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em;
              font-weight: 600; color: var(--over-2); border: 1px solid var(--over);
              padding: .18rem .4rem; margin-top: .28rem; min-height: 26px;
              display: inline-flex; align-items: center; }
  .fold .do:hover { background: var(--over); color: #fff; }
  .keepstats { font-size: 11px; color: var(--ink-2); margin: 0 0 .5rem;
               font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  #keepsonly { margin-top: .6rem; width: 100%; font-size: 11px; text-transform: uppercase;
               letter-spacing: .1em; font-weight: 600; border: 1px solid var(--over);
               color: var(--over-2); padding: .4rem; min-height: 32px; }
  #keepsonly[aria-pressed="true"] { background: var(--over); color: #fff; }

  /* ------------------------------- the nights ----------------------------- */
  /* The reader's own plate, as a run of nights. The overprint rule holds here
     exactly as it holds over the register: a mark is laid only where a fact
     exists, and a week of somebody's life is mostly nothing — so most of this
     strip is blank paper, and that is the honest shape of it. A night this
     copy was not opened is not drawn as a zero, because a zero would be a
     claim about a night nobody here was present for. */
  .nights { display: flex; gap: 2px; align-items: stretch; }
  /* The cells are the register's own fill, because a night is the survey's
     unit and the survey ran on every one of them. What the READER did on a
     night is the only thing printed in magenta over it — so an unmarked cell
     is a night that existed and was not opened, which is what the note says. */
  /* max-width so that one night is a division of a ruler rather than a block
     the width of the margin: on the first night there is only one cell */
  .nt { flex: 1 1 0; min-width: 5px; max-width: 44px; height: 30px; position: relative;
        border: 0; padding: 0; background: var(--plate); display: block; }
  .nt::after { content: ""; position: absolute; inset-inline: 0; bottom: 0;
               height: 1px; background: var(--rule); }
  .nt.read::after { height: 2px; background: var(--over); }
  .nt > i { position: absolute; inset-inline: 0; bottom: 2px; display: block;
            background: var(--over); }
  .nt.kept    > i { height: 4px; }
  .nt.applied > i { height: 14px; }
  .nt.answered > i { height: 24px; }
  /* an answered night is punched: the paper shows through the top of the mark */
  .nt.answered > i::after { content: ""; position: absolute; inset-inline: 0;
                            top: 3px; height: 3px; background: var(--sheet); }
  .nt.today { outline: 1px dotted var(--ink-3); outline-offset: 1px; }
  .nt[aria-pressed="true"] { outline: 1.5px solid var(--over); outline-offset: 1px; }
  button.nt { cursor: pointer; }
  .nightscale { display: flex; justify-content: space-between; font-size: 10px;
                color: var(--ink-3); font-family: "IBM Plex Mono", monospace;
                margin-top: .25rem; }
  #nightnote { margin-top: .45rem; }
  #nightclear { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
                font-weight: 600; color: var(--over-2); margin-top: .4rem;
                border-bottom: 1px solid var(--over); display: inline-block; }

  /* --------------------------- nearest first ------------------------------ */
  /* Stolen from r02-c, which found the best wordless answer to "what could I
     do": state where you stand and the register becomes a staircase. The
     control does not exist until a country has been stated, because until then
     there is nothing to measure from. */
  #nearbtn { margin-top: .7rem; width: 100%; font-size: 11px; text-transform: uppercase;
             letter-spacing: .1em; font-weight: 600; border: 1px solid var(--over);
             color: var(--over-2); padding: .45rem; min-height: 32px; }
  #nearbtn[aria-pressed="true"] { background: var(--over); color: #fff; }
  .r .km { font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
           color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* ----------------------------- the kept copy ---------------------------- */
  /* The morning after the build moves. A renderer must not guess at a contract
     it does not hold — but an apology with no register is just an empty page,
     and this browser is holding last night's sheet. So the copy prints, and
     every part of the page that could be mistaken for tonight says otherwise.
     This furniture is INK, not magenta: a stale register is a fact about the
     survey, and the reader's plate does not get to speak for it. */
  body.stale { --sheet: #F5F3EE; }
  #stale { border: 1.5px solid var(--rule-2); border-inline-start-width: 5px;
           padding: .8rem .95rem .85rem; margin-bottom: 1.1rem; }
  #stale h2 { margin: 0 0 .35rem; font-size: 1.05rem; font-weight: 600; }
  #stale p { margin: 0 0 .4rem; font-size: 13px; line-height: 1.45; max-width: 64ch; }
  #stale p:last-child { margin-bottom: 0; }
  #stale .quiet { color: var(--ink-2); font-size: 12.5px; }
  #stale .num { font-family: "IBM Plex Mono", monospace; font-weight: 600;
                font-variant-numeric: tabular-nums; }
  .copymark { font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
              font-weight: 600; color: var(--ink); border: 1px solid var(--rule-2);
              padding: .1rem .3rem; }
  /* the depth stamp carries the mark every hundred lines, so a reader who
     scrolled past the panel is never reading a copy that looks like tonight */
  body.stale .stamp .d { color: var(--ink); font-weight: 600; }

  /* ================================ the sheet ============================= */
  #main { padding: 1.1rem 0 5rem; min-width: 0; }

  /* the revision slip: tipped in above the sheet, only for a reader who has
     been here before, and only ever stating what the data carries */
  #slip { border: 1px solid var(--over); border-inline-start-width: 4px;
          padding: .7rem .85rem .75rem; margin-bottom: 1.1rem; background: var(--sheet); }
  #slip h2 { margin: 0 0 .3rem; font-size: 10.5px; text-transform: uppercase;
             letter-spacing: .13em; font-weight: 600; color: var(--over-2); }
  #slip p { margin: 0 0 .35rem; font-size: 13px; line-height: 1.45; max-width: 62ch; }
  #slip p:last-child { margin-bottom: 0; }
  #slip .num { font-weight: 600; }
  #slip .quiet { color: var(--ink-2); font-size: 12px; }

  .findbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: .8rem;
             align-items: end; padding-bottom: .5rem; }
  .findbar label { display: block; }
  #q { width: 100%; font: inherit; font-size: 14px; color: var(--ink);
       background: var(--sheet); border: 0; border-bottom: 1.5px solid var(--rule-2);
       padding: .3rem .1rem; border-radius: 0; }
  #q::placeholder { color: var(--ink-3); }
  /* The scope line states the rule the sheet was dealt by, which is a clause,
     not a label — so it wraps. Only the counts are held to their nouns, with a
     non-breaking space, so "6,423 roles" can never break across a line. */
  .scope { text-align: end; font-size: 12px; color: var(--ink-2); }
  .scope .n { font-family: "IBM Plex Mono", monospace; font-weight: 500;
              color: var(--ink); font-variant-numeric: tabular-nums; }
  .scope .pair { white-space: nowrap; }

  /* the column heads, and the register's own rule */
  .heads, .r { display: grid; align-items: center;
    grid-template-columns: 1.7rem 3rem minmax(0,1fr) 11rem 4.6rem 3.9rem 1.6rem;
    gap: 0 .55rem; }
  .heads { border-bottom: 1.5px solid var(--rule-2); padding-bottom: .3rem;
           position: sticky; top: 0; background: var(--sheet); z-index: 3; }
  .heads > span { font-size: 10px; text-transform: uppercase; letter-spacing: .11em;
                  font-weight: 600; color: var(--ink-3); }
  .heads .e { text-align: end; }

  #sheet { position: relative; }
  /* The row's whole width is one target. The button carries the label; the
     spans beside it are ink and take no clicks, so the fold stays the only
     other thing on the line that can be pressed. */
  .r > .open { position: absolute; inset: 0; z-index: 0; }
  .r > span { position: relative; z-index: 1; pointer-events: none; }
  .r > .fd { position: relative; z-index: 2; }
  .r .sc { font-size: 9.5px; font-weight: 600; letter-spacing: .08em;
           color: var(--ink-3); border: 1px solid var(--rule); padding: 0 .18rem;
           margin-inline-end: .3rem; }
  .r .sc.read { color: var(--over-2); border-color: var(--over); }
  .r {
    height: var(--rowh); border-bottom: 1px solid var(--rule);
    content-visibility: auto; contain-intrinsic-size: auto var(--rowh);
    position: relative;
  }
  /* the overprint column. A tick where a fact exists; a rule where facts run
     consecutively, so a cluster of reachable roles reads as one mark rather
     than as confetti. Nothing at all where a board said nothing. */
  .r > .o { display: block; height: 100%; position: relative; }
  .r.reach > .o::before {
    content: ""; position: absolute; inset-inline-start: .45rem;
    inset-block: 9px; width: 3px; background: var(--over);
  }
  .r.reach.runs > .o::before { inset-block: 0; }
  .r.closed > .o::after {
    content: ""; position: absolute; inset-inline-start: .45rem; top: 50%;
    width: 3px; height: 1.5px; background: var(--ink-3);
  }
  .r .cc { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500;
           color: var(--ink-2); letter-spacing: .03em;
           overflow: hidden; text-overflow: clip; white-space: nowrap; }
  .r .tt { display: block; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; font-size: 13.5px; }
  .r .co { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           font-size: 12.5px; color: var(--ink-2); }
  .r .wp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
           color: var(--ink-3); overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .r .dt { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--ink-3);
           text-align: end; font-variant-numeric: tabular-nums; }
  /* the dog-ear. Folded corners are drawn folded. */
  .r .fd { justify-self: end; width: 1.6rem; height: 100%; position: relative; }
  .r .fd::after {
    content: ""; position: absolute; top: 50%; inset-inline-end: 2px;
    transform: translateY(-50%);
    width: 0; height: 0; border-inline-start: 9px solid transparent;
    border-bottom: 9px solid var(--rule);
  }
  .r .fd:hover::after { border-bottom-color: var(--ink-3); }
  .r .fd[aria-pressed="true"]::after { border-bottom-color: var(--over); }
  /* The lens ADDS. r02-a's lens dimmed every line the boards had said nothing
     about to 58%, and the judge was right that half a second of that reads as
     switched off rather than as silence — which is the page's own rule broken
     at the centre of its best idea. A second plate cannot take ink away. So
     the register keeps its full black everywhere, and a reachable line gets a
     screened tint of the reader's colour laid over it: silence is now the
     PAPER, which is exactly what silence looks like on a printed sheet. */
  #sheet.lens .r.reach { background: var(--wash-2); }
  /* the cursor is the reader: the same plate, one step stronger, and bracketed
     by two rules — the line a compositor is standing on */
  .r.cur { background: var(--wash);
           box-shadow: inset 0 1px 0 var(--over), inset 0 -1px 0 var(--over); }
  .r.cur::before { content: ""; position: absolute; inset-block: 0;
                   inset-inline-start: 0; width: 2px; background: var(--over); }
  .r.folded .co { color: var(--over-2); }

  /* ------------------- what the reader did about a line ------------------- */
  /* Three marks, one plate, each printed only once the reader has stated the
     fact it stands for. A fold is a corner. An application is a rule down the
     end of the line — the reader's own edge, in the reader's own colour. An
     answer rules the line off: the register's hairline becomes magenta, which
     is the compositor's mark for a line that is finished with. */
  .r.applied .fd::before {
    content: ""; position: absolute; inset-block: 0; inset-inline-end: 0;
    width: 3px; background: var(--over);
  }
  .r.answered { border-bottom-color: var(--over); }
  /* the reader's own date, printed over the survey's own in the same column */
  .r .dt.mine { color: var(--over-2); font-weight: 500; }

  /* the depth stamp: a hairline every hundred lines, printing the depth and
     the night the sheet has reached. Rhythm that states a fact. */
  .stamp { display: grid; grid-template-columns: 1.7rem minmax(0,1fr) auto;
           gap: .55rem; align-items: center; height: 26px;
           border-bottom: 1px solid var(--rule); }
  .stamp .ln { height: 1px; background: var(--rule); }
  .stamp .n, .stamp .d { font-family: "IBM Plex Mono", monospace; font-size: 10.5px;
                         color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .stamp .d { padding-inline-start: .6rem; }

  /* ---------------------------- the evidence sheet ------------------------ */
  /* Stolen outright from r01-c: the role opens where it sits, and everything
     the register holds about it is printed at once. A field the corpus does
     not carry prints as nothing. The two mobility fields are the exception,
     and only because their silence is the finding this page is built on. */
  .ev { border-bottom: 1px solid var(--rule-2); border-top: 1.5px solid var(--rule-2);
        background: var(--plate); padding: .9rem 1rem 1rem 2.25rem; }
  .ev h3 { margin: 0 0 .1rem; font-size: 1.02rem; font-weight: 600; line-height: 1.25; }
  .ev .sub { margin: 0 0 .7rem; font-size: 12.5px; color: var(--ink-2); }
  .evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
            gap: .55rem 1.4rem; }
  .fld { display: block; }
  .fld .k { display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: .11em; font-weight: 600; color: var(--ink-3); }
  .fld .v { display: block; font-size: 13px; }
  .fld .v .num, .fld .v.num { font-family: "IBM Plex Mono", monospace;
                              font-variant-numeric: tabular-nums; }
  .fld.said .v { color: var(--over-2); font-weight: 600; }
  .fld.silent .v { color: var(--ink-3); font-style: italic; }
  .evacts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
  .evacts a, .evacts button {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
    border: 1px solid var(--rule-2); padding: .45rem .7rem; min-height: 32px;
    display: inline-flex; align-items: center; text-decoration: none;
  }
  .evacts a:hover, .evacts button:hover { background: var(--ink); color: var(--sheet); }
  .evacts .keep { border-color: var(--over); color: var(--over-2); }
  .evacts .keep:hover { background: var(--over); color: #fff; }
  .evacts .keep[aria-pressed="true"] { background: var(--over); color: #fff; }
  .deriv { margin: .8rem 0 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.4;
           max-width: 70ch; border-top: 1px solid var(--rule); padding-top: .5rem; }
  /* what the READER did about this line, and therefore the reader's colour */
  .mineline { margin: .85rem 0 0; font-size: 12.5px; line-height: 1.45;
              color: var(--over-2); max-width: 66ch;
              border-inline-start: 2px solid var(--over); padding-inline-start: .6rem; }
  .desc { margin: .55rem 0 0; display: grid; gap: .2rem; max-width: 70ch; }
  .desc p { margin: 0; font-size: 12.5px; line-height: 1.4; }
  .desc .dk { font-size: 10px; text-transform: uppercase; letter-spacing: .11em;
              font-weight: 600; color: var(--ink-3); margin-inline-end: .4rem; }

  /* ------------------------------ empty states ---------------------------- */
  .empty { padding: 1.6rem 0 0; max-width: 62ch; }
  .empty h2 { margin: 0 0 .4rem; font-size: 1.05rem; font-weight: 600; }
  .empty p { margin: 0 0 .55rem; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
  .empty .num { font-family: "IBM Plex Mono", monospace; color: var(--ink); font-weight: 500; }
  .gloss { display: flex; flex-wrap: wrap; gap: .4rem; margin: .3rem 0 .8rem; }
  .gloss button { border: 1px solid var(--over); color: var(--over-2); font-size: 12px;
                  padding: .35rem .55rem; min-height: 30px; }
  .gloss button:hover { background: var(--over); color: #fff; }
  .glossnote { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }

  /* --------------------------------- the ask ------------------------------ */
  /* Not a wall and not a modal: a card bound in at the exact line the free
     printing stops, stating in numbers what is left, what signing in does,
     and what it does NOT do. It prints its own counter back — r01-b's best
     idea — because a page that measures a reader owes them the reading. */
  #ask { border-top: 1.5px solid var(--rule-2); margin-top: 0;
         padding: 1.2rem 0 0; }
  #ask .card { border: 1.5px solid var(--over); padding: 1.05rem 1.15rem 1.1rem;
               max-width: 56rem; }
  /* Answered and declined: the card steps back to a line and an offer. */
  #ask .card.quiet { border-color: var(--rule); }
  #ask h2 { margin: 0 0 .5rem; font-size: 1.12rem; font-weight: 600; letter-spacing: -.015em; }
  #ask p { margin: 0 0 .6rem; font-size: 13.5px; line-height: 1.5; max-width: 64ch; }
  #ask p.fine { color: var(--ink-2); font-size: 12.5px; }
  #ask .num { font-family: "IBM Plex Mono", monospace; font-weight: 600;
              font-variant-numeric: tabular-nums; }
  .askacts { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .85rem; }
  .askacts button {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
    padding: .6rem .9rem; min-height: 44px; border: 1px solid var(--rule-2);
    display: inline-flex; align-items: center;
  }
  .askacts .yes { background: var(--over); border-color: var(--over); color: #fff; }
  .askacts .yes:hover { background: var(--over-2); border-color: var(--over-2); }
  .askacts button:not(.yes):hover { background: var(--ink); color: var(--sheet); }
  .counter { margin: .8rem 0 0; font-size: 11px; letter-spacing: .06em;
             color: var(--ink-3); font-family: "IBM Plex Mono", monospace;
             font-variant-numeric: tabular-nums; }

  /* --------------------------------- footer ------------------------------- */
  footer { border-top: 1.5px solid var(--rule-2); margin-top: 2.5rem;
           padding: 1.4rem var(--gut) 4rem; }
  .foot { max-width: 96rem; margin-inline: auto; display: grid;
          grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 1.2rem 2rem; }
  .note { font-size: 11.5px; line-height: 1.5; color: var(--ink-2); max-width: 46ch; }
  .note h3 { margin: 0 0 .25rem; font-size: 10px; text-transform: uppercase;
             letter-spacing: .12em; font-weight: 600; color: var(--ink-3); }
  /* The sources are links in a line of prose, which on a phone is a 15px-tall
     target. They are set as a row of struck chips instead — same sentence, a
     hand can hit them. */
  .srcs { margin-top: 1.2rem; font-size: 11.5px; color: var(--ink-3);
          display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .srcs a { color: var(--ink); text-decoration: none; border: 1px solid var(--rule-2);
            padding: .3rem .5rem; min-height: 32px; display: inline-flex;
            align-items: center; font-weight: 500; }
  .srcs a:hover { background: var(--ink); color: var(--sheet); }
  /* the bookplate, kept from r01-a: every byte this copy holds about the
     reader, printed, with the control that burns it */
  #plate { max-width: 96rem; margin: 1.4rem auto 0; border: 1px solid var(--rule-2);
           padding: .85rem 1rem .95rem; }
  #plate h3 { margin: 0 0 .45rem; font-size: 10px; text-transform: uppercase;
              letter-spacing: .12em; font-weight: 600; color: var(--ink-3); }
  #plate dl { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr);
              gap: .1rem .8rem; font-size: 12px; }
  #plate dt { font-family: "IBM Plex Mono", monospace; color: var(--ink-3); font-size: 11.5px; }
  #plate dd { margin: 0; overflow-wrap: anywhere; }
  #plate .none { font-size: 12px; color: var(--ink-2); }
  #burn { margin-top: .7rem; font-size: 11px; text-transform: uppercase;
          letter-spacing: .1em; font-weight: 600; border: 1px solid var(--rule-2);
          padding: .45rem .7rem; min-height: 32px; }
  #burn:hover { background: var(--ink); color: var(--sheet); }

  /* ------------------------------- the key -------------------------------- */
  #keypanel[hidden] { display: none; }
  #keypanel {
    position: fixed; inset-block: 0; inset-inline-end: 0; width: min(26rem, 92vw);
    background: var(--sheet); border-inline-start: 1.5px solid var(--rule-2);
    padding: 1.1rem 1.2rem 3rem; overflow-y: auto; z-index: 40;
    box-shadow: -18px 0 40px -30px rgba(0,0,0,.5);
  }
  #keypanel h2 { margin: 0 0 .6rem; font-size: 1rem; font-weight: 600; }
  #keypanel dl { margin: 0 0 1rem; display: grid;
                 grid-template-columns: auto minmax(0,1fr); gap: .35rem .7rem;
                 font-size: 12.5px; align-items: baseline; }
  #keypanel dt { font-family: "IBM Plex Mono", monospace; font-size: 11.5px;
                 border: 1px solid var(--rule); padding: .05rem .3rem; justify-self: start;
                 min-width: 1.1rem; text-align: center; }
  /* The mark for "nothing is printed" is nothing. A bordered empty box would be
     a mark, which is the opposite of what that row says. */
  #keypanel dt:empty { border-color: transparent; }
  #keypanel dd { margin: 0; color: var(--ink-2); }
  #keyclose { position: absolute; inset-inline-end: 1rem; top: .9rem; font-size: 11px;
              text-transform: uppercase; letter-spacing: .1em; font-weight: 600;
              min-height: 32px; min-width: 32px; }
  #keybtn { font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
            font-weight: 600; border: 1px solid var(--rule-2); padding: .32rem .6rem; }
  #keybtn:hover { background: var(--ink); color: var(--sheet); }

  /* -------------------------- the registration mark ----------------------- */
  /* A press registers its second plate with a cross. This one appears only
     once the reader has stated something, because until then there is no
     second plate to register. */
  #reg { position: fixed; inset-inline-end: .6rem; top: .6rem; width: 18px; height: 18px;
         pointer-events: none; z-index: 2; opacity: 0; }
  #reg.on { opacity: 1; }
  #reg::before, #reg::after { content: ""; position: absolute; background: var(--over); }
  #reg::before { inset-inline-start: 8px; inset-block: 0; width: 1.5px; }
  #reg::after { inset-block-start: 8px; inset-inline: 0; height: 1.5px; }

  /* The loading line sits INSIDE the register, on the first row's own line, so
     that when the rows arrive they land where it stood. Held in its own box at
     the top of the page it pushed 57px of the document down the moment it went,
     which is a 0.34 layout shift on a page whose whole argument is precision. */
  #status { margin: 0; padding: .5rem 0 0; font-size: 13px; color: var(--ink-2); }

  /* --------------------------------- motion -------------------------------- */
  /* Every moving thing on this page is in this block and nowhere else, so the
     reduced-motion promise is one query rather than a habit. */
  @media (prefers-reduced-motion: no-preference) {
    .r, .chip, #onlybtn, .fold, #reg { transition: background-color .12s ease,
                                       opacity .16s ease, color .12s ease; }
    #reg { transition: opacity .3s ease; }
    .ev { animation: unfold .18s ease-out; }
    @keyframes unfold { from { opacity: 0; transform: translateY(-3px); } }
  }
  /* No smooth scrolling anywhere, at any setting. Every scroll this page makes
     is a jump to a place the reader asked for — a cursor step, a plate change,
     a depth on the gauge — and animating a 195,000px sheet is not motion that
     carries meaning, it is a wait. */

  /* -------------------------------- narrow --------------------------------- */
  @media (max-width: 62rem) {
    :root { --rowh: 52px; --gut: 1rem; }
    .blockgrid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .cell:nth-child(2) { border-inline-end: 0; padding-inline-end: 0; }
    .cell:nth-child(odd) { padding-inline-start: 0; }
    .cell:nth-child(n+3) { border-top: 1px solid var(--rule); padding-top: .7rem; }
    .thesis { max-width: none; }
    /* On a phone the margin cannot sit beside the sheet, and stacking it whole
       above the register would put three screens of apparatus in front of the
       first job — which is the opposite of what the free sample is for. So the
       rail dissolves (display: contents) and its sections take their own places
       in one column: the standpoint and the tally in front of the register,
       because they are the invitation; the gauge and the folds behind it,
       because they are instruments for a reader already inside. */
    .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0;
            padding-inline: var(--gut); }
    #rail { display: contents; }
    #stand { order: 1; margin-bottom: 1rem; }
    .s-tally { order: 2; }
    .s-countries { order: 3; }
    #main { order: 4; }
    .s-gauge { order: 5; border-top: 1.5px solid var(--rule-2); padding-top: 1rem; }
    /* the reader's own record sits with the reader's own folds, behind the
       register: both are instruments for somebody who is already inside */
    .s-nights { order: 6; }
    #foldsect { order: 7; }
    /* fifteen countries as eight rows rather than fifteen */
    .clist { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: .9rem; }
    .heads, .r { grid-template-columns: 1.5rem minmax(0,1fr) 2.6rem 1.9rem;
                 grid-template-areas: "o t c f" "o m c f"; }
    /* Four columns on a phone, so the column heads are four too: the three
       that have nowhere to go are struck, and the rest are placed by name
       rather than by their order in the source. */
    .heads { grid-template-areas: "o t c f"; }
    .heads .h-co, .heads .h-dt, .heads .h-wp { display: none; }
    .heads .h-o { grid-area: o; }
    .heads .h-f { grid-area: f; }
    .heads #h-role { grid-area: t; }
    .heads #h-cc { grid-area: c; text-align: end; }
    .r > .o { grid-area: o; }
    .r .tt { grid-area: t; white-space: normal; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
             font-size: 13.5px; line-height: 1.25; align-self: end; }
    .r .co { grid-area: m; align-self: start; font-size: 11.5px; }
    .r .wp { display: none; }
    .r .cc { grid-area: c; text-align: end; }
    .r .dt { display: none; }
    /* A dog-ear on a phone is a thumb target before it is a mark: 2.75rem is
       44px, and the fourteen pixels come out of the title, which has a whole
       line to itself here anyway. */
    .r .fd { grid-area: f; width: 2.75rem; }
    .r .fd::after { border-inline-start-width: 11px; border-bottom-width: 11px; }
    .stamp { grid-template-columns: 1.5rem minmax(0,1fr) auto; }
    .ev { padding-inline-start: 1rem; }
    .findbar { grid-template-columns: minmax(0,1fr); }
    /* A finger is not a cursor. Everything pressable grows to 44px on the one
       layout that is actually held in a hand. */
    .chip, .crow, .fold .x, #foldout, .gloss button, .evacts a, .evacts button,
    .srcs a, #burn, #keybtn, .account button, #standclear { min-height: 44px; }
    /* हिन्दी is three characters wide and was a 39px target; the finder was a
       31px one, which is the most-pressed control on the page. */
    .chip, .srcs a { min-width: 44px; justify-content: center; }
    /* "Erase" is two characters in Hindi and one word everywhere else, so its
       width is the translator's and its target is not. */
    #standclear { min-width: 44px; text-align: end; }
    #q { min-height: 44px; }
    .crow { padding-block: .5rem; }
    .fold .x { min-width: 44px; }
    .fold .do { min-height: 44px; }
    .stmt select, .youbar select { min-height: 44px; }
    #onlybtn, #nearbtn, #keepsonly { min-height: 44px; }
    /* A night is a column in a ruler, and ten columns cannot each be 44px wide
       inside a 350px screen. So the ruler scrolls instead of shrinking: every
       night stays present, and every one of them is a target a thumb can hit.
       The strip scrolls, the page does not. */
    .nights { overflow-x: auto; scrollbar-width: thin; }
    .nt { flex: 0 0 auto; min-width: 44px; height: 44px; }
    .scope { text-align: start; }
    .gaugewrap { grid-template-columns: 30px minmax(0,1fr); }
    #keypanel { width: 100vw; border-inline-start: 0; }
  }
  @media (max-width: 26rem) {
    .cell { padding-inline-end: .6rem; }
    .cell + .cell { padding-inline-start: .6rem; }
  }
  @media print { #rail, #ask, #keypanel, .findbar { display: none; } }
</style>
</head>
<body>

<div id="reg" aria-hidden="true"></div>

<div class="block">
  <div class="blockgrid">
    <div class="cell">
      <h1>ROLE<span class="dot">·</span>ATLAS</h1>
      <p class="thesis" id="thesis"></p>
    </div>
    <div class="cell">
      <span class="micro" id="l-snapshot"></span>
      <span class="v mono"><time id="snapdate"></time></span>
      <span class="micro" id="l-scale"></span>
      <span class="v sm" id="scaleline"></span>
    </div>
    <div class="cell">
      <span class="micro" id="l-extent"></span>
      <span class="v mono" id="extent"></span>
      <span class="micro" id="l-cover"></span>
      <span class="v sm" id="cover"></span>
    </div>
    <div class="cell">
      <span class="micro" id="l-edition"></span>
      <div class="youbar">
        <select id="edition"></select>
        <div class="account" id="account"></div>
        <button type="button" id="keybtn"></button>
      </div>
    </div>
  </div>
</div>

<div class="body" id="bodygrid">
  <aside id="rail">

    <section class="sect" id="stand">
      <h2><span id="l-stand"></span><button type="button" id="standclear" class="hide"></button></h2>
      <div class="stmt">
        <span class="lbl" id="l-where"></span>
        <select id="where"></select>
      </div>
      <div class="stmt">
        <span class="lbl" id="l-reads"></span>
        <div class="chips" id="reads" role="group"></div>
      </div>
      <div class="stmt">
        <span class="lbl" id="l-work"></span>
        <select id="work"></select>
      </div>
      <p class="stnote" id="standnote"></p>
      <button type="button" id="nearbtn" class="hide" aria-pressed="false"></button>
    </section>

    <section class="sect s-tally">
      <h2 id="l-tally"></h2>
      <div class="tally" id="tally" role="img"></div>
      <div class="tkey" id="tkey"></div>
      <button type="button" id="onlybtn" aria-pressed="false"></button>
    </section>

    <section class="sect s-gauge">
      <h2 id="l-gauge"></h2>
      <div class="gaugewrap">
        <canvas id="gauge" width="60" height="336"></canvas>
        <div class="gmeta">
          <div><span class="big" id="depthnow">0</span><br><span class="micro" id="l-depth"></span></div>
          <div><span id="gaugenote"></span></div>
        </div>
      </div>
    </section>

    <section class="sect s-countries">
      <h2 id="l-countries"></h2>
      <div class="clist" id="clist"></div>
    </section>

    <section class="sect s-nights" id="nightsect">
      <h2><span id="l-nights"></span><span class="num" id="nightn"></span></h2>
      <div class="nights" id="nights" role="group"></div>
      <div class="nightscale" id="nightscale" aria-hidden="true"></div>
      <p class="stnote" id="nightnote"></p>
      <button type="button" id="nightclear" class="hide"></button>
    </section>

    <section class="sect" id="foldsect">
      <h2><span id="l-folds"></span><span class="num" id="foldn"></span></h2>

function detectLocale() {

  for (const want of (navigator.languages || [navigator.language || 'en'])) {
    const w = String(want).toLowerCase();
    const exact = CODES.find((c) => c.toLowerCase() === w);
    if (exact) return exact;
    const base = w.split('-')[0];

    // language beats an exact match in somebody else's.
    const near = CODES.find((c) => c.toLowerCase().split('-')[0] === base);

// DERIVED, and it says so wherever it prints. No board states the language of
// its own posting, so the page reads the characters of the title and nothing

function scriptOf(title) {

// A role's bearing to the reader. Three states and one of them is silence — the
// state 5,671 of the 6,423 roles are in, and the one every job site on earth
// renders as a maybe. Silence is printed as nothing at all.
//
// The rule the whole page rests on: a border only exists where the reader is on
// the other side of it. Standing in a role's own country, no posting has to say
// anything for the role to be within reach — there is nothing to cross.
// Standing anywhere else, only the posting's own words can open it, and remote
// is NOT one of those words: "Remote — United Kingdom" is a UK job worked from
// a UK sofa. Conflating the two is the lie this register exists not to tell.
function bearing(r) {
  const open = r.visa === 'yes' || r.abroad === 'yes';
  const closed = r.visa === 'no' || r.abroad === 'no';
  // The workplace statement is a gate on reach, never a source of a "no" the
  // board did not print: a board that named no workplace stays silent.
  if (SP.work === 'remote') {
    if (r.wp && r.wp !== 'remote') return 'closed';
    if (r.wp !== 'remote') return 'silent';
  }
  if (SP.where && SP.where !== 'ELSEWHERE' && r.cc.includes(SP.where)) return 'reach';
  if (open) return 'reach';
  if (closed) return 'closed';
  return 'silent';
}

// Taken from r02-c, which got the best wordless answer of round 2 out of it.
// DERIVED, and marked ≈ at every place it prints: these are the fifteen
// capitals, and a capital is not a reader and not a desk. The number is a
// bearing between two countries, which is the only distance this corpus can
// support — no posting on this sheet states a place precise enough for more,
// and a page that printed "412 km from you" would be inventing both ends of it.
const CAPITALS = {
  'India': [28.61, 77.21], 'United Kingdom': [51.51, -0.13], 'Ireland': [53.35, -6.26],
  'Germany': [52.52, 13.40], 'Netherlands': [52.37, 4.90], 'France': [48.86, 2.35],
  'Spain': [40.42, -3.70], 'Sweden': [59.33, 18.07], 'Denmark': [55.68, 12.57],
  'Norway': [59.91, 10.75], 'Finland': [60.17, 24.94], 'Japan': [35.68, 139.69],
  'Singapore': [1.35, 103.82], 'Australia': [-35.28, 149.13], 'New Zealand': [-41.29, 174.78],
};
const RAD = Math.PI / 180;
function greatCircle(a, b) {
  const [la1, lo1] = CAPITALS[a], [la2, lo2] = CAPITALS[b];
  const dla = (la2 - la1) * RAD, dlo = (lo2 - lo1) * RAD;
  const h = Math.sin(dla / 2) ** 2
    + Math.cos(la1 * RAD) * Math.cos(la2 * RAD) * Math.sin(dlo / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h)));

  if (a === b) return 0;
  const k = `${a}|${b}`;
  let v = KMCACHE.get(k);
  if (v === undefined) { v = Math.round(greatCircle(a, b) / 10) * 10; KMCACHE.set(k, v); }

}

// stand, and when a posting named no country. Neither prints anything.
function roleKm(r) {
  if (!SP.where || SP.where === 'ELSEWHERE' || !CAPITALS[SP.where]) return null;

  for (const c of r.cc) {
    if (!CAPITALS[c]) continue;
    const d = kmBetween(SP.where, c);
    if (best === null || d < best) best = d;
  }
  return best;
}
