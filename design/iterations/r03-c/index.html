// ---------------------------------------------------------------------------
// the rail — depth measured in roles, exactly
// ---------------------------------------------------------------------------
// r01-c bought an exact gauge with fixed-height rows and paid for it in
// truncated titles — 43% of them at 380px. The rows here wrap instead, so the
// needle cannot be a pixel ratio. It reads the INDEX of the row at the top of
// the viewport: binary search the chunks (always laid out, because they carry
// an intrinsic size), then the rows inside the one chunk that is on screen.
function topIndex() {
  if (!chunks.length) return 0;
  const y = window.scrollY + 8;
  let lo = 0, hi = chunks.length - 1, ci = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (chunks[mid].offsetTop <= y) { ci = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (!built[ci]) ensureChunk(ci);
  const rows = chunks[ci].querySelectorAll('.row');
  let n = ci * CH;
  for (const r of rows) { if (r.offsetTop <= y) n = Number(r.dataset.n); else break; }
  return n;
}
let ticking = false;
function tick() {
  ticking = false;
  if (!view.length) { $('#depthn').textContent = '0'; return; }
  const n = topIndex();
  $('#depthn').textContent = num(n + 1);
  const track = $('#rail .track');
  $('#needle').style.top = Math.round((n / Math.max(1, view.length - 1)) * (track.clientHeight - 2)) + 'px';
  $('#rail').setAttribute('aria-label', t('depth'));
}
addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(tick); }
}, { passive: true });
addEventListener('resize', () => {
  for (const c of chunks) c.style.height = '';
  if (!ticking) { ticking = true; requestAnimationFrame(tick); }
});

// ---------------------------------------------------------------------------
// the cursor — it follows the eye
// ---------------------------------------------------------------------------
// Round 1's shared tell: press j after scrolling deep and every variant warped
// back to a cursor that never moved with the reader. Here, if the cursor is not
// on screen when you press a key, it is re-seated at the row you are looking at
// before it steps.
function seat(n) {
  const prev = document.getElementById('r' + cursor);
  if (prev) prev.setAttribute('aria-selected', 'false');
  cursor = n;
  const row = document.getElementById('r' + n);
  if (row) {
    row.setAttribute('aria-selected', 'true');
    $('#log').setAttribute('aria-activedescendant', row.id);
  }
}
function onScreen(n) {
  const row = document.getElementById('r' + n);
  if (!row) return false;
  const r = row.getBoundingClientRect();
  return r.bottom > 0 && r.top < innerHeight;
}
function moveCursor(d) {
  if (cursor < 0 || !onScreen(cursor)) { cursor = topIndex(); }
  else cursor = Math.min(view.length - 1, Math.max(0, cursor + d));
  const ci = Math.floor(cursor / CH);
  ensureChunk(ci); ensureChunk(ci + 1);
  seat(cursor);
  const row = document.getElementById('r' + cursor);
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'auto' });
}
addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'select' || tag === 'textarea';
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape') {
    if (!$('#keys').hidden) { $('#keys').hidden = true; return; }
    if (!$('#daybook').hidden) { toggleDaybook(false); $('#dbbtn').focus(); return; }
    if (!$('#picker').hidden) { closePicker(); $('#homebtn').focus(); return; }
    if (typing) { e.target.blur(); return; }
    if (openIdx >= 0) { toggleSheet(openIdx); return; }
  }
  if (typing) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
  else if (e.key === 'Enter' || e.key === 'o') {
    if (cursor >= 0) { e.preventDefault(); toggleSheet(cursor); }
  } else if (e.key === 's') {
    if (cursor >= 0) { e.preventDefault(); toggleKeep(cursor); }
  } else if (e.key === 'a') {
    // The ladder, from the keyboard. It only ever climbs one rung, and only on
    // a row the reader has already kept — a key that could invent "applied" on
    // a row you were merely passing is exactly the inference this page refuses.
    if (cursor >= 0 && view[cursor]) {
      const st = keepState(view[cursor].u);
      if (st >= 0 && st < 2) { e.preventDefault(); setState(view[cursor], st + 1); }
    }
  } else if (e.key === 'd') {
    e.preventDefault(); toggleDaybook();
  } else if (e.key === '[' || e.key === ']') {
    e.preventDefault();
    const list = [null, ...COUNTRIES];
    let i = list.indexOf(F.country);
    i = (i + (e.key === ']' ? 1 : -1) + list.length) % list.length;
    F.country = list[i];
    paintStrip(); writeURL(true); render();
    window.scrollTo({ top: 0, behavior: 'auto' });
    // Focus must land somewhere real. r01-c dropped it on BODY here, which
    // strands a keyboard reader with nothing focused at all.
    const cell = $('#strip').children[i];
    if (cell) cell.focus();
  } else if (e.key === '?') { e.preventDefault(); $('#keys').hidden = !$('#keys').hidden; }
});

// ---------------------------------------------------------------------------
// the session, in the URL
// ---------------------------------------------------------------------------
let urlLock = false;
function writeURL(push) {
  if (urlLock) return;
  const p = new URLSearchParams();
  if (F.country) p.set('c', CODE[F.country]);
  if (F.mark) p.set('m', F.mark);
  if (F.q) p.set('q', F.q);
  if (F.sort !== 'deal') p.set('s', F.sort);
  if (F.keptOnly) p.set('k', '1');
  const h = p.toString();
  const url = location.pathname + location.search + (h ? '#' + h : '');
  if (url === location.pathname + location.search + location.hash) return;
  history[push ? 'pushState' : 'replaceState'](null, '', url);
}
function readURL() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const code = p.get('c');
  F.country = code ? (COUNTRIES.find((n) => CODE[n] === code) || null) : null;
  F.mark = ['r', 'a', 'n', 's', 'since'].includes(p.get('m')) ? p.get('m') : null;
  F.q = p.get('q') || '';
  F.sort = ['deal', 'new', 'near', 'co'].includes(p.get('s')) ? p.get('s') : 'deal';
  F.keptOnly = p.get('k') === '1';
}
addEventListener('popstate', () => {
  urlLock = true;
  readURL();
  $('#q').value = F.q; $('#clear').hidden = !F.q;
  paintStrip(); paintMarks(); paintSort(); paintTray();
  render(); paintBridge();
  urlLock = false;
});

// ---------------------------------------------------------------------------
// wiring
// ---------------------------------------------------------------------------
let qt = null;
$('#q').addEventListener('input', (e) => {
  F.q = e.target.value;
  $('#clear').hidden = !F.q;
  clearTimeout(qt);
  qt = setTimeout(() => { writeURL(false); render(); paintBridge(); }, 110);
});
$('#clear').addEventListener('click', () => {
  $('#q').value = ''; F.q = ''; $('#clear').hidden = true;
  writeURL(false); render(); paintBridge(); $('#q').focus();
});
$('#sort').addEventListener('change', (e) => {
  F.sort = e.target.value; writeURL(true); render();
  window.scrollTo({ top: 0, behavior: 'auto' });
});
$('#homebtn').addEventListener('click', () => {
  const p = $('#picker');
  p.hidden = !p.hidden;
  $('#homebtn').setAttribute('aria-expanded', String(!p.hidden));
});
$('#tray').addEventListener('click', () => {
  F.keptOnly = !F.keptOnly; paintTray(); writeURL(true); render();
  window.scrollTo({ top: 0, behavior: 'auto' });
});
$('#keyhint').addEventListener('click', () => { $('#keys').hidden = !$('#keys').hidden; });
// The daybook opens in the page and pushes the register down, because it is the
// reader's half of the same document rather than a thing on top of it. No
// overlay, no focus trap, no scroll lock — Escape closes it and the register is
// exactly where it was.
function toggleDaybook(force) {
  const box = $('#daybook'), btn = $('#dbbtn');
  if (btn.hidden && force !== true) return;
  const open = force != null ? force : box.hidden;
  if (open) paintDaybook();
  box.hidden = !open;
  document.body.classList.toggle('dbopen', open);
  btn.setAttribute('aria-expanded', String(open));
  $('#nightsbtn').setAttribute('aria-expanded', String(open));
  if (open) box.scrollIntoView({ block: 'nearest', behavior: 'auto' });
}
$('#dbbtn').addEventListener('click', () => toggleDaybook());
$('#nightsbtn').addEventListener('click', () => toggleDaybook(true));
$('#lang').addEventListener('change', (e) => setLocale(e.target.value));

function setLocale(id) {
  LOC = S[id] ? id : 'en';
  try { localStorage.setItem(LKEY, JSON.stringify(LOC).slice(1, -1)); } catch {}
  document.documentElement.lang = LOC;
  document.documentElement.dir = DIRS[LOC] || 'ltr';
  document.title = t('title');
  NF = new Intl.NumberFormat(LOC);
  PR = new Intl.PluralRules(LOC);
  DF = new Intl.DateTimeFormat(LOC, { year: 'numeric', month: 'short', day: 'numeric' });
  $('#log').setAttribute('aria-label', t('lRoles'));
  $('#q').placeholder = t('qPh');
  $('#q').setAttribute('aria-label', t('qAria'));
  $('#clear').setAttribute('aria-label', t('clear'));
  paintLang(); paintHome(); paintNotes(); paintKeys(); paintSort();
  paintNights(); paintDbBtn();
  if (!$('#daybook').hidden) paintDaybook();
  if (STALE) paintStale();
  if (ROLES.length) {
    paintFigs(); paintStrip(); paintPicker(); paintMarks();
    const y = window.scrollY;
    render(); paintBridge();
    window.scrollTo({ top: y, behavior: 'auto' });
  }
  const b = $('#account button');
  if (b) b.textContent = t('signIn');
}
window.__onAuth = () => {
  const b = $('#account button');
  if (b) b.textContent = t('signIn');
  if (window.__signedIn && !gate.open) { const y = window.scrollY; render(); window.scrollTo({ top: y, behavior: 'auto' }); }
  else if ($('#seamslot').firstChild) { const y = window.scrollY; render(); window.scrollTo({ top: y, behavior: 'auto' }); }
};

// ---------------------------------------------------------------------------
// go
// ---------------------------------------------------------------------------
LOC = pickLocale();
setLocale(LOC);

// The night is recorded once the page has actually rendered something the
// reader could read — either tonight's register or last night's sheet. It is
// never recorded for a load that failed outright, because "you were here" would
// then be a line about a page that never opened.
function stampNight() {
  const d = today();
  if (!nights.includes(d)) { nights.push(d); nights.sort(); store.set(NIGHTK, nights); }
  if (!bookHas('read', d)) write('read');
  computeNights(); paintNights(); paintDbBtn();
}
// The refusal, and what comes after it. r02-c stopped at the first half.
function refuse(why) {
  STALE = why;
  document.body.classList.remove('pre');
  for (const id of ['#strip','#picker','#marks','#tribar','#overlap','#status','#rail','#log','#seamslot','#figs'])
    { const n = $(id); if (n) n.hidden = true; }
  const q = document.querySelector('.qline'); if (q) q.hidden = true;
  // The headline figures do not print at all here. There is no live number to
  // put in them, and a zero would read as a fact. The dated ones live inside
  // the band below, each wearing the night it was read on.
  paintStale(); paintNights(); paintDbBtn(); stampNight();
}

Promise.all([
  fetch(src, { cache: 'no-cache' }).then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))),
  soft('../data/descriptions.json'),
  soft(seenSrc),
]).then(([data, descs, seen]) => {
  if (data.schema_version !== SCHEMA) {
    refuse({ kind: 'schema', want: SCHEMA, src, got: data.schema_version });
    return;
  }
  DESCS = (descs && typeof descs === 'object' && !Array.isArray(descs)) ? descs : {};
  SEEN = new Map();
  for (const [d, buckets] of Object.entries((seen && seen.dates) || {})) {
    for (const [kind, urls] of Object.entries(buckets || {})) {
      if (!Array.isArray(urls)) continue;
      for (const u of urls) SEEN.set(u, { date: d, confirmed: kind === 'confirmed' });
    }
  }
  flatten(data);
  readURL();
  $('#q').value = F.q; $('#clear').hidden = !F.q;
  paintFigs(); paintStrip(); paintPicker(); paintMarks(); paintSort(); paintTray();
  paintNights(); paintDbBtn(); paintNotes();
  render(); paintBridge();
  // The snapshot is stamped only after the diff has been taken, so a first
  // visit shows nothing rather than a fabricated zero and the second shows a
  // real number. The reader's night is stamped separately: one is about the
  // register moving, the other is about the reader being here, and conflating
  // them is what made r02-c's return chip a count of the whole corpus.
  store.set(SNAPK, SNAP);
  stampNight();
  writeSheet();
}).catch((e) => {
  refuse({ kind: 'load', src, msg: e.message });
});
</script>
