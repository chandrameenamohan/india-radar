# T14.1 — the Workers API. Deploy: npx wrangler deploy --config worker/wrangler.toml
#
# The register is NOT here. `site/index.html` stays on GitHub Pages exactly as it
# is; this Worker is a second, separate deployable that the app page calls
# cross-origin. See the CORS note at the top of index.mjs for why they cannot
# share a hostname.

name = "roleatlas-api"
main = "index.mjs"
compatibility_date = "2026-08-02"

# NO workers.dev SUBDOMAIN. Registering one would publish this API on a second,
# permanent hostname that nothing needs and the CORS allowlist does not cover --
# a free extra front door. The custom domain below is the only way in, and
# `custom_domain = true` makes Cloudflare create and proxy the DNS record itself.
#
# The API is on its own hostname because it has to be PROXIED (orange cloud) and
# `roleatlas.sennamind.com` must stay DNS-only for GitHub to keep issuing the
# certificate for the register. See the CORS note at the top of index.mjs.
workers_dev = false
routes = [{ pattern = "api.roleatlas.sennamind.com", custom_domain = true }]

[vars]
# Not a secret: the frontend API host is base64 inside the Clerk publishable key,
# which is public by design (v3). It is a var so that a wrong value is a visible
# config change rather than an invisible one.
CLERK_ISSUER = "https://regular-troll-50.clerk.accounts.dev"

# PROVISIONED 2026-08-03. Re-run the schema after any change to `schema.sql` --
# it is `CREATE TABLE IF NOT EXISTS` throughout, so applying it twice is safe:
#   npx wrangler d1 execute roleatlas --file worker/schema.sql --remote
# The tests never touch either binding: every module takes its store as an
# argument, which is what let three of them be built in parallel with no
# infrastructure at all.

[[d1_databases]]
binding = "DB"
database_name = "roleatlas"
database_id = "8383daaf-b15f-4813-804b-7c4c8419eb34"  # created 2026-08-03, region APAC

[[r2_buckets]]
binding = "RESUMES"
bucket_name = "roleatlas-resumes"
