# What a human knows and a source states wrongly — T10.1.
#
# Two directives, one per line:
#
#   <name, spelled exactly as the corpus spells it>: website <url>
#       The address the corpus carries is not this company's. The corrected one
#       is what slug discovery reads, so a wrong entry here is a wrong board.
#
#   <name>: board <the company whose board it is>
#       The board this company's careers page links belongs to somebody else —
#       an acquirer, a parent. Nothing is listed under this name: the roles on
#       that board are the other company's, and publishing them here would
#       attribute somebody's jobs to a company that may no longer employ anyone.
#
# `#` starts a comment. Say WHY, always: a correction nobody can justify is a
# correction nobody later dares delete.
#
# Every name here must still be in the corpus each time this file is read. A
# correction for a company the sources have dropped stops the run rather than
# sitting here looking effective — this file is hand-maintained, so its errors
# are the kind that rot silently unless something shouts.
#
# All four below came from the description pass (T8.7), where a human reading
# each company's own site found what the corpus said about it and couldn't be.

# CB Insights' profile for Cresta links analyticsinsight.net — a trade
# publication that wrote about them, not their address.
Cresta: website https://cresta.com
# CB Insights files Monzo under `mondo`, the name they left behind in 2016, and
# links the domain that went with it.
Monzo: website https://monzo.com
# Two companies called Alloy. The corpus has alloy.app (an AI prototyping tool);
# `greenhouse/alloy` 302s to www.alloy.com/about/jobs and its role applies at
# www.alloy.com — the identity-risk fintech. The BOARD is the one we publish, so
# the listing is right and the address is wrong. Found by the description audit
# (T10.3), which read alloy.app and wrote a description of the wrong company.
Alloy: website https://www.alloy.com
# The rest of the name collisions the T10.3 audit turned up. Each is the same
# shape: the BOARD is a real company we can name, and the corpus address is
# somebody else wearing the same word. The listing is proven by the board, so the
# listing stays and the address is what gets corrected. Evidence in each case is
# the board's own apply URL or a link off its careers site — never a guess.
#   falconx.us -> falconx.vc, a founder accelerator. The board is the crypto
#   prime brokerage, and falconx.io titles itself exactly that.
FalconX: website https://falconx.io
#   sliceit.com -> slice.bank.in, an Indian consumer fintech. The board applies
#   at slice.careers, which links about.slicelife.com — the pizzeria tech company.
Slice: website https://slicelife.com
#   getsymphony.co is a YC insurance-AI startup. The board applies at
#   symphony.com, which is Symphony Communication Services, enterprise messaging.
Symphony: website https://symphony.com

# Acquired by Pindrop in 2021. nextcaller.com links Pindrop's board, so the one
# role listed under "Next Caller" was Pindrop's, and no evidence here says Next
# Caller employs anybody as itself any more.
Next Caller: board Pindrop
# Three different companies wearing one word. The corpus row's website is
# insider-coaching.com (finance career coaching); `greenhouse/insider` states
# "Business Insider" and its one role links businessinsider.com — a news
# organisation. T2.2's containment rule let this through because "Insider" IS
# inside "Business Insider", which is the measured cost of that rule, not a bug
# in it. Found by the description pass (T8.7): the writer read the website,
# described a coaching programme, and the board was hiring a Business Reporter.
Insider: board Business Insider
